main = "creem-worker.js"
compatibility_date = "2024-11-01"

[vars]
# 게임이 놓인 주소 — 쉼표로 여럿 적을 수 있다
ALLOW_ORIGIN = "https://elel99gg34-code.github.io"
# Creem 대시보드에서 만든 물건 id
PROD_SKIN = ""
PROD_VIP  = "prod_1yYgNhC1QxUEf5YmAeqdPR"

# 이미 내어 준 주문을 적어 두는 곳 — 이미 만들어 두었다 (baekgwi-orders)
[[kv_namespaces]]
binding = "ORDERS"
id = "47054fd1996b4f57af6458acd6501bea"

# 비밀은 파일에 적지 않는다:
#   wrangler secret put CREEM_API_KEY
