<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>백귀야행 百鬼夜行</title>
<style>
/* ============================================================
   백귀야행 — 수묵 로그라이크 덱빌딩
   ============================================================ */
:root{
  --paper:#e9dfc9;
  --paper2:#dccfb2;
  --ink:#17130f;
  --ink2:#3b332a;
  --ink3:#6b6053;
  --red:#a8272c;
  --red2:#c9484a;
  --jade:#2c5f5a;
  --gold:#9d7c2e;
  --blue:#31536b;
  --cw:152px;   /* card width */
  --ch:214px;   /* card height */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#0c0a09;
  color:var(--ink);
  font-family:"Nanum Myeongjo","NanumMyeongjo","Batang","BatangChe","AppleMyungjo","Noto Serif KR","Songti SC",serif;
  user-select:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}

#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#app::before{ /* 한지 질감 */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.5;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(120,100,70,.10) 0 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(120,100,70,.09) 0 1px, transparent 1px),
    radial-gradient(circle at 45% 85%, rgba(120,100,70,.08) 0 1px, transparent 1px);
  background-size:7px 7px, 11px 11px, 13px 13px;
  mix-blend-mode:multiply;
}
#app::after{ /* 비네트 */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(40,30,18,.30) 100%);
}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden}
#bg .sky{position:absolute;inset:0;background:linear-gradient(#f2e9d5 0%, #e6dac0 55%, #d9caa9 100%)}
#bg svg{position:absolute;bottom:0;left:0;width:100%;height:100%}
#fx{position:absolute;inset:0;z-index:6;pointer-events:none}
#arrow{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
#scene{position:absolute;inset:0;z-index:2}
#overlay{position:absolute;inset:0;z-index:20;display:none}
#tip{position:absolute;z-index:40;display:none;max-width:290px;pointer-events:none;
  background:rgba(24,19,14,.95);color:#efe6d2;padding:9px 12px;border-radius:3px;font-size:13px;line-height:1.55;
  box-shadow:0 8px 26px rgba(0,0,0,.45);border:1px solid rgba(200,180,140,.25)}
#tip b{color:#e6c46a}
#toast{position:absolute;top:78px;left:50%;transform:translateX(-50%);z-index:45;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(24,19,14,.92);color:#f0e7d3;padding:7px 16px;border-radius:2px;font-size:14px;
  animation:toastIn .3s ease, toastOut .4s ease 1.9s forwards;border-left:3px solid var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}

.shake{animation:shake .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}
  30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-1px)}}
.shake-lg{animation:shakeLg .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shakeLg{10%,90%{transform:translate(-4px,2px)}20%,80%{transform:translate(8px,-4px)}
  30%,50%,70%{transform:translate(-14px,4px)}40%,60%{transform:translate(14px,-3px)}}

/* ---------- 공용 ---------- */
.brush-btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 26px;font-size:16px;letter-spacing:.06em;color:#efe6d2;background:var(--ink);
  border-radius:2px;transition:.16s;box-shadow:0 3px 0 rgba(0,0,0,.25);
}
.brush-btn:hover{background:#2a2219;transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,.3)}
.brush-btn:active{transform:translateY(0);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.brush-btn.red{background:var(--red)}.brush-btn.red:hover{background:var(--red2)}
.brush-btn.gold{background:linear-gradient(120deg,#c8a24a,#9b7526);color:#2a1c06;border-color:#e8c86a}
.brush-btn.gold:hover{background:linear-gradient(120deg,#e2bc63,#b48c31)}
.brush-btn.gold:disabled{background:#6b6455;color:#bdb29a;border-color:#6b6455;cursor:default;opacity:.75}
.rewbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.brush-btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.brush-btn.ghost:hover{background:rgba(23,19,15,.08)}
.brush-btn:disabled{opacity:.35;cursor:default;transform:none!important;box-shadow:none}
.seal{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;
  font-size:13px;width:26px;height:26px;border-radius:3px;letter-spacing:0}

/* ---------- 타이틀 ---------- */
#title-scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#title-scene h1{font-size:19px;letter-spacing:1.1em;color:var(--ink3);font-weight:400;margin-left:1.1em}
#title-scene .big{font-size:104px;letter-spacing:.16em;margin:6px 0 2px;margin-left:.16em;line-height:1;
  color:var(--ink);text-shadow:2px 3px 0 rgba(168,39,44,.18)}
#title-scene .sub{font-size:14px;color:var(--ink3);letter-spacing:.35em;margin-bottom:34px;margin-left:.35em}
#title-scene .menu{display:flex;flex-direction:column;gap:12px;width:250px}
#title-scene .menu .brush-btn{width:100%}
#title-scene .foot{position:absolute;bottom:18px;font-size:11px;color:var(--ink3);letter-spacing:.18em}
.title-seal{position:absolute;right:calc(50% - 320px);top:calc(50% - 130px);width:74px;height:74px;background:var(--red);
  color:#fff;display:grid;grid-template-columns:1fr 1fr;place-items:center;font-size:26px;border-radius:4px;
  transform:rotate(-6deg);opacity:.9;box-shadow:0 4px 14px rgba(0,0,0,.2);line-height:1}

/* ---------- 상단바 ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:12px;
  padding:0 16px;background:linear-gradient(rgba(23,19,15,.90),rgba(23,19,15,.78));color:#eee3cc;z-index:12;
  border-bottom:1px solid rgba(200,175,125,.22)}
#topbar .grp{display:flex;align-items:center;gap:7px;font-size:15px}
#topbar .lbl{font-size:11px;color:#a89a80;letter-spacing:.1em}
.hpbar{position:relative;width:126px;height:16px;background:#2e2620;border:1px solid #554a3c;border-radius:2px;overflow:hidden}
.hpbar i{position:absolute;inset:0;width:0;background:linear-gradient(#c14247,#8e2226);transition:width .4s ease}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;color:#fff;text-shadow:0 1px 2px #000;letter-spacing:.02em}
/* 막대기는 보이지 않는다 — 휠이나 끌기로 넘긴다 */
#relicbar{display:flex;gap:5px;flex:1 1 0;min-width:60px;flex-wrap:nowrap;align-items:center;
  overflow-x:auto;overflow-y:hidden;height:36px;scrollbar-width:none;-ms-overflow-style:none;
  mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent);
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent)}
#relicbar.fits{mask-image:none;-webkit-mask-image:none}
#relicbar::-webkit-scrollbar{display:none;width:0;height:0}
.relic,.topbtn,#potbar,#topbar .grp,#deckbtn,#menubtn{flex:none}
.relic{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#efe4cb;color:#2a2219;
  font-size:15px;border:1.5px solid var(--gold);cursor:help;transition:.15s;line-height:1}
/* 많이 모았으면 조금 작게 그려 더 많이 보이게 한다 */
#relicbar.dense .relic{width:25px;height:25px;font-size:12.5px;border-width:1.2px}

.relic:hover{transform:translateY(-3px) scale(1.08);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.relic.new{animation:relicPop .6s ease}
@keyframes relicPop{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:none}}
.topbtn{position:relative;width:34px;height:34px;border-radius:5px;font-size:16px;line-height:1;
  display:grid;place-items:center;color:#f2e7cc;background:rgba(157,124,46,.22);
  border:1.5px solid #9d7c2e;transition:.15s}
.topbtn:hover{transform:translateY(-2px);background:rgba(157,124,46,.42);box-shadow:0 4px 12px rgba(0,0,0,.45)}
.topbtn.box{color:#dff4fb;background:rgba(47,127,153,.28);border-color:#6fd0e8;
  box-shadow:0 0 12px rgba(111,208,232,.35)}
.topbtn.atop{color:#ffd9c8;background:rgba(200,80,40,.24);border-color:#e2622a}
.topbtn.place{color:#fff0cf;background:rgba(157,124,46,.3);border-color:#d8ac3e}
.topbtn.place:hover{background:rgba(180,145,60,.55)}
.topbtn.place.ready{animation:flameGlow 2.2s ease-in-out infinite}
.topbtn.atop:hover{background:rgba(200,80,40,.5)}
.topbtn.atop.ready{animation:flameGlow 1.7s ease-in-out infinite}
.topbtn.atop.locked{opacity:.4}
.topbtn.skill{color:#e6d6ff;background:rgba(120,60,200,.24);border-color:#a879e8}
.topbtn.skill:hover{background:rgba(120,60,200,.46)}
.topbtn.fuse{color:#ffd9e0;background:rgba(190,40,80,.22);border-color:#d84a70}
.topbtn.fuse:hover{background:rgba(190,40,80,.45)}
.topbtn.fuse.ready{animation:ssxGlow 1.4s ease-in-out infinite}
.topbtn.box:hover{background:rgba(47,127,153,.5)}
/* 응급 회복 — 체력이 바닥나면 나타난다 */
.topbtn.heal{color:#dcffef;background:rgba(30,120,90,.34);border-color:#4fd3a0;
  animation:healPulse 1.5s ease-in-out infinite}
.topbtn.heal:hover{background:rgba(40,160,120,.6)}
.topbtn.heal em{background:#c8a24a;color:#2a1c06}
.topbtn.heal.poor{border-color:#8a7f68;color:#bdb29a;background:rgba(60,56,46,.4);animation:none;opacity:.55}
.topbtn.heal.poor em{background:#7a7263;color:#e3dcc9}
.topbtn.hide{display:none}
@keyframes healPulse{50%{box-shadow:0 0 18px rgba(80,220,170,.85);border-color:#9bffd8}}
.topbtn em{position:absolute;right:-5px;top:-5px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;
  background:var(--red);color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center;line-height:1}
.topbtn em:empty{display:none}
.topbtn.empty{opacity:.42;box-shadow:none}
.topbtn.busy{opacity:.3;cursor:default;transform:none!important}
#potbar{display:flex;gap:5px;align-items:center}
.potion{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;font-size:14px;color:#2a2219;
  background:#efe4cb;border:1.5px solid var(--jade);cursor:pointer;transition:.15s;line-height:1}
.potion:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.potion.empty{width:15px;background:rgba(255,255,255,.05);border:1.5px dashed #5f5545;cursor:default;border-radius:3px}
.potion.empty:hover{transform:none;box-shadow:none}

/* ---------- 전투 ---------- */
#battle{position:absolute;inset:0;padding-top:52px}
#field{position:absolute;top:52px;left:0;right:0;bottom:270px;display:flex;align-items:center;padding:0 40px}
#pside{width:250px;display:flex;flex-direction:column;align-items:center;gap:8px}
#eside{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:40px;padding-bottom:6px}

.unit{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;transition:opacity .4s}
.unit .body{position:relative;width:132px;height:132px;display:grid;place-items:center;cursor:default;overflow:visible;
  animation:bob 3.6s ease-in-out infinite}
.unit.big .body{width:172px;height:172px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.unit .body svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.unit .body .glyph{position:relative;font-size:46px;color:var(--ink);z-index:2;text-shadow:0 2px 6px rgba(0,0,0,.18)}
.unit.big .body .glyph{font-size:62px}
.unit .nm{font-size:13.5px;color:var(--ink2);letter-spacing:.08em}
.unit.targetable .body{cursor:crosshair}
.unit.targetable:hover .body{filter:drop-shadow(0 0 10px rgba(168,39,44,.85))}
.unit.targeted .body{filter:drop-shadow(0 0 14px rgba(168,39,44,1))}
.unit.hurt{animation:hurt .3s}
@keyframes hurt{0%,100%{transform:none}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.unit.dying{opacity:0;transform:scale(.7) rotate(8deg);transition:.55s ease-in}
.unit .ebar{position:relative;width:118px;height:13px;background:#c6b795;border:1px solid #6b6053;border-radius:2px;overflow:hidden}
.unit .ebar i{position:absolute;inset:0;width:100%;background:linear-gradient(#b8343a,#7d1e22);transition:width .35s}
.unit .ebar b{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;color:#fff;font-weight:400;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.blockbadge{position:absolute;left:-10px;bottom:0;width:36px;height:36px;display:grid;place-items:center;z-index:6;
  color:#fff;font-size:14px;background:var(--blue);border-radius:50%;border:2px solid #d8cdb0;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.blockbadge.hide{display:none}
.stats{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:170px;min-height:22px}
.st{display:flex;align-items:center;gap:2px;padding:1px 6px;border-radius:2px;font-size:11.5px;cursor:help;line-height:1.5}
.st.buff{background:rgba(44,95,90,.20);color:#1e4744;border:1px solid rgba(44,95,90,.5)}
.st.debuff{background:rgba(168,39,44,.18);color:#8b1f24;border:1px solid rgba(168,39,44,.45)}
.st b{font-size:11px;font-weight:700}

.intent{display:flex;align-items:center;gap:5px;height:32px;color:var(--ink2);font-size:17px;cursor:help}
.intent svg{width:27px;height:27px}
.intent.big{color:var(--red)}
.intent .x{font-size:12px;color:var(--ink3)}
/* 카드에 마우스를 올렸을 때의 예상치 */
.unit .prev{height:22px;display:flex;align-items:center;gap:4px;font-size:15px;color:var(--red);
  opacity:0;transition:opacity .12s;pointer-events:none;white-space:nowrap}
.unit .prev.on{opacity:1;animation:prevPop .18s ease-out}
.unit .prev.blk{color:var(--blue)}
.unit .prev.heal{color:#2c7a4b}
.unit .prev small{font-size:10.5px;color:var(--ink3)}
@keyframes prevPop{from{transform:translateY(5px);opacity:0}to{transform:none;opacity:1}}
.unit.willdie .body{filter:drop-shadow(0 0 12px rgba(168,39,44,.9))}
.unit.willdie .ebar i{background:linear-gradient(#6b6053,#3b332a)}

.dmgnum{position:absolute;z-index:30;font-size:30px;color:var(--red);pointer-events:none;
  text-shadow:0 2px 5px rgba(255,255,255,.9),0 0 3px #fff;animation:dmgUp 1s ease-out forwards}
.dmgnum.blk{color:var(--blue)}
.dmgnum.heal{color:#2c7a4b}
.dmgnum.sm{font-size:21px}
.dmgnum.big{font-size:40px;color:#d23a2e}
.dmgnum.crit{font-size:54px;color:#ff8a1e;font-weight:400;
  text-shadow:0 0 14px #fff,0 0 30px #ffb648,0 0 60px #ff6a00,0 3px 8px rgba(0,0,0,.6);
  animation:dmgCrit 1.05s cubic-bezier(.15,1.4,.35,1) forwards}
@keyframes dmgCrit{0%{opacity:0;transform:translate(-50%,16px) scale(.3) rotate(-8deg)}
  16%{opacity:1;transform:translate(-50%,-12px) scale(1.65) rotate(3deg)}
  30%{transform:translate(-50%,-18px) scale(1.15) rotate(-1deg)}
  100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.critmark{position:absolute;z-index:32;pointer-events:none;font-size:20px;letter-spacing:.32em;
  color:#fff2c8;text-indent:.32em;text-shadow:0 0 12px #ff8a1e,0 0 28px #ff5a00;
  animation:critMark .8s ease-out forwards}
@keyframes critMark{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}
  20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-38px) scale(1)}}
/* 타격 정지 — 아주 짧게 화면을 붙든다 */
.hitstop{animation:hitStop .1s steps(1) both}
.hitstop-lg{animation:hitStopLg .16s steps(1) both}
@keyframes hitStop{0%{filter:contrast(1.35) saturate(1.25) brightness(1.1)}100%{filter:none}}
@keyframes hitStopLg{0%{filter:contrast(1.6) saturate(1.4) brightness(1.25)}
  60%{filter:contrast(1.2) saturate(1.15)}100%{filter:none}}
/* 체력이 바닥일 때 화면 가장자리가 뛴다 */
#lowhp{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(140,20,24,.34) 88%,rgba(120,12,16,.6) 100%)}
#lowhp.on{opacity:1;animation:lowPulse 1.9s ease-in-out infinite}
@keyframes lowPulse{50%{opacity:.45}}
/* 한 턴에 이어 낸 부적 */
.chainmark{position:fixed;right:34px;top:44%;z-index:31;pointer-events:none;text-align:right;white-space:nowrap;min-width:78px;
  color:#ffd76a;letter-spacing:.1em;text-shadow:0 0 14px #ff8a00,0 2px 8px rgba(0,0,0,.8);
  animation:chainPop .9s cubic-bezier(.2,1.3,.4,1) forwards}
.chainmark b{display:block;font-size:46px;font-weight:400;line-height:1}
.chainmark span{display:block;font-size:13px;letter-spacing:.3em;opacity:.85;white-space:nowrap;text-indent:.3em}
@keyframes chainPop{0%{opacity:0;transform:translateX(26px) scale(.7)}
  20%{opacity:1;transform:translateX(0) scale(1.16)}
  60%{opacity:1;transform:translateX(0) scale(1)}
  100%{opacity:0;transform:translateX(-8px) scale(1.02)}}
/* 전리품이 상단바로 날아간다 */
.flyget{position:fixed;z-index:33;pointer-events:none;font-size:17px;letter-spacing:.06em;
  text-shadow:0 2px 6px rgba(0,0,0,.7);transition:transform .78s cubic-bezier(.4,0,.2,1),opacity .78s}
@keyframes dmgUp{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}
  18%{opacity:1;transform:translate(-50%,-8px) scale(1.25)}
  35%{transform:translate(-50%,-14px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-56px) scale(.95)}}

/* ---------- 손패 ---------- */
#hud{position:absolute;left:0;right:0;bottom:0;height:270px}
#hand{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;width:var(--cw);height:var(--ch);left:50%;top:14px;margin-left:calc(var(--cw)/-2);
  pointer-events:auto;cursor:pointer;transform-origin:50% 112%;
  transition:transform .22s cubic-bezier(.2,.9,.3,1.2), filter .18s, opacity .25s;will-change:transform}
.card .face{position:absolute;inset:0;border-radius:6px;overflow:hidden;
  background:linear-gradient(155deg,#f6efdd,#e3d7ba 60%,#d5c6a3);
  border:1.5px solid #4a3f31;box-shadow:0 5px 14px rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.4);
  display:flex;flex-direction:column;padding:8px 9px}
.card.attack .face{background:linear-gradient(155deg,#f7ece0,#e9d5c2 60%,#dcc0aa)}
.card.skill .face{background:linear-gradient(155deg,#eaf0ea,#d5e0da 60%,#bfd0c8)}
.card.power .face{background:linear-gradient(155deg,#f2ecf6,#ddd3e6 60%,#c9bcd8)}
.card .cost{position:absolute;left:-9px;top:-9px;width:34px;height:34px;border-radius:50%;background:var(--ink);
  color:#f4ecd8;display:grid;place-items:center;font-size:17px;z-index:3;border:2px solid #d6c8a6;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.card .cost.free{background:var(--jade)}
.card .cname{text-align:center;font-size:13.5px;letter-spacing:.02em;margin-top:9px;color:#22190f;line-height:1.2}
.card .cname.up{color:var(--gold)}
.card .art{flex:0 0 62px;margin:5px 0;display:grid;place-items:center;position:relative}
.card .art .g{font-size:36px;color:rgba(23,19,15,.82);line-height:1}
.card .art .ring{position:absolute;width:56px;height:56px;border-radius:50%;border:1.5px solid rgba(23,19,15,.18)}
.card .txt{flex:1;min-height:0;overflow:hidden;font-size:11.5px;line-height:1.45;text-align:center;color:#2c241a;padding:2px 1px;
  display:flex;align-items:center;justify-content:center;word-break:keep-all}
.card .txt.long{font-size:10.2px;line-height:1.34}
.card .txt.xlong{font-size:9.3px;line-height:1.3;letter-spacing:-.2px}
.card .txt em{font-style:normal;color:var(--red);font-weight:700}
.card .txt i{font-style:normal;color:var(--blue);font-weight:700}
.card .kind{text-align:center;font-size:10px;letter-spacing:.24em;color:#6b6053;margin-left:.24em;
  border-top:1px solid rgba(23,19,15,.16);padding-top:4px}
.card .grade{position:absolute;right:5px;top:5px;z-index:4;min-width:19px;height:18px;padding:0 4px;
  display:grid;place-items:center;border-radius:3px;font-size:10.5px;letter-spacing:.02em;line-height:1;
  color:#fff;background:var(--gc);box-shadow:0 1px 4px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35)}
.card.special .face{background:linear-gradient(155deg,#fdf1e6,#f3d9c2 55%,#e8bfa0);border-color:#a8420f}

/* S급부터는 불이 붙는다 */
@keyframes flameGlow{
  0%,100%{box-shadow:0 0 13px 2px rgba(226,98,42,.6),0 5px 14px rgba(0,0,0,.34),inset 0 0 20px rgba(255,150,70,.20)}
  50%    {box-shadow:0 0 26px 7px rgba(255,146,52,.92),0 5px 14px rgba(0,0,0,.34),inset 0 0 30px rgba(255,180,90,.36)}}
@keyframes emberSpin{to{transform:rotate(360deg)}}
@keyframes emberPulse{0%,100%{opacity:.55;filter:blur(7px)}50%{opacity:.95;filter:blur(11px)}}
.card.g-s .face{animation:flameGlow 1.7s ease-in-out infinite}
.card.g-s .grade{text-shadow:0 0 7px rgba(255,190,120,.95)}
.card.g-s::before{content:'';position:absolute;inset:-5px;border-radius:9px;z-index:0;
  background:conic-gradient(from 0deg,#ff8a00,#ffd24d,#e2622a,#ff8a00);
  animation:emberSpin 4.5s linear infinite, emberPulse 1.7s ease-in-out infinite}

@keyframes ssxGlow{
  0%,100%{box-shadow:0 0 18px 4px rgba(255,45,85,.72),0 0 42px 10px rgba(255,140,0,.35),inset 0 0 24px rgba(255,120,150,.28)}
  50%    {box-shadow:0 0 36px 12px rgba(255,80,120,1),0 0 70px 20px rgba(255,170,40,.55),inset 0 0 38px rgba(255,180,190,.45)}}
.card.g-ssx .face{border-color:#ff2d55;background:linear-gradient(155deg,#fff2f4,#ffd9dd 50%,#f6b9c4);
  animation:ssxGlow 1.25s ease-in-out infinite}
.card.g-ssx .grade{font-weight:700;text-shadow:0 0 9px rgba(255,220,120,1)}
.card.g-ssx .art .g{color:#8e0f2c;text-shadow:0 0 14px rgba(255,60,100,.75)}
.card.g-ssx::before{content:'';position:absolute;inset:-8px;border-radius:12px;z-index:0;
  background:conic-gradient(from 0deg,#ff2d55,#ff8a00,#ffe14d,#ff2d55,#c2185b,#ff2d55);
  animation:emberSpin 2.6s linear infinite, emberPulse 1.25s ease-in-out infinite}
.card.g-unknown .face{border-color:#7b4bd8}
.card.g-unknown::before{content:'';position:absolute;inset:-7px;border-radius:11px;z-index:0;
  background:conic-gradient(from 0deg,#7b4bd8,#2de1ff,#ff2d55,#ffe14d,#7b4bd8);
  animation:emberSpin 3.4s linear infinite, emberPulse 1.5s ease-in-out infinite}

/* ══ 스킨(皮) — S급·SSX급·?급 부적에 입힌다 ══════════════
   스킨을 입으면 등급이 만드는 기본 아우라를 지우고 제 색을 낸다.
   ═══════════════════════════════════════════════════════════ */
.card.skinned::before{display:none!important}
.card.skinned .face{animation:none}
.card.skinned .sklayer{position:absolute;inset:0;border-radius:5px;pointer-events:none;z-index:1;overflow:hidden}
.card.skinned .face > *:not(.sklayer){position:relative;z-index:2}
/* 무늬가 화려해도 글이 읽히도록 받침을 깐다 (무늬 위·글자 아래) */
.card.skinned .txt:before,.card.skinned .cname:before,.card.skinned .kind:before{
  content:'';position:absolute;inset:-3px -5px;border-radius:5px;z-index:-1;
  background:var(--scrim,rgba(0,0,0,.34))}
.card.skinned .kind:before{inset:-1px -5px}
/* 바탕이 밝은 옷은 흰 받침 */
.card.sk-celadon,.card.sk-frost,.card.sk-plum,.card.sk-landscape,.card.sk-glass,
.card.sk-tigerfur,.card.sk-talisman{--scrim:rgba(255,255,255,.52)}
.card.skinned .skaura{position:absolute;inset:-7px;border-radius:11px;z-index:0;pointer-events:none}
@keyframes skSweep{0%{background-position:210% 0}55%,100%{background-position:-110% 0}}
@keyframes skSpin{to{transform:rotate(360deg)}}
@keyframes skBreathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes skRise{0%{transform:translateY(0) scale(.7);opacity:0}
  15%{opacity:.9}100%{transform:translateY(-104px) scale(1.1);opacity:0}}
@keyframes skDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4px,-5px) scale(1.08)}}
@keyframes skTwinkle{0%,100%{opacity:.15}50%{opacity:.95}}

/* 1. 금박(金箔) — 검은 옻칠 위에 금박을 입혔다 */
.card.sk-gold .face{background:linear-gradient(155deg,#241c10,#100c07 55%,#2a2013);border-color:#c8a13c;
  box-shadow:0 5px 16px rgba(0,0,0,.55),inset 0 0 0 1px rgba(230,190,110,.45)}
.card.sk-gold .cname{color:#ffe9ae;text-shadow:0 0 10px rgba(255,200,110,.6)}
.card.sk-gold .txt{color:#f0e0bc}
.card.sk-gold .txt em{color:#ff9a6a}.card.sk-gold .txt i{color:#8fd0ff}
.card.sk-gold .kind{color:#a08a55;border-top-color:rgba(200,160,80,.3)}
.card.sk-gold .art .g{color:#ffd776;text-shadow:0 0 16px rgba(255,190,90,.85),0 2px 0 #6b4a12}
.card.sk-gold .art .ring{border-color:rgba(230,190,110,.5);box-shadow:0 0 14px rgba(230,180,90,.4) inset}
.card.sk-gold .cost{background:linear-gradient(140deg,#e6bd63,#8a6118);color:#2a1c06;border-color:#ffe9ae}
.card.sk-gold .sklayer{mix-blend-mode:screen;
  background:linear-gradient(108deg,transparent 36%,rgba(255,230,150,.5) 47%,rgba(255,200,90,.28) 53%,transparent 64%);
  background-size:250% 100%;animation:skSweep 3.4s ease-in-out infinite}
.card.sk-gold .skaura{background:conic-gradient(from 0deg,#c8a13c,#ffe9ae,#8a6118,#c8a13c);
  filter:blur(8px);opacity:.6;animation:skSpin 7s linear infinite}

/* 2. 청자(靑瓷) — 갈라진 비취빛 유약 */
.card.sk-celadon .face{background:linear-gradient(155deg,#dcefe6,#b8dbcd 55%,#94c2b2);border-color:#3f7d6b;
  box-shadow:0 5px 14px rgba(0,0,0,.3),inset 0 0 26px rgba(255,255,255,.5)}
.card.sk-celadon .cname{color:#14453a}
.card.sk-celadon .txt{color:#1c4a3f}
.card.sk-celadon .kind{color:#4c7c6e;border-top-color:rgba(30,80,68,.22)}
.card.sk-celadon .art .g{color:#0f3b31;text-shadow:0 1px 0 rgba(255,255,255,.65)}
.card.sk-celadon .art .ring{border-color:rgba(20,70,58,.3)}
.card.sk-celadon .cost{background:linear-gradient(140deg,#5ea78f,#22574a);color:#eafff6;border-color:#bfe6d8}
.card.sk-celadon .sklayer{opacity:.5;
  background:
    linear-gradient(64deg,transparent 48%,rgba(20,60,52,.5) 49%,transparent 50%),
    linear-gradient(-38deg,transparent 62%,rgba(20,60,52,.4) 63%,transparent 64%),
    linear-gradient(15deg,transparent 30%,rgba(20,60,52,.35) 31%,transparent 32%),
    linear-gradient(-72deg,transparent 76%,rgba(20,60,52,.3) 77%,transparent 78%)}
.card.sk-celadon .skaura{background:radial-gradient(circle,rgba(120,210,180,.55),transparent 70%);
  animation:skBreathe 3.6s ease-in-out infinite}

/* 3. 주칠(朱漆) — 붉은 옻칠에 금니로 그렸다 */
.card.sk-lacquer .face{background:linear-gradient(155deg,#7d1418,#4a0a0d 58%,#68110f);border-color:#e8c86a;
  box-shadow:0 5px 16px rgba(0,0,0,.5),inset 0 0 0 1px rgba(232,200,106,.4)}
.card.sk-lacquer .cname{color:#ffdf9a}
.card.sk-lacquer .txt{color:#f2d6c4}
.card.sk-lacquer .txt em{color:#ffb08a}.card.sk-lacquer .txt i{color:#9fd8ff}
.card.sk-lacquer .kind{color:#c8926a;border-top-color:rgba(232,200,106,.28)}
.card.sk-lacquer .art .g{color:#ffe6a8;text-shadow:0 0 12px rgba(255,190,90,.6),0 2px 0 #3a0708}
.card.sk-lacquer .art .ring{border-color:rgba(232,200,106,.45)}
.card.sk-lacquer .cost{background:linear-gradient(140deg,#2a0607,#5a0d10);color:#ffdf9a;border-color:#e8c86a}
.card.sk-lacquer .sklayer{opacity:.32;
  background:repeating-linear-gradient(42deg,transparent 0 7px,rgba(255,220,150,.14) 7px 8px)}
.card.sk-lacquer .skaura{background:radial-gradient(circle,rgba(200,40,40,.7),transparent 72%);
  animation:skBreathe 2.8s ease-in-out infinite}

/* 4. 먹빛(墨) — 번지는 먹물 */
.card.sk-ink .face{background:linear-gradient(155deg,#3a3630,#171512 60%,#2a2622);border-color:#8f887c;
  box-shadow:0 5px 14px rgba(0,0,0,.55),inset 0 0 30px rgba(0,0,0,.6)}
.card.sk-ink .cname{color:#f0ece0}
.card.sk-ink .txt{color:#cfc9b8}
.card.sk-ink .txt em{color:#ff8a7a}.card.sk-ink .txt i{color:#8fc4ff}
.card.sk-ink .kind{color:#8f887c;border-top-color:rgba(200,195,180,.2)}
.card.sk-ink .art .g{color:#f6f2e6;text-shadow:0 0 20px rgba(0,0,0,.9)}
.card.sk-ink .art .ring{border-color:rgba(240,236,224,.28)}
.card.sk-ink .cost{background:#0e0d0b;color:#f0ece0;border-color:#8f887c}
.card.sk-ink .sklayer{opacity:.55;
  background:radial-gradient(ellipse 60% 34% at 22% 26%,rgba(0,0,0,.85),transparent 70%),
    radial-gradient(ellipse 48% 30% at 78% 68%,rgba(0,0,0,.7),transparent 72%),
    radial-gradient(ellipse 40% 22% at 50% 92%,rgba(0,0,0,.6),transparent 70%);
  animation:skDrift 7s ease-in-out infinite}
.card.sk-ink .skaura{background:radial-gradient(circle,rgba(60,56,48,.9),transparent 68%);
  animation:skBreathe 4.5s ease-in-out infinite}

/* 5. 야광(夜光) — 어둠 속에서 스스로 빛난다 */
.card.sk-glow .face{background:linear-gradient(155deg,#0d1730,#060a18 58%,#0a1428);border-color:#2de1ff;
  box-shadow:0 5px 18px rgba(0,0,0,.6),0 0 22px rgba(45,225,255,.35),inset 0 0 26px rgba(20,120,180,.35)}
.card.sk-glow .cname{color:#b6f4ff;text-shadow:0 0 12px rgba(45,225,255,.9)}
.card.sk-glow .txt{color:#a8d8e8}
.card.sk-glow .txt em{color:#ff7a9a}.card.sk-glow .txt i{color:#6ef0ff}
.card.sk-glow .kind{color:#5a90a8;border-top-color:rgba(45,225,255,.3)}
.card.sk-glow .art .g{color:#dffaff;text-shadow:0 0 10px #2de1ff,0 0 26px #2de1ff,0 0 48px rgba(45,225,255,.7)}
.card.sk-glow .art .ring{border-color:rgba(45,225,255,.55);box-shadow:0 0 16px rgba(45,225,255,.5)}
.card.sk-glow .cost{background:linear-gradient(140deg,#0b3a52,#041826);color:#b6f4ff;border-color:#2de1ff;
  box-shadow:0 0 12px rgba(45,225,255,.6)}
.card.sk-glow .sklayer{
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(45,225,255,.07) 3px 4px);
  animation:skBreathe 2.4s ease-in-out infinite}
.card.sk-glow .skaura{background:radial-gradient(circle,rgba(45,225,255,.75),transparent 70%);
  filter:blur(5px);animation:skBreathe 2.1s ease-in-out infinite}

/* 6. 화염(火焰) — 불티가 피어오른다 */
.card.sk-flame .face{background:linear-gradient(170deg,#ffd9a0,#f08a2a 40%,#a82810 78%,#5a0f06);
  border-color:#ffb648;box-shadow:0 5px 18px rgba(0,0,0,.5),inset 0 -18px 30px rgba(90,15,6,.6)}
.card.sk-flame .cname{color:#fff3d8;text-shadow:0 1px 4px rgba(120,20,0,.8)}
.card.sk-flame .txt{color:#fff0dc;text-shadow:0 1px 3px rgba(90,15,6,.7)}
.card.sk-flame .txt em{color:#fff0a0}.card.sk-flame .txt i{color:#bfe8ff}
.card.sk-flame .kind{color:#ffd9a0;border-top-color:rgba(255,200,120,.4)}
.card.sk-flame .art .g{color:#fff6dc;text-shadow:0 0 14px #ff8a00,0 0 34px #ff4a00,0 2px 0 #7a1c04}
.card.sk-flame .art .ring{border-color:rgba(255,220,160,.6);box-shadow:0 0 20px rgba(255,140,40,.6)}
.card.sk-flame .cost{background:linear-gradient(140deg,#ff9a2a,#8a2408);color:#fff6dc;border-color:#ffd9a0}
.card.sk-flame .sklayer i{position:absolute;bottom:-6px;width:3px;height:3px;border-radius:50%;
  background:#ffd076;box-shadow:0 0 7px #ff9a2a;animation:skRise 2.6s linear infinite}
.card.sk-flame .skaura{background:conic-gradient(from 0deg,#ff4a00,#ffd24d,#ff8a00,#ff2d00,#ff4a00);
  filter:blur(9px);opacity:.75;animation:skSpin 3.4s linear infinite,skBreathe 1.5s ease-in-out infinite}

/* 7. 서리(霜) — 살얼음이 낀 부적 */
.card.sk-frost .face{background:linear-gradient(155deg,#f2fbff,#cfe6f5 52%,#a8c8e0);border-color:#5a9ec8;
  box-shadow:0 5px 14px rgba(0,0,0,.28),0 0 20px rgba(140,210,255,.4),inset 0 0 30px rgba(255,255,255,.7)}
.card.sk-frost .cname{color:#0f3550}
.card.sk-frost .txt{color:#173d58}
.card.sk-frost .kind{color:#4a7898;border-top-color:rgba(30,80,120,.25)}
.card.sk-frost .art .g{color:#0d3a5c;text-shadow:0 0 12px rgba(180,230,255,.95),0 1px 0 #fff}
.card.sk-frost .art .ring{border-color:rgba(80,150,200,.45)}
.card.sk-frost .cost{background:linear-gradient(140deg,#7fc4e8,#255f88);color:#f2fbff;border-color:#cfe6f5}
.card.sk-frost .sklayer{opacity:.6;
  background:
    linear-gradient(60deg,transparent 41%,rgba(255,255,255,.9) 42%,transparent 44%),
    linear-gradient(-60deg,transparent 56%,rgba(255,255,255,.8) 57%,transparent 59%),
    linear-gradient(120deg,transparent 24%,rgba(255,255,255,.7) 25%,transparent 27%),
    radial-gradient(circle at 82% 16%,rgba(255,255,255,.9),transparent 26%),
    radial-gradient(circle at 14% 76%,rgba(255,255,255,.8),transparent 24%)}
.card.sk-frost .skaura{background:radial-gradient(circle,rgba(150,220,255,.8),transparent 70%);
  filter:blur(6px);animation:skBreathe 3.2s ease-in-out infinite}

/* 8. 자개(螺鈿) — 검은 칠 위에 자개를 박았다 */
.card.sk-nacre .face{background:linear-gradient(155deg,#1a1620,#0b0910 58%,#16121c);border-color:#8fd8c8;
  box-shadow:0 5px 16px rgba(0,0,0,.6),inset 0 0 0 1px rgba(180,240,220,.3)}
.card.sk-nacre .cname{color:#d8fff2}
.card.sk-nacre .txt{color:#bfd8d2}
.card.sk-nacre .txt em{color:#ff9ab8}.card.sk-nacre .txt i{color:#9fe0ff}
.card.sk-nacre .kind{color:#6f9a90;border-top-color:rgba(140,220,200,.28)}
.card.sk-nacre .art .g{color:#eafff8;text-shadow:0 0 16px rgba(140,255,220,.7)}
.card.sk-nacre .art .ring{border-color:rgba(140,220,200,.4)}
.card.sk-nacre .cost{background:linear-gradient(140deg,#123028,#050a08);color:#d8fff2;border-color:#8fd8c8}
.card.sk-nacre .sklayer{opacity:.62;mix-blend-mode:screen;
  background:
    conic-gradient(from 20deg at 26% 30%,#7affd8,#9ab8ff,#ff9ae0,#ffe89a,#7affd8),
    conic-gradient(from 200deg at 74% 70%,#ff9ae0,#7affd8,#ffe89a,#9ab8ff,#ff9ae0);
  background-size:44% 30%,38% 26%;background-repeat:no-repeat;
  -webkit-mask-image:radial-gradient(ellipse 22% 15% at 26% 30%,#000 60%,transparent 62%),
    radial-gradient(ellipse 19% 13% at 74% 70%,#000 60%,transparent 62%),
    radial-gradient(ellipse 12% 9% at 60% 20%,#000 60%,transparent 62%);
  mask-image:radial-gradient(ellipse 22% 15% at 26% 30%,#000 60%,transparent 62%),
    radial-gradient(ellipse 19% 13% at 74% 70%,#000 60%,transparent 62%),
    radial-gradient(ellipse 12% 9% at 60% 20%,#000 60%,transparent 62%);
  animation:skBreathe 3.8s ease-in-out infinite}
.card.sk-nacre .skaura{background:conic-gradient(from 0deg,#7affd8,#9ab8ff,#ff9ae0,#ffe89a,#7affd8);
  filter:blur(8px);opacity:.55;animation:skSpin 8s linear infinite}

/* 9. 혼돈(混沌) — 빛깔이 잡히지 않는다 */
.card.sk-chaos .face{background:linear-gradient(155deg,#1c1030,#0a0616 55%,#1a0e2c);border-color:#c78cff;
  box-shadow:0 5px 20px rgba(0,0,0,.6),inset 0 0 28px rgba(140,80,220,.4)}
.card.sk-chaos .cname{color:#f2dcff;text-shadow:0 0 12px rgba(190,120,255,.8)}
.card.sk-chaos .txt{color:#dcc8f0}
.card.sk-chaos .txt em{color:#ff7ab0}.card.sk-chaos .txt i{color:#7ae8ff}
.card.sk-chaos .kind{color:#9a7ac0;border-top-color:rgba(190,140,255,.3)}
.card.sk-chaos .art .g{color:#fff;text-shadow:0 0 14px #b98cff,0 0 30px #ff2d55,0 0 48px #2de1ff}
.card.sk-chaos .art .ring{border-color:rgba(200,150,255,.5);box-shadow:0 0 18px rgba(180,110,255,.6)}
.card.sk-chaos .cost{background:linear-gradient(140deg,#4a1c7a,#12061f);color:#f2dcff;border-color:#c78cff}
.card.sk-chaos .sklayer{mix-blend-mode:screen;opacity:.4;
  background:conic-gradient(from 0deg,#ff2d55,#ffd24d,#2de1ff,#b98cff,#ff2d55);
  animation:skSpin 4.2s linear infinite}
.card.sk-chaos .skaura{background:conic-gradient(from 0deg,#ff2d55,#ffd24d,#2de1ff,#b98cff,#ff2d55);
  filter:blur(10px);opacity:.85;animation:skSpin 2.4s linear infinite,skBreathe 1.3s ease-in-out infinite}

/* 10. 성수(星宿) — 별자리를 새겼다 */
.card.sk-star .face{background:linear-gradient(175deg,#101a34,#050a18 50%,#0b1226);border-color:#8fa8e8;
  box-shadow:0 5px 18px rgba(0,0,0,.6),inset 0 0 30px rgba(30,50,110,.6)}
.card.sk-star .cname{color:#e2ecff}
.card.sk-star .txt{color:#c2d0ee}
.card.sk-star .txt em{color:#ff96a8}.card.sk-star .txt i{color:#96d8ff}
.card.sk-star .kind{color:#7a8cc0;border-top-color:rgba(150,180,255,.28)}
.card.sk-star .art .g{color:#fff8dc;text-shadow:0 0 12px rgba(255,240,190,.9),0 0 30px rgba(150,180,255,.7)}
.card.sk-star .art .ring{border-color:rgba(180,200,255,.4)}
.card.sk-star .cost{background:linear-gradient(140deg,#1d2a55,#070c1a);color:#e2ecff;border-color:#8fa8e8}
.card.sk-star .sklayer i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff8dc;
  box-shadow:0 0 5px #fff8dc;animation:skTwinkle 2.6s ease-in-out infinite}
.card.sk-star .sklayer:after{content:'';position:absolute;inset:0;
  background:linear-gradient(118deg,transparent 44%,rgba(190,215,255,.35) 46%,transparent 48%),
    linear-gradient(-58deg,transparent 62%,rgba(190,215,255,.28) 63%,transparent 65%)}
.card.sk-star .skaura{background:radial-gradient(circle,rgba(120,160,255,.6),transparent 70%);
  filter:blur(7px);animation:skBreathe 4s ease-in-out infinite}

.card:hover{z-index:20!important}
.card.sel{z-index:25!important;filter:drop-shadow(0 0 12px rgba(168,39,44,.9))}
.card.unplayable .face{filter:grayscale(.75) brightness(.82)}
.card.unplayable .cost{background:#6b6053}
.card.playing{pointer-events:none}
/* 부적이 나가는 모션 — 종류마다 다르다 */
.card.fly{animation:cardFly .32s ease-in forwards}
@keyframes cardFly{to{opacity:0;transform:translate(0,-160px) scale(.55) rotate(4deg)}}
/* 한 번 크게 들어 보인 뒤 흩어진다 */
.card.cast{z-index:60!important;pointer-events:none;
  animation:cardCast .46s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes cardCast{
  0%{transform:translate(0,0) scale(1) rotate(0);opacity:1;filter:none}
  30%{transform:translate(var(--mx,0px),calc(var(--my,-150px) * .55)) scale(1.34) rotate(-3deg);
      filter:brightness(1.35) drop-shadow(0 0 22px var(--cg,#ffd76a))}
  58%{transform:translate(var(--mx,0px),var(--my,-150px)) scale(1.22) rotate(2deg);
      filter:brightness(1.6) drop-shadow(0 0 34px var(--cg,#ffd76a))}
  100%{transform:translate(calc(var(--mx,0px) * 1.9),calc(var(--my,-150px) * 1.7)) scale(.42) rotate(9deg);
       opacity:0;filter:brightness(2.2) blur(3px)}}
/* 심법은 내 몸으로 스며든다 */
.card.cast.into{animation:cardInto .5s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes cardInto{
  0%{transform:translate(0,0) scale(1);opacity:1}
  34%{transform:translate(0,-96px) scale(1.28) rotate(-2deg);filter:brightness(1.5) drop-shadow(0 0 26px var(--cg,#7fe6cf))}
  100%{transform:translate(var(--mx,-360px),var(--my,-120px)) scale(.2) rotate(-14deg);opacity:0;filter:blur(4px) brightness(2)}}
/* 나가는 자리에 남는 잔상 */
.castghost{position:fixed;z-index:59;pointer-events:none;border-radius:6px;
  border:2px solid var(--cg,#ffd76a);box-shadow:0 0 26px var(--cg,#ffd76a),inset 0 0 20px var(--cg,#ffd76a);
  animation:ghostGo .5s ease-out forwards}
@keyframes ghostGo{0%{opacity:.85;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.7) rotate(6deg)}}
/* 부적에서 대상으로 흐르는 기운 */
.castflow{position:fixed;z-index:58;pointer-events:none;height:4px;transform-origin:0 50%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--cg,#ffd76a),transparent);
  filter:blur(1px);animation:flowGo .42s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes flowGo{0%{opacity:0;transform:scaleX(0) rotate(var(--a))}
  30%{opacity:1}100%{opacity:0;transform:scaleX(1) rotate(var(--a))}}

#pilebar{position:absolute;bottom:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;pointer-events:none}
.pile{pointer-events:auto;width:62px;height:62px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(23,19,15,.86);color:#efe4cb;font-size:11px;letter-spacing:.06em;cursor:pointer;transition:.15s;border:1.5px solid rgba(214,200,166,.35)}
.pile:hover{transform:scale(1.08);background:rgba(35,28,20,.95)}
.pile b{font-size:19px;font-weight:400;line-height:1.2}
#endturn{pointer-events:auto;position:absolute;right:22px;bottom:82px;padding:13px 24px;font-size:16px;letter-spacing:.14em;
  background:var(--red);color:#fff;border-radius:3px;box-shadow:0 4px 0 #6f1a1e;transition:.15s;margin-left:.14em}
#endturn:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 6px 0 #6f1a1e}
#endturn:disabled{background:#7a7263;box-shadow:0 4px 0 #55503f;opacity:.7;transform:none}
/* 자동 플레이 */
#autobtn{pointer-events:auto;position:absolute;right:22px;bottom:140px;padding:8px 16px;font-size:13px;letter-spacing:.12em;
  background:rgba(23,19,15,.82);color:#d8cbaa;border:1.5px solid #6d6250;border-radius:3px;transition:.15s}
#autobtn b{font-size:11px;opacity:.9;margin-left:3px}
#autobtn:hover{border-color:#c8a94e;color:#f2e6c4}
#autobtn.on{background:#2c5f5a;border-color:#7fd3c6;color:#eafff9;box-shadow:0 0 14px rgba(70,190,175,.45);
  animation:autopulse 1.8s ease-in-out infinite}
#autobtn.locked{opacity:.5;border-style:dashed}
#autobtn.locked:hover{border-color:#8a7f68;color:#d8cbaa}
@keyframes autopulse{50%{box-shadow:0 0 24px rgba(70,190,175,.85)}}
#autochip{position:fixed;left:50%;top:56px;transform:translate(-50%,-16px);z-index:70;display:none;align-items:center;gap:9px;
  padding:7px 15px 7px 11px;border-radius:22px;background:rgba(18,44,42,.94);border:1.5px solid #6ec3b6;
  color:#e6fff9;font-size:12.5px;letter-spacing:.14em;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);
  transition:transform .2s,opacity .2s;opacity:0}
#autochip.on{display:flex;transform:translate(-50%,0);opacity:1}
#autochip i{width:9px;height:9px;border-radius:50%;background:#7fe6cf;animation:autoblink 1.1s infinite}
#autochip b{font-weight:400;font-size:11px;color:#9fd8cd;letter-spacing:.1em;border-left:1px solid rgba(150,220,205,.35);padding-left:9px}
#autochip:hover{background:rgba(28,64,60,.98)}
@keyframes autoblink{50%{opacity:.25}}
/* 설정 */
.optlist{display:flex;flex-direction:column;gap:2px;width:min(520px,88vw);max-height:58vh;overflow-y:auto;padding-right:6px}
.optlist::-webkit-scrollbar{width:8px}.optlist::-webkit-scrollbar-thumb{background:rgba(220,200,160,.3);border-radius:4px}
.optrow{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid rgba(220,200,160,.14)}
.optrow .lb{flex:1;text-align:left}
.optrow .lb b{display:block;font-weight:400;font-size:14.5px;color:#f0e6cd;letter-spacing:.06em}
.optrow .lb small{display:block;font-size:11.5px;color:#9d927b;margin-top:2px;letter-spacing:.02em}
.optrow .val{flex:none;min-width:104px;padding:7px 12px;font-size:12.5px;letter-spacing:.1em;border-radius:3px;

.optrow .val:hover{border-color:#c8a94e;color:#f6ecd0}
.optrow .val.yes{border-color:#4f9c8f;color:#a7ecdd;background:rgba(30,70,66,.5)}
.optrow .val.no{opacity:.55}
.optrow input[type=range]{flex:none;width:150px;accent-color:#a8272c}
.opthead{margin:16px 0 2px;font-size:12px;letter-spacing:.3em;color:#c8a94e;text-align:left;border-bottom:1px solid rgba(200,169,78,.3);padding-bottom:6px}
#energy{pointer-events:auto;position:absolute;left:96px;bottom:88px;width:78px;height:78px;border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#4a8a83,#1e4642);color:#f3ecd8;
  font-size:22px;border:2.5px solid #d6c8a6;box-shadow:0 0 22px rgba(44,95,90,.55),0 4px 10px rgba(0,0,0,.35);cursor:help}
#energy small{font-size:12px;opacity:.75}
#energy.flash{animation:eflash .4s}
@keyframes eflash{50%{transform:scale(1.18);box-shadow:0 0 40px rgba(90,190,175,.9)}}
#turnlabel{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:56px;letter-spacing:.3em;
  color:var(--ink);opacity:0;pointer-events:none;z-index:15;margin-left:.3em;text-shadow:0 4px 20px rgba(255,255,255,.7)}
#turnlabel.show{animation:turnShow 1.15s ease-out}
@keyframes turnShow{0%{opacity:0;transform:translateX(-50%) scale(.7)}
  20%{opacity:.8;transform:translateX(-50%) scale(1)}70%{opacity:.8}100%{opacity:0;transform:translateX(-50%) scale(1.08)}}

/* ---------- 지도 ---------- */
/* 지도는 스크롤하지 않는다 — 한 화면에 전부 담고 필요한 만큼만 줄인다 */
#map{position:absolute;inset:52px 0 0 0;overflow:hidden;display:flex;flex-direction:column;align-items:center}
#mapstage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#mapinner{position:relative;width:660px;transform-origin:50% 50%}
/* 지금 자리 */
.mapnode.cur:after{content:'';position:absolute;inset:-11px;border-radius:50%;border:2px solid var(--gold);
  animation:curRing 1.9s ease-out infinite;pointer-events:none}
@keyframes curRing{0%{transform:scale(.86);opacity:.95}100%{transform:scale(1.5);opacity:0}}
/* 갈 수 있는 곳 위의 작은 화살 */
.mapnode.avail:before{content:'';position:absolute;left:50%;top:-17px;margin-left:-6px;
  border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:8px solid var(--red);
  animation:availArrow 1.4s ease-in-out infinite;opacity:.9}
@keyframes availArrow{50%{transform:translateY(-5px)}}
/* 한눈에 보이는 층 눈금 */
.maprow{position:absolute;left:-46px;font-size:11px;color:rgba(23,19,15,.4);letter-spacing:.08em;
  transform:translateY(-50%)}
.maprow.now{color:var(--red);font-size:12.5px}
/* 아래 안내 띠 */
#maplegend{flex:none;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:8px 14px 12px;
  font-size:11.5px;color:var(--ink3);letter-spacing:.04em}
#maplegend span{display:flex;align-items:center;gap:5px}
#maplegend i{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-style:normal;
  font-size:11px;background:#efe6d0;border:1.5px solid var(--ink2);color:var(--ink)}
.mapnode{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:grid;place-items:center;
  font-size:22px;background:#efe6d0;border:2px solid var(--ink2);color:var(--ink);transition:.18s;z-index:2;line-height:1}
.mapnode.avail{cursor:pointer;border-color:var(--red);box-shadow:0 0 0 4px rgba(168,39,44,.18),0 0 16px rgba(168,39,44,.35);
  animation:nodePulse 1.7s ease-in-out infinite}
@keyframes nodePulse{0%,100%{box-shadow:0 0 0 4px rgba(168,39,44,.16),0 0 14px rgba(168,39,44,.3)}
  50%{box-shadow:0 0 0 8px rgba(168,39,44,.08),0 0 22px rgba(168,39,44,.5)}}
.mapnode.avail:hover{transform:scale(1.18)}
.mapnode.done{opacity:.42;filter:grayscale(.7)}
.mapnode.cur{border-color:var(--gold);box-shadow:0 0 0 4px rgba(157,124,46,.3)}
.mapnode.janggi{background:linear-gradient(150deg,#5c4a1d,#957d2b);color:#fbf3ea;border-color:#e8cf94;
  box-shadow:0 0 0 3px rgba(232,207,148,.2),0 0 16px rgba(232,207,148,.45)}
.mapnode.janggi.done{background:#4a4438}
.mapnode.special{background:linear-gradient(150deg,#1d4a5c,#2b7d95);color:#eaf7fb;border-color:#6fd0e8;
  box-shadow:0 0 0 3px rgba(111,208,232,.22),0 0 18px rgba(111,208,232,.5)}
.mapnode.special.done{background:#3a4a50}
.mapnode.boss{width:76px;height:76px;margin:-38px 0 0 -38px;font-size:32px;background:#2a1f17;color:#f0d9a0;border-color:var(--red)}
#maphead{flex:none;text-align:center;padding:10px 0 4px;font-size:13.5px;letter-spacing:.3em;color:var(--ink2);margin-left:.3em}
#maphead .actname{font-size:23px;display:block;margin-top:3px;letter-spacing:.18em;margin-left:.18em}
#maphead .actbar{width:min(420px,60vw);height:5px;margin:8px auto 0;border-radius:3px;background:rgba(23,19,15,.14);
  overflow:hidden}
#maphead .actbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#e2884a);
  transition:width .5s ease}
#maphead .actsub{display:block;font-size:11px;letter-spacing:.1em;color:var(--ink3);margin-top:5px}

/* ---------- 카드 목록/보상/상점 등 패널 ---------- */
.panel{position:absolute;inset:0;background:rgba(18,14,10,.93);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;z-index:22;animation:fadeIn .2s;padding:22px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel h2{color:#f2e9d3;font-size:26px;letter-spacing:.22em;font-weight:400;margin-left:.22em;text-align:center}
.panel .hint{color:#b3a68c;font-size:13px;letter-spacing:.08em;margin-top:-10px}
.cardgrid{display:flex;flex-wrap:wrap;gap:18px 16px;justify-content:center;align-content:flex-start;
  max-height:64vh;overflow-y:auto;padding:12px;max-width:min(1180px,94vw)}
.cardgrid::-webkit-scrollbar{width:8px}.cardgrid::-webkit-scrollbar-thumb{background:rgba(220,200,160,.35);border-radius:4px}
.cardgrid .card{position:relative;left:auto;top:auto;margin:0;transform:none!important;transition:transform .16s}
.cardgrid .card.pick:hover{transform:translateY(-10px) scale(1.05)!important;z-index:5}
.cardgrid .card.dim{opacity:.4}
.rewardrow{display:flex;gap:12px;flex-direction:column;width:420px;max-width:92vw}
.rewitem{display:flex;align-items:center;gap:14px;padding:13px 18px;background:rgba(240,232,212,.94);border-radius:3px;
  cursor:pointer;transition:.15s;border-left:4px solid var(--gold)}
.rewitem:hover{transform:translateX(6px);background:#fff}

.rewitem .ic{width:40px;height:40px;display:grid;place-items:center;font-size:21px;background:var(--ink);color:#f0e6cd;border-radius:50%;flex:none;line-height:1}
.rewitem .t{flex:1}.rewitem .t b{display:block;font-size:15.5px;font-weight:400}

.shopgrid{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.shopcol{display:flex;flex-direction:column;gap:10px;align-items:center}

.priced{position:relative;margin-bottom:14px}
.pricetag{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:var(--ink);color:#e8c86a;
  font-size:12px;padding:2px 10px;border-radius:10px;white-space:nowrap;z-index:6;border:1px solid rgba(232,200,106,.4)}
.pricetag.no{color:#b0553f}
.evtbox{max-width:640px;background:rgba(240,232,212,.96);padding:30px 34px;border-radius:4px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);border-top:4px solid var(--red)}

.evtbox .opt{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:9px;background:rgba(23,19,15,.06);
  border-left:3px solid var(--ink3);font-size:14.5px;transition:.14s;border-radius:2px}
.evtbox .opt:hover{background:rgba(168,39,44,.12);border-left-color:var(--red);transform:translateX(5px)}
.evtbox .opt small{display:block;color:var(--ink3);font-size:12px;margin-top:3px}

.restrow{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.restopt{width:200px;padding:26px 18px;background:rgba(240,232,212,.95);border-radius:4px;text-align:center;cursor:pointer;
  transition:.18s;border-bottom:4px solid var(--jade)}

.restopt .ic{font-size:40px;margin-bottom:10px;line-height:1}

.restopt small{color:var(--ink3);font-size:12.5px;line-height:1.5;display:block}
.restopt.dis{opacity:.4;cursor:default;transform:none!important}

/* ── 타격 연출 ─────────────────────────────────────────── */
.impact{position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-50%);width:0;height:0}
.impact i{position:absolute;display:block;transform-origin:50% 50%}
.flashlayer{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0}
@keyframes scrFlash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}

/* 베기 */
@keyframes slashGo{0%{transform:rotate(var(--a)) translateX(-40px) scaleX(0);opacity:0}
  25%{opacity:1}60%{transform:rotate(var(--a)) translateX(10px) scaleX(1);opacity:1}
  100%{transform:rotate(var(--a)) translateX(38px) scaleX(1);opacity:0}}
.ik-slash i,.ik-slash2 i,.ik-spin i{width:210px;height:7px;margin:-3px 0 0 -105px;border-radius:4px;
  background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);
  box-shadow:0 0 14px rgba(255,255,255,.95),0 0 26px rgba(168,39,44,.7);
  animation:slashGo .3s cubic-bezier(.2,.8,.3,1) forwards}
.ik-spin i{width:250px;margin-left:-125px}

/* 찌르기 */
@keyframes pierceGo{0%{transform:translateX(-190px) scaleX(.2);opacity:0}
  30%{opacity:1}55%{transform:translateX(0) scaleX(1);opacity:1}100%{transform:translateX(44px) scaleX(.6);opacity:0}}
.ik-pierce i.lance{width:230px;height:5px;margin:-2px 0 0 -115px;border-radius:3px;
  background:linear-gradient(90deg,transparent,#ffe9c9 40%,#fff 85%,#fff);
  box-shadow:0 0 12px rgba(255,220,170,.95);animation:pierceGo .26s ease-out forwards}

/* 강타 — 충격파 고리 */
@keyframes ringOut{0%{transform:scale(.15);opacity:0}18%{opacity:1}100%{transform:scale(2.6);opacity:0}}
.ik-blunt i,.ik-holy i.ring,.ik-void i{width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  border:7px solid rgba(23,19,15,.85);animation:ringOut .5s cubic-bezier(.1,.7,.3,1) forwards}
.ik-blunt i:nth-child(2){animation-delay:.09s;border-width:4px;border-color:rgba(23,19,15,.5)}

/* 무(無) — 안으로 빨려드는 고리 */
@keyframes ringIn{0%{transform:scale(3.2) rotate(0);opacity:0}25%{opacity:1}
  100%{transform:scale(.05) rotate(140deg);opacity:.9}}
.ik-void i{border:6px solid rgba(20,16,14,.95);box-shadow:0 0 30px rgba(0,0,0,.8) inset,0 0 22px rgba(120,0,40,.7);
  animation:ringIn .55s cubic-bezier(.6,0,.4,1) forwards}
.ik-void i:nth-child(2){animation-delay:.1s;border-color:rgba(255,45,85,.8)}
.ik-void i:nth-child(3){animation-delay:.2s;border-color:rgba(20,16,14,.7)}

/* 화염 */
@keyframes flameUp{0%{transform:translate(var(--x),20px) scale(.4);opacity:0}
  20%{opacity:1}100%{transform:translate(calc(var(--x)*1.7),-120px) scale(1.5);opacity:0}}
.ik-fire i{width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50% 50% 45% 45%;filter:blur(7px);
  background:radial-gradient(circle at 50% 70%,#fff2c0,#ff9b30 45%,#d4360f 80%,transparent);
  animation:flameUp .62s ease-out forwards}

/* 번개 */
@keyframes boltFlash{0%{opacity:0}10%{opacity:1}22%{opacity:.2}34%{opacity:1}100%{opacity:0}}
.ik-lightning svg{position:absolute;left:-90px;top:-360px;width:180px;height:400px;
  animation:boltFlash .42s steps(1,end) forwards;filter:drop-shadow(0 0 10px rgba(180,230,255,.95))}

/* 빛 */
@keyframes rayGrow{0%{transform:rotate(var(--a)) scaleY(0);opacity:0}

.ik-holy i.ray{width:8px;height:170px;margin:-85px 0 0 -4px;border-radius:4px;
  background:linear-gradient(#fff5cf,rgba(255,220,120,0));animation:rayGrow .55s ease-out forwards}
.ik-holy i.ring{border-color:rgba(240,205,110,.95);box-shadow:0 0 30px rgba(255,225,140,.8)}

/* 독 */
@keyframes bubbleUp{0%{transform:translate(var(--x),16px) scale(.3);opacity:0}
  25%{opacity:.95}100%{transform:translate(calc(var(--x)*1.4),-84px) scale(1.15);opacity:0}}
.ik-poison i{width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c9f28a,#4d8f2f 70%,#1f4a17);
  box-shadow:0 0 10px rgba(120,200,80,.7);animation:bubbleUp .7s ease-out forwards}

/* 바람 / 꽃잎 */
@keyframes arcSweep{0%{transform:rotate(var(--a)) translateX(-70px);opacity:0}

.ik-wind i{width:130px;height:4px;margin:-2px 0 0 -65px;border-radius:3px;
  background:linear-gradient(90deg,transparent,rgba(220,235,240,.95),transparent);
  animation:arcSweep .5s ease-out forwards}
@keyframes petalFall{0%{transform:translate(0,-60px) rotate(0);opacity:0}
  20%{opacity:1}100%{transform:translate(var(--x),90px) rotate(540deg);opacity:0}}
.ik-petal i{width:16px;height:22px;margin:-11px 0 0 -8px;border-radius:60% 0 60% 0;
  background:linear-gradient(150deg,#ffd8e2,#e0708f);box-shadow:0 0 8px rgba(220,110,140,.6);
  animation:petalFall .8s ease-out forwards}

/* 부적 던지기 */
@keyframes talisFly{0%{transform:translate(-260px,-40px) rotate(-25deg);opacity:0}
  20%{opacity:1}75%{transform:translate(0,0) rotate(8deg);opacity:1}100%{transform:translate(14px,4px) scale(1.5);opacity:0}}
.ik-talisman i{width:34px;height:56px;margin:-28px 0 0 -17px;border-radius:2px;
  background:linear-gradient(#f6ecd4,#e6d3ae);border:1.5px solid #a8272c;

.openscene .ograde{position:absolute;font-size:56px;letter-spacing:.2em;opacity:0;color:#fff}

@keyframes gradePop{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.15)}
  70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}

/* 뽑기 결과 */
.pullgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:min(1020px,94vw);

@keyframes pullPop{0%{opacity:0;transform:scale(.3) rotate(-14deg)}
  60%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:none}}
.pullitem{width:110px;padding:12px 6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:linear-gradient(160deg,#efe4cb,#cdbb96);border:2px solid #6b6053;opacity:0;
  animation:pullPop .45s cubic-bezier(.2,1.5,.4,1) forwards}
.pullitem .pg{font-size:34px;color:#22190f;line-height:1}
.pullitem .pn{font-size:11px;color:#3a3225;text-align:center;word-break:keep-all;line-height:1.25}
.pullitem .pb{font-size:9.5px;padding:1px 6px;border-radius:3px;background:var(--gc);color:#fff;
  border:1px solid rgba(255,255,255,.4)}
.pullitem.p-special{border-color:#e2622a;animation:pullPop .45s cubic-bezier(.2,1.5,.4,1) forwards,
  flameGlow 1.7s ease-in-out infinite .45s}
.pullitem.p-ssx{border-color:#ff2d55;animation:pullPop .45s cubic-bezier(.2,1.5,.4,1) forwards,
  ssxGlow 1.25s ease-in-out infinite .45s}

  box-shadow:0 0 22px rgba(150,90,255,.85),0 0 50px rgba(60,220,255,.35)}
.pullitem.p-bonus{border-color:#6fe0a8;background:linear-gradient(160deg,#e2f6ec,#b6dcc7)}

/* 도감 */
.dexwrap{display:flex;flex-direction:column;gap:16px;max-height:62vh;overflow-y:auto;padding:4px 10px;max-width:min(1080px,94vw)}
.dexwrap::-webkit-scrollbar{width:8px}.dexwrap::-webkit-scrollbar-thumb{background:rgba(220,200,160,.35);border-radius:4px}
.dexsec h3{color:#cdbf9f;font-size:13px;letter-spacing:.22em;font-weight:400;margin:0 0 8px 2px}
.dexsec h3 i{font-style:normal;color:#e8c86a;letter-spacing:0;margin-left:8px;font-size:12.5px}
.dexgrid{display:flex;flex-wrap:wrap;gap:8px}
.dextile{width:74px;height:74px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:#efe4cb;border:1.5px solid #6b6053;cursor:help;transition:.14s}
.dextile:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
.dextile > b{font-size:23px;font-weight:400;color:#22190f;line-height:1}

.dextile.clickable{cursor:pointer}
.dextile.gd_common{border-color:#3f7346}.dextile.gd_uncommon{border-color:#2f6d8f}
.dextile.gd_rare{border-color:#b8912f;box-shadow:0 0 9px rgba(184,145,47,.45)}
.dextile.gd_special{border-color:#e2622a;background:#fbeade;animation:flameGlow 1.7s ease-in-out infinite}
.dextile.gd_ssx{border-color:#ff2d55;background:#ffe6ea;animation:ssxGlow 1.25s ease-in-out infinite}
.dextile.gd_ssx b{color:#8e0f2c}
.dextile.gd_unknown{border-color:#b98cff;background:#efe6ff;
  box-shadow:0 0 16px rgba(150,90,255,.7),0 0 34px rgba(60,220,255,.3)}
.dextile.gd_unknown b{color:#5324a8}
.dextile.gd_curse{border-color:#5b3b6b;background:#ded0e0}
.dextile.locked{border-color:#7b4bd8!important;border-style:dashed}
.dexsec h3 .gradechip{margin-right:6px}
.dexsec h3 em{font-style:normal;color:#8a7f6b;font-size:11.5px;letter-spacing:.02em;margin-left:10px}
.gradechip{display:inline-grid;place-items:center;min-width:20px;height:19px;padding:0 5px;border-radius:3px;
  background:var(--gc);color:#fff;font-size:11px;line-height:1;vertical-align:middle;
  border:1px solid rgba(255,255,255,.35);box-shadow:0 1px 4px rgba(0,0,0,.4)}
/* 카드 상세보기 */
.detailrow{display:flex;gap:34px;justify-content:center;flex-wrap:wrap}
.detailcol{display:flex;flex-direction:column;align-items:center;gap:10px}
.detailcol h4{color:#cdbf9f;font-size:12.5px;letter-spacing:.2em;font-weight:400}
.dslot{position:relative;width:var(--cw);height:var(--ch)}
.dslot .card{position:absolute;left:0;top:0;margin:0;transform:none!important;cursor:default;transform-origin:50% 50%}
.detailnote{color:#a2977f;font-size:13px;letter-spacing:.04em;text-align:center;max-width:520px}
.dextile.r_uncommon{border-color:var(--jade)}.dextile.r_rare{border-color:var(--gold)}
.dextile.r_boss{border-color:var(--red);background:#f0dcd2}
.dextile.e_elite{border-color:var(--red)}.dextile.e_boss{border-color:var(--red);background:#2a1f17}
.dextile.e_boss b{color:#f0d9a0}.dextile.e_boss span{color:#c8b48a}
/* 미발견은 등급 색보다 우선한다 */
.dexgrid .dextile.unknown{background:rgba(255,255,255,.04);border-style:dashed;box-shadow:none;cursor:default}
.dexgrid .dextile.unknown b,.dexgrid .dextile.unknown span{color:#6f6553}
.dexgrid .dextile.unknown:hover{transform:none;box-shadow:none}

/* ══ 장기 상점 ═══════════════════════════════════════════ */
.janggi{position:absolute;inset:0;display:flex;flex-direction:column;
  background:linear-gradient(165deg,#2a2117 0%,#3a2e1e 45%,#181309 100%)}
.jhead{position:relative;height:54px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(rgba(12,9,5,.94),rgba(40,32,20,.84));border-bottom:1px solid rgba(220,190,120,.3)}
.jhead h2{color:#f6ecd2;font-size:17px;letter-spacing:.22em;font-weight:400;margin-left:.22em}
.jhead .jcur{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:15px;color:#efe4cb}
.jhead .jcur i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;color:#1d1710}
.jhead .jcur .gold i{background:linear-gradient(140deg,#ffd76a,#b6821c)}
.jhead .jcur .dia i{background:linear-gradient(140deg,#8ee6ff,#2f9fc4)}
.jbody{position:relative;flex:1;display:flex;min-height:0;align-items:center;justify-content:center;gap:26px;padding:18px}
.jside{width:240px;flex:none;display:flex;flex-direction:column;gap:10px}
.jside h3{color:#e8cf94;font-size:13px;letter-spacing:.2em;font-weight:400}
.jside p{color:#c3ad80;font-size:12.5px;line-height:1.8}
.jside .note{padding:12px 14px;border-radius:8px;background:rgba(10,8,4,.5);border:1px solid rgba(220,190,120,.25)}

/* 장기판 */
.jboard{position:relative;width:min(560px,52vw);aspect-ratio:9/10;border-radius:6px;flex:none;
  background:linear-gradient(160deg,#e8d5a8,#d6bd88);border:3px solid #6b4a1e;
  box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(120,80,20,.18)}
.jboard svg{position:absolute;inset:0;width:100%;height:100%}
.jpiece{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:22%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.16s;
  background:radial-gradient(circle at 36% 30%,#f6e6bc,#d2b276);border:2.5px solid #8a2b2b;
  box-shadow:0 3px 8px rgba(0,0,0,.45)}
.jpiece.green{border-color:#1f6b4a}
.jpiece b{font-size:clamp(15px,2.1vw,26px);color:#8a2b2b;font-weight:400;line-height:1}
.jpiece.green b{color:#1f6b4a}
.jpiece:hover{transform:translate(-50%,-56%) scale(1.1);box-shadow:0 8px 18px rgba(0,0,0,.6);z-index:3}
.jpiece .tagp{position:absolute;bottom:-16px;font-size:10px;color:#4a3a18;white-space:nowrap;letter-spacing:.02em}
.jpiece.todo{filter:grayscale(.55);opacity:.75;cursor:default}
.jpiece.todo:hover{transform:translate(-50%,-50%);box-shadow:0 3px 8px rgba(0,0,0,.45)}
.jpiece.sold{filter:grayscale(1);opacity:.4;cursor:default}
.jpiece.sold:hover{transform:translate(-50%,-50%)}
.jpiece.buyable{animation:jpulse 1.8s ease-in-out infinite}
.jpiece.picked{transform:translate(-50%,-56%) scale(1.12);box-shadow:0 0 0 3px rgba(255,210,90,.9),0 8px 18px rgba(0,0,0,.6);z-index:4}
.jdot{position:absolute;width:5.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(40,110,80,.62);cursor:pointer;z-index:2;box-shadow:0 0 10px rgba(60,180,130,.6);
  animation:jdotIn .2s ease-out}
.jdot:hover{background:rgba(40,140,100,.9);transform:translate(-50%,-50%) scale(1.25)}
.jdot.cap{width:12.6%;background:transparent;border:3px solid rgba(190,40,50,.85);box-shadow:0 0 14px rgba(200,50,60,.6)}
.jdot.cap:hover{background:rgba(190,40,50,.25)}
@keyframes jdotIn{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}}
.jlast{position:absolute;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:20%;
  background:rgba(255,200,90,.22);border:1px dashed rgba(140,90,20,.6);pointer-events:none;z-index:1}
.jboard.jshake{animation:shake .3s}
.jold{display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:8px;
  background:rgba(10,8,4,.5);border:1px solid rgba(220,190,120,.25)}
.jface{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:23px;
  background:radial-gradient(circle at 35% 30%,#efe0b8,#9c7f45);color:#2a1c08;border:2px solid #c8a94e}
.jsay{font-size:12.5px;color:#e0cfa4;line-height:1.7;letter-spacing:.02em}
.jbtns{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.jbtns .brush-btn{width:100%;font-size:13.5px;padding:9px 12px}
.jhead .gback{width:34px;height:34px;border-radius:6px;background:rgba(220,190,120,.15);
  border:1px solid rgba(220,190,120,.4);color:#f4ead0;font-size:18px}
.jhead .gback:hover{background:rgba(220,190,120,.32)}
@keyframes jpulse{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.45)}
  50%{box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 18px 4px rgba(255,200,90,.7)}}

/* ── 스킨 11~25 ─────────────────────────────────────────── */

/* ══ 더 진한 타격감 ══════════════════════════════════════ */
/* 벤 자리를 가로지르는 섬광 */
.slashline{position:fixed;z-index:33;pointer-events:none;height:3px;transform-origin:0 50%;
  background:linear-gradient(90deg,transparent,#fff 18%,#ffd9a0 50%,#fff 82%,transparent);
  box-shadow:0 0 14px #fff,0 0 30px #ffb648;animation:slashGo .34s cubic-bezier(.1,.9,.3,1) forwards}
@keyframes slashGo{0%{opacity:0;transform:scaleX(0) rotate(var(--a))}
  22%{opacity:1;transform:scaleX(1.05) rotate(var(--a))}
  100%{opacity:0;transform:scaleX(1) rotate(var(--a))}}
/* 충격 고리 */
.shockring{position:fixed;z-index:32;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);
  border:3px solid var(--rc,#fff);animation:ringGo .46s cubic-bezier(.15,.85,.3,1) forwards}
@keyframes ringGo{0%{width:12px;height:12px;opacity:.95;border-width:5px}
  100%{width:var(--rs,180px);height:var(--rs,180px);opacity:0;border-width:1px}}
/* 화면 가장자리에서 밀려드는 붉은 기운 */
.rushv{position:fixed;inset:0;z-index:31;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 38%,var(--vc,rgba(200,40,40,.5)) 100%);
  animation:rushGo .5s ease-out forwards}
@keyframes rushGo{0%{opacity:0;transform:scale(1.15)}25%{opacity:1;transform:scale(1)}100%{opacity:0}}
/* 처치할 때 갈라지는 금 */
.crackfx{position:fixed;z-index:33;pointer-events:none;transform:translate(-50%,-50%);
  animation:crackGo .58s ease-out forwards}
@keyframes crackGo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
/* 숫자가 튀어오른다 */
@keyframes numPop{0%{transform:translate(-50%,0) scale(.4)}45%{transform:translate(-50%,-16px) scale(1.35)}
  100%{transform:translate(-50%,-30px) scale(1)}}
/* 기 구슬이 터질 때 */
#energy.spend{animation:qiSpend .34s ease-out}
@keyframes qiSpend{0%{transform:scale(1)}35%{transform:scale(.84);filter:brightness(1.6)}100%{transform:scale(1)}}
/* 적이 죽기 직전 붉게 떤다 */
.unit.willdie .body{animation:dieSoon 1s ease-in-out infinite}
/* 각성한 보스 */
.unit.awake .body{animation:awakePulse 1.5s ease-in-out infinite}
.unit.awake .nm{color:#ff5a3a;text-shadow:0 0 12px rgba(255,80,40,.8)}
.unit.awake .nm:after{content:' 覺';color:#ffb648}
@keyframes awakePulse{0%,100%{filter:drop-shadow(0 0 10px rgba(255,80,40,.65)) saturate(1.2)}
  50%{filter:drop-shadow(0 0 26px rgba(255,120,50,1)) saturate(1.6) brightness(1.12)}}
@keyframes dieSoon{50%{filter:brightness(1.25) saturate(1.4)}}

/* ══ 떠돌이 상인 ═════════════════════════════════════════ */
.merchtop{display:flex;gap:15px;align-items:center;max-width:560px;margin:2px auto 10px;text-align:left}
.mface{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;

/* ══ 더 요란하게 ═════════════════════════════════════════ */
/* 화면이 한 번 깜빡인다 (아주 짧게) */
.blinkw{position:fixed;inset:0;z-index:36;pointer-events:none;background:#fff;
  animation:blinkGo .13s ease-out forwards}
@keyframes blinkGo{0%{opacity:.85}100%{opacity:0}}
/* 반짝이 — 한 점에서 터져 흩어지는 별 */
.sparkle{position:fixed;z-index:34;pointer-events:none;width:var(--sz,14px);height:var(--sz,14px);
  transform:translate(-50%,-50%);animation:sparkGo var(--dur,.6s) cubic-bezier(.15,.9,.3,1) forwards}
.sparkle:before,.sparkle:after{content:'';position:absolute;inset:0;background:var(--sc3,#fff);
  clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%)}
.sparkle:after{transform:rotate(45deg) scale(.62);opacity:.75}
@keyframes sparkGo{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(60deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(160deg)}}
/* 화면을 가로지르는 빛기둥 */
.lightbeam{position:fixed;top:0;bottom:0;z-index:33;pointer-events:none;width:var(--bw,120px);
  background:linear-gradient(90deg,transparent,var(--bc,rgba(255,240,200,.65)),transparent);
  transform:translateX(-50%) skewX(-14deg);animation:beamGo .5s ease-out forwards}
@keyframes beamGo{0%{opacity:0;transform:translateX(-50%) skewX(-14deg) scaleY(.4)}
  30%{opacity:1;transform:translateX(-50%) skewX(-14deg) scaleY(1)}
  100%{opacity:0;transform:translateX(-50%) skewX(-14deg) scaleY(1.1)}}
/* 색수차 — 한순간 화면이 어긋난다 */
#app.rgbsplit{animation:rgbGo .22s steps(2) 2}
@keyframes rgbGo{0%{filter:none}
  50%{filter:drop-shadow(3px 0 0 rgba(255,0,60,.55)) drop-shadow(-3px 0 0 rgba(0,200,255,.55))}
  100%{filter:none}}
/* 화면 전체가 확 당겨진다 */
#app.zoompunch{animation:zoomGo .26s cubic-bezier(.2,.9,.3,1)}
@keyframes zoomGo{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}
/* 큰 글자가 쿵 하고 찍힌다 */
.stampword{position:fixed;left:50%;top:38%;z-index:35;pointer-events:none;transform:translate(-50%,-50%);
  font-size:clamp(46px,9vw,110px);letter-spacing:.2em;text-indent:.2em;color:#fff;white-space:nowrap;

#skillbtn{pointer-events:auto;position:absolute;left:20px;bottom:92px;width:70px;height:70px;border-radius:12px;
  --sc:#7d7568;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--sc) 42%,#160d10),#1c1216);
  border:2px solid var(--sc);color:#f6ece8;
  box-shadow:0 0 16px color-mix(in srgb,var(--sc) 55%,transparent);transition:.16s}

  text-shadow:0 0 12px color-mix(in srgb,var(--sc) 80%,transparent)}

#skillbtn:hover{transform:translateY(-3px) scale(1.05);
  box-shadow:0 0 30px color-mix(in srgb,var(--sc) 85%,transparent)}
@keyframes skillPulse{0%,100%{box-shadow:0 0 16px color-mix(in srgb,var(--sc) 55%,transparent)}
  50%{box-shadow:0 0 34px 6px color-mix(in srgb,var(--sc) 95%,transparent)}}
#skillbtn.ready{animation:skillPulse 1.6s ease-in-out infinite}
/* 특별 등급은 저마다 다른 결을 준다 */
#skillbtn.sg-special.ready{animation:flameGlow 1.7s ease-in-out infinite}
#skillbtn.sg-ssx.ready{animation:ssxGlow 1.25s ease-in-out infinite}
@keyframes unknownGlow{
  0%,100%{box-shadow:0 0 20px 3px rgba(150,90,255,.75),0 0 44px 8px rgba(60,220,255,.3)}
  50%    {box-shadow:0 0 38px 10px rgba(180,120,255,1),0 0 72px 18px rgba(80,235,255,.5)}}
#skillbtn.sg-unknown.ready{animation:unknownGlow 1.5s ease-in-out infinite}
#skillbtn.used,#skillbtn.none{filter:grayscale(.85);opacity:.42;box-shadow:none;animation:none;cursor:default}
#skillbtn.used::after{content:'사용함';position:absolute;font-size:10px;color:#ffb3c2;bottom:-15px;letter-spacing:.1em}
@media(max-width:1100px){#skillbtn{left:8px;width:58px;height:58px}#skillbtn b{font-size:22px}}

<body>
<div id="app">
  <div id="bg"><div class="sky"></div></div>
  <canvas id="fx"></canvas>
  <svg id="arrow"><defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 L3.5 6 Z" fill="#a8272c"/></marker></defs>
    <path id="arrowpath" fill="none" stroke="#a8272c" stroke-width="5" stroke-linecap="round"
          marker-end="url(#ah)" opacity=".9"/>
  </svg>
  <div id="scene"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <div id="tip"></div>
</div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   0. 코어 — 난수, 유틸, 사운드, 파티클, 툴팁
   ══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
let SPEED = 1;                       /* 연출 속도 배율 (설정에서 조절) */
/* VIP 2배속 — 켜져 있으면 모든 연출이 절반의 시간에 흐른다 */
const turboX = () => (typeof OPT === 'object' && OPT && OPT.turbo && vipOn() ? .5 : 1);
const wait = ms => new Promise(r => setTimeout(r, ms * SPEED * turboX()));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* --- 시드 기반 난수 (mulberry32) --- */
let _rng = mulberry32(Date.now() >>> 0);
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = () => _rng();
const ri = (a, b) => a + Math.floor(_rng() * (b - a + 1));           // 정수 [a,b]
const pick = arr => arr[Math.floor(_rng() * arr.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(_rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickWeighted(list) {                                         // [{w:숫자,...}]
  let t = 0; for (const o of list) t += o.w;
  let r = _rng() * t;
  for (const o of list) { r -= o.w; if (r <= 0) return o; }
  return list[list.length - 1];
}
function sample(arr, n) { const c = arr.slice(); shuffle(c); return c.slice(0, n); }

/* --- 사운드: WebAudio 실시간 합성 (외부 파일 없음) ---------------------
   master → 컴프레서 → 출력, 그리고 컨볼버(잔향)로 보내는 send 를 둔다.
   같은 소리도 매번 음정·길이를 조금씩 흔들어 기계적으로 들리지 않게 한다.
   ---------------------------------------------------------------------- */
const SND = {
  ctx: null, on: true, master: null, revSend: null, noiseBuf: null, amb: null, ambGain: null,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { this.on = false; return; }
    const c = this.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 26; comp.ratio.value = 5;
    comp.attack.value = .004; comp.release.value = .22;
    this.master = c.createGain(); this.master.gain.value = (typeof OPT === 'object' && OPT ? OPT.vol : .85);
    this.master.connect(comp).connect(c.destination);
    /* 잔향: 잡음 임펄스를 만들어 컨볼버에 물린다 */
    const conv = c.createConvolver();
    conv.buffer = this.impulse(2.1, 3.1);
    const revGain = c.createGain(); revGain.gain.value = .9;
    conv.connect(revGain).connect(this.master);
    this.revSend = c.createGain(); this.revSend.gain.value = 1;
    this.revSend.connect(conv);
    /* 재사용할 잡음 버퍼 */
    const n = Math.floor(c.sampleRate * 2);
    this.noiseBuf = c.createBuffer(1, n, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  },
  impulse(dur, decay) {
    const c = this.ctx, rate = c.sampleRate, len = Math.floor(rate * dur);
    const buf = c.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  },
  ok() { return this.on && this.ctx; },
  vary(x, amt) { return x * (1 + (Math.random() * 2 - 1) * (amt == null ? .035 : amt)); },

  /* 기본 알갱이 — 음 하나 */
  blip(freq, o) {
    if (!this.ok()) return;
    o = o || {};
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0);
    const dur = this.vary(o.dur || .2, .06);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(this.vary(freq, o.jit == null ? .02 : o.jit), t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(18, o.to), t0 + dur);
    if (o.detune) osc.detune.setValueAtTime(o.detune, t0);
    const vol = (o.vol == null ? .14 : o.vol);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (o.atk || .006));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    if (o.rev) { const r = c.createGain(); r.gain.value = o.rev; g.connect(r); r.connect(this.revSend); }
    osc.start(t0); osc.stop(t0 + dur + .06);
  },
  /* 기본 알갱이 — 잡음 하나 */
  hiss(o) {
    if (!this.ok()) return;
    o = o || {};
    const c = this.ctx, t0 = c.currentTime + (o.delay || 0);
    const dur = this.vary(o.dur || .18, .08);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    s.playbackRate.value = this.vary(1, .2);
    const f = c.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    f.Q.value = o.q || 1;
    const f0 = this.vary(o.freq || 1400, .1);
    f.frequency.setValueAtTime(f0, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(Math.max(80, o.to), t0 + dur);
    const g = c.createGain(), vol = (o.vol == null ? .14 : o.vol);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (o.atk || .004));
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    s.connect(f).connect(g); g.connect(this.master);
    if (o.rev) { const r = c.createGain(); r.gain.value = o.rev; g.connect(r); r.connect(this.revSend); }
    s.start(t0); s.stop(t0 + dur + .06);

  ambience(on, strong) {
    if (!this.ok()) return;
    const c = this.ctx;
    if (!on) {
      if (this.amb) {
        this.ambGain.gain.linearRampToValueAtTime(.0001, c.currentTime + .6);
        const a = this.amb; setTimeout(() => { try { a.stop(); } catch (e) {} }, 900);
        this.amb = null;
      }
      return;
    }
    if (this.amb) { if (this.ambGain) this.ambGain.gain.linearRampToValueAtTime(strong ? .034 : .019, c.currentTime + 1.2); return; }
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    s.playbackRate.value = .35;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = .7;
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = .06; lg.gain.value = 210;
    lfo.connect(lg).connect(f.frequency); lfo.start();
    this.ambGain = c.createGain(); this.ambGain.gain.value = .0001;
    this.ambGain.gain.linearRampToValueAtTime(strong ? .034 : .019, c.currentTime + 2.5);
    s.connect(f).connect(this.ambGain).connect(this.master);
    s.start(); this.amb = s;
  }
};
/* --- 캔버스 먹물 파티클 --- */
const FX = {
  cv: null, cx: null, ps: [], running: false,
  init() {
    this.cv = $('#fx'); this.cx = this.cv.getContext('2d');
    const rz = () => { this.cv.width = innerWidth; this.cv.height = innerHeight; };
    rz(); addEventListener('resize', rz);
  },
  burst(x, y, n, color, spd = 5, life = 42, size = 4) {
    if (!OPT.particles) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (.35 + Math.random());
      this.ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.2,
        r: size * (.4 + Math.random()), life: life * (.6 + Math.random() * .7), age: 0, color, g: .17 });
    }
    this.run();
  },
  ink(x, y, n = 16) { this.burst(x, y, n, '23,19,15', 5.5, 46, 5); },
  blood(x, y, n = 20) { this.burst(x, y, n, '150,32,38', 6.5, 44, 4.5); },
  spark(x, y, n = 14, c = '44,120,110') { this.burst(x, y, n, c, 4, 40, 3.4); },
  gold(x, y, n = 18) { this.burst(x, y, n, '190,150,60', 4.5, 55, 3.4); },
  run() {
    if (this.running) return; this.running = true;
    const step = () => {
      const c = this.cx; c.clearRect(0, 0, this.cv.width, this.cv.height);
      for (let i = this.ps.length - 1; i >= 0; i--) {
        const p = this.ps[i];
        p.age++; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.vy *= .985;
        if (p.age > p.life) { this.ps.splice(i, 1); continue; }
        const k = 1 - p.age / p.life;
        c.globalAlpha = k * .85;
        c.fillStyle = 'rgb(' + p.color + ')';
        c.beginPath(); c.arc(p.x, p.y, p.r * (.35 + k * .8), 0, 6.284); c.fill();
      }
      c.globalAlpha = 1;
      if (this.ps.length) requestAnimationFrame(step);
      else { this.running = false; c.clearRect(0, 0, this.cv.width, this.cv.height); }
    };
    requestAnimationFrame(step);
  }
};
function centerOf(node) { const r = node.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function shake(big) {
  if (!OPT.shake) return;
  const a = $('#app'); a.classList.remove('shake', 'shake-lg'); void a.offsetWidth;
  a.classList.add(big ? 'shake-lg' : 'shake');
  setTimeout(() => a.classList.remove('shake', 'shake-lg'), 520);
}

/* --- 툴팁 --- */
let tipEl;
function tipShow(html, x, y) {
  if (!OPT.tips) return;
  tipEl = tipEl || $('#tip');
  tipEl.innerHTML = html; tipEl.style.display = 'block';
  const r = tipEl.getBoundingClientRect();
  tipEl.style.left = clamp(x - r.width / 2, 8, innerWidth - r.width - 8) + 'px';
  tipEl.style.top = (y - r.height - 14 < 8 ? y + 24 : y - r.height - 14) + 'px';
}
function tipHide() { if (tipEl) tipEl.style.display = 'none'; }
function bindTip(node, htmlFn) {
  node.addEventListener('mouseenter', e => { const r = node.getBoundingClientRect(); tipShow(htmlFn(), r.left + r.width / 2, r.top); });
  node.addEventListener('mouseleave', tipHide);
}
function toast(msg) {
  const t = el('div', 'toast', msg); $('#toast').appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
