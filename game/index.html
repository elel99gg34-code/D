/* --- 상점 ---------------------------------------------------
   재고는 모험 상태에 저장된다. 창을 닫았다 다시 열어도 같은 물건이며,
   막이 바뀌거나 지도의 상점 노드를 밟으면 새로 채워진다.
   ----------------------------------------------------------- */
function restockShop() {
  const run = G.run, price = v => pipe('modPrice', v);
  const cards = [], seen = new Set();
  const w = [{ w: 60, r: 'common' }, { w: 32, r: 'uncommon' }, { w: 8, r: 'rare' }];
  let guard = 0;
  while (cards.length < 5 && guard++ < 200) {
    const id = randomCard(w); if (seen.has(id)) continue; seen.add(id);
    const up = rnd() < .12;
    const base = { common: 52, uncommon: 78, rare: 135 }[CARDS[id].rar];
    cards.push({ id, up, p: price(Math.round(base * (up ? 1.5 : 1) * (.9 + rnd() * .3))), sold: false });
  }
  const relics = [];
  for (let i = 0; i < 2; i++) {
    const id = randomRelic();
    if (id && !relics.some(r => r.id === id))
      relics.push({ id, p: price({ common: 145, uncommon: 190, rare: 265, boss: 300 }[RELICS[id].rar]), sold: false });
  }
  const pots = [];
  for (let i = 0; i < 3; i++) {
    const id = randomPotion();
    pots.push({ id, p: price({ common: 52, uncommon: 78, rare: 112 }[POTIONS[id].rar]), sold: false });
  }
  run.shop = { cards, relics, pots, purged: false };
}
function showShop() {
  G.scene = 'shop';
  const run = G.run;
  if (!run.shop) restockShop();
  const sh = run.shop;
  const purgePrice = pipe('modPrice', 72 + (run.purges || 0) * 20);

  function draw() {
    const p = overlay(`<h2>떠돌이 상인</h2><div class="hint">보유 골드 <b style="color:#e8c86a">${run.gold}</b>
        · 다이아 <b style="color:#6fd0e8">${run.dia || 0}</b></div>
      <div class="shopgrid">
        <div class="shopcol"><h3>부 적</h3><div class="cardgrid" style="max-width:640px;max-height:52vh"></div></div>
        <div class="shopcol"><h3>물 건</h3><div class="rewardrow" style="width:330px"></div></div>
      </div>
      <button class="brush-btn red" id="sh_leave">떠난다</button>`);
    const g = p.querySelector('.cardgrid');
    sh.cards.forEach(it => {
      const holder = el('div', 'priced');
      const card = { uid: -100 - sh.cards.indexOf(it), id: it.id, up: it.up };
      const n = cardNode(card);
      if (it.sold) n.classList.add('dim');
      holder.appendChild(n);
      holder.appendChild(el('div', 'pricetag' + (run.gold < it.p || it.sold ? ' no' : ''), it.sold ? '판매됨' : it.p + ' 골드'));
      if (!it.sold) {
        n.classList.add('pick');
        n.onclick = () => buy(it.p, () => {
          it.sold = true; run.deck.push(mkCard(it.id, it.up)); run.stats.cards++;
          dexAdd('cards', it.id); toast(`${cname(card)} 구입`);
        });
      }
      g.appendChild(holder);
    });
    const row = p.querySelector('.rewardrow');
    const addRow = (ic, t, sub, pr, sold, fn) => {
      const n = el('div', 'rewitem' + (sold ? ' taken' : ''),
        `<div class="ic">${ic}</div><div class="t"><b>${t}</b><small>${sub}</small></div>
         <div style="color:${run.gold >= pr && !sold ? '#9d7c2e' : '#b0553f'};font-size:14px;white-space:nowrap">${sold ? '판매됨' : pr + ' 골드'}</div>`);
      if (!sold) n.onclick = () => buy(pr, fn);
      row.appendChild(n);
    };
    sh.relics.forEach(it => addRow(RELICS[it.id].g, RELICS[it.id].n, RELICS[it.id].d.replace(/<[^>]+>/g, ''), it.p, it.sold,
      () => { it.sold = true; gainRelic(it.id); }));
    sh.pots.forEach(it => addRow(POTIONS[it.id].g, POTIONS[it.id].n, POTIONS[it.id].d.replace(/<[^>]+>/g, ''), it.p, it.sold,
      () => { if (run.potions.length >= run.potSlots) { toast('물약을 더 지닐 수 없다'); return false; } it.sold = true; run.potions.push(it.id); }));
    addRow('淨', '부적 태우기', '덱에서 카드 한 장을 없앤다', purgePrice, sh.purged,
      async () => {
        const c = await pickFromList(run.deck, '없앨 카드를 고르시오', { cancel: true });
        if (!c) { draw(); return false; }
        run.deck.splice(run.deck.findIndex(x => x.uid === c.uid), 1);
        run.purges = (run.purges || 0) + 1; sh.purged = true;
        toast(`${CARDS[c.id].n} 제거`);
      });
    p.querySelector('#sh_leave').onclick = () => { closeOverlay(); saveRun(); showMap(); };
  }
  async function buy(cost, fn) {
    if (run.gold < cost) { SND.err(); toast('골드가 모자란다'); return; }
    const r = await fn();
    if (r === false) return;
    run.gold -= cost; SND.coin(); saveRun(); renderTop(); draw();
  }
  draw();
}

/* ══ 부적 뽑기 상점 ════════════════════════════════════════
   배너를 고르고, 1회 / 10+1회 뽑는다. 누적이 쌓이면
   30·60·100회에서 확정 보너스를 준다 (100회에서 누적이 초기화).
   지금은 시험 중이라 값을 받지 않는다 (BOX_FREE).
   ═══════════════════════════════════════════════════════════ */
const BOX_FREE = true;
const BANNERS = [
  { n: '작은 상자',     g: '匣', sub: '한 줌의 운',     price: 3,  tier: 0,
    desc: '다이아 · 부적 · 물약 · 보물이 고루 나온다.' },
  { n: '보통 상자',     g: '匣', sub: '제법 묵직하다',  price: 5,  tier: 1,
    desc: '부적이 나올 확률이 오른다.' },
  { n: '큰 상자',       g: '匱', sub: '값어치를 한다',  price: 8,  tier: 2,
    desc: '희귀 부적과 보물이 자주 나온다.' },
  { n: '특대급 상자!',  g: '櫃', sub: '전설이 잠들었다', price: 20, tier: 3, hot: true,
    desc: '<b>특별 부적만 나온다!</b>' }
];
const MILESTONES = [
  { at: 30,  grade: 'special', s: 'S',   label: '[S급] 보너스' },
  { at: 60,  grade: 'special', s: 'S',   label: '[S급] 보너스' },
  { at: 100, grade: 'ssx',     s: 'SSX', label: '[SSX급] 보너스', ssx: true }
];
const GRADE_STARS = { basic: 1, common: 2, uncommon: 3, rare: 4, special: 5, ssx: 6, unknown: 7 };
const stars = rar => '★'.repeat(GRADE_STARS[rar] || 1);

/* 상자 하나에서 나오는 것 */
function boxLoot(tier) {
  const run = G.run;
  /* 특대급 — 반드시 특별 등급 부적. ?급 0.1% · SSX급 10% · 나머지 S급 */
  if (tier === 3) {
    const r = rnd();
    const grade = r < .001 && GRADE_POOL.unknown.length ? 'unknown'
                : r < .101 && GRADE_POOL.ssx.length ? 'ssx' : 'special';
    const id = pick(GRADE_POOL[grade]);
    const up = grade === 'special' && rnd() < .35;
    const c = mkCard(id, up);
    return { g: CARDS[id].g, n: cname(c), grade, card: c,
      d: `<b style="color:${GRADE[grade].c}">${GRADE[grade].n}</b> — ` + CARDS[id].txt(cval(c), up).replace(/<[^>]+>/g, ''),
      take: () => { run.deck.push(mkCard(id, up)); run.stats.cards++; dexAdd('cards', id); } };
  }
  const w = [
    [{ w: 34, t: 'dia' }, { w: 26, t: 'card' }, { w: 26, t: 'potion' }, { w: 14, t: 'treasure' }],
    [{ w: 26, t: 'dia' }, { w: 34, t: 'card' }, { w: 18, t: 'potion' }, { w: 22, t: 'treasure' }],
    [{ w: 20, t: 'dia' }, { w: 42, t: 'card' }, { w: 10, t: 'potion' }, { w: 28, t: 'treasure' }]
  ][tier];
  const kind = pickWeighted(w).t;
  if (kind === 'dia') {
    const n = ri(1 + tier, 3 + tier * 2);
    return { g: '玉', n: `다이아 ${n}`, d: '맑고 단단한 돌. 뽑기의 값으로 쓰인다.',
      take: () => { run.dia = (run.dia || 0) + n; } };
  }
  if (kind === 'card') {
    const special = (tier >= 1 && rnd() < .35) || rnd() < .15;
    const id = special && GRADE_POOL.special.length ? pick(GRADE_POOL.special) : pick(POOL.rare);
    const up = tier >= 2 && rnd() < .3;
    const c = mkCard(id, up);
    return { g: CARDS[id].g, n: cname(c), grade: CARDS[id].rar, card: c,
      d: `<b style="color:${GRADE[CARDS[id].rar].c}">${GRADE[CARDS[id].rar].n}</b> — ` + CARDS[id].txt(cval(c), up).replace(/<[^>]+>/g, ''),
      take: () => { run.deck.push(mkCard(id, up)); run.stats.cards++; dexAdd('cards', id); } };
  }
  if (kind === 'potion') {
    const id = randomPotion();
    return { g: POTIONS[id].g, n: POTIONS[id].n, d: POTIONS[id].d.replace(/<[^>]+>/g, ''),
      take: () => { if (run.potions.length >= run.potSlots) { run.gold += 60; } else run.potions.push(id); } };
  }
  const rid = randomRelic(tier >= 2 ? 'rare' : null) || randomRelic();
  if (!rid) { const g = ri(80, 160); return { g: '金', n: `골드 ${g}`, d: '엽전 꾸러미', take: () => { run.gold += g; } }; }
  return { g: RELICS[rid].g, n: RELICS[rid].n, d: RELICS[rid].d.replace(/<[^>]+>/g, ''),
    take: () => gainRelic(rid, true) };
}

/* 배너에서 등장하는 부적 목록 */
function bannerPool(tier) {
  if (tier === 3) return GRADE_POOL.special.concat(GRADE_POOL.ssx, GRADE_POOL.unknown);
  const base = POOL.rare.slice();
  if (tier >= 1) return base.concat(GRADE_POOL.special);
  return base;
}
function bannerRates(tier) {
  if (tier === 3) return [
    { g: 'special', p: '89.9%' }, { g: 'ssx', p: '10%' }, { g: 'unknown', p: '0.1%' }];
  return null;
}

/* 누적 보너스 지급 */
function grantMilestones(before, after) {
  const run = G.run, got = [];
  for (const m of MILESTONES) {
    if (before < m.at && after >= m.at) {
      const pool = GRADE_POOL[m.grade];
      if (!pool.length) continue;
      const id = pick(pool);
      run.deck.push(mkCard(id, false)); run.stats.cards++; dexAdd('cards', id);
      got.push({ g: CARDS[id].g, n: CARDS[id].n, grade: m.grade, bonus: true,
                 d: `${m.label} — ` + CARDS[id].txt(CARDS[id].v(false), false).replace(/<[^>]+>/g, '') });
    }
  }
  return got;
}

function showSpecialShop(refill) {
  G.scene = 'special';
  const run = G.run;
  if (run.summons == null) run.summons = 0;
  if (run.banner == null) run.banner = 3;
  if (refill) run.banner = 3;
  let tabGrade = 'all';

  function draw() {
    const bi = run.banner, B = BANNERS[bi];
    const pool = bannerPool(B.tier);
    const grades = [];
    for (const id of pool) if (grades.indexOf(CARDS[id].rar) < 0) grades.push(CARDS[id].rar);
    grades.sort((a, b) => GRADE_ORDER.indexOf(a) - GRADE_ORDER.indexOf(b));
    if (tabGrade !== 'all' && grades.indexOf(tabGrade) < 0) tabGrade = 'all';
    const shown = tabGrade === 'all' ? pool : pool.filter(id => CARDS[id].rar === tabGrade);
    const rates = bannerRates(B.tier);
    const cur = run.summons % 100 === 0 && run.summons ? 100 : run.summons % 100;

    const p = overlay(`<div class="gacha">
      <div class="ghead">
        <button class="gback" id="g_back">←</button>
        <h2>부적 뽑기</h2>
        <div class="gcur">
          <span class="dia"><i>玉</i>${run.dia || 0}</span>
          <span class="gold"><i>金</i>${run.gold}</span>
        </div>
      </div>
      <div class="gbody">
        <div class="gnav"></div>
        <div class="gmain">
          <div class="gtitle">${B.n}</div>
          <div class="gsub">${B.desc}${rates ? ' &nbsp;확률 ' + rates.map(r =>
            `<b style="color:${GRADE[r.g].c}">${GRADE[r.g].n} ${r.p}</b>`).join(' · ') : ''}</div>
          <div class="gtabs"></div>
          <div class="gpool"></div>
          <div class="gbonus">
            <div class="bh">Bonus <span style="color:#bba98a">뽑기 누적</span> <b>${cur} / 100</b></div>
            <div class="gbar"><i style="width:${cur}%"></i></div>
          </div>
          <div class="gbtns">
            <button class="gsummon" id="g_one">1회 뽑기
              <span class="cost">${BOX_FREE ? '무료 <s>玉' + B.price + '</s>' : '玉' + B.price}</span></button>
            <button class="gsummon ten" id="g_ten">10+1회 뽑기
              <span class="cost">${BOX_FREE ? '무료 <s>玉' + (B.price * 10) + '</s>' : '玉' + (B.price * 10)}</span></button>
          </div>
        </div>
        <div class="gart">
          <svg class="ring" viewBox="0 0 100 100">
            <path d="M72,24 A40,40 0 1 0 79,44" fill="none" stroke="#d9ab55" stroke-width="6"
              stroke-linecap="round" opacity=".8"/>
            <path d="M72,24 A40,40 0 1 0 79,44" fill="none" stroke="#ffe1a0" stroke-width="2"
              stroke-linecap="round" opacity=".5" transform="scale(1.06) translate(-3,-3)"/>
          </svg>
          <div class="glyph">${B.g}</div>
          <div class="sub">符 籙 抽 籤</div>
        </div>
      </div>
    </div>`, 'gachapanel');

    /* 배너 목록 */
    const nav = p.querySelector('.gnav');
    BANNERS.forEach((b, i) => {
      const n = el('button', 'gbanner' + (b.hot ? ' hot' : '') + (i === bi ? ' on' : ''),
        `<div class="bg">${b.g}</div><div class="bn"><b>${b.n}</b><small>${b.sub}</small></div>
         ${b.hot ? '<div class="tag">HOT</div>' : ''}`);
      n.onclick = () => { if (i === bi) return; run.banner = i; tabGrade = 'all'; SND.ui(); draw(); };
      nav.appendChild(n);
    });

    /* 등급 탭 */
    const tabs = p.querySelector('.gtabs');
    const mkTab = (key, label) => {
      const t = el('button', 'gtab' + (tabGrade === key ? ' on' : ''), label);
      t.onclick = () => { tabGrade = key; SND.ui(); draw(); };
      tabs.appendChild(t);
    };
    mkTab('all', '전체');
    grades.forEach(g => mkTab(g, GRADE[g].n));

    /* 등장 목록 */
    const gp = p.querySelector('.gpool');
    for (const id of shown) {
      const d = CARDS[id];
      const u = el('div', 'gunit u-' + d.rar,
        `<div class="ub" style="--gc:${GRADE[d.rar].c}">${GRADE[d.rar].s}</div>
         <div class="ustar">${stars(d.rar)}</div>
         <div class="ug">${d.g}</div><div class="un">${d.n}</div>`);
      bindTip(u, () => `<b>${d.n}</b> · ${GRADE[d.rar].n} ${TYPE_NAME[d.type]}<br>${d.txt(d.v(false), false)}
        <br><span style="color:#8f846d">눌러서 자세히 보기</span>`);
      u.onclick = () => { tipHide(); showCardDetail(id); };
      gp.appendChild(u);
    }
    if (!shown.length) gp.innerHTML = '<div style="color:#8f846d">비어 있다</div>';

    /* 누적 보너스 눈금 */
    const bar = p.querySelector('.gbar');
    MILESTONES.forEach(m => {
      const n = el('div', 'gmile' + (cur >= m.at ? ' done' : '') + (m.ssx ? ' ssx' : ''),
        `<em>${m.at}회</em><span>${cur >= m.at ? '✓' : m.s}</span>`);
      n.style.left = m.at + '%';
      bindTip(n, () => `<b>${m.at}회 누적</b><br>${m.label} 부적을 하나 준다`);
      bar.appendChild(n);
    });

    p.querySelector('#g_back').onclick = () => { closeOverlay(); saveRun(); showMap(); };
    p.querySelector('#g_one').onclick = () => doSummon(B, 1);
    p.querySelector('#g_ten').onclick = () => doSummon(B, 11);
  }

  async function doSummon(B, times) {
    const cost = BOX_FREE ? 0 : B.price * (times === 11 ? 10 : 1);
    if (cost && (run.dia || 0) < cost) { SND.err(); toast('다이아가 모자란다'); return; }
    run.dia = (run.dia || 0) - cost;
    const before = run.summons;
    const items = [];
    for (let i = 0; i < times; i++) {
      const loot = boxLoot(B.tier);
      loot.take();
      items.push({ g: loot.g, n: loot.n, d: loot.d, grade: loot.grade || null });
    }
    run.summons += times;
    const bonus = grantMilestones(before % 100, run.summons % 100 === 0 ? 100 : (before % 100) + times);
    if (run.summons % 100 === 0 || (before % 100) + times >= 100) run.summons = ((before % 100) + times) % 100;
    saveRun(); renderTop();
    const all = items.concat(bonus);
    const best = all.reduce((a, it) => Math.max(a, GRADE_ORDER.indexOf(it.grade || 'basic')), -1);
    closeOverlay();
    await boxOpenScene(B.g, GRADE_ORDER[best] || 'special');
    showPullResult(all, () => draw());
  }
  draw();
}

/* 상자가 흔들리다 터지는 연출 — 등급이 높을수록 오래 끌고 빛이 세다 */
function boxOpenScene(glyph, bestGrade) {
  return new Promise(res => {
    const hi = bestGrade === 'unknown' ? 3 : bestGrade === 'ssx' ? 2 : bestGrade === 'special' ? 1 : 0;
    const sc = el('div', 'openscene');
    const color = ['#ffd76a', '#ff9c4a', '#ff2d55', '#b98cff'][hi];
    sc.innerHTML = `<div class="obox shake" style="border-color:${color}"><span>${glyph}</span></div>
      <div class="ohint">상 자 가 떨 린 다</div>`;
    for (let i = 0; i < 12; i++) {
      const ray = el('i', 'oray');
      ray.style.cssText = `--a:${i * 30}deg;transform:rotate(${i * 30}deg);animation-delay:${i * .012}s;` +
        `background:linear-gradient(transparent,${color},transparent)`;
      sc.appendChild(ray);
    }
    $('#app').appendChild(sc);
    const boxEl = sc.querySelector('.obox');
    const hint = sc.querySelector('.ohint');
    const suspense = 500 + hi * 420;          /* 좋은 게 나올수록 길게 뜸을 들인다 */
    let beat = 0;
    const tick = setInterval(() => { beat++; SND.drum(); if (beat > 2 + hi * 2) clearInterval(tick); }, 260);
    setTimeout(() => {
      boxEl.classList.remove('shake'); boxEl.classList.add('charge');
      hint.textContent = ['빛 이 새 어 나 온 다', '뜨 겁 다', '무 언 가 깨 어 난 다', '하 늘 이 갈 라 진 다'][hi];
      hint.style.color = color;
      SND.hiss({ dur: 1.05, vol: .12, freq: 300, to: 6000, filter: 'bandpass', q: 1.2, rev: .6 });
    }, suspense);
    setTimeout(() => {
      clearInterval(tick);
      sc.classList.add('bursting');
      boxEl.classList.remove('charge'); boxEl.classList.add('burst');
      hint.remove();
      const g = el('div', 'ograde', GRADE[bestGrade] ? GRADE[bestGrade].n : '');
      g.style.color = color; g.style.textShadow = `0 0 30px ${color},0 0 70px ${color}`;
      sc.appendChild(g);
      const cx = innerWidth / 2, cy = innerHeight / 2;
      FX.gold(cx, cy, 44);
      if (hi >= 2) FX.burst(cx, cy, 40, hi === 3 ? '150,90,255' : '255,60,110', 8, 60, 5);
      shake(true);
      if (hi === 3) { screenFlash('radial-gradient(circle,rgba(255,255,255,.95),rgba(120,60,220,.8))', 900); SND.gong(); SND.thunder(); }
      else if (hi === 2) { screenFlash('rgba(255,90,130,.55)', 640); SND.gong(); }
      else if (hi === 1) { screenFlash('rgba(255,180,90,.4)', 480); SND.power(); }
      else SND.bell();
    }, suspense + 1050);
    setTimeout(() => { sc.remove(); res(); }, suspense + 2050);
  });
}

/* 뽑기 결과 */
function showPullResult(items, after) {
  const best = items.reduce((a, it) => {
    const r = GRADE_ORDER.indexOf(it.grade || 'basic');
    return r > a ? r : a;
  }, -1);
  const bestGrade = GRADE_ORDER[best];
  SND.coin();

  const p = modal(`<h2>뽑기 결과</h2>
    <div class="hint">${items.length}개를 얻었다${bestGrade === 'unknown' ? ' · <b style="color:#b98cff">?급 등장!</b>'
      : bestGrade === 'ssx' ? ' · <b style="color:#ff2d55">SSX급 등장!</b>' : ''}</div>
    <div class="pullgrid"></div>
    <button class="brush-btn red" id="pr_ok">확인</button>`);
  const g = p.querySelector('.pullgrid');
  items.forEach((it, i) => {
    const gr = it.grade;
    const n = el('div', 'pullitem' + (gr ? ' p-' + gr : '') + (it.bonus ? ' p-bonus' : ''),
      `<div class="pg">${it.g}</div>
       ${gr ? `<div class="pb" style="--gc:${GRADE[gr].c}">${GRADE[gr].n}</div>` : ''}
       <div class="pn">${it.n}</div>`);
    n.style.animationDelay = (i * .07) + 's';
    bindTip(n, () => `<b>${it.n}</b><br>${it.d}`);
    g.appendChild(n);
  });
  p.querySelector('#pr_ok').onclick = () => { closeTop(); if (after) after(); };
}

/* ══════════════════════════════════════════════════════════
   12. 사건(이벤트)
   ══════════════════════════════════════════════════════════ */
function addCard(id, up) { G.run.deck.push(mkCard(id, up)); G.run.stats.cards++; dexAdd('cards', id); toast(`${CARDS[id].n}${up ? '+' : ''} 획득`); }

function showEvent() {
  G.scene = 'event';
  const run = G.run;
  let pool = EVENTS.filter(e => G.seen.events.indexOf(e.id) < 0);
  if (!pool.length) { G.seen.events = []; pool = EVENTS; }
  const ev = pick(pool);
  G.seen.events.push(ev.id);
  const opts = ev.opts(run);
  const p = overlay(`<div class="evtbox"><h2>${ev.t}</h2><div class="who">${ev.who}</div><p>${ev.d}</p><div class="opts"></div></div>`);
  const box = p.querySelector('.opts');
  opts.forEach(o => {
    const b = el('button', 'opt', `${o.t}<small>${o.s}</small>`);
    if (o.dis) b.disabled = true;
    b.onclick = async () => {
      box.querySelectorAll('button').forEach(x => x.disabled = true);
      await o.do();
      renderTop(); closeOverlay(); saveRun();
      if (run._forceElite) { run._forceElite = false; startBattle(pick(ENCOUNTERS[run.act].elite), 'elite'); }
      else showMap();
    };
    box.appendChild(b);
  });
}

function storyScene(kind) {

      break;

    case 'village': {

        tails += `<path d="M500,360 Q${500 + Math.cos(a * Math.PI / 180) * 200},${360 + Math.sin(a * Math.PI / 180) * 150}

      break;
    }
    case 'tiger':
      art = mt('#2e2312', 'M0,430 L200,270 L400,400 L600,250 L800,390 L1000,300 L1000,600 L0,600 Z', .85) +
        `<g opacity=".9"><ellipse cx="500" cy="360" rx="130" ry="105" fill="#1a1208"/>

/* 한 글자씩 찍히는 이야기 화면 */
function showStory(key) {
  const pages = key && STORY[key];
  if (!pages || !pages.length) return Promise.resolve();
  return new Promise(done => {
    let i = 0, typing = null, finished = false;
    const sc = el('div', 'story');
    sc.innerHTML = `<div class="sart"></div><div class="svig"></div>
      <div class="swho"></div><div class="stitle"></div>
      <div class="stext"></div><div class="snext">눌러서 계속</div>
      <button class="sskip">건너뛰기</button>`;
    $('#app').appendChild(sc);
    const art = sc.querySelector('.sart'), who = sc.querySelector('.swho'),
      title = sc.querySelector('.stitle'), text = sc.querySelector('.stext'),
      next = sc.querySelector('.snext');

    function finish() {
      if (finished) return; finished = true;
      clearInterval(typing);
      sc.classList.add('fadeout');
      setTimeout(() => { sc.remove(); done(); }, 600);
    }
    function page() {
      const p = pages[i];
      art.innerHTML = storyScene(p.scene);
      art.classList.remove('kenburns'); void art.offsetWidth; art.classList.add('kenburns');
      who.textContent = p.who || '';
      title.textContent = p.title || '';
      title.style.display = p.title ? '' : 'none';
      next.style.opacity = '0';
      const full = p.t;
      let n = 0;
      clearInterval(typing);
      SND.hiss({ dur: .06, vol: .05, freq: 3000, filter: 'bandpass', q: 2 });
      typing = setInterval(() => {
        n += 1;
        text.innerHTML = full.slice(0, n).replace(/\n/g, '<br>') + (n < full.length ? '<span class="cur">▍</span>' : '');
        if (n % 3 === 0 && full[n - 1] && full[n - 1].trim())
          SND.blip(1400 + Math.random() * 400, { dur: .02, type: 'square', vol: .012 });
        if (n >= full.length) { clearInterval(typing); typing = null; next.style.opacity = ''; }
      }, 42);
    }
    function advance() {
      if (typing) {                       /* 타자 중이면 즉시 완성 */
        clearInterval(typing); typing = null;
        text.innerHTML = pages[i].t.replace(/\n/g, '<br>');
        next.style.opacity = '';
        return;
      }
      i++;
      if (i >= pages.length) { finish(); return; }
      SND.ui(); page();
    }
    sc.onclick = advance;
    sc.querySelector('.sskip').onclick = e => { e.stopPropagation(); finish(); };
    const key2 = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); } };
    addEventListener('keydown', key2);
    const origDone = done;
    done = () => { removeEventListener('keydown', key2); origDone(); };
    page();
  });
}

  META.best = Math.max(META.best, score); saveMeta();
  G.scene = 'over';
  G.b = null;
  const canReturn = !!G.cp;
  /* 모험은 지우지 않는다. 마지막 갈림길 상태를 저장해 두어 창을 닫았다 와도 이어진다. */

function dexTile(known, glyph, name, tipHtml, cls, onClick) {
  const n = el('div', 'dextile ' + (cls || '') + (known ? '' : ' unknown'),
    `<b>${known ? glyph : '?'}</b><span>${known ? name : '???'}</span>`);
  if (known) {

    if (onClick) { n.classList.add('clickable'); n.onclick = () => { tipHide(); SND.ui(); onClick(); }; }

  return n;
}

function showDex() {
  const byGrade = {};
  for (const k of GRADE_ORDER.concat(['curse'])) byGrade[k] = [];
  for (const id in CARDS) byGrade[CARDS[id].rar].push(id);
  const relicIds = Object.keys(RELICS), enemyIds = Object.keys(ENEMIES);
  const totalCards = Object.keys(CARDS).length;

  let secs = '';
  for (const gk of GRADE_ORDER.concat(['curse'])) {
    if (!byGrade[gk].length) continue;
    const got = byGrade[gk].filter(id => META.dex.cards[id]).length;
    const note = gk === 'unknown' ? '<em>특대급 상자에서 0.1% — 세상에 단 하나</em>'
      : gk === 'ssx' ? '<em>특대급 상자에서 10%</em>'
      : gk === 'special' ? '<em>특별 상자에서만</em>' : '';
    secs += `<div class="dexsec"><h3><span class="gradechip" style="--gc:${GRADE[gk].c}">${GRADE[gk].s}</span> ${GRADE[gk].n}
      <i>${got} / ${byGrade[gk].length}</i>${note}</h3><div class="dexgrid" data-g="${gk}"></div></div>`;
  }
  const p = modal(`<h2>도 감</h2>
    <div class="hint">모험을 거듭하며 만난 것들이 여기 남는다 · 부적을 누르면 자세히 볼 수 있다
      <b style="color:#e8c86a">(부적 ${dexCount('cards', totalCards)})</b></div>
    <div class="dexwrap">
      ${secs}
      <div class="dexsec"><h3>유물 <i>${dexCount('relics', relicIds.length)}</i></h3><div class="dexgrid" id="dx_r"></div></div>
      <div class="dexsec"><h3>요괴 <i>${dexCount('enemies', enemyIds.length)}</i></h3><div class="dexgrid" id="dx_e"></div></div>
    </div>
    <button class="brush-btn" id="dx_close">닫기</button>`);

  for (const gk of GRADE_ORDER.concat(['curse'])) {
    const box = p.querySelector(`.dexgrid[data-g="${gk}"]`);
    if (!box) continue;
    for (const id of byGrade[gk]) {
      const d = CARDS[id], known = !!META.dex.cards[id];
      box.appendChild(dexTile(known, d.g, d.n,
        `<b>${d.n}</b> · ${GRADE[d.rar].n} ${TYPE_NAME[d.type]}<br>${d.txt(d.v(false), false)}
         <br><span style="color:#8f846d">눌러서 자세히 보기</span>`,
        'gd_' + d.rar, () => showCardDetail(id)));
    }
  }
  const gr = p.querySelector('#dx_r');
  for (const id of relicIds) {
    const d = RELICS[id], known = !!META.dex.relics[id];
    gr.appendChild(dexTile(known, d.g, d.n, `<b>${d.n}</b> · ${d.rar === 'boss' ? '보스 유물' : RARITY_NAME[d.rar] || d.rar}<br>${d.d}`, 'r_' + d.rar));
  }
  const ge = p.querySelector('#dx_e');
  for (const id of enemyIds) {
    const d = ENEMIES[id], known = !!META.dex.enemies[id];
    const moves = Object.keys(d.moves).map(k => d.moves[k].label).join(' · ');
    ge.appendChild(dexTile(known, d.g, d.n,
      `<b>${d.n}</b> · 체력 ${d.hp[0]}~${d.hp[1]}${d.boss ? ' · 보스' : d.elite ? ' · 엘리트' : ''}<br>행동: ${moves}`,
      d.boss ? 'e_boss' : d.elite ? 'e_elite' : ''));
  }
  p.querySelector('#dx_close').onclick = closeTop;
}

function showHelp(startTab) {
  const keys = Object.keys(GUIDE);
  let cur = startTab && GUIDE[startTab] ? startTab : keys[0];
  const p = modal(`<div class="guide"><div class="gh"></div><div class="gc"></div></div>
    <button class="brush-btn" id="h_close">닫기</button>`);
  const gh = p.querySelector('.gh'), gc = p.querySelector('.gc');
  function draw() {
    gh.innerHTML = '';
    keys.forEach(k => {
      const b = el('button', k === cur ? 'on' : '', k);
      b.onclick = () => { cur = k; SND.ui(); draw(); gc.scrollTop = 0; };
      gh.appendChild(b);
    });
    gc.innerHTML = GUIDE[cur]();
  }
  draw();
  p.querySelector('#h_close').onclick = closeTop;
}

function showTitle() {
  G.scene = 'title'; G.b = null; _bgKey = ''; setBg(1);
  const tb = $('#topbar'); if (tb) tb.remove();
  SND.ambience(false);
  closeOverlay(); hideArrow();
  const s = $('#scene');
  s.innerHTML = `<div id="title-scene">
      <div class="title-seal"><span>百</span><span>鬼</span><span>夜</span><span>行</span></div>

    </div>`;
  s.querySelector('#t_new').onclick = () => { SND.init(); SND.gong(); clearSave(); newRun(0); };
  s.querySelector('#t_help').onclick = () => { SND.init(); showHelp(); };
  /* 처음 오는 사람에게는 안내서를 권한다 */
  if (!META.runs && !hasSave()) setTimeout(() => {
    const n = $('#t_help'); if (n) { n.style.borderColor = '#e8c86a'; n.style.color = '#e8c86a';
      n.textContent = '안내서 (처음이신가요?)'; }
  }, 900);
  s.querySelector('#t_dex').onclick = () => { SND.init(); SND.ui(); showDex(); };
  const c = s.querySelector('#t_cont');
  if (c) c.onclick = () => { SND.init(); SND.ui(); resumeRun(); };
}
function resumeRun() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d || !d.run) { toast('저장된 모험이 없다'); return; }
    adoptRun(d.run);
    G.cp = d.cp || null;
    showMap();
  } catch (e) { console.error(e); toast('저장된 기록을 읽을 수 없다'); }
}

/* --- 키보드 --- */
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const o = $('#overlay'), top = o.lastElementChild;
    if (top) { if (top.dataset.modal) closeTop(); return; }   /* 화면 패널은 Esc 로 닫지 않는다 */
    if (G.b && (G.b.sel || G.b.potSel != null)) { G.b.sel = null; hideArrow(); syncHand(); syncEnemies(); return; }
    if (G.run) showMenu();
    return;
  }
  if (!G.b || G.b.busy || G.b.over || $('#overlay').style.display === 'block') return;
  if (e.key >= '1' && e.key <= '9') {
    const c = G.b.hand[+e.key - 1];
    if (c) onCardClick(c);
  } else if (e.key === 'e' || e.key === 'E' || e.key === ' ') { e.preventDefault(); endTurn(); }
  else if (e.key === 'd' || e.key === 'D') showCardList(G.run.deck, '나의 덱');
});
addEventListener('resize', () => { if (G.b) syncHand(); });
addEventListener('pointerdown', () => SND.init(), { once: true });

/* --- 시작 --- */
loadMeta();
FX.init();
showTitle();

  '· 유물', Object.keys(RELICS).length, '· 물약', Object.keys(POTIONS).length, '· 요괴', Object.keys(ENEMIES).length);

</script>
