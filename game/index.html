  /* 계면조(슬픈 쪽) · 평조(밝은 쪽) — 다섯 음 */
  MODE_G: [0, 3, 5, 7, 10],
  MODE_P: [0, 2, 5, 7, 9],
  bgmSet(act) {
    const a = Math.min(25, Math.max(1, act || 1));
    /* [으뜸음, 조, 한 박(ms), 대금, 장구] */
    const T = [
      [196, 'P', 620, .5, .0],   /* 1 요괴 숲 — 낮고 성기게 */
      [185, 'P', 600, .5, .0],   /* 2 안개 봉우리 */
      [175, 'G', 570, .6, .1],   /* 3 구천 벼랑 */
      [165, 'G', 540, .7, .2],   /* 4 명계 관문 */
      [220, 'P', 520, .6, .2],   /* 5 구천 상계 — 높아진다 */
      [147, 'G', 500, .8, .3],   /* 6 무간 */
      [131, 'G', 520, .9, .3],   /* 7 무저갱 */
      [262, 'P', 560, .5, .1],   /* 8 태초 — 맑다 */
      [175, 'G', 540, .6, .2],   /* 9 환영 */
      [110, 'G', 460, .8, .55],  /* 10 백귀야행 — 장구가 산다 */
      [233, 'P', 540, .6, .15],  /* 11 새벽 */
      [196, 'P', 560, .5, .25],  /* 12 인간계 */
      [156, 'G', 500, .6, .35],  /* 13 왕도 */
      [294, 'P', 600, .7, .1],   /* 14 천계 */
      [98,  'G', 700, .9, .0],   /* 15 무 — 거의 없다 */
      [196, 'P', 620, .5, .1],   /* 16 회귀 — 첫 막으로 돌아간다 */
      [165, 'G', 520, .7, .3],   /* 17 기억 */
      [208, 'G', 560, .8, .2],   /* 18 스승 */
      [139, 'G', 480, .7, .45],  /* 19 백년 */
      [123, 'G', 520, .9, .4],   /* 20 산 */
      [147, 'G', 540, .7, .2],   /* 21 사잇길 */
      [330, 'P', 620, .8, .1],   /* 22 천국 문 — 높고 맑다 */
      [392, 'P', 680, .9, .0],   /* 23 천국 */
      [104, 'G', 440, .6, .65],  /* 24 침공 — 장구가 몰아친다 */
      [87,  'G', 560, 1.0, .35]  /* 25 사신도 */
    ][a - 1];
    return { root: T[0], scale: T[1] === 'G' ? this.MODE_G : this.MODE_P,
             beat: T[2], daeg: T[3], jang: T[4] };
  },
  /* 거문고 — 술대로 뜯는다 */
  geomungo(f, vol) {
    if (!this.ok()) return;
    const c = this.ctx, t0 = c.currentTime, g = c.createGain(), o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f * 1.012, t0);
    o.frequency.exponentialRampToValueAtTime(f, t0 + .07);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.5);
    o.connect(g).connect(this.musicBus());
    o.start(t0); o.stop(t0 + 1.6);
    /* 술대가 줄을 긁는 소리 */
    const n = c.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    const bf = c.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = f * 5; bf.Q.value = 3;
    const ng = c.createGain();
    ng.gain.setValueAtTime(vol * .5, t0);
    ng.gain.exponentialRampToValueAtTime(.0001, t0 + .09);
    n.connect(bf).connect(ng).connect(this.musicBus());
    n.start(t0); n.stop(t0 + .12);
  },
  /* 대금 — 긴 숨, 떨림이 있다 */
  daegeum(f, dur, vol) {
    if (!this.ok()) return;
    const c = this.ctx, t0 = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 4.6; lg.gain.value = f * .012;
    lfo.connect(lg).connect(o.frequency); lfo.start(t0); lfo.stop(t0 + dur + .2);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + dur * .28);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(this.musicBus());
    o.start(t0); o.stop(t0 + dur + .1);
    /* 숨소리 */
    const n = c.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    const bf = c.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = f * 3.2; bf.Q.value = 1.6;
    const ng = c.createGain();
    ng.gain.setValueAtTime(.0001, t0);
    ng.gain.exponentialRampToValueAtTime(vol * .35, t0 + dur * .3);
    ng.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    n.connect(bf).connect(ng).connect(this.musicBus());
    n.start(t0); n.stop(t0 + dur + .1);
  },
  /* 장구 — 북편(왼쪽 낮은 것)과 채편(오른쪽 높은 것) */
  janggu(kind, vol) {
    if (!this.ok()) return;
    const c = this.ctx, t0 = c.currentTime;
    if (kind === 'kung') {                     /* 북편 */
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(96, t0);
      o.frequency.exponentialRampToValueAtTime(52, t0 + .18);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .3);
      o.connect(g).connect(this.musicBus());
      o.start(t0); o.stop(t0 + .34);
    } else {                                   /* 채편 */
      const n = c.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
      const bf = c.createBiquadFilter(); bf.type = 'bandpass';
      bf.frequency.setValueAtTime(2400, t0); bf.Q.value = 2.2;
      const g = c.createGain();
      g.gain.setValueAtTime(vol * .8, t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .1);
      n.connect(bf).connect(g).connect(this.musicBus());
      n.start(t0); n.stop(t0 + .14);
    }
  },
  bgmNote(deg, oct) {
    const S = this.bgmSet(this.music.act);
    const n = S.scale[((deg % S.scale.length) + S.scale.length) % S.scale.length];
    return S.root * Math.pow(2, (n + (oct || 0) * 12) / 12);
  },
  bgmTick() {
    const m = this.music;
    if (!m.on || !this.ok()) return;
    const S = this.bgmSet(m.act);
    const b = m.beat % 8;
    const battle = m.mode === 'battle' || m.mode === 'boss';
    const boss = m.mode === 'boss';
    const V = boss ? 1.05 : battle ? .9 : .72;
    /* 거문고 — 여덟 박 가운데 몇 자리에. 성기게 둘수록 방해가 덜하다 */
    const SPOT = battle ? [0, 3, 5, 6] : [0, 5];
    if (SPOT.indexOf(b) >= 0 && Math.random() < (battle ? .62 : .42)) {
      const deg = [0, 2, 4, 1, 3, 0, 2, 4][b] + (Math.random() < .25 ? 1 : 0);
      this.geomungo(this.bgmNote(deg, b === 0 ? 0 : Math.random() < .3 ? 1 : 0), .075 * V);
    }
    /* 대금 — 두 고리에 한 번, 길게 */
    if (b === 0 && m.cyc % 2 === 0 && Math.random() < S.daeg * .8)
      this.daegeum(this.bgmNote(m.cyc % 5 === 0 ? 2 : 0, 1), S.beat * 6 / 1000, .038 * V);
    /* 뿌리음 — 아주 낮게 깔린다 */
    if (b === 0 && m.cyc % 4 === 0)
      this.daegeum(S.root / 2, S.beat * 12 / 1000, .028 * V);
    /* 장구 — 덩 · 쿵 · 덕. 지도에서는 거의 치지 않는다 */
    const jv = S.jang * (boss ? 1.25 : battle ? .85 : .45);
    if (jv > .05) {
      if (b === 0) { this.janggu('kung', .11 * jv); this.janggu('deok', .06 * jv); }
      else if (b === 4) this.janggu('kung', .09 * jv);
      else if (b === 6 && boss) this.janggu('deok', .055 * jv);
    }
    m.beat++;
    if (b === 7) m.cyc++;
    m.t = setTimeout(() => this.bgmTick(), S.beat / (boss ? 1.12 : 1));
  },
  /* 큰 한 수가 나갈 때 음악을 잠깐 눕힌다 — 그 소리가 들리도록 */
  duck(ms, depth) {
    if (!this.ok() || !this.mGain) return;
    const c = this.ctx, g = this.mGain, now = c.currentTime;
    const base = Math.max(.0001, (OPT.musicVol == null ? .38 : OPT.musicVol) * .24);
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(Math.max(.0001, g.gain.value), now);
    g.gain.linearRampToValueAtTime(Math.max(.0001, base * (depth == null ? .28 : depth)), now + .08);
    g.gain.linearRampToValueAtTime(base, now + (ms || 1600) / 1000);
  },
  /* 비기 한 소절 — 등급에 따라 결이 다르다 */
  skillSting(rar) {
    if (!this.ok()) return;
    const S = this.bgmSet(this.music.act || 1);
    const hi = rar === 'unknown' ? 4 : rar === 'ssx' ? 3 : rar === 'ssc' ? 2 : rar === 'special' ? 1 : 0;
    this.duck(1400 + hi * 400, .22);
    /* 징 한 번, 그리고 다섯 음이 차오른다 */
    this.gong();
    const deg = [0, 2, 4, 6, 8].slice(0, 3 + hi);
    deg.forEach((dg, i) => setTimeout(() => {
      this.geomungo(this.bgmNote(dg, hi >= 2 ? 1 : 0), .14 + hi * .015);
      if (hi >= 2) this.blip(this.bgmNote(dg, 2), { dur: .5, type: 'sine', vol: .05, rev: .8 });
    }, i * (90 - hi * 8)));
    /* 대금이 길게 받쳐 준다 */
    setTimeout(() => this.daegeum(this.bgmNote(0, 1), 1.2 + hi * .3, .07), 60);
    /* 장구가 몰아친다 */
    if (hi >= 1) for (let i = 0; i < 3 + hi; i++)
      setTimeout(() => this.janggu(i % 2 ? 'deok' : 'kung', .12), i * (70 - hi * 4));
    if (hi >= 3) setTimeout(() => { this.thunder(); }, 220);
  },
  bgm(on, mode) {
    if (!this.ok()) { if (!on) return; }
    const m = this.music;
    const act = (typeof G === 'object' && G && G.run) ? G.run.act : 1;
    if (!on || (typeof OPT === 'object' && OPT && OPT.music === false)) {
      m.on = false;
      if (m.t) { clearTimeout(m.t); m.t = null; }
      if (this.mGain) this.mGain.gain.linearRampToValueAtTime(.0001, this.ctx.currentTime + .9);
      return;
    }
    this.init();
    if (!this.ok()) return;
    const changed = m.act !== act || m.mode !== (mode || 'map');
    m.act = act; m.mode = mode || 'map';
    const bus = this.musicBus();
    const vol = (OPT.musicVol == null ? .38 : OPT.musicVol) * (m.mode === 'boss' ? 1.08 : 1);
    bus.gain.cancelScheduledValues(this.ctx.currentTime);
    bus.gain.setValueAtTime(Math.max(.0001, bus.gain.value), this.ctx.currentTime);
    bus.gain.linearRampToValueAtTime(Math.max(.0001, vol * .24), this.ctx.currentTime + 1.4);
    if (m.on && !changed) return;
    if (changed) { m.beat = 0; m.cyc = 0; }
    if (!m.on) { m.on = true; if (m.t) clearTimeout(m.t); this.bgmTick(); }
  },
  /* ── 배경 바람 — 막마다 결이 다르다 ──────────────────────
     낮은 산은 마른 바람, 벼랑은 휘파람, 명계는 웅웅거림,
     태초는 맑은 울림, 백귀야행은 멀리서 오는 발소리,
     무(無)는 거의 아무것도 없다. */
  ambProfile(act) {
    const a = Math.min(25, Math.max(1, act || 1));
    return [
      { f: 420, q: .7, r: .35, w: .06, d: 210 },   /* 1 요괴 숲 */
      { f: 380, q: .8, r: .34, w: .05, d: 180 },   /* 2 안개 봉우리 */
      { f: 640, q: 2.6, r: .30, w: .09, d: 380 },  /* 3 구천 벼랑 — 휘파람 */
      { f: 190, q: 1.1, r: .28, w: .04, d: 90 },   /* 4 명계 관문 — 웅웅 */
      { f: 900, q: 1.4, r: .40, w: .07, d: 320 },  /* 5 구천 상계 */
      { f: 130, q: .9, r: .24, w: .03, d: 60 },    /* 6 무간 */
      { f: 96, q: .7, r: .22, w: .025, d: 44 },    /* 7 무저갱 */
      { f: 1500, q: 2.2, r: .5, w: .05, d: 520 },  /* 8 태초 — 맑다 */
      { f: 560, q: 1.2, r: .34, w: .06, d: 240 },  /* 9 환영 */
      { f: 250, q: 1.8, r: .30, w: .14, d: 150 },  /* 10 백귀야행 — 발소리처럼 흔들린다 */
      { f: 1100, q: 1.0, r: .44, w: .05, d: 420 }, /* 11 새벽 */
      { f: 470, q: .8, r: .36, w: .05, d: 200 },   /* 12 인간계 */
      { f: 330, q: 1.6, r: .30, w: .06, d: 170 },  /* 13 왕도 */
      { f: 1750, q: 1.3, r: .55, w: .04, d: 600 }, /* 14 천계 */
      { f: 70, q: .6, r: .18, w: .015, d: 26 },    /* 15 무 */
      { f: 430, q: .7, r: .35, w: .06, d: 215 },   /* 16 회귀 — 첫 막의 바람과 거의 같다 */
      { f: 300, q: 2.0, r: .32, w: .10, d: 190 },  /* 17 기억 — 웅성거림 */
      { f: 780, q: 1.5, r: .42, w: .045, d: 300 }, /* 18 스승 — 절의 처마 바람 */
      { f: 210, q: 1.7, r: .34, w: .12, d: 130 },  /* 19 백년 — 수많은 발소리 */
      { f: 520, q: .55, r: .38, w: .035, d: 260 }, /* 20 산 — 정상의 큰 바람 */
      { f: 360, q: 1.4, r: .32, w: .07, d: 200 },  /* 21 사잇길 */
      { f: 1400, q: 1.1, r: .5, w: .04, d: 520 },  /* 22 천국 문 — 맑고 높다 */
      { f: 1900, q: .9, r: .58, w: .03, d: 640 },  /* 23 천국 */
      { f: 150, q: 1.9, r: .3, w: .13, d: 110 },   /* 24 침공 — 발소리 */
      { f: 88, q: 1.2, r: .26, w: .02, d: 50 }     /* 25 사신도 — 낮고 고요하다 */
    ][a - 1];
  },
  ambience(on, strong) {
    if (!this.ok()) return;
    const c = this.ctx;
    if (!on) {
      if (this.amb) {
        this.ambGain.gain.linearRampToValueAtTime(.0001, c.currentTime + .6);
        const a = this.amb; setTimeout(() => { try { a.stop(); } catch (e) {} }, 900);
        this.amb = null;
      }
      return;
    }
    const act = (typeof G === 'object' && G && G.run) ? G.run.act : 1;
    /* 막이 바뀌면 바람도 갈아 끼운다 */
    if (this.amb && this.ambAct !== act) { const old = this.amb, og = this.ambGain;
      og.gain.linearRampToValueAtTime(.0001, c.currentTime + .8);
      setTimeout(() => { try { old.stop(); } catch (e) {} }, 1100);
      this.amb = null; }
    if (this.amb) { if (this.ambGain) this.ambGain.gain.linearRampToValueAtTime(strong ? .034 : .019, c.currentTime + 1.2); return; }
    const pr = this.ambProfile(act);
    this.ambAct = act;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    s.playbackRate.value = .35;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = pr.f; f.Q.value = pr.q;
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = pr.w; lg.gain.value = pr.d;
    lfo.connect(lg).connect(f.frequency); lfo.start();
    this.ambGain = c.createGain(); this.ambGain.gain.value = .0001;
    this.ambGain.gain.linearRampToValueAtTime((strong ? .034 : .019) * (pr.r / .34), c.currentTime + 2.5);
    s.connect(f).connect(this.ambGain).connect(this.master);
    s.start(); this.amb = s;
  }
};
/* --- 캔버스 먹물 파티클 --- */
const FX = {
  cv: null, cx: null, ps: [], running: false,
  init() {
    this.cv = $('#fx'); this.cx = this.cv.getContext('2d');
    const rz = () => { this.cv.width = innerWidth; this.cv.height = innerHeight; };
    rz(); addEventListener('resize', rz);
  },
  burst(x, y, n, color, spd = 5, life = 42, size = 4) {
    if (!OPT.particles) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (.35 + Math.random());
      this.ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.2,
        r: size * (.4 + Math.random()), life: life * (.6 + Math.random() * .7), age: 0, color, g: .17 });
    }
    this.run();
  },
  ink(x, y, n = 16) { this.burst(x, y, n, '23,19,15', 5.5, 46, 5); },
  blood(x, y, n = 20) { this.burst(x, y, n, '150,32,38', 6.5, 44, 4.5); },
  spark(x, y, n = 14, c = '44,120,110') { this.burst(x, y, n, c, 4, 40, 3.4); },
  gold(x, y, n = 18) { this.burst(x, y, n, '190,150,60', 4.5, 55, 3.4); },
  run() {
    if (this.running) return; this.running = true;
    const step = () => {
      const c = this.cx; c.clearRect(0, 0, this.cv.width, this.cv.height);
      for (let i = this.ps.length - 1; i >= 0; i--) {
        const p = this.ps[i];
        p.age++; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.vy *= .985;
        if (p.age > p.life) { this.ps.splice(i, 1); continue; }
        const k = 1 - p.age / p.life;
        c.globalAlpha = k * .85;
        c.fillStyle = 'rgb(' + p.color + ')';
        c.beginPath(); c.arc(p.x, p.y, p.r * (.35 + k * .8), 0, 6.284); c.fill();
      }
      c.globalAlpha = 1;
      if (this.ps.length) requestAnimationFrame(step);
      else { this.running = false; c.clearRect(0, 0, this.cv.width, this.cv.height); }
    };
    requestAnimationFrame(step);
  }
};
function centerOf(node) { const r = node.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

  const a = $('#app'); a.classList.remove('shake', 'shake-lg'); void a.offsetWidth;
  a.classList.add(big ? 'shake-lg' : 'shake');
  setTimeout(() => a.classList.remove('shake', 'shake-lg'), 520);
}

let tipEl;
function tipShow(html, x, y) {
  if (!OPT.tips) return;
  tipEl = tipEl || $('#tip');
  tipEl.innerHTML = html; tipEl.style.display = 'block';
  const r = tipEl.getBoundingClientRect();
  tipEl.style.left = clamp(x - r.width / 2, 8, innerWidth - r.width - 8) + 'px';
  tipEl.style.top = (y - r.height - 14 < 8 ? y + 24 : y - r.height - 14) + 'px';
}
function tipHide() { if (tipEl) tipEl.style.display = 'none'; }
function bindTip(node, htmlFn) {
  node.addEventListener('mouseenter', e => { const r = node.getBoundingClientRect(); tipShow(htmlFn(), r.left + r.width / 2, r.top); });
  node.addEventListener('mouseleave', tipHide);
}
function toast(msg) {

  setTimeout(() => t.remove(), 2400);
}

function jpEarned(run, won) {
  if (!run) return 0;
  const s = run.stats || {};
  let p = (s.floors || 0) * 2 + (s.battles || 0) * 1
        + (s.elites || 0) * 5 + Math.max(0, (run.act || 1) - 1) * 10;
  if (won) p = Math.round(p * 2);
  return Math.max(6, p);
}

}

  if (!act) return 1;
  if (META.cleared >= act) return 1;           /* 이미 넘어선 막에는 붙지 않는다 */

function mkCard(id, up) { return { uid: _uid++, id, up: !!up }; }
function cdef(c) { return CARDS[c.id]; }
function cval(c) { return cdef(c).v(c.up); }
function ccost(c) {
  const d = cdef(c);
  const k = d.costOf ? d.costOf(c.up) : d.cost;
  if (k > 0 && curseTag('costup')) return k + 1;               /* 저주 — 무겁다 */
  return k;
}
/* 실제로 치르는 값 — 무념무상 같은 효과를 반영한다 */
function ecost(c) {
  const k = ccost(c);
  if (!G.b || k <= 0) return k;
  if (G.b.freeTurn) return 0;
  return Math.max(0, k - (G.b.cheap || 0));   /* 천수 같은 것이 값을 깎아 준다 */
}
function cname(c) { return cdef(c).n + (c.up ? '+' : ''); }
/* 등급 — 4등급이 가장 낮고 ?급이 가장 높다. ?급은 아직 어디에도 없다. */
const GRADE = {
  basic:    { n: '4등급', s: '4', c: '#7d7568', desc: '흔한 기본 부적' },
  common:   { n: '3등급', s: '3', c: '#3f7346', desc: '쓸 만한 부적' },
  uncommon: { n: '2등급', s: '2', c: '#2f6d8f', desc: '드문 부적' },
  rare:     { n: '1등급', s: '1', c: '#b8912f', desc: '귀한 부적' },
  special:  { n: 'S급',   s: 'S', c: '#e2622a', desc: '특별 상자에서만 나오는 불타는 부적' },
  ssc:      { n: 'SSC급', s: 'SSC', c: '#1fb6c9', desc: 'S급을 넘어선 청람빛 부적. SSX에는 못 미치나, 그 아래는 전부 아래다.' },
  ssx:      { n: 'SSX급', s: 'SSX', c: '#ff2d55', desc: '전설로만 전하는 금단의 부적' },
  unknown:  { n: '?급',   s: '?', c: '#7b4bd8', desc: '전해지지 않는 등급. 특대급 상자에서 0.1% 확률로만 모습을 드러낸다.' },
  curse:    { n: '저주',  s: '呪', c: '#5b3b6b', desc: '덱을 좀먹는다' }
};
const GRADE_ORDER = ['basic', 'common', 'uncommon', 'rare', 'special', 'ssc', 'ssx', 'unknown'];
const RARITY_NAME = {};
for (const k in GRADE) RARITY_NAME[k] = GRADE[k].n;
const auraClass = rar => rar === 'ssx' ? ' g-ssx' : rar === 'ssc' ? ' g-ssc'
  : rar === 'special' ? ' g-s' : rar === 'unknown' ? ' g-unknown' : '';
const TYPE_NAME = { attack: '공격', skill: '기술', power: '심법', curse: '저주' };
/* 보상 풀 */
const POOL = { common: [], uncommon: [], rare: [] };
const SPECIAL_CARDS = [];                    /* 상자에서 나오는 것 전부 */
const GRADE_POOL = { special: [], ssc: [], ssx: [], unknown: [] };
for (const k in CARDS) {
  const c = CARDS[k];
  if (POOL[c.rar]) POOL[c.rar].push(k);
  else if (GRADE_POOL[c.rar]) { GRADE_POOL[c.rar].push(k); if (c.rar !== 'unknown') SPECIAL_CARDS.push(k); }
}
function randomCard(rarWeights) {
  const r = pickWeighted(rarWeights).r;
  return pick(POOL[r]);
}
/* ── 등급 해금 ──────────────────────────────────────────────
   기본(4등급) 부적은 보상에서 절대 나오지 않는다.
   처음에는 3등급만 나오고, 산을 오를수록 2등급 → 1등급이 열린다.
   엘리트·보스는 한 등급 더 위까지 미리 내준다. */
const UNLOCK = [
  { at: 0,  r: 'common',   n: '3등급' },
  { at: 7,  r: 'uncommon', n: '2등급' },
  { at: 18, r: 'rare',     n: '1등급' }
];
const ACT_SPAN = 12;
function progress() { const r = G.run; return r ? (r.act - 1) * ACT_SPAN + r.floor : 0; }
function unlockedGrades(boost) {
  const p = progress();
  let list = UNLOCK.filter(u => p >= u.at).map(u => u.r);
  if (!list.length) list = ['common'];
  if (boost === 'elite' || boost === 'boss') {           /* 엘리트·보스는 한 단계 앞서 준다 */
    const nextIdx = UNLOCK.findIndex(u => list.indexOf(u.r) < 0);
    if (nextIdx >= 0) list = list.concat(UNLOCK[nextIdx].r);
  }
  return list;
}
function gradeWeights(boost) {
  const un = unlockedGrades(boost);
  const base = boost === 'boss' ? { common: 10, uncommon: 55, rare: 45 }
             : boost === 'elite' ? { common: 40, uncommon: 42, rare: 20 }
             : { common: 62, uncommon: 33, rare: 9 };
  const w = un.map(r => ({ w: base[r], r })).filter(x => x.w > 0);
  return w.length ? w : [{ w: 1, r: un[0] }];
}
/* 다음에 열릴 등급까지 남은 층수 (안내용) */
function nextUnlock() {
  const p = progress();
  const u = UNLOCK.find(x => p < x.at);
  return u ? { n: u.n, left: u.at - p } : null;
}
function checkUnlockToast() {
  const p = progress();
  G.run.unlocked = G.run.unlocked || [];
  for (const u of UNLOCK) {
    if (p >= u.at && u.at > 0 && G.run.unlocked.indexOf(u.r) < 0) {
      G.run.unlocked.push(u.r);
      flash(`${u.n} 부적 해금`);
      toast(`이제 전투 보상에 ${u.n} 부적이 나온다`);
    }
  }
}
function rewardCards(n, boost) {
  const w = gradeWeights(boost);
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    const id = randomCard(w);
    if (out.some(c => c.id === id)) continue;
    out.push(mkCard(id, false));
  }
  return out;
}

function fusionFor(ids) {
  const set = new Set(ids);
  return FUSIONS.filter(f => set.has(f.a) && set.has(f.b));
}
function canFuse() { return G.run ? fusionFor(G.run.relics.map(r => r.id)) : []; }
function doFuse(f) {
  const run = G.run;
  run.relics = run.relics.filter(r => r.id !== f.a && r.id !== f.b);
  const r = { id: f.to, used: false, isNew: true };
  run.relics.push(r);
  const d = RELICS[f.to];
  if (d.h && d.h.onGain) d.h.onGain(r);
  dexAdd('relics', f.to);
  SND.gong(); SND.power();
  flash(d.n);
  saveRun(); renderTop();
}

function fire(hook, ...args) {
  if (!G.run) return;
  const half = curseTag('relichalf');
  for (const r of G.run.relics) {
    const d = RELICS[r.id]; if (!d.h || !d.h[hook]) continue;
    if (half) { r.skip = !r.skip; if (r.skip) continue; }   /* 저주 — 한 번 걸러 한 번만 듣는다 */
    d.h[hook](r, ...args);
  }
}
function pipe(hook, val, ...args) {
  if (!G.run) return val;
  const half = curseTag('relichalf');
  for (const r of G.run.relics) {
    const d = RELICS[r.id]; if (!d.h || !d.h[hook]) continue;
    const out = d.h[hook](r, val, ...args);
    val = (half && typeof out === 'number' && typeof val === 'number') ? val + (out - val) * .5 : out;
  }
  return typeof val === 'number' ? Math.round(val) : val;
}
function hasRelic(id) { return G.run && G.run.relics.some(r => r.id === id); }
function gainRelic(id, silent) {
  if (hasRelic(id)) return false;
  if (G.run.relics.length >= RELIC_SLOTS) { relicOverflow(id); return true; }
  const r = { id: id, used: false, isNew: true };
  G.run.relics.push(r);
  const d = RELICS[id];
  dexAdd('relics', id);
  if (d.h && d.h.onGain) d.h.onGain(r);
  if (!silent) { SND.power(); toast(`유물 획득 — ${d.n}`); }
  return true;
}
/* 자리가 꽉 찼을 때 — 무엇을 버릴지 고르게 한다.
   지금 떠 있는 창(보상·상점 등)이 닫히거나 다시 그려진 뒤에 띄워야
   그 과정에서 창이 지워지지 않는다. */
function relicOverflow(newId) { setTimeout(() => showRelicOverflow(newId), 90); }
function showRelicOverflow(newId) {
  const run = G.run, d = RELICS[newId];
  if (run.relics.length < RELIC_SLOTS) {           /* 그 사이 자리가 났다면 그냥 준다 */
    const r = { id: newId, used: false, isNew: true };
    run.relics.push(r);
    if (d.h && d.h.onGain) d.h.onGain(r);
    dexAdd('relics', newId); SND.power(); toast(`유물 획득 — ${d.n}`);
    renderTop(); saveRun(); return;
  }
  const p = modal(`<h2>유물 자리가 없다</h2>
    <div class="hint">유물은 ${RELIC_SLOTS}개까지만 지닐 수 있다 · 하나를 버리거나, 새 유물을 포기한다<br>
      <b style="color:#9ab0cc">버리기 아깝다면 ≡ → 터 → 신성의 신전에 바치고 가호를 받으시오</b></div>
    <div class="relicgrid" id="ro_old"></div>
    <div class="hint" style="margin-top:6px">새로 얻은 것</div>
    <div class="relicgrid" id="ro_new"></div>`);
  const mk = (id, box, isNew) => {
    const rd = RELICS[id];
    const n = el('div', 'rtile g-' + rgrade(id) + (isNew ? ' fresh' : ''),
      `<b>${rd.g}</b><span>${rd.n}</span>`);
    bindTip(n, () => `<b>${rd.n}</b> · ${GRADE[rgrade(id)].n}<br>${rd.d}`);
    n.onclick = () => {
      if (isNew) { toast(`${d.n}을 두고 간다`); closeTop(); return; }
      run.relics = run.relics.filter(x => x.id !== id);
      const r = { id: newId, used: false, isNew: true };
      run.relics.push(r);
      if (RELICS[newId].h && RELICS[newId].h.onGain) RELICS[newId].h.onGain(r);
      dexAdd('relics', newId);
      SND.power(); toast(`${rd.n}을 버리고 ${d.n}을 얻었다`);
      closeTop(); renderTop(); saveRun();
    };
    box.appendChild(n);
  };
  for (const r of run.relics) mk(r.id, p.querySelector('#ro_old'), false);
  mk(newId, p.querySelector('#ro_new'), true);
}
function randomRelic(rar) {
  const owned = new Set(G.run.relics.map(r => r.id));
  let pools = rar ? [rar] : ['common', 'common', 'common', 'uncommon', 'uncommon', 'rare'];
  pools = pools.filter(p => p !== 'fused');
  const cand = [];
  for (const p of pools) for (const id of RELIC_POOL[p]) if (!owned.has(id)) cand.push(id);
  return cand.length ? pick(cand) : null;
}

const P = () => (G.b ? G.b.p : null);
const alive = () => G.b ? G.b.enemies.filter(e => e.hp > 0 && !e.dead) : [];

function calcAtk(src, tgt, base) {
  let d = base;
  if (src.dmgMul && src.dmgMul !== 1) d = d * src.dmgMul;    /* 막에 따른 보정 */
  d += (src.s.str || 0);
  if (src.isPlayer) {
    d += (src.s.edge || 0);
    if (hasBoon('atk80')) d *= 1.8;                          /* 저주를 이겨 낸 자 */
    const tr = G.run && G.run.train;                         /* 수행 — 무쇠손 */
    if (tr && tr.atk) d *= (1 + tr.atk);
    d *= sorrowAtk();                                        /* 슬픔의 원한 */
    d *= shrineAtk();                                        /* 신전 — 칼날의 가호 */
  }
  if (src.s.weak) d = Math.floor(d * .75);
  if (tgt.s.vuln) d = Math.floor(d * 1.5);
  return Math.max(0, Math.floor(d));
}
/* 실제 피해 적용. {hp: 체력으로 들어간 피해, blocked: 막은 양} */
function applyDamage(ent, dmg, pierce) {
  if (ent.isPlayer) {
    if (G.b && G.b.halved) dmg = Math.ceil(dmg / 2);
    dmg = pipe('modTaken', dmg);
    const tr = G.run && G.run.train;                    /* 수행 — 굳은살 */
    if (tr && tr.def && dmg > 0) dmg = Math.max(1, dmg - tr.def);
    const sh = shrineDef();                             /* 신전 — 가죽의 가호 */
    if (sh && dmg > 0) dmg = Math.max(1, dmg - sh);
  }
  let d = Math.max(0, dmg), blocked = 0;
  if (!pierce && ent.block > 0) { blocked = Math.min(ent.block, d); ent.block -= blocked; d -= blocked; }
  ent.hp = Math.max(0, ent.hp - d);
  if (ent.isPlayer) {
    G.run.hp = ent.hp;
    if (d > 0) checkHermit();
  } else if (ent.hp > 0) {
    if (!ent.halfDone && ent.hp * 2 <= ent.maxHp) {
      ent.halfDone = true;
      if (ent.def.onHalf) ent.def.onHalf(ent);
    }
    /* 반이 깎이는 순간과 각성이 한꺼번에 올 수도 있으므로 따로 본다 */
    if (ent.def.boss && !ent.awake && ent.hp <= ent.maxHp * AWAKEN_AT
        && (G.run && G.run.act || 1) >= AWAKEN_FROM) {
      awaken(ent);                          /* 보스는 더 몰리면 눈을 뜬다 */
    }
  }
  return { hp: d, blocked };
}
function checkHermit() {
  if (!G.run || !P()) return;
  const r = G.run.relics.find(x => x.id === 'hermit' || x.id === 'immortalpill');
  if (r && !r.used && P().hp > 0 && P().hp * 2 <= P().maxHp) {
    r.used = true; heal(r.id === 'immortalpill' ? 35 : 25);
    flash(r.id === 'immortalpill' ? '선단을 삼켰다' : '표주박이 열렸다');
  }
}

/* --- 카드가 쓰는 기본 동작들 --- */
function atk(t, base, opts) {
  opts = opts || {};
  if (!G.b || !t || t.hp <= 0) return 0;
  base = pipe('modAtk', base, G.b.curCard);
  const dmg = calcAtk(P(), t, base);
  const r = applyDamage(t, dmg, opts.pierce);
  G.b.attacked = true;
  impact(opts.fx || (G.b.curCard ? CARD_FX[G.b.curCard.id] : null) || 'slash', t);
  hitFx(t, r.hp, r.blocked, true);
  const dr = P().s.drain || 0;
  if (dr && r.hp + r.blocked > 0) heal(dr);
  if (t.s.thorns) { pure(P(), t.s.thorns); }
  return r.hp;
}
function pure(t, amt) {                       // 방어도·보정 무시 직접 피해
  if (!t || t.hp <= 0 && !t.isPlayer) return;
  const r = applyDamage(t, amt, true);
  hitFx(t, r.hp, 0, false);
}
function blk(n, raw) {
  const p = P(); if (n <= 0) return;
  let v = Math.max(0, raw ? n : n + (p.s.dex || 0));
  if (curseTag('weakblock')) v = Math.floor(v * .65);         /* 저주 — 방패가 삭는다 */
  p.block += v; SND.block(); blockFx(p, v); syncPlayer();
}
function eblk(e, n) { const v = Math.max(0, n + (e.s.dex || 0)); e.block += v; SND.block(); blockFx(e, v); }
function st(ent, key, n) {
  if (!n || !ent) return;
  ent.s[key] = (ent.s[key] || 0) + n;
  const noNeg = ['vuln', 'weak', 'poison', 'stun', 'dbl', 'regen', 'regenP', 'afterimg', 'thorns', 'drain', 'edge', 'rage', 'flow', 'sword', 'focus', 'curse', 'endblock', 'turnblock', 'rebirth'];
  if (ent.s[key] === 0 || (noNeg.indexOf(key) >= 0 && ent.s[key] <= 0)) delete ent.s[key];
  if (n > 0) statusFx(ent, key);
  syncAll();
}
function heal(n) { const p = P(); const b4 = p.hp;
  n = Math.max(1, Math.round(n * sorrowHeal()));            /* 슬픔의 원한 — 상처가 더디 아문다 */
  p.hp = Math.min(p.maxHp, p.hp + n); G.run.hp = p.hp;
  if (p.hp > b4) { healFx(p, p.hp - b4); SND.heal(); } syncPlayer(); }
function eheal(e, n) { const b4 = e.hp; e.hp = Math.min(e.maxHp, e.hp + n); if (e.hp > b4) healFx(e, e.hp - b4); }
function lose(n) { const p = P(); applyDamage(p, n, true); hitFx(p, n, 0, false); syncPlayer(); }
function healRun(n) { if (!G.run) return;
  G.run.hp = Math.min(G.run.maxHp, G.run.hp + Math.max(1, Math.round(n * sorrowHeal())));
  if (G.run.hp > EMERGENCY_HP) G.run._healMute = false; }
function energy(n) { G.b.energy += n; const e = $('#energy'); if (e) { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); } syncAll(); }

/* --- 덱 조작 --- */
function drawCards(n) {
  const b = G.b; if (!b) return;
  for (let i = 0; i < n; i++) {
    /* 손은 열 장까지. 자동으로 도는 중에는 굳이 알리지 않는다 —
       뽑기 효과가 겹치면 한 판에 몇 번씩 떠서 오류처럼 보였다 */
    if (b.hand.length >= 10) { if (!AUTO.on) toast('손에 카드를 더 들 수 없다'); break; }
    if (!b.drawPile.length) {
      if (!b.discardPile.length) break;
      b.drawPile = shuffle(b.discardPile.slice()); b.discardPile = [];
    }
    b.hand.push(b.drawPile.pop());
  }
  SND.draw(n); if (n >= 3) SND.swoosh(); syncAll();
}
function discardCard(c) {
  const b = G.b, i = b.hand.findIndex(x => x.uid === c.uid);
  if (i >= 0) b.hand.splice(i, 1);
  b.discardPile.push(c); syncAll();
}
function exhaustCard(c) {
  const b = G.b, i = b.hand.findIndex(x => x.uid === c.uid);
  if (i >= 0) b.hand.splice(i, 1);
  b.exhaustPile.push(c);
  fire('onExhaust', c);
  syncAll();
}

/* --- 전투 시작 --- */
function startBattle(enemyIds, kind, opts) {
  const run = G.run;
  opts = opts || {};
  const b = G.b = {
    p: { isPlayer: true, hp: run.hp, maxHp: run.maxHp, block: 0, s: {}, el: null },
    enemies: [], hand: [], drawPile: [], discardPile: [], exhaustPile: [],
    energy: 0, maxEnergy: Math.max(1, run.maxEnergy - (curseTag('lessqi') ? 1 : 0)), turn: 0, played: 0, attacked: false,
    drawMod: 0, busy: true, over: false, kind: kind || 'normal', sel: null, curCard: null,
    skillUsed: false, freeTurn: false, halved: false, startHp: run.hp, pet: null
  };
  let ux = 1;
  /* 막마다 요괴가 굵어진다 (대전투장은 자체 배율을 쓴다) */
  let sc = kind === 'arena' ? { hp: 1, dmg: 1 } : actScale(run.act);
  /* ── 보스가 너무 셌다 ──────────────────────────────────
     특별 상자를 까지 않으면 못 넘을 지경이라는 말을 들었다.
     보스만 따로 눅인다. 엘리트는 그보다 덜.
     ────────────────────────────────────────────────── */
  if (kind === 'boss') sc = { hp: sc.hp * BOSS_SOFT.hp, dmg: sc.dmg * BOSS_SOFT.dmg };
  else if (kind === 'elite') sc = { hp: sc.hp * ELITE_SOFT.hp, dmg: sc.dmg * ELITE_SOFT.dmg };
  const boost = sc.hp;
  for (const id of enemyIds) {
    const d = ENEMIES[id];
    let hp = ri(d.hp[0], d.hp[1]) + Math.floor((run.asc || 0) * 0.08 * d.hp[0]);
    hp = Math.round(hp * boost);
    if (opts.hpMul) hp = Math.round(hp * opts.hpMul);
    const e = { uid: 'e' + (ux++), id, def: d, n: d.n, g: d.g, hp, maxHp: hp, block: 0, s: {},
                dmgMul: sc.dmg,
                hist: [], turnCount: 0, mv: null, mvKey: null, el: null, dead: false, halfDone: false };
    if (d.init) d.init(e);
    if (opts.str) e.s.str = (e.s.str || 0) + opts.str;
    if (opts.dex) e.s.dex = (e.s.dex || 0) + opts.dex;
    dexAdd('enemies', id);
    b.enemies.push(e);
  }
  b.drawPile = shuffle(run.deck.map(c => Object.assign({}, c, { bonus: 0 })));
  if (kind !== 'arena') { run.inBattle = true; saveRun(); }   /* 도중에 나가면 갈림길로 되돌린다 */
  G.scene = 'battle';
  renderBattle();
  SND.ambience(true, true);
  SND.bgm(true, kind === 'boss' ? 'boss' : 'battle');
  if (kind === 'boss') SND.boss(); else if (kind === 'elite') SND.gong(); else SND.drum();
  if (friendOn()) setTimeout(() => friendSay(kind === 'boss' ? '"보스야. 천천히 가자."'
    : kind === 'elite' ? '"이건 굵다. 조심해."' : '"붙자."', 3000), 700);
  if (hasBoon('str5')) { st(b.p, 'str', 4); st(b.p, 'dex', 4); }
  fire('battleStart');
  for (const e of b.enemies) pickIntent(e);
  syncAll();
  setTimeout(() => startPlayerTurn(), 420);
}

/* ══ 각성(覺醒) — 보스가 반으로 꺾이면 눈을 뜬다 ══════════
   피해가 50% 오르고, 본래 없던 세 수를 새로 쓴다.
   ═══════════════════════════════════════════════════════════ */
const AWAKEN_AT = 0.40;                   /* 체력이 이 아래로 떨어지면 각성한다 */
const AWAKEN_FROM = 3;                    /* 이 막부터 보스가 눈을 뜬다 — 첫 두 막은 그냥 둔다 */
const AWAKEN_MOVES = {
  aw_rend:  { t: 'attack', label: '각성 · 찢어발기기', d: 30, n: 2, fx: 'slash2', awaken: true },
  aw_curse: { t: 'atkdeb', label: '각성 · 업을 씌운다', d: 26, fx: 'void', awaken: true,
              deb: { weak: 5, vuln: 5, curse: 6 } },
  aw_roar:  { t: 'buff',   label: '각성 · 포효', blk: 40, self: { str: 8, thorns: 6 }, awaken: true,
              extra: e => { SND.charge(); if (e.el) { const c = centerOf(e.el);
                sparkles(c.x, c.y, 16, '#ff8a3a', 90); shockRing(c.x, c.y, 260, '#ff6a2a'); } } }
};
const AWAKEN_KEYS = Object.keys(AWAKEN_MOVES);
function awaken(e) {
  if (e.awake || !e.def.boss) return;
  e.awake = true;
  e.dmgMul = (e.dmgMul || 1) * 1.5;      /* 딱 50% — 힘까지 얹으면 너무 세다 */
  if (e.el) e.el.classList.add('awake');
  stampWord('각 성', '#ff3a2a');
  screenFlash('radial-gradient(circle,rgba(255,90,40,.65),rgba(60,0,0,.85))', 1000);
  blink(2); zoomPunch(); rgbSplit(); shake(true); hitstop(true);
  rushVignette('rgba(200,30,20,.55)');
  SND.boss(); SND.gong(); SND.charge();
  if (e.el) { const c = centerOf(e.el);
    sparkles(c.x, c.y, 30, '#ff9a4a', 180); shockRing(c.x, c.y, 460, '#ff5a2a');
    FX.burst(c.x, c.y, 40, '255,90,40', 8, 60, 6);
    for (let i = 0; i < 3; i++) setTimeout(() => lightBeam(c.x + (i - 1) * 90, 'rgba(255,120,50,.6)', 150), i * 110);
  }
  flash(e.n + ' 각성');
  syncAll();
}
function pickIntent(e) {
  if (e.hp <= 0) return;
  /* 콜로세움의 상대는 정해진 수가 없다 — 제 덱에서 뽑아 그 자리에서 만든다 */
  if (e.def.duel) {
    const foe = colFoe(e.def.duel);
    e.mvKey = 'duel';
    e.mv = colMoveFrom(foe);
    e.duelExtra = [];
    for (let i = 1; i < (foe.draw || 1); i++) e.duelExtra.push(colMoveFrom(foe));
    return;
  }
  let key;
  if (e.awake && rnd() < .38) key = pick(AWAKEN_KEYS);   /* 각성한 보스는 새 수를 섞어 쓴다 */
  else key = e.def.next(e);
  e.mvKey = key;
  e.mv = AWAKEN_MOVES[key] || e.def.moves[key];
}

/* --- 플레이어 턴 시작 --- */
async function startPlayerTurn() {
  const b = G.b; if (!b || b.over) return;
  b.turn++; b.played = 0; b.attacked = false; b.busy = true;
  b.freeTurn = false; b.halved = false; b.cheap = 0;
  if (b.pet) b.pet.used = false;
  const p = P();
  if (!p.s.barricade) p.block = 0;
  b.energy = b.maxEnergy + (p.s.focus || 0);

  if (b.turn === 1 && shLv('shield')) blk(shLv('shield') * 4, true);   /* 신전 — 방패의 가호 */
  if (shLv('hand')) b.drawMod = (b.drawMod || 0) + shLv('hand');       /* 신전 — 손의 가호 */
  /* 상인에게 얻은 가호는 첫 턱에 한 번 */
  if (b.turn === 1) for (const k of talkBoons()) {
    const bo = TALK_BOON[k];
    if (bo && bo.on) { try { bo.on(b); } catch (e) { console.error('가호 오류', k, e); } }
  }
  if (p.s.rage) st(p, 'str', p.s.rage);
  if (p.s.afterimg) { blk(p.s.afterimg, true); delete p.s.afterimg; }
  if (p.s.turnblock) blk(p.s.turnblock, true);
  if (p.s.poison) { const d = p.s.poison; SND.poison(); pure(p, d); st(p, 'poison', -1); if (await checkOver()) return; }
  if (p.s.sword) { for (let i = 0; i < p.s.sword; i++) { const a = alive(); if (a.length) pure(pick(a), 4); } }
  fire('turnStart');
  await checkDeaths();
  /* 검기·독 따위가 차례 첫머리에 마지막 요괴를 눕혔을 수 있다.
     checkDeaths 는 시체만 치울 뿐 전투를 끝내지 않는다 — 여기서 끝을 본다.
     (이것을 빠뜨려 '이겼는데 계속 싸우는' 헛턴이 돌았다) */
  if (await checkOver()) return;
  if (b.over) return;

  const n = 5 + (p.s.flow || 0) + b.drawMod + (hasBoon('draw1') ? 1 : 0);
  b.drawMod = 0;
  b.fortuneRolled = false;
  drawCards(Math.max(0, n));
  await tryFortune();
  SND.drum();
  showTurnLabel('당신의 차례');
  b.busy = false;
  syncAll();
  if (friendOn()) setTimeout(() => friendAdvise(b.turn === 1), 520);
}

/* --- 카드 사용 --- */
async function playCard(card, target) {
  const b = G.b, p = P();
  if (b.busy || b.over) return;
  const d = cdef(card), cost = ecost(card);
  if (cost === -2) { SND.err(); toast('사용할 수 없는 카드다'); return; }
  const isX = cost === -1;
  const need = isX ? 1 : cost;
  if (b.energy < need) { SND.err(); toast('기가 부족하다'); return; }
  if (d.tgt === 'enemy' && (!target || target.hp <= 0)) return;

  b.busy = true; b.sel = null; hideArrow(); clearPreview();
  const spent = isX ? b.energy : cost;
  b.energy -= spent;
  if (spent > 0) { const eb = $('#energy');
    if (eb) { eb.classList.remove('spend'); void eb.offsetWidth; eb.classList.add('spend'); } }

  const i = b.hand.findIndex(x => x.uid === card.uid);
  if (i >= 0) b.hand.splice(i, 1);
  setTint(card);                             /* 스킨을 입었다면 이 부적의 빛깔로 */
  castMotion(card, d, target);
  SND.cardPlay(d.type);
  if (d.type === 'attack') SND.slash();
  if (d.rar === 'ssc') SND.blip(1046, { dur: .5, type: 'sine', vol: .06, to: 1568, rev: .7 });

  b.curCard = card;
  if (worthBanner(card)) skillBanner(cname(card), d.rar === 'ssx');
  if (d.rar === 'ssx' || d.rar === 'unknown') {
    blink(1.3); zoomPunch(); rgbSplit();
    sparkles(innerWidth / 2, innerHeight * .5, 22, tint(GRADE[d.rar].c), 220);
    lightBeam(innerWidth / 2, FX_TINT ? rgba(shade(FX_TINT, .3), .55)
      : d.rar === 'unknown' ? 'rgba(190,140,255,.55)' : 'rgba(255,90,130,.55)', 190);
  } else if (d.rar === 'special') { blink(.7); sparkles(innerWidth / 2, innerHeight * .52, 10, tint('#ffb07a'), 150); }
  const ctx = { v: cval(card), u: card.up, t: target, card, x: spent };
  let times = 1;
  if (d.type === 'attack' && p.s.dbl) { times = 2; st(p, 'dbl', -1); }
  for (let k = 0; k < times; k++) {
    if (k > 0) await wait(180);
    try { await d.play(ctx); } catch (err) { console.error('카드 처리 오류', d.id, err); }
    await checkDeaths();
    if (b.over) break;
  }
  b.curCard = null;
  b.played++;
  chainFx(b.played);                         /* 한 턴에 이어 낼수록 소리가 올라간다 */
  fire('cardPlay', card);

  if (!b.over) {
    if (d.exhaust) exhaustCard(card); else b.discardPile.push(card);
  } else {
    b.discardPile.push(card);
  }
  syncAll();
  await wait(90);
  FX_TINT = null;                            /* 빛깔은 이 부적에서 끝난다 */
  b.busy = false;
  if (!b.over) { await checkDeaths(); syncAll(); await checkOver(); }
}

/* --- 물약 --- */
async function usePotion(idx, target) {
  const run = G.run, id = run.potions[idx];
  if (!id) return;
  const d = POTIONS[id];
  if (!G.b && !d.anywhere) { toast('전투 중에만 쓸 수 있다'); return; }
  if (G.b && (G.b.busy || G.b.over)) return;
  if (d.tgt === 'enemy' && !target) { startPotionTargeting(idx); return; }
  run.potions.splice(idx, 1);
  SND.potion();
  if (G.b) G.b.busy = true;
  try { d.use(target); } catch (e) { console.error(e); }
  fire('onPotion');
  toast(`${d.n} 사용`);
  if (G.b) { await checkDeaths(); G.b.busy = false; syncAll(); await checkOver(); }
  else { renderTop(); saveRun(); }
}

/* --- 턴 종료 → 적 턴 --- */
async function endTurn() {
  const b = G.b, p = P();
  if (b.busy || b.over) return;
  /* 안전줄 — 어떤 길로 왔든, 요괴가 하나도 안 남았으면 그것은 이긴 것이다 */
  if (!alive().length) { if (await checkOver()) return; }
  b.busy = true; b.sel = null; hideArrow(); syncAll();

  fire('turnEnd');
  /* 손에 남은 저주 */
  for (const c of b.hand.slice()) if (c.id === 'curse_grudge') { lose(2); }
  if (p.s.regen) { heal(p.s.regen); st(p, 'regen', -1); }
  if (p.s.regenP) heal(p.s.regenP);
  if (p.s.endblock) blk(p.s.endblock, true);
  if (p.s.curse) { pure(p, p.s.curse); }
  if (await checkOver()) return;

  /* 손패 버리기 */
  for (const c of b.hand.slice()) b.discardPile.push(c);
  b.hand = [];
  syncAll();
  await wait(220);
  decay(p);

  /* 적들의 행동 */
  for (const e of b.enemies) {
    if (e.hp <= 0 || e.dead || b.over) continue;
    e.turnCount++;
    e.block = 0;
    if (e.s.poison) { const d = e.s.poison; SND.poison(); pure(e, d); st(e, 'poison', -1);
      await wait(240); await checkDeaths();
      if (await checkOver()) return;         /* 독이 마지막 놈을 눕혔다면 여기서 끝난다 */
      if (e.hp <= 0 || b.over) continue; }
    if (e.s.stun) { st(e, 'stun', -1); floatText(e, '무력', 'blk'); await wait(420); decay(e); pickIntent(e); continue; }
    highlight(e, true);
    await wait(230);
    await doMove(e, e.mv);
    /* 콜로세움의 상대는 한 차례에 여러 장을 낸다 */
    for (const m2 of (e.duelExtra || [])) {
      if (!G.b || b.over || e.hp <= 0 || !P() || P().hp <= 0) break;
      await wait(180);

/* 손에 든 한 장을 저울질한다. 쓸 수 없으면 null */
function autoScore(c) {
  const b = G.b, p = P(), d = cdef(c);

  let t = c.up ? 14 : 0;

  const through = Math.max(0, incomingTotal() - p.block);
  if (typeof v.b === 'number') t += Math.min(240, v.b * (through > 0 ? 8 : 1.1));
  let target = null;
  if (typeof v.d === 'number' && foes.length) {

      if (!AUTO.on) break;
      if (!G.run || G.scene === 'title' || G.scene === 'over' || G.scene === 'win') { autoStop(); break; }
      /* 상자가 터지는 중이면 끝날 때까지 기다린다 */
      if ($('#app > .openscene')) { AUTO.lost = 0; continue; }
      /* 이야기는 읽을 틈을 두고 넘긴다 */
      const story = $('#app > .story:not(.fadeout)');
      if (story) {
        const now = Date.now();
        if (!AUTO.storyAt) AUTO.storyAt = now;
        if (now - AUTO.storyAt > 1500) { AUTO.storyAt = now; story.click(); }
        continue;
      }
      AUTO.storyAt = 0;
      const o = $('#overlay');
      if (o.style.display === 'block' && o.lastElementChild) { autoOverlay(o.lastElementChild); continue; }
      AUTO.wait = 0;
      if (G.b) {
        if (G.b.busy || G.b.over) continue;
        try { autoBattleStep(); } catch (e) { console.error('자동 플레이 오류', e); autoStop('길을 잃었다'); }
        continue;
      }
      if (G.scene === 'map') {
        /* '전투만'이면 지도에 서는 순간 손을 뗀다 — 로비에서 켜져 있을 이유가 없다 */
        if (OPT.autoScope !== 'run') { autoStop('전투가 끝났다'); break; }
        AUTO.lost = 0; AUTO.fights++; autoMapStep(); continue;
      }
      /* 어느 화면도 아닌 자리에 오래 서 있으면 스스로 지도로 돌아간다 */
      if (OPT.autoScope === 'run' && G.run) {
        AUTO.lost = (AUTO.lost || 0) + 1;
        if (AUTO.lost > 14) { AUTO.lost = 0; closeOverlay(); showMap(); }
      }
    }
  } finally { AUTO.loop = false; syncAuto(); }
}
function autoStart() {
  if (AUTO.on) return;
  if (!G.run) { toast('모험 중에만 쓸 수 있다'); return; }
  if (!autoOk()) { SND.err(); toast('자동 플레이는 제1막을 넘어선 자에게 열린다 (VIP는 곧바로)'); return; }
  if (!G.b && OPT.autoScope !== 'run') { SND.err(); toast('싸울 때만 대신해 준다 — 지도까지 맡기려면 설정에서 범위를 바꾸시오'); return; }
  AUTO.on = true; SND.ui();
  toast(OPT.autoScope === 'run' ? '자동 플레이 — 지도까지 스스로 나아간다' : '자동 플레이 — 전투를 대신한다');
  syncAuto(); autoLoop();
}

function emergencyHeal() {
  const run = G.run;
  if (!run || run.hp > EMERGENCY_HP || run.hp >= run.maxHp) return;
  if (run.gold < EMERGENCY_COST) { SND.err(); toast(`골드가 모자란다 (${EMERGENCY_COST} 필요)`); return; }
  run.gold -= EMERGENCY_COST;
  const n = run.maxHp - run.hp;
  if (G.b) heal(n); else { healRun(n); SND.heal(); }
  screenFlash('rgba(90,220,170,.28)', 460);
  FX.spark(innerWidth / 2, 90, 26, '80,220,170');
  toast(`숨을 돌렸다 — 체력을 모두 회복 (골드 ${EMERGENCY_COST})`);

  const hc = $('#healcall'); if (hc) hc.remove();

function guideTick() {
  const run = G.run;
  if (!run || G.b || AUTO.on || OPT.noGuide) return;
  if ($('#overlay') && $('#overlay').children.length) return;
  if (run._guideAct === run.act) return;          /* 이 막에서는 이미 나섰다 */
  if (run.floor > 2) return;                      /* 막 초입에서만 */
  for (const g of GUIDES) {
    if (guided(g.id)) continue;
    let ok = false; try { ok = !!g.when(run); } catch (e) { ok = false; }
    if (!ok) continue;
    markGuided(g.id);
    run._guideAct = run.act;
    if (g.soft) guideNote(g); else showGuide(g);
    return;
  }
}

/* ── 상자를 까라는 권유 ───────────────────────────────────
   뽑기가 공짜인데 모르고 안 여는 사람이 있다는 말을 들었다.
   그렇다고 자꾸 들이밀 것은 아니다 — 보스 앞에서 딱 한 번만.
   그 막에서 이미 열었으면 뜨지 않고, 한 번 닫으면 그 판 내내 잠잠하다.
   ────────────────────────────────────────────────────────── */
let _boxCallOn = false;
function boxCallHide() { const n = $('#boxcall'); if (n) n.remove(); _boxCallOn = false; }
function boxNudge() {
  const run = G.run;
  boxCallHide();
  if (!run || G.b || AUTO.on || G.scene !== 'map') return;
  if (run._boxMute || OPT.noBoxCall) return;
  if (run._boxAct === run.act) return;                 /* 이 막에서 이미 열었다 */
  if (run._boxCall === run.act) return;                /* 이 막에서 이미 권했다 */
  const rows = run.map ? run.map.nodes.reduce((a, n) => Math.max(a, n.r), 0) + 1 : 12;
  if (run.floor < rows - 3) return;                    /* 보스가 보일 때만 */
  run._boxCall = run.act;
  _boxCallOn = true;
  const n = el('div', 'boxcall',
    `<div class="bcg">匣</div>
     <div class="bct"><b>보스가 코앞이다 — 상자를 열고 가는 게 좋다</b>

     <button class="bcx" id="bc_x" title="닫기">×</button>`);
  n.id = 'boxcall';
  $('#app').appendChild(n);
  SND.blip(560, { dur: .1, type: 'triangle', vol: .06, to: 760 });
  n.querySelector('#bc_go').onclick = () => { boxCallHide(); openBoxes(); };
  n.querySelector('#bc_x').onclick = () => { run._boxMute = true; boxCallHide(); };
  setTimeout(() => { if ($('#boxcall') === n) boxCallHide(); }, 11000);
}

/* --- 손패 배치 --- */
function syncHand() {
  const b = G.b, box = $('#hand'); if (!b || !box) return;
  const have = new Set(b.hand.map(c => c.uid));
  for (const uid in cardEls) if (!have.has(+uid) && !have.has(uid)) { cardEls[uid].remove(); delete cardEls[uid]; }
  b.hand.forEach(c => {
    if (!cardEls[c.uid]) {
      const n = cardNode(c);
      n.style.transform = 'translate(320px,240px) scale(.4)';
      n.onclick = ev => { ev.stopPropagation(); onCardClick(c); };
      box.appendChild(n);
      cardEls[c.uid] = n;
    }
  });
  const n = b.hand.length, W = box.clientWidth || innerWidth;
  const spread = Math.min(150, (W - 480) / Math.max(1, n));
  const per = Math.min(3.2, 20 / Math.max(1, n));        /* 장수가 많을수록 완만하게 */
  const sc = Math.min(1, Math.max(.82, spread / 112));   /* 빽빽하면 조금 작게 */
  b.hand.forEach((c, i) => {
    const node = cardEls[c.uid]; if (!node) return;
    const mid = (n - 1) / 2, off = i - mid;
    const x = off * spread, ang = off * (n > 1 ? per : 0), y = Math.min(18, off * off * 2.6);
    const sel = b.sel && b.sel.uid === c.uid;
    node.style.zIndex = i + 1;
    node.style.transform = `translate(${x}px,${y - (sel ? 54 : 0)}px) rotate(${sel ? 0 : ang}deg) scale(${sel ? 1.08 : sc})`;
    node.classList.toggle('sel', !!sel);
    const cost = ecost(c);
    const playable = cost !== -2 && (cost === -1 ? b.energy >= 1 : b.energy >= cost);
    node.classList.toggle('unplayable', !playable);
    node.onmouseenter = () => {
      if (!b.sel) node.style.transform = `translate(${x}px,${y - 46}px) rotate(0deg) scale(1.1)`;
      showPreview(c);
    };
    node.onmouseleave = () => { clearPreview(); if (!b.sel || !sel) syncHand(); };
  });
}

/* --- 입력: 카드 선택 / 조준 --- */
function onCardClick(c) {
  const b = G.b; if (b.busy || b.over) return;
  const d = cdef(c), cost = ecost(c);
  if (cost === -2) { SND.err(); toast('사용할 수 없는 카드다'); return; }
  if (cost >= 0 && b.energy < cost) { SND.err(); toast('기가 부족하다'); return; }
  if (cost === -1 && b.energy < 1) { SND.err(); toast('기가 부족하다'); return; }
  if (b.sel && b.sel.uid === c.uid) { b.sel = null; hideArrow(); clearPreview(); syncHand(); syncEnemies(); return; }
  if (d.tgt === 'enemy') {
    const a = alive();
    if (a.length === 1) { playCard(c, a[0]); return; }
    b.sel = c; b.potSel = null; SND.select(); showArrow(); syncHand(); syncEnemies(); showPreview(c);
  } else playCard(c, null);
}
function onEnemyClick(e) {
  const b = G.b; if (!b || b.busy || b.over || e.hp <= 0) return;
  if (b.potSel != null) { const i = b.potSel; b.potSel = null; hideArrow(); syncEnemies(); usePotion(i, e); return; }
  if (b.sel) { const c = b.sel; b.sel = null; hideArrow(); clearPreview(); playCard(c, e); }
}

}
let arrowOn = false, mouseXY = { x: 0, y: 0 };

const CRIT_AT = 26;                           /* 이만큼 들어가면 '치명' */

/* ── 부적이 나가는 모션 ─────────────────────────────────
   공격은 상대에게 날아가고, 기술은 가운데서 터지고,
   심법은 내 몸으로 스며든다. 등급이 높을수록 빛이 세다.
   ────────────────────────────────────────────────────── */
function castMotion(card, d, target) {
  const cel = cardEls[card.uid];
  delete cardEls[card.uid];
  if (!cel) return;
  const gc = tint(GRADE[d.rar] ? GRADE[d.rar].c : '#ffd76a');
  const r = cel.getBoundingClientRect();
  const from = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  /* 어디로 갈 것인가 */
  let to = { x: innerWidth / 2, y: innerHeight * .34 };
  if (d.type === 'power' || (d.type === 'skill' && !target)) {
    const pe = P() && P().el;
    if (pe) { const c = centerOf(pe); to = { x: c.x, y: c.y }; }
  } else if (target && target.el) { const c = centerOf(target.el); to = { x: c.x, y: c.y }; }
  else if (d.tgt === 'all') {
    const a = alive();
    if (a.length && a[0].el) { const c = centerOf(a[Math.floor(a.length / 2)].el || a[0].el); to = { x: c.x, y: c.y }; }
  }
  const into = (d.type === 'power');
  cel.style.setProperty('--cg', gc);
  cel.style.setProperty('--mx', (to.x - from.x) * (into ? 1 : .55) + 'px');
  cel.style.setProperty('--my', (to.y - from.y) * (into ? 1 : .55) + 'px');
  cel.classList.add('cast');
  if (into) cel.classList.add('into');
  setTimeout(() => cel.remove(), into ? 520 : 480);

  if (!OPT.particles) return;
  /* 자리에 남는 잔상 */
  const g = el('div', 'castghost');
  g.style.cssText = `left:${from.x}px;top:${from.y}px;width:${r.width}px;height:${r.height}px;--cg:${gc}`;
  $('#app').appendChild(g);
  setTimeout(() => g.remove(), 520);
  /* 대상으로 흐르는 기운 */
  setTimeout(() => {
    const dx = to.x - from.x, dy = to.y - from.y;
    const len = Math.hypot(dx, dy);
    const f = el('div', 'castflow');
    f.style.cssText = `left:${from.x}px;top:${from.y}px;width:${len}px;--cg:${gc};` +
      `--a:${Math.atan2(dy, dx) * 180 / Math.PI}deg`;
    $('#app').appendChild(f);
    setTimeout(() => f.remove(), 440);
    sparkles(to.x, to.y, d.rar === 'basic' ? 3 : d.rar === 'common' ? 4 : 7, gc, 56);
  }, 190);
  FX.burst(from.x, from.y, d.rar === 'basic' ? 6 : 10, hexRgb(gc), 4, 34, 3.4);
}
/* #rrggbb → "r,g,b" */
function hexRgb(h) {

}
/* ── 스킨 빛깔이 이펙트까지 물든다 ────────────────────────

/* 밝은 쪽/어두운 쪽으로 민 빛깔 — 치명타의 속불처럼 */
function shade(hex, k) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
  if (!m) return hex || '#ffce6a';
  const f = v => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))));
  return '#' + [1, 2, 3].map(i => f(parseInt(m[i], 16)).toString(16).padStart(2, '0')).join('');
}
/* 색을 rgba() 로 — 무게(a)를 실어서 */
function rgba(hex, a) { return `rgba(${hexRgb(hex)},${a})`; }

let _lowTimer = null;

/* 처치할 때 이따금 물약이 떨어진다 */
function dropOnKill(e) {
  const run = G.run; if (!run) return;
  const big = !!(e.def.boss || e.def.elite);
  const chance = big ? .55 : .10;
  if (rnd() >= chance) return;
  if (run.potions.length >= run.potSlots) return;
  /* 좋은 물약이 나올 확률은 상대가 셀수록 높다 */
  const pool = POT_POOL.filter(id => {
    const r = POTIONS[id].rar;

  });
  const id = pickWeighted(pool.map(x => ({
    w: POTIONS[x].rar === 'common' ? 10 : POTIONS[x].rar === 'uncommon' ? (big ? 8 : 4) : (big ? 4 : 1), id: x
  }))).id;
  run.potions.push(id);
  const d = POTIONS[id];
  if (e.el) { const c = centerOf(e.el); FX.spark(c.x, c.y, 16, '120,200,180'); }
  SND.potion();
  toast(`${d.n} 을(를) 떨어뜨렸다`);
  renderTop();
}

/* ── 천운(天運) — 카드를 뽑을 때 아주 드물게 터진다 ─────────── */
const FORTUNE_CHANCE = 0.02;
async function tryFortune() {
  const b = G.b;
  if (!b || b.fortuneRolled || b.over) return false;
  b.fortuneRolled = true;                       /* 한 턴에 한 번만 굴린다 */
  if (rnd() >= FORTUNE_CHANCE) return false;
  const pool = b.drawPile.concat(b.discardPile)
    .filter(c => { const t = cdef(c).type; return t === 'skill' || t === 'power'; });
  if (!pool.length) return false;
  b.busy = true;
  skillBanner('天 運', true);
  screenFlash('radial-gradient(circle,rgba(255,255,220,.9),rgba(255,150,40,.7))', 900);
  stampWord('천 운', '#ffd76a'); blink(2); zoomPunch(); rgbSplit();
  sparkles(innerWidth / 2, innerHeight * .45, 40, '#fff2c0', 300);
  for (let i = 0; i < 5; i++)
    setTimeout(() => lightBeam(innerWidth * (.12 + i * .19), 'rgba(255,235,180,.6)', 130), i * 90);
  SND.gong(); SND.victory();
  toast(`천운! 덱의 기술 ${pool.length}장이 저절로 펼쳐진다`);
  await wait(500);
  for (const c of pool) {
    const i1 = b.drawPile.indexOf(c); if (i1 >= 0) b.drawPile.splice(i1, 1);
    const i2 = b.discardPile.indexOf(c); if (i2 >= 0) b.discardPile.splice(i2, 1);
    const d = cdef(c);
    b.curCard = c;
    try {
      const t = d.tgt === 'enemy' ? (alive()[0] || null) : null;
      if (d.tgt === 'enemy' && !t) { b.exhaustPile.push(c); continue; }
      await d.play({ v: cval(c), u: c.up, t, card: c, x: 0 });
    } catch (err) { console.error('천운 처리 오류', d.id, err); }
    b.curCard = null;
    b.exhaustPile.push(c);
    await checkDeaths();
    if (b.over) break;
    await wait(110);
  }
  FX.gold(innerWidth / 2, innerHeight / 2, 40);
  syncAll();
  b.busy = false;
  return true;
}

/* ══════════════════════════════════════════════════════════
   벗 — 다른 갈림길로 간 퇴마사
   ──────────────────────────────────────────────────────────
   같은 날 같은 산에 오른 사람이 하나 더 있었다. 이름은 단오(丹午).
   산 어귀에서 길이 갈렸고, 서로 통(通) 부적 한 장씩을 나눠 가졌다.
   부적이 통하는 동안 벗은 곁에서 훈수를 둔다 — 제3막까지.
   제6막에서 벗의 부적이 끊긴다. 그 뒤로는 벗을 찾아 오르는 이야기다.
   ══════════════════════════════════════════════════════════ */
const FRIEND = { n: '단오', g: '午', col: '#3a6a8a' };
const FRIEND_UNTIL = 3;                       /* 이 막까지 훈수를 둔다 */
const FRIEND_LOST = 6;                        /* 이 막에서 부적이 끊긴다 */
function friendOn() {
  const r = G.run;
  return !!r && !r.friendLost && r.act <= FRIEND_UNTIL;
}
/* 판을 보고 한마디 — 상황에 맞는 것 가운데 하나 */
function friendLine() {
  const b = G.b, p = P(); if (!b || !p) return null;
  const foes = alive(); if (!foes.length) return null;
  const inc = incomingTotal();
  const through = Math.max(0, inc - p.block);
  const lowHp = p.hp <= p.maxHp * .35;
  const bigHit = foes.some(e => e.mv && e.mv.d && e.mv.d * (e.mv.n || 1) >= 16);
  const canKill = foes.some(e => {
    for (const c of b.hand) { const v = cval(c) || {};
      if (typeof v.d === 'number' && calcAtk(p, e, v.d) * (v.n || 1) >= e.hp + e.block) return true; }
    return false;
  });
  const heavy = b.hand.filter(c => (ecost(c) || 0) > b.energy).length;
  const noBlock = !b.hand.some(c => { const v = cval(c) || {}; return typeof v.b === 'number' && v.b > 0; });
  const weak = p.s.weak, vuln = p.s.vuln, poison = p.s.poison;
  const C = [];
  if (canKill)      C.push('"저놈, 이번에 넘길 수 있겠는데. 마무리 먼저."');
  if (lowHp && through > 0) C.push('"막아! 이번 건 못 버텨."');
  else if (through >= p.hp * .5) C.push(`"이번에 ${through} 들어와. 방어도부터 올려."`);
  else if (bigHit)  C.push('"저 손 크다. 그냥 맞지 마."');
  if (poison)       C.push('"독 물렸어. 짧게 끝내는 게 낫겠는데."');
  if (vuln)         C.push('"취약 붙었잖아. 지금 맞으면 배로 아파."');
  if (weak)         C.push('"약화 걸렸으니 이번 턴은 때리지 말고 버텨."');
  if (heavy >= 2)   C.push('"손에 무거운 게 많네. 값싼 것부터 흘려."');
  if (noBlock && through > 0) C.push('"막을 게 없으면 먼저 때려서 수를 줄여."');
  if (b.turn === 1) C.push('"첫 턴이야. 서두르지 말고 판을 봐."');
  if (foes.length >= 3) C.push('"셋이나 되네. 넓게 치는 부적 있으면 지금."');
  if (b.energy >= 4) C.push('"기 남았어. 아끼지 말고 다 써."');
  if (!C.length) C.push('"괜찮아. 네 판이야."');
  return pick(C);
}
/* 벗이 말한다 — 전투 화면 왼쪽 아래 쪽지 */
function friendSay(text, dur) {
  const old = $('#friendsay'); if (old) old.remove();

function friendAdvise(force) {
  if (!friendOn() || !G.b || G.b.over) return;
  const b = G.b;
  if (!force && b.friendSaid && b.turn - b.friendSaid < 2) return;   /* 매 턴 떠들지 않는다 */

  b.friendSaid = b.turn;
  friendSay(t);
}

/* ══════════════════════════════════════════════════════════
   요괴 팻(獸) — 잡은 것을 데리고 다닌다
   ──────────────────────────────────────────────────────────
   · 제4막을 넘어서면 열린다.
   · 데려올 수 있는 것은 「힘이 중간쯤인」 요괴뿐이다 — 잡졸도, 보스도 안 된다.
   · 팻의 체력은 늘 주인보다 30 낮다.
   · 그 요괴가 쓰던 수를 그대로, 한 턴에 한 번 쓸 수 있다.
   · 팻이 쓰러지면 「슬픔의 원한」이 남는다 — 손은 매워지고, 상처는 더디 아문다.
   · 되살리려면 엘리트 다섯을 잡아야 한다.
   · 뽑기는 계정당 세 번. 제10막을 넘으면 다섯 번이 더 붙는다. 신중히.
   ══════════════════════════════════════════════════════════ */
const PET_ACT = 4;                            /* 이 막을 넘으면 열린다 */
const PET_PULLS_BASE = 3;
const PET_PULLS_BONUS = 5, PET_BONUS_ACT = 10;
const PET_HP_GAP = 30;                        /* 주인보다 이만큼 낮다 */
/* 팻은 거들 뿐이다 — 요괴 때의 힘에서 이만큼만 낸다.
   0.60 은 주인보다 세 보였다. 곁에서 거드는 정도로 내렸다. */
const PET_DMG = 0.35;
const PET_REVIVE_ELITES = 5;                  /* 되살리는 데 드는 엘리트 수 */
/* 힘이 중간쯤인 것들만 — 잡졸도 보스도 아니다 */
const PET_POOL = Object.keys(ENEMIES).filter(id => {
  const d = ENEMIES[id];
  if (d.boss) return false;
  const hp = (d.hp[0] + d.hp[1]) / 2;
  return hp >= 55 && hp <= 420;
});
function petsOk() { return (META.cleared || 0) >= PET_ACT; }
function petPullsTotal() { return PET_PULLS_BASE + ((META.cleared || 0) >= PET_BONUS_ACT ? PET_PULLS_BONUS : 0); }
function petPullsLeft() { return Math.max(0, petPullsTotal() - ((META.pets && META.pets.pulls) || 0)); }
function petOwned() { return Object.keys((META.pets && META.pets.own) || {}); }
function activePet() {
  const a = META.pets && META.pets.active;
  return a && META.pets.own[a] ? a : null;
}
function petAlive() { const a = activePet(); return a && !META.pets.own[a].dead; }
/* 팻 하나를 뽑는다 — 도감에 오른 것 가운데서 */
function petLoot() {
  const seen = PET_POOL.filter(id => META.dex.enemies[id]);
  const pool = (seen.length >= 4 ? seen : PET_POOL).filter(id => !META.pets.own[id]);
  const id = pool.length ? pick(pool) : pick(PET_POOL);
  const d = ENEMIES[id];
  return { id, g: d.g, n: d.n, grade: d.elite ? 'rare' : 'uncommon',
    d: `<b style="color:${d.col}">${d.elite ? '엘리트' : '요괴'} 팻</b> — 체력은 늘 주인보다 ${PET_HP_GAP} 낮다<br>` +
       `쓰는 수: ${Object.keys(d.moves).map(k => d.moves[k].label).join(' · ')}`,
    take: () => gainPet(id, true) };
}
function gainPet(id, silent) {
  META.pets.own[id] = { dead: false, need: 0, at: Date.now() };
  if (!META.pets.active) META.pets.active = id;
  saveMeta();
  if (!silent) { SND.unlock(); toast(`팻 — ${ENEMIES[id].n}`); }
  return true;
}
function setPet(id) {
  if (id && !META.pets.own[id]) return false;
  META.pets.active = id || null; saveMeta(); return true;
}
/* ── 전투 안에서의 팻 ─────────────────────────────────────── */
function makePet() {
  const id = activePet();
  if (!id || !petAlive() || !G.run) return null;
  const d = ENEMIES[id];
  const mx = Math.max(10, G.run.maxHp - PET_HP_GAP);
  return { id, def: d, n: d.n, g: d.g, col: d.col, isPet: true,
    hp: mx, maxHp: mx, block: 0, s: {}, el: null, used: false };
}
function PET() { return G.b && G.b.pet && G.b.pet.hp > 0 ? G.b.pet : null; }
/* 주인이 맞으면 팻도 그만큼 나눠 맞는다 */
function petShare(dmg) {
  const pt = PET(); if (!pt || dmg <= 0) return;
  const d = Math.max(1, Math.round(dmg * .25));
  pt.hp = Math.max(0, pt.hp - d);
  if (pt.el) { pt.el.classList.remove('hurt'); void pt.el.offsetWidth; pt.el.classList.add('hurt'); }
  floatText(pt, '-' + d, '');
  if (pt.hp <= 0) petFalls();
  syncPet();
}
function petFalls() {
  const pt = G.b && G.b.pet; if (!pt || pt.fell) return;
  pt.fell = true;
  META.pets.own[pt.id].dead = true;
  META.pets.own[pt.id].need = PET_REVIVE_ELITES;
  saveMeta();
  if (pt.el) { pt.el.classList.add('petdead'); }
  /* 슬픔의 원한 — 이 모험이 끝날 때까지 남는다 */
  G.run.sorrow = (G.run.sorrow || 0) + 1;
  SND.lose(); shake(true); screenFlash('rgba(120,20,40,.45)', 900);
  stampWord('슬 픔', '#c8324a');
  flash(`${pt.n}이(가) 쓰러졌다 — 슬픔의 원한`);
  syncAll();
}
/* 엘리트를 잡을 때마다 되살아날 날이 가까워진다 */
function petEliteTick() {
  const id = activePet(); if (!id) return;
  const rec = META.pets.own[id];
  if (!rec || !rec.dead) return;
  rec.need = Math.max(0, (rec.need || 0) - 1);
  if (rec.need <= 0) {
    rec.dead = false; rec.need = 0; saveMeta();
    SND.unlock(); screenFlash('rgba(255,220,150,.4)', 700);
    flash(`${ENEMIES[id].n}이(가) 되살아났다`);
    if (G.b && !G.b.pet) { G.b.pet = makePet(); buildPet(); syncPet(); }
  } else { saveMeta(); toast(`${ENEMIES[id].n} 되살리기까지 엘리트 ${rec.need}`); }
}
/* 슬픔의 원한 — 손은 매워지고 상처는 더디 아문다 */
function sorrowAtk() { return 1 + Math.min(.75, (G.run && G.run.sorrow || 0) * .25); }
function sorrowHeal() { return (G.run && G.run.sorrow) ? .5 : 1; }
/* 팻의 수 하나를 쓴다 */
async function petUse(key) {
  const b = G.b, pt = PET();
  if (!b || b.busy || b.over || !pt || pt.used) return;
  const m = pt.def.moves[key]; if (!m) return;
  pt.used = true; b.busy = true; syncAll();
  const foes = alive();
  const t = foes.length ? foes.slice().sort((a, z) => a.hp - z.hp)[0] : null;
  floatText(pt, m.label, 'blk');
  SND.charge();
  await wait(180);
  if (m.d && t) {
    for (let i = 0; i < (m.n || 1); i++) {
      if (!G.b || b.over) break;
      const a2 = alive(); if (!a2.length) break;
      const tt = a2.indexOf(t) >= 0 ? t : a2[0];
      const dmg = Math.max(1, Math.round(calcAtk(pt, tt, m.d) * PET_DMG));
      const r = applyDamage(tt, dmg);
      impact(m.fx || 'claw', tt);
      hitFx(tt, r.hp, r.blocked, true);
      await wait(m.n > 1 ? 170 : 130);
    }
  }
  if (m.blk) { blk(Math.round(m.blk * PET_DMG)); }
  if (m.self) for (const k in m.self) st(P(), k, Math.max(1, Math.round(m.self[k] * PET_DMG)));
  if (m.deb) for (const e of alive()) for (const k in m.deb) st(e, k, Math.max(1, Math.round(m.deb[k] * PET_DMG)));
  if (m.heal) { heal(Math.round(m.heal * PET_DMG)); }
  syncAll();
  await checkDeaths();
  b.busy = false; syncAll();
  await checkOver();
}
function buildPet() {
  const pt = G.b && G.b.pet; if (!pt) return;
  const side = $('#pside'); if (!side) return;
  const u = el('div', 'unit petunit');
  u.innerHTML = `<div class="body" style="--pc:${pt.col}">
      <span class="glyph">${pt.g}</span><div class="blockbadge hide"></div></div>
    <div class="nm">${pt.n} <em>팻</em></div>
    <div class="ebar pet"><i></i><b></b></div>`;
  side.appendChild(u);
  pt.el = u;
}
function syncPet() {
  const pt = G.b && G.b.pet; if (!pt || !pt.el) return;
  const bar = pt.el.querySelector('.ebar');
  bar.querySelector('i').style.width = Math.max(0, pt.hp / pt.maxHp * 100) + '%';
  bar.querySelector('b').textContent = pt.hp + ' / ' + pt.maxHp;
  pt.el.classList.toggle('petdead', pt.hp <= 0);
  const btn = $('#petbtn');
  if (btn) {
    const can = pt.hp > 0 && !pt.used && !G.b.busy && !G.b.over;
    btn.className = can ? 'ready' : pt.hp <= 0 ? 'none' : 'used';
    btn.disabled = !can;
    btn.querySelector('b').textContent = pt.g;
    btn.querySelector('small').textContent = pt.hp > 0 ? (pt.used ? '이번 턴 씀' : pt.n) : '쓰러졌다';
    btn.style.setProperty('--sc', pt.col);
  }
}

/* ── 비기 ────────────────────────────────────────────────── */
function syncSkill() {
  const btn = $('#skillbtn'); if (!btn || !G.b) return;
  const id = G.run.skill, d = id && SKILLS[id];
  btn.querySelector('b').textContent = d ? d.g : '—';
  btn.querySelector('small').textContent = d ? d.n : '비기 없음';
  btn.className = (d ? 'sg-' + d.rar + ' ' : '') + (!d ? 'none' : G.b.skillUsed ? 'used' : 'ready');
  btn.style.setProperty('--sc', d ? GRADE[d.rar].c : '#7d7568');
  btn.disabled = !d || G.b.skillUsed || G.b.busy || G.b.over;
  btn.onmouseenter = () => {
    const r = btn.getBoundingClientRect();
    tipShow(d ? `<b>${d.n}</b> · <span style="color:${GRADE[d.rar].c}">${GRADE[d.rar].n} 비기</span><br>${d.d}
      <br><span style="color:#9a8d74">기를 쓰지 않는다 · 전투당 한 번</span>${G.b.skillUsed ? '<br><b>이미 썼다</b>' : ''}`
      : '<b>비기가 없다</b><br>보스를 잡거나 비기 상자에서 얻는다', r.left + r.width / 2, r.top);
  };
  btn.onmouseleave = tipHide;
}
/* ── 비기가 나갈 때의 연출 ────────────────────────────────
   기를 쓰지 않는 한 수다. 나갈 때만은 화면을 통째로 쓴다.
   등급이 높을수록 오래 끌고, 빛이 세고, 음악이 더 깊이 눕는다.
   ────────────────────────────────────────────────────── */
function skillAura(d) {
  const c = GRADE[d.rar] ? GRADE[d.rar].c : '#ffd76a';
  const hi = d.rar === 'unknown' ? 4 : d.rar === 'ssx' ? 3 : d.rar === 'ssc' ? 2 : d.rar === 'special' ? 1 : 0;
  const n = el('div', 'skaura g' + hi);
  n.style.setProperty('--ac', c);
  n.innerHTML = `<i class="ring"></i><i class="ring r2"></i><i class="ring r3"></i>
    <div class="glyphbig">${d.g}</div>
    <div class="skname">${d.n}</div>
    ${[...Array(10 + hi * 4)].map((_, i) =>
      `<b class="ray" style="--a:${(360 / (10 + hi * 4)) * i}deg;animation-delay:${i * .018}s"></b>`).join('')}`;
  $('#app').appendChild(n);
  setTimeout(() => n.remove(), 1300 + hi * 200);
  if (!OPT.particles) return;
  sparkles(innerWidth / 2, innerHeight * .46, 14 + hi * 6, c, 130 + hi * 40);
  FX.burst(innerWidth / 2, innerHeight * .46, 18 + hi * 8, hexRgb(c), 6, 54, 5);
  lightBeam(innerWidth * .5, rgba(c, .5), 150 + hi * 40);
  if (hi >= 1) setTimeout(() => lightBeam(innerWidth * .3, rgba(c, .38), 130), 90);
  if (hi >= 2) setTimeout(() => lightBeam(innerWidth * .7, rgba(c, .38), 130), 160);
}
async function useSkill() {
  const b = G.b; if (!b || b.busy || b.over || b.skillUsed) return;
  const id = G.run.skill, d = id && SKILLS[id];
  if (!d) { SND.err(); toast('장착한 비기가 없다'); return; }
  b.skillUsed = true; b.busy = true; b.sel = null; hideArrow(); clearPreview(); syncAll();
  const hi = d.rar === 'unknown' ? 4 : d.rar === 'ssx' ? 3 : d.rar === 'ssc' ? 2 : d.rar === 'special' ? 1 : 0;
  /* 단추에서 기운이 솟는다 */
  const btn = $('#skillbtn');
  if (btn) { btn.classList.remove('fire'); void btn.offsetWidth; btn.classList.add('fire');
    const r = btn.getBoundingClientRect();
    FX.burst(r.left + r.width / 2, r.top + r.height / 2, 12 + hi * 4, hexRgb(GRADE[d.rar].c), 5, 46, 4); }
  SND.skillSting(d.rar);
  skillAura(d);
  blink(1 + hi * .25); zoomPunch();
  if (hi >= 2) { rgbSplit(); rushVignette(rgba(GRADE[d.rar].c, .3)); }
  hitstop(hi >= 2);
  await wait(hi >= 2 ? 420 : 300);
  try { await d.use(); } catch (e) { console.error('비기 오류', id, e); }
  await checkDeaths();
  b.busy = false; syncAll();
  await checkOver();
}
/* 이번 턴 적들에게 받을 피해 합계 */
function incomingTotal() {
  if (!G.b) return 0;
  let t = 0;
  for (const e of alive()) {
    if (e.s.stun || !e.mv || !e.mv.d) continue;
    t += calcAtk(e, P(), e.mv.d) * (e.mv.n || 1);
  }
  if (G.b.halved) t = Math.ceil(t / 2);
  return t;
}
function syncIncoming() {
  const p = P(); if (!p || !p.el) return;
  let box = p.el.querySelector('.incoming');
  const total = incomingTotal();
  if (!total) { if (box) box.remove(); return; }
  if (!box) { box = el('div', 'incoming'); p.el.querySelector('.body').appendChild(box); }
  const through = Math.max(0, total - p.block);
  box.className = 'incoming' + (through === 0 ? ' safe' : '');
  box.innerHTML = through === 0
    ? `막아냄 <b>${total}</b>`
    : `받을 피해 <b>${through}</b>` + (p.block ? ` <span style="opacity:.6">(${total}−${p.block})</span>` : '');
}

/* ── 예상치 미리보기 ─────────────────────────────────────────
   손패의 부적에 마우스를 올리면 그 부적이 실제로 낼 수치를
   힘·검기·약화·취약까지 계산해서 적 머리 위에 띄운다. */

/* ══════════════════════════════════════════════════════════
   9. 지도 생성 — 갈라지는 등산로 (간선이 교차하지 않는다)
   ══════════════════════════════════════════════════════════ */
const MAP_W = 5, MAP_H = 12, MAP_PATHS = 6;
/* ══════════════════════════════════════════════════════════
   지도 — 왼쪽에서 오른쪽으로 걸어 오르는 산길
   ──────────────────────────────────────────────────────────
   여섯 갈래가 얽혔다 풀리며 보스까지 간다. 세로로 세우면
   열두 층이 화면 높이에 눌리므로, 눕혀서 넓은 쪽을 쓴다.
   ══════════════════════════════════════════════════════════ */
const TREASURE_ROW = 5;                     /* 이 층은 반드시 보물 */
const REST_ROW = MAP_H - 1;                 /* 보스 직전은 반드시 야영지 */
function genMap(act) {
  const nodes = [], grid = {};
  const key = (r, c) => r + '_' + c;
  const getNode = (r, c) => {
    if (!grid[key(r, c)]) { const n = { id: nodes.length, r, c, type: null, next: [], prev: [] }; grid[key(r, c)] = n; nodes.push(n); }
    return grid[key(r, c)];
  };
  const edges = [];
  const crosses = (r, from, to) => edges.some(e => e.r === r && (e.a - from) * (e.b - to) < 0);
  for (let p = 0; p < MAP_PATHS; p++) {
    let c = ri(0, MAP_W - 1);
    if (p === 1) { let g = 0; while (c === nodes[0].c && g++ < 20) c = ri(0, MAP_W - 1); }
    let cur = getNode(0, c);
    for (let r = 0; r < MAP_H - 1; r++) {
      let cand = [cur.c - 1, cur.c, cur.c + 1].filter(x => x >= 0 && x < MAP_W && !crosses(r, cur.c, x));
      if (!cand.length) cand = [cur.c];
      const nc = pick(cand);
      const nx = getNode(r + 1, nc);
      if (cur.next.indexOf(nx.id) < 0) { cur.next.push(nx.id); nx.prev.push(cur.id); edges.push({ r, a: cur.c, b: nc }); }
      cur = nx;
    }
  }
  /* 보스 */
  const boss = { id: nodes.length, r: MAP_H, c: (MAP_W - 1) / 2, type: 'boss', next: [], prev: [] };
  nodes.push(boss);
  for (const n of nodes) if (n.r === MAP_H - 1) { n.next.push(boss.id); boss.prev.push(n.id); }

  /* ── 종류 배정 ──────────────────────────────────────────
     야영지가 너무 흔하다는 말을 들었다. 무게를 절반 아래로 줄이고,
     한 막에 놓을 수 있는 수 자체에 뚜껑을 씌운다.
     게다가 바로 앞뒤 층에 야영지가 있으면 다시 놓지 않는다.
     ────────────────────────────────────────────────────── */
  const REST_CAP = 2;                        /* 보스 앞 야영지를 빼고 이만큼만 */
  let rests = 0;
  const restNear = n => nodes.some(o => o.type === 'rest' && Math.abs(o.r - n.r) <= 1);
  const ordered = nodes.slice().sort((a, b) => a.r - b.r || a.c - b.c);
  for (const n of ordered) {
    if (n.type) continue;
    if (n.r === 0) { n.type = 'battle'; continue; }
    if (n.r === TREASURE_ROW) { n.type = 'treasure'; continue; }
    if (n.r === REST_ROW) {
      /* 보스 직전에는 반드시 쉴 자리가 있어야 한다. 다만 줄 전체를
         야영지로 채우면 야영지가 흔해 보인다 — 절반만 야영지로 둔다. */
      const already = nodes.filter(o => o.r === REST_ROW && o.type === 'rest').length;
      n.type = (already === 0 || (already < 2 && rnd() < .5)) ? 'rest'
             : (rnd() < .3 ? 'shop' : 'treasure');
      continue;
    }
    const w = [{ w: 64, t: 'battle' }, { w: 12, t: 'event' }, { w: 5, t: 'shop' }];
    if (n.r >= 4 && rests < REST_CAP && !restNear(n)) w.push({ w: 6, t: 'rest' });
    if (n.r >= 4 && n.r !== MAP_H - 2) w.push({ w: 15 + act * 3, t: 'elite' });
    if (n.r >= 7) w.push({ w: 4, t: 'treasure' });
    n.type = pickWeighted(w).t;
    if (n.type === 'rest') rests++;

  const m = { nodes, act };
  mapLayout(m);

}
/* 좌표를 매긴다 — 눕힌 산길 */
function mapLayout(m) {
  if (!m || !m.nodes) return m;
  const STEP = 92, LANE = 100, PAD_L = 96, PAD_R = 116;
  const maxR = m.nodes.reduce((a, n) => Math.max(a, n.r), 0);
  m.w = PAD_L + maxR * STEP + PAD_R;
  m.h = (MAP_W - 1) * LANE + 208;
  m.cols = maxR + 1;
  const midY = m.h / 2 - 12;
  for (const n of m.nodes) {
    const jitter = n.type === 'boss' ? 0 : ((n.id * 37) % 18) - 9;
    n.x = PAD_L + n.r * STEP;
    n.y = midY + (n.c - (MAP_W - 1) / 2) * LANE + jitter - n.r * 3.4;
    /* 오를수록 길이 조금씩 높아진다 — 산을 타는 맛 */
    if (n.type === 'boss') { n.x = PAD_L + maxR * STEP; n.y = midY - maxR * 3.4; }
    if (!n.prev) n.prev = [];
  }
  /* 옛 저장에 prev 가 없을 수 있다 — 여기서 다시 잇는다 */
  if (m.nodes.some(n => !n.prev.length && n.r > 0)) {
    for (const n of m.nodes) n.prev = [];
    for (const n of m.nodes) for (const t of n.next) if (m.nodes[t]) m.nodes[t].prev.push(n.id);
  }
  return m;
}

  const m = run.map;

  if (m.nodes) { mapLayout(m); return; }
  const fresh = genMap(run.act || 1);

  run.mapCur = -1; run.mapDone = [];

}

function modal(html, cls) {

/* ── 창이 붙들고 있던 약속을 풀어 준다 ─────────────────────
   고르는 창은 Promise 를 쥐고 기다린다. Esc 로 그냥 지워 버리면
   기다리던 쪽이 영영 깨어나지 못해 아무것도 못 하게 된다.
   창을 없앨 때는 반드시 이 고리를 거쳐 약속부터 푼다.
   ────────────────────────────────────────────────────────── */
function disposePanel(p) {
  if (!p || !p._esc) return;
  const f = p._esc; p._esc = null;
  try { f(); } catch (e) { console.error('창 정리 오류', e); }
}
function closeTop() {
  const o = $('#overlay');
  const p = o.lastElementChild;
  if (p) { disposePanel(p); p.remove(); }
  if (!o.children.length) o.style.display = 'none';
}
/* 자기 자신만 닫는다 — 창이 겹쳤을 때 남의 화면을 지우지 않는다.
   (고르는 창이 두 번 닫히면서 아래 보상 화면까지 사라지던 문제를 막는다) */
function closePanel(p) {
  const o = $('#overlay');
  if (p && p.parentNode === o) { disposePanel(p); p.remove(); }
  if (!o.children.length) o.style.display = 'none';
}
function closeOverlay() {
  const o = $('#overlay');
  [...o.children].forEach(disposePanel);
  o.style.display = 'none'; o.innerHTML = '';
}

function showCardList(list, title, shuffled) {

    <div class="cardgrid"></div><button class="brush-btn" id="cl_close">닫기</button>`);
  const g = p.querySelector('.cardgrid');
  const arr = shuffled ? shuffle(list.slice()) : list.slice();
  if (!arr.length) g.innerHTML = '<div style="color:#c8bda3">비어 있다</div>';
  for (const c of arr) g.appendChild(cardNode(c));
  p.querySelector('#cl_close').onclick = closeTop;
}
/* --- 덱에서 카드 고르기 (Promise) --- */
function pickFromList(list, title, opts) {
  opts = opts || {};
  return new Promise(res => {
    const p = modal(`<h2>${title}</h2>${opts.hint ? `<div class="hint">${opts.hint}</div>` : ''}
      <div class="cardgrid"></div>${opts.cancel ? '<button class="brush-btn ghost" id="pk_cancel" style="color:#e9dfc9;border-color:#8a7f68">그만두기</button>' : ''}`);
    p._esc = () => res(null);                 /* Esc 로 닫혀도 기다리는 쪽을 깨운다 */
    const g = p.querySelector('.cardgrid');
    if (!list.length) g.innerHTML = '<div style="color:#c8bda3">고를 카드가 없다</div>';
    for (const c of list) {
      const n = cardNode(c); n.classList.add('pick');
      n.onclick = () => { p._esc = null; closePanel(p); SND.ui(); res(c); };
      g.appendChild(n);
    }
    const cb = p.querySelector('#pk_cancel');
    if (cb) cb.onclick = () => { p._esc = null; closePanel(p); res(null); };
  });
}
function chooseCards(list, n, title) {
  return pickFromList(list, title).then(c => c ? [c] : []);
}
