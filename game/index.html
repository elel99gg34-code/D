  vip: { owned: false, at: 0, freeBoxAt: 0 }, skins: { own: {}, eq: {} },
  dex: { cards: {}, relics: {}, enemies: {}, skills: {} } };
/* VIP · 자동 플레이 개방 여부 */
const VIP_FREEBOX_MS = 30 * 24 * 3600 * 1000;          /* 한 달에 한 번 */
function vipOn() { return !!(META.vip && META.vip.owned); }
function autoOk() { return !!META.autoUnlocked || vipOn(); }
function vipFreeBoxLeft() { return Math.max(0, VIP_FREEBOX_MS - (Date.now() - (META.vip.freeBoxAt || 0))); }
/* --- 설정 (기본값) --- */
const OPT_DEF = {
  vol: .85,                 /* 음량 */
  shake: true,              /* 화면 흔들림 */
  particles: true,          /* 먹물 파편 */
  tips: true,               /* 설명 풍선 */
  banner: true,             /* 큰 기술 이름 연출 */
  autoScope: 'battle',      /* battle = 전투만 · run = 지도까지 스스로 나아간다 */
  autoPace: 'normal',       /* slow · normal · fast */
  autoPotion: true,         /* 위급할 때 물약을 쓴다 */
  autoSkill: true,          /* 비기를 알아서 쓴다 */
  turbo: false              /* VIP 2배속 */
};
let OPT = Object.assign({}, OPT_DEF);
function loadMeta() { try { const m = JSON.parse(localStorage.getItem(META_KEY)); if (m) META = Object.assign(META, m); } catch (e) {}
  SPEED = META.speed || 1;
  if (META.sound === false) SND.on = false;
  META.opt = Object.assign({}, OPT_DEF, META.opt || {});
  OPT = META.opt;
  META.vip = Object.assign({ owned: false, at: 0, freeBoxAt: 0 }, META.vip || {});
  META.skins = Object.assign({ own: {}, eq: {} }, META.skins || {});
  META.skins.own = META.skins.own || {}; META.skins.eq = META.skins.eq || {};
  META.autoUnlocked = !!META.autoUnlocked;
  META.dex = META.dex || { cards: {}, relics: {}, enemies: {} };
  META.dex.cards = META.dex.cards || {}; META.dex.relics = META.dex.relics || {};
  META.dex.enemies = META.dex.enemies || {}; META.dex.skills = META.dex.skills || {}; }
function applyVol() { try { if (SND.master) SND.master.gain.value = OPT.vol; } catch (e) {} }
function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch (e) {} }
function saveRun() {
  if (!G.run) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} return; }
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ run: G.run, cp: G.cp })); } catch (e) {}
}
/* 갈림길에 들어서기 직전의 상태를 떠 둔다. 쓰러지면 여기로 돌아온다. */
function markCheckpoint() { try { G.cp = JSON.stringify(G.run); } catch (e) { G.cp = null; } }
/* 저장된 모험 객체를 현재 모험으로 받아들인다 (카드 고유번호 충돌 방지 포함) */
function adoptRun(obj) {
  G.run = obj;
  let mx = 0;
  for (const c of G.run.deck) mx = Math.max(mx, c.uid || 0);
  _uid = mx + 1;
  G.run.stats = G.run.stats || { battles: 0, elites: 0, cards: 0, gold: 0, floors: 0, revives: 0 };
  if (G.run.stats.revives == null) G.run.stats.revives = 0;
  if (G.run.dia == null) G.run.dia = 0;
  if (G.run.summons == null) G.run.summons = 0;
  if (G.run.banner == null) G.run.banner = 3;
  if (!G.run.skills) { G.run.skills = []; gainSkill('shout', true); }
  if (!G.run.arena) G.run.arena = { best: 0, cleared: 0 };
  if (!G.run.boons) G.run.boons = [];
  if (G.run.curse === undefined) G.run.curse = null;
  G.run.inBattle = false;
}
/* ── 도감: 모험을 넘어서 남는 기록 ───────────────────────── */
function dexAdd(kind, id) {
  if (!META.dex[kind][id]) { META.dex[kind][id] = 1; saveMeta(); return true; }
  return false;
}
function dexCount(kind, total) { return Object.keys(META.dex[kind]).length + ' / ' + total; }
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* ---------- 카드 인스턴스/조회 ---------- */
let _uid = 1;
function mkCard(id, up) { return { uid: _uid++, id, up: !!up }; }
function cdef(c) { return CARDS[c.id]; }
function cval(c) { return cdef(c).v(c.up); }
function ccost(c) {
  const d = cdef(c);
  const k = d.costOf ? d.costOf(c.up) : d.cost;
  if (k > 0 && curseTag('costup')) return k + 1;               /* 저주 — 무겁다 */
  return k;
}
/* 실제로 치르는 값 — 무념무상 같은 효과를 반영한다 */
function ecost(c) { const k = ccost(c); return (G.b && G.b.freeTurn && k > 0) ? 0 : k; }
function cname(c) { return cdef(c).n + (c.up ? '+' : ''); }
/* 등급 — 4등급이 가장 낮고 ?급이 가장 높다. ?급은 아직 어디에도 없다. */
const GRADE = {
  basic:    { n: '4등급', s: '4', c: '#7d7568', desc: '흔한 기본 부적' },
  common:   { n: '3등급', s: '3', c: '#3f7346', desc: '쓸 만한 부적' },
  uncommon: { n: '2등급', s: '2', c: '#2f6d8f', desc: '드문 부적' },
  rare:     { n: '1등급', s: '1', c: '#b8912f', desc: '귀한 부적' },
  special:  { n: 'S급',   s: 'S', c: '#e2622a', desc: '특별 상자에서만 나오는 불타는 부적' },
  ssx:      { n: 'SSX급', s: 'SSX', c: '#ff2d55', desc: '전설로만 전하는 금단의 부적' },
  unknown:  { n: '?급',   s: '?', c: '#7b4bd8', desc: '전해지지 않는 등급. 특대급 상자에서 0.1% 확률로만 모습을 드러낸다.' },
  curse:    { n: '저주',  s: '呪', c: '#5b3b6b', desc: '덱을 좀먹는다' }
};
const GRADE_ORDER = ['basic', 'common', 'uncommon', 'rare', 'special', 'ssx', 'unknown'];
const RARITY_NAME = {};
for (const k in GRADE) RARITY_NAME[k] = GRADE[k].n;
const auraClass = rar => rar === 'ssx' ? ' g-ssx' : rar === 'special' ? ' g-s' : rar === 'unknown' ? ' g-unknown' : '';
const TYPE_NAME = { attack: '공격', skill: '기술', power: '심법', curse: '저주' };
/* 보상 풀 */
const POOL = { common: [], uncommon: [], rare: [] };
const SPECIAL_CARDS = [];                    /* 상자에서 나오는 것 전부 */
const GRADE_POOL = { special: [], ssx: [], unknown: [] };
for (const k in CARDS) {
  const c = CARDS[k];
  if (POOL[c.rar]) POOL[c.rar].push(k);
  else if (GRADE_POOL[c.rar]) { GRADE_POOL[c.rar].push(k); if (c.rar !== 'unknown') SPECIAL_CARDS.push(k); }
}
function randomCard(rarWeights) {
  const r = pickWeighted(rarWeights).r;
  return pick(POOL[r]);
}
/* ── 등급 해금 ──────────────────────────────────────────────
   기본(4등급) 부적은 보상에서 절대 나오지 않는다.
   처음에는 3등급만 나오고, 산을 오를수록 2등급 → 1등급이 열린다.
   엘리트·보스는 한 등급 더 위까지 미리 내준다. */
const UNLOCK = [
  { at: 0,  r: 'common',   n: '3등급' },
  { at: 7,  r: 'uncommon', n: '2등급' },
  { at: 18, r: 'rare',     n: '1등급' }
];
const ACT_SPAN = 12;
function progress() { const r = G.run; return r ? (r.act - 1) * ACT_SPAN + r.floor : 0; }
function unlockedGrades(boost) {
  const p = progress();
  let list = UNLOCK.filter(u => p >= u.at).map(u => u.r);
  if (!list.length) list = ['common'];
  if (boost === 'elite' || boost === 'boss') {           /* 엘리트·보스는 한 단계 앞서 준다 */
    const nextIdx = UNLOCK.findIndex(u => list.indexOf(u.r) < 0);
    if (nextIdx >= 0) list = list.concat(UNLOCK[nextIdx].r);
  }
  return list;
}
function gradeWeights(boost) {
  const un = unlockedGrades(boost);
  const base = boost === 'boss' ? { common: 10, uncommon: 55, rare: 45 }
             : boost === 'elite' ? { common: 40, uncommon: 42, rare: 20 }
             : { common: 62, uncommon: 33, rare: 9 };
  const w = un.map(r => ({ w: base[r], r })).filter(x => x.w > 0);
  return w.length ? w : [{ w: 1, r: un[0] }];
}
/* 다음에 열릴 등급까지 남은 층수 (안내용) */
function nextUnlock() {
  const p = progress();
  const u = UNLOCK.find(x => p < x.at);
  return u ? { n: u.n, left: u.at - p } : null;
}
function checkUnlockToast() {
  const p = progress();
  G.run.unlocked = G.run.unlocked || [];
  for (const u of UNLOCK) {
    if (p >= u.at && u.at > 0 && G.run.unlocked.indexOf(u.r) < 0) {
      G.run.unlocked.push(u.r);
      flash(`${u.n} 부적 해금`);
      toast(`이제 전투 보상에 ${u.n} 부적이 나온다`);
    }
  }
}
function rewardCards(n, boost) {
  const w = gradeWeights(boost);
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    const id = randomCard(w);
    if (out.some(c => c.id === id)) continue;
    out.push(mkCard(id, false));
  }
  return out;
}

const RELIC_POOL = { common: [], uncommon: [], rare: [], boss: [], fused: [] };
for (const k in RELICS) RELIC_POOL[RELICS[k].rar].push(k);
/* 합성 결과물은 무작위로 나오지 않는다 */
function fusionFor(ids) {
  const set = new Set(ids);
  return FUSIONS.filter(f => set.has(f.a) && set.has(f.b));
}
function canFuse() { return G.run ? fusionFor(G.run.relics.map(r => r.id)) : []; }
function doFuse(f) {
  const run = G.run;
  run.relics = run.relics.filter(r => r.id !== f.a && r.id !== f.b);
  const r = { id: f.to, used: false, isNew: true };
  run.relics.push(r);
  const d = RELICS[f.to];
  if (d.h && d.h.onGain) d.h.onGain(r);
  dexAdd('relics', f.to);
  SND.gong(); SND.power();
  flash(d.n);
  saveRun(); renderTop();
}

function fire(hook, ...args) {
  if (!G.run) return;
  const half = curseTag('relichalf');
  for (const r of G.run.relics) {
    const d = RELICS[r.id]; if (!d.h || !d.h[hook]) continue;
    if (half) { r.skip = !r.skip; if (r.skip) continue; }   /* 저주 — 한 번 걸러 한 번만 듣는다 */
    d.h[hook](r, ...args);
  }
}
function pipe(hook, val, ...args) {
  if (!G.run) return val;
  const half = curseTag('relichalf');
  for (const r of G.run.relics) {
    const d = RELICS[r.id]; if (!d.h || !d.h[hook]) continue;
    const out = d.h[hook](r, val, ...args);
    val = (half && typeof out === 'number' && typeof val === 'number') ? val + (out - val) * .5 : out;
  }
  return typeof val === 'number' ? Math.round(val) : val;
}
function hasRelic(id) { return G.run && G.run.relics.some(r => r.id === id); }
function gainRelic(id, silent) {
  if (hasRelic(id)) return false;
  if (G.run.relics.length >= RELIC_SLOTS) { relicOverflow(id); return true; }
  const r = { id: id, used: false, isNew: true };
  G.run.relics.push(r);
  const d = RELICS[id];
  dexAdd('relics', id);
  if (d.h && d.h.onGain) d.h.onGain(r);
  if (!silent) { SND.power(); toast(`유물 획득 — ${d.n}`); }
  return true;
}
/* 자리가 꽉 찼을 때 — 무엇을 버릴지 고르게 한다.
   지금 떠 있는 창(보상·상점 등)이 닫히거나 다시 그려진 뒤에 띄워야
   그 과정에서 창이 지워지지 않는다. */
function relicOverflow(newId) { setTimeout(() => showRelicOverflow(newId), 90); }
function showRelicOverflow(newId) {
  const run = G.run, d = RELICS[newId];
  if (run.relics.length < RELIC_SLOTS) {           /* 그 사이 자리가 났다면 그냥 준다 */
    const r = { id: newId, used: false, isNew: true };
    run.relics.push(r);
    if (d.h && d.h.onGain) d.h.onGain(r);
    dexAdd('relics', newId); SND.power(); toast(`유물 획득 — ${d.n}`);
    renderTop(); saveRun(); return;
  }
  const p = modal(`<h2>유물 자리가 없다</h2>
    <div class="hint">유물은 ${RELIC_SLOTS}개까지만 지닐 수 있다 · 하나를 버리거나, 새 유물을 포기한다</div>
    <div class="relicgrid" id="ro_old"></div>
    <div class="hint" style="margin-top:6px">새로 얻은 것</div>
    <div class="relicgrid" id="ro_new"></div>`);
  const mk = (id, box, isNew) => {
    const rd = RELICS[id];
    const n = el('div', 'rtile g-' + rgrade(id) + (isNew ? ' fresh' : ''),
      `<b>${rd.g}</b><span>${rd.n}</span>`);
    bindTip(n, () => `<b>${rd.n}</b> · ${GRADE[rgrade(id)].n}<br>${rd.d}`);
    n.onclick = () => {
      if (isNew) { toast(`${d.n}을 두고 간다`); closeTop(); return; }
      run.relics = run.relics.filter(x => x.id !== id);
      const r = { id: newId, used: false, isNew: true };
      run.relics.push(r);
      if (RELICS[newId].h && RELICS[newId].h.onGain) RELICS[newId].h.onGain(r);
      dexAdd('relics', newId);
      SND.power(); toast(`${rd.n}을 버리고 ${d.n}을 얻었다`);
      closeTop(); renderTop(); saveRun();
    };
    box.appendChild(n);
  };
  for (const r of run.relics) mk(r.id, p.querySelector('#ro_old'), false);
  mk(newId, p.querySelector('#ro_new'), true);
}
function randomRelic(rar) {
  const owned = new Set(G.run.relics.map(r => r.id));
  let pools = rar ? [rar] : ['common', 'common', 'common', 'uncommon', 'uncommon', 'rare'];
  pools = pools.filter(p => p !== 'fused');
  const cand = [];
  for (const p of pools) for (const id of RELIC_POOL[p]) if (!owned.has(id)) cand.push(id);
  return cand.length ? pick(cand) : null;
}

const SKILL_POOL = { basic: [], common: [], uncommon: [], rare: [], special: [], ssx: [], unknown: [] };
for (const k in SKILLS) SKILL_POOL[SKILLS[k].rar].push(k);
const ALL_SKILLS = Object.keys(SKILLS);
function randomSkill(rar) {
  const owned = new Set((G.run && G.run.skills) || []);
  const pool = (rar ? SKILL_POOL[rar] : ALL_SKILLS).filter(id => !owned.has(id));
  return pool.length ? pick(pool) : null;
}
function gainSkill(id, silent) {
  const run = G.run;
  run.skills = run.skills || [];
  if (run.skills.indexOf(id) >= 0) return false;
  run.skills.push(id);
  if (!run.skill) run.skill = id;
  dexAdd('skills', id);
  if (!silent) { SND.gong(); toast(`비기 획득 — ${SKILLS[id].n}`); }
  return true;
}

  init: e => { e.phase = 1; },

    dance:  { t: 'attack', label: '구미난무', d: 4, n: 3 },

  onTurnEnd: e => { e.tails = (e.tails || 0) + 1; if (e.tails % 3 === 0) st(e, 'str', 1); },  // 세 턴에 꼬리 하나
  onHalf: e => { e.phase = 2; st(e, 'str', 1); flash('꼬리 아홉이 모두 깨어났다'); },
  next: e => {

    return r < .3 ? 'charm' : r < .6 ? 'dance' : r < .82 ? 'devour' : 'veil';
  } });

/* ══════════════════════════════════════════════════════════
   7. 전투 엔진
   ══════════════════════════════════════════════════════════ */
const P = () => (G.b ? G.b.p : null);
const alive = () => G.b ? G.b.enemies.filter(e => e.hp > 0 && !e.dead) : [];

function calcAtk(src, tgt, base) {
  let d = base;
  if (src.dmgMul && src.dmgMul !== 1) d = d * src.dmgMul;    /* 막에 따른 보정 */
  d += (src.s.str || 0);
  if (src.isPlayer) {
    d += (src.s.edge || 0);
    if (hasBoon('atk80')) d *= 1.8;                          /* 저주를 이겨 낸 자 */
  }
  if (src.s.weak) d = Math.floor(d * .75);
  if (tgt.s.vuln) d = Math.floor(d * 1.5);
  return Math.max(0, Math.floor(d));
}
/* 실제 피해 적용. {hp: 체력으로 들어간 피해, blocked: 막은 양} */
function applyDamage(ent, dmg, pierce) {
  if (ent.isPlayer) {
    if (G.b && G.b.halved) dmg = Math.ceil(dmg / 2);
    dmg = pipe('modTaken', dmg);
  }
  let d = Math.max(0, dmg), blocked = 0;
  if (!pierce && ent.block > 0) { blocked = Math.min(ent.block, d); ent.block -= blocked; d -= blocked; }
  ent.hp = Math.max(0, ent.hp - d);
  if (ent.isPlayer) {
    G.run.hp = ent.hp;
    if (d > 0) checkHermit();
  } else if (ent.hp > 0) {
    if (!ent.halfDone && ent.hp * 2 <= ent.maxHp) {
      ent.halfDone = true;
      if (ent.def.onHalf) ent.def.onHalf(ent);
    }
    /* 반이 깎이는 순간과 각성이 한꺼번에 올 수도 있으므로 따로 본다 */
    if (ent.def.boss && !ent.awake && ent.hp <= ent.maxHp * AWAKEN_AT) {
      awaken(ent);                          /* 보스는 더 몰리면 눈을 뜬다 */
    }
  }
  return { hp: d, blocked };
}
function checkHermit() {
  if (!G.run || !P()) return;
  const r = G.run.relics.find(x => x.id === 'hermit' || x.id === 'immortalpill');
  if (r && !r.used && P().hp > 0 && P().hp * 2 <= P().maxHp) {
    r.used = true; heal(r.id === 'immortalpill' ? 35 : 25);
    flash(r.id === 'immortalpill' ? '선단을 삼켰다' : '표주박이 열렸다');
  }
}

/* --- 카드가 쓰는 기본 동작들 --- */
function atk(t, base, opts) {
  opts = opts || {};
  if (!G.b || !t || t.hp <= 0) return 0;
  base = pipe('modAtk', base, G.b.curCard);
  const dmg = calcAtk(P(), t, base);
  const r = applyDamage(t, dmg, opts.pierce);
  G.b.attacked = true;
  impact(opts.fx || (G.b.curCard ? CARD_FX[G.b.curCard.id] : null) || 'slash', t);
  hitFx(t, r.hp, r.blocked, true);
  const dr = P().s.drain || 0;
  if (dr && r.hp + r.blocked > 0) heal(dr);
  if (t.s.thorns) { pure(P(), t.s.thorns); }
  return r.hp;
}
function pure(t, amt) {                       // 방어도·보정 무시 직접 피해
  if (!t || t.hp <= 0 && !t.isPlayer) return;
  const r = applyDamage(t, amt, true);
  hitFx(t, r.hp, 0, false);
}
function blk(n, raw) {
  const p = P(); if (n <= 0) return;
  let v = Math.max(0, raw ? n : n + (p.s.dex || 0));
  if (curseTag('weakblock')) v = Math.floor(v * .65);         /* 저주 — 방패가 삭는다 */
  p.block += v; SND.block(); blockFx(p, v); syncPlayer();
}
function eblk(e, n) { const v = Math.max(0, n + (e.s.dex || 0)); e.block += v; SND.block(); blockFx(e, v); }
function st(ent, key, n) {
  if (!n || !ent) return;
  ent.s[key] = (ent.s[key] || 0) + n;
  const noNeg = ['vuln', 'weak', 'poison', 'stun', 'dbl', 'regen', 'regenP', 'afterimg', 'thorns', 'drain', 'edge', 'rage', 'flow', 'sword', 'focus', 'curse', 'endblock', 'turnblock', 'rebirth'];
  if (ent.s[key] === 0 || (noNeg.indexOf(key) >= 0 && ent.s[key] <= 0)) delete ent.s[key];
  if (n > 0) statusFx(ent, key);
  syncAll();
}
function heal(n) { const p = P(); const b4 = p.hp; p.hp = Math.min(p.maxHp, p.hp + n); G.run.hp = p.hp;
  if (p.hp > b4) { healFx(p, p.hp - b4); SND.heal(); } syncPlayer(); }
function eheal(e, n) { const b4 = e.hp; e.hp = Math.min(e.maxHp, e.hp + n); if (e.hp > b4) healFx(e, e.hp - b4); }
function lose(n) { const p = P(); applyDamage(p, n, true); hitFx(p, n, 0, false); syncPlayer(); }
function healRun(n) { if (!G.run) return; G.run.hp = Math.min(G.run.maxHp, G.run.hp + n); }
function energy(n) { G.b.energy += n; const e = $('#energy'); if (e) { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); } syncAll(); }

/* --- 덱 조작 --- */
function drawCards(n) {
  const b = G.b; if (!b) return;
  for (let i = 0; i < n; i++) {
    if (b.hand.length >= 10) { toast('손에 카드를 더 들 수 없다'); break; }
    if (!b.drawPile.length) {
      if (!b.discardPile.length) break;
      b.drawPile = shuffle(b.discardPile.slice()); b.discardPile = [];
    }
    b.hand.push(b.drawPile.pop());
  }
  SND.draw(); if (n >= 3) SND.swoosh(); syncAll();
}
function discardCard(c) {
  const b = G.b, i = b.hand.findIndex(x => x.uid === c.uid);
  if (i >= 0) b.hand.splice(i, 1);
  b.discardPile.push(c); syncAll();
}
function exhaustCard(c) {
  const b = G.b, i = b.hand.findIndex(x => x.uid === c.uid);
  if (i >= 0) b.hand.splice(i, 1);
  b.exhaustPile.push(c);
  fire('onExhaust', c);
  syncAll();
}

/* --- 전투 시작 --- */
function startBattle(enemyIds, kind, opts) {
  const run = G.run;
  opts = opts || {};
  const b = G.b = {
    p: { isPlayer: true, hp: run.hp, maxHp: run.maxHp, block: 0, s: {}, el: null },
    enemies: [], hand: [], drawPile: [], discardPile: [], exhaustPile: [],
    energy: 0, maxEnergy: Math.max(1, run.maxEnergy - (curseTag('lessqi') ? 1 : 0)), turn: 0, played: 0, attacked: false,
    drawMod: 0, busy: true, over: false, kind: kind || 'normal', sel: null, curCard: null,
    skillUsed: false, freeTurn: false, halved: false, startHp: run.hp
  };
  let ux = 1;
  /* 제4막부터 요괴의 체력·공격력이 10% 오른다 (대전투장은 자체 배율을 쓴다) */
  const sc = kind === 'arena' ? { hp: 1, dmg: 1 } : actScale(run.act);
  const boost = sc.hp;
  for (const id of enemyIds) {
    const d = ENEMIES[id];
    let hp = ri(d.hp[0], d.hp[1]) + Math.floor((run.asc || 0) * 0.08 * d.hp[0]);
    hp = Math.round(hp * boost);
    if (opts.hpMul) hp = Math.round(hp * opts.hpMul);
    const e = { uid: 'e' + (ux++), id, def: d, n: d.n, g: d.g, hp, maxHp: hp, block: 0, s: {},
                dmgMul: sc.dmg,
                hist: [], turnCount: 0, mv: null, mvKey: null, el: null, dead: false, halfDone: false };
    if (d.init) d.init(e);
    if (opts.str) e.s.str = (e.s.str || 0) + opts.str;
    if (opts.dex) e.s.dex = (e.s.dex || 0) + opts.dex;
    dexAdd('enemies', id);
    b.enemies.push(e);
  }
  b.drawPile = shuffle(run.deck.map(c => Object.assign({}, c, { bonus: 0 })));
  if (kind !== 'arena') { run.inBattle = true; saveRun(); }   /* 도중에 나가면 갈림길로 되돌린다 */
  G.scene = 'battle';
  renderBattle();
  SND.ambience(true, true);
  if (kind === 'boss') SND.boss(); else if (kind === 'elite') SND.gong(); else SND.drum();
  if (hasBoon('str5')) { st(b.p, 'str', 4); st(b.p, 'dex', 4); }
  fire('battleStart');
  for (const e of b.enemies) pickIntent(e);
  syncAll();
  setTimeout(() => startPlayerTurn(), 420);
}

/* ══ 각성(覺醒) — 보스가 반으로 꺾이면 눈을 뜬다 ══════════
   피해가 50% 오르고, 본래 없던 세 수를 새로 쓴다.
   ═══════════════════════════════════════════════════════════ */
const AWAKEN_AT = 0.40;                   /* 체력이 이 아래로 떨어지면 각성한다 */
const AWAKEN_MOVES = {
  aw_rend:  { t: 'attack', label: '각성 · 찢어발기기', d: 30, n: 2, fx: 'slash2', awaken: true },
  aw_curse: { t: 'atkdeb', label: '각성 · 업을 씌운다', d: 26, fx: 'void', awaken: true,
              deb: { weak: 5, vuln: 5, curse: 6 } },
  aw_roar:  { t: 'buff',   label: '각성 · 포효', blk: 40, self: { str: 8, thorns: 6 }, awaken: true,
              extra: e => { SND.charge(); if (e.el) { const c = centerOf(e.el);
                sparkles(c.x, c.y, 16, '#ff8a3a', 90); shockRing(c.x, c.y, 260, '#ff6a2a'); } } }
};
const AWAKEN_KEYS = Object.keys(AWAKEN_MOVES);
function awaken(e) {
  if (e.awake || !e.def.boss) return;
  e.awake = true;
  e.dmgMul = (e.dmgMul || 1) * 1.5;      /* 딱 50% — 힘까지 얹으면 너무 세다 */
  if (e.el) e.el.classList.add('awake');
  stampWord('각 성', '#ff3a2a');
  screenFlash('radial-gradient(circle,rgba(255,90,40,.65),rgba(60,0,0,.85))', 1000);
  blink(2); zoomPunch(); rgbSplit(); shake(true); hitstop(true);
  rushVignette('rgba(200,30,20,.55)');
  SND.boss(); SND.gong(); SND.charge();
  if (e.el) { const c = centerOf(e.el);
    sparkles(c.x, c.y, 30, '#ff9a4a', 180); shockRing(c.x, c.y, 460, '#ff5a2a');
    FX.burst(c.x, c.y, 40, '255,90,40', 8, 60, 6);
    for (let i = 0; i < 3; i++) setTimeout(() => lightBeam(c.x + (i - 1) * 90, 'rgba(255,120,50,.6)', 150), i * 110);
  }
  flash(e.n + ' 각성');
  syncAll();
}
function pickIntent(e) {
  if (e.hp <= 0) return;
  let key;
  if (e.awake && rnd() < .38) key = pick(AWAKEN_KEYS);   /* 각성한 보스는 새 수를 섞어 쓴다 */
  else key = e.def.next(e);
  e.mvKey = key;
  e.mv = AWAKEN_MOVES[key] || e.def.moves[key];
}

/* --- 플레이어 턴 시작 --- */
async function startPlayerTurn() {
  const b = G.b; if (!b || b.over) return;
  b.turn++; b.played = 0; b.attacked = false; b.busy = true;
  b.freeTurn = false; b.halved = false;
  const p = P();
  if (!p.s.barricade) p.block = 0;
  b.energy = b.maxEnergy + (p.s.focus || 0);

  if (p.s.rage) st(p, 'str', p.s.rage);
  if (p.s.afterimg) { blk(p.s.afterimg, true); delete p.s.afterimg; }
  if (p.s.turnblock) blk(p.s.turnblock, true);
  if (p.s.poison) { const d = p.s.poison; SND.poison(); pure(p, d); st(p, 'poison', -1); if (await checkOver()) return; }
  if (p.s.sword) { for (let i = 0; i < p.s.sword; i++) { const a = alive(); if (a.length) pure(pick(a), 4); } }
  fire('turnStart');
  await checkDeaths();
  if (b.over) return;

  const n = 5 + (p.s.flow || 0) + b.drawMod + (hasBoon('draw1') ? 1 : 0);
  b.drawMod = 0;
  b.fortuneRolled = false;
  drawCards(Math.max(0, n));
  await tryFortune();
  SND.drum();
  showTurnLabel('당신의 차례');
  b.busy = false;
  syncAll();
}

/* --- 카드 사용 --- */
async function playCard(card, target) {
  const b = G.b, p = P();
  if (b.busy || b.over) return;
  const d = cdef(card), cost = ecost(card);
  if (cost === -2) { SND.err(); toast('사용할 수 없는 카드다'); return; }
  const isX = cost === -1;
  const need = isX ? 1 : cost;
  if (b.energy < need) { SND.err(); toast('기가 부족하다'); return; }
  if (d.tgt === 'enemy' && (!target || target.hp <= 0)) return;

  b.busy = true; b.sel = null; hideArrow(); clearPreview();
  const spent = isX ? b.energy : cost;
  b.energy -= spent;
  if (spent > 0) { const eb = $('#energy');
    if (eb) { eb.classList.remove('spend'); void eb.offsetWidth; eb.classList.add('spend'); } }

  const i = b.hand.findIndex(x => x.uid === card.uid);
  if (i >= 0) b.hand.splice(i, 1);
  castMotion(card, d, target);
  SND.cardPlay(d.type);
  if (d.type === 'attack') SND.slash();

  b.curCard = card;
  if (worthBanner(card)) skillBanner(cname(card), d.rar === 'ssx');
  if (d.rar === 'ssx' || d.rar === 'unknown') {
    blink(1.3); zoomPunch(); rgbSplit();
    sparkles(innerWidth / 2, innerHeight * .5, 22, GRADE[d.rar].c, 220);
    lightBeam(innerWidth / 2, d.rar === 'unknown' ? 'rgba(190,140,255,.55)' : 'rgba(255,90,130,.55)', 190);
  } else if (d.rar === 'special') { blink(.7); sparkles(innerWidth / 2, innerHeight * .52, 10, '#ffb07a', 150); }
  const ctx = { v: cval(card), u: card.up, t: target, card, x: spent };
  let times = 1;
  if (d.type === 'attack' && p.s.dbl) { times = 2; st(p, 'dbl', -1); }
  for (let k = 0; k < times; k++) {
    if (k > 0) await wait(180);
    try { await d.play(ctx); } catch (err) { console.error('카드 처리 오류', d.id, err); }
    await checkDeaths();
    if (b.over) break;
  }
  b.curCard = null;
  b.played++;
  chainFx(b.played);                         /* 한 턴에 이어 낼수록 소리가 올라간다 */
  fire('cardPlay', card);

  if (!b.over) {
    if (d.exhaust) exhaustCard(card); else b.discardPile.push(card);
  } else {
    b.discardPile.push(card);
  }
  syncAll();
  await wait(90);
  b.busy = false;
  if (!b.over) { await checkDeaths(); syncAll(); await checkOver(); }
}

/* --- 물약 --- */
async function usePotion(idx, target) {
  const run = G.run, id = run.potions[idx];
  if (!id) return;
  const d = POTIONS[id];
  if (!G.b && !d.anywhere) { toast('전투 중에만 쓸 수 있다'); return; }
  if (G.b && (G.b.busy || G.b.over)) return;
  if (d.tgt === 'enemy' && !target) { startPotionTargeting(idx); return; }
  run.potions.splice(idx, 1);
  SND.potion();
  if (G.b) G.b.busy = true;
  try { d.use(target); } catch (e) { console.error(e); }
  fire('onPotion');
  toast(`${d.n} 사용`);
  if (G.b) { await checkDeaths(); G.b.busy = false; syncAll(); await checkOver(); }
  else { renderTop(); saveRun(); }
}

/* --- 턴 종료 → 적 턴 --- */
async function endTurn() {
  const b = G.b, p = P();
  if (b.busy || b.over) return;
  b.busy = true; b.sel = null; hideArrow(); syncAll();

  fire('turnEnd');
  /* 손에 남은 저주 */
  for (const c of b.hand.slice()) if (c.id === 'curse_grudge') { lose(2); }
  if (p.s.regen) { heal(p.s.regen); st(p, 'regen', -1); }
  if (p.s.regenP) heal(p.s.regenP);
  if (p.s.endblock) blk(p.s.endblock, true);
  if (p.s.curse) { pure(p, p.s.curse); }
  if (await checkOver()) return;

  /* 손패 버리기 */
  for (const c of b.hand.slice()) b.discardPile.push(c);
  b.hand = [];
  syncAll();
  await wait(220);
  decay(p);

  /* 적들의 행동 */
  for (const e of b.enemies) {
    if (e.hp <= 0 || e.dead || b.over) continue;
    e.turnCount++;
    e.block = 0;
    if (e.s.poison) { const d = e.s.poison; SND.poison(); pure(e, d); st(e, 'poison', -1);
      await wait(240); await checkDeaths(); if (e.hp <= 0 || b.over) continue; }
    if (e.s.stun) { st(e, 'stun', -1); floatText(e, '무력', 'blk'); await wait(420); decay(e); pickIntent(e); continue; }
    highlight(e, true);
    await wait(230);
    await doMove(e, e.mv);
    if (e.def.onTurnEnd) e.def.onTurnEnd(e);
    highlight(e, false);
    await checkDeaths();
    if (await checkOver()) return;
    decay(e);
    pickIntent(e);
    await wait(180);
  }
  if (b.over) return;
  syncAll();
  await wait(150);
  startPlayerTurn();
}

async function doMove(e, m) {
  if (!m) return;
  const b = G.b;
  if (!b || b.over) return;                 /* 도중에 전투가 사라졌을 수 있다 */
  if (m.d && m.d >= 18) skillBanner(m.label); else floatText(e, m.label, 'blk');
  await wait(160);
  if (m.d) {
    for (let i = 0; i < (m.n || 1); i++) {
      if (!G.b || b.over || !P() || P().hp <= 0) return;
      const dmg = calcAtk(e, P(), m.d);
      const r = applyDamage(P(), dmg);
      impact(m.fx || 'claw', P());
      hitFx(P(), r.hp, r.blocked, true);
      /* 요괴가 때릴 때도 손맛이 있어야 한다 */
      const pc = P().el ? centerOf(P().el) : { x: innerWidth * .18, y: innerHeight * .42 };

      lunge(e);

  }
  if (!G.b || b.over) return;
  if (m.blk) { eblk(e, m.blk);
    if (e.el) { const c2 = centerOf(e.el); shockRing(c2.x, c2.y, 130, '#7fb4e8');
      sparkles(c2.x, c2.y, 6, '#bfe0ff', 46); }
    syncAll(); await wait(180); }
  if (m.self) {
    if (m.self.str >= 4) { SND.charge();
      if (e.el) { const c3 = centerOf(e.el);
        sparkles(c3.x, c3.y, 14, '#ffb060', 80); shockRing(c3.x, c3.y, 220, '#ff8a3a');
        lightBeam(c3.x, 'rgba(255,140,60,.45)', 130); blink(.6); } }
    for (const k in m.self) st(e, k, m.self[k]); await wait(160); }
  if (m.deb && P()) { for (const k in m.deb) st(P(), k, m.deb[k]); SND.tone(190, .3, 'sawtooth', .1, 120); await wait(200); }
  if (m.heal) { eheal(e, m.heal); await wait(160); }

}
function decay(ent) {
  for (const k in ent.s) if (STATUS[k] && STATUS[k].decay) { ent.s[k]--; if (ent.s[k] <= 0) delete ent.s[k]; }

}

/* --- 사망 처리 --- */
async function checkDeaths() {
  const b = G.b; if (!b) return;
  let any = false;
  let killed = 0;
  for (const e of b.enemies) {
    if (e.hp <= 0 && !e.dead) {
      e.dead = true; any = true; killed++;
      fire('onKill', e);
      killFx(e);
      dropOnKill(e);
    }
  }
  if (killed >= 2) {                                  /* 한 번에 여럿을 눕히면 더 요란하게 */
    const n = el('div', 'combomark', killed + '연속 처치!');
    n.style.top = (innerHeight * .26) + 'px';
    $('#app').appendChild(n); setTimeout(() => n.remove(), 1200);
    SND.victory(); shake(true); hitstop(true);
    for (let i = 0; i < killed; i++) setTimeout(() => SND.combo(i + 3), i * 90);
    screenFlash('rgba(255,220,140,.4)', 560);
    FX.gold(innerWidth / 2, innerHeight * .4, 40);
    stampWord(killed + ' 연 속', '#ffb648');
    blink(1.6); zoomPunch(); rgbSplit();
    sparkles(innerWidth / 2, innerHeight * .4, 26, '#ffe9a8', 200);
    lightBeam(innerWidth * .35, 'rgba(255,220,150,.6)', 150);
    setTimeout(() => lightBeam(innerWidth * .65, 'rgba(255,200,120,.5)', 190), 110);
  }
  if (any) {
    await wait(430);
    if (!G.b) return;                       /* 기다리는 사이 전투가 끝났을 수 있다 */
    for (const e of G.b.enemies) if (e.dead && e.el) { e.el.remove(); e.el = null; }
    syncAll();
  }
}
async function checkOver() {
  const b = G.b; if (!b || b.over) return !!(b && b.over);
  const p = P();
  if (p.hp <= 0 && p.s.rebirth) {                 /* 불사조 */
    const h = p.s.rebirth; delete p.s.rebirth;
    p.hp = Math.min(p.maxHp, h); G.run.hp = p.hp; p.block += 20;
    screenFlash('rgba(255,190,90,.65)', 700); SND.victory(); flash('불사조가 날아오른다');
    healFx(p, h); syncAll(); await wait(600);
    return false;
  }
  if (p.hp <= 0) {
    b.over = true; await wait(500);
    if (b.kind === 'arena') arenaLose(); else gameOver();
    return true;
  }
  if (!alive().length) { b.over = true; await wait(420); if (!G.b) return true; winBattle(); return true; }
  return false;
}
function winBattle() {
  const b = G.b, run = G.run;
  if (!b || !run) return;                      /* 기다리는 사이 전투가 사라졌을 수 있다 */
  run.inBattle = false;
  if (P()) run.hp = P().hp;
  run.stats.battles++;
  fire('battleEnd', b.kind);
  curseTick();                                   /* 저주가 하루 저문다 */
  SND.victory();
  const kind = b.kind;
  if (kind === 'arena') { arenaWin(); return; }
  G.b = null;
  showRewards(kind);
}

/* ══════════════════════════════════════════════════════════
   7-B. 자동 플레이 — 스스로 싸운다
   ──────────────────────────────────────────────────────────
   원칙: 좋은 부적일수록 먼저 나간다.
   등급 차이는 1000점, 상황 판단은 ±400점으로 묶어 두었으므로
   등급이 한 칸이라도 높으면 어떤 상황에서도 먼저 쓰인다.
   같은 등급 안에서만 상황(마무리 일격·받을 피해·심법)이 순서를 가른다.
   ══════════════════════════════════════════════════════════ */
const AUTO = { on: false, loop: false, cards: 0, turns: 0, fights: 0, storyAt: 0, rewLeft: -1, rewStall: 0, wait: 0, lost: 0 };
const AUTO_PACE = { slow: 1500, normal: 850, fast: 380 };
const autoDelay = () => AUTO_PACE[OPT.autoPace] || 300;
/* 등급 서열 — 이 값이 곧 우선순위다 */
const AUTO_RANK = { basic: 0, common: 1, uncommon: 2, rare: 3, special: 4, ssx: 5, unknown: 6 };

/* 손에 든 한 장을 저울질한다. 쓸 수 없으면 null */
function autoScore(c) {
  const b = G.b, p = P(), d = cdef(c);
  if (!b || !d || d.rar === 'curse' || d.type === 'curse') return null;
  const cost = ecost(c);
  if (cost === -2) return null;
  const need = cost === -1 ? 1 : cost;
  if (need > b.energy) return null;
  const foes = alive();
  if (d.tgt === 'enemy' && !foes.length) return null;

  const v = cval(c) || {};
  /* ① 등급 — 압도적인 첫 번째 잣대 */
  let s = (AUTO_RANK[d.rar] || 0) * 1000;
  /* ② 같은 등급 안에서의 눈치 (±400 을 넘지 않는다) */
  let t = c.up ? 14 : 0;
  if (d.type === 'power') t += 150 - b.turn * 14;              /* 심법은 이를수록 값지다 */
  const through = Math.max(0, incomingTotal() - p.block);
  if (typeof v.b === 'number') t += Math.min(240, v.b * (through > 0 ? 8 : 1.1));
  let target = null;
  if (typeof v.d === 'number' && foes.length) {
    let best = null, bv = -1;
    for (const e of foes) {
      const dmg = calcAtk(p, e, v.d) * (v.n || 1);
      let ev = Math.min(dmg, e.hp + e.block) * 1.4;
      if (dmg >= e.hp + e.block) ev += 170;                    /* 마무리 일격 */
      if (e.def.boss || e.def.elite) ev += 10;
      if (e.mv && e.mv.d && !e.s.stun) ev += 8;                /* 때리려는 놈부터 */
      if (ev > bv) { bv = ev; best = e; }
    }
    target = best; t += Math.min(260, bv);
  }
  if (d.exhaust) t -= 12;
  if (d.id === 'lastward' && b.hand.length > 1) t -= 300;   /* 손이 빌 때만 값어치가 있다 */
  if (d.tgt === 'enemy' && !target) target = foes[0];
  return { c, target: d.tgt === 'enemy' ? target : null, score: s + clamp(t, -400, 400) };
}
/* 물약은 아낀다 — 죽기 직전에, 목숨을 건질 물약만, 한 판에 한두 병까지 */
function autoPotionIdx() {
  const run = G.run, b = G.b, p = P();
  if (!run.potions.length) return -1;
  const cap = (b.kind === 'boss' || b.kind === 'elite' || b.kind === 'arena') ? 2 : 1;
  if ((b.autoPots || 0) >= cap) return -1;
  const through = Math.max(0, incomingTotal() - p.block);
  const dying = p.hp <= p.maxHp * .25 || through >= p.hp;
  if (!dying) return -1;
  /* 목숨을 건지는 물약만 쓴다. 없으면 그냥 아낀다 */
  for (const id of ['heal', 'iron']) {
    const i = run.potions.indexOf(id);
    if (i >= 0) return i;
  }
  return -1;
}
function autoSkillWorth() {
  const b = G.b, p = P();
  if (b.turn < 2) return false;
  if (b.turn >= 6) return true;
  if (b.kind === 'boss' || b.kind === 'elite' || b.kind === 'arena') return b.turn >= 3;
  return p.hp < p.maxHp * .55 || Math.max(0, incomingTotal() - p.block) >= p.hp * .3;
}
/* 전투에서의 한 수 — 기다리지 않고 던진다 (효과가 창을 띄우면 고리가 받아 준다) */
function autoBattleStep() {
  const b = G.b, run = G.run;
  if (OPT.autoPotion) {
    const i = autoPotionIdx();
    if (i >= 0) {
      const pd = POTIONS[run.potions[i]];
      const foes = alive();
      if (!(pd.tgt === 'enemy' && !foes.length)) {
        b.autoPots = (b.autoPots || 0) + 1;
        usePotion(i, pd.tgt === 'enemy' ? foes.slice().sort((a, z) => a.hp - z.hp)[0] : null);
        return;
      }
    }
  }
  if (OPT.autoSkill && run.skill && !b.skillUsed && autoSkillWorth()) { useSkill(); return; }
  const cands = [];
  for (const c of b.hand) { const r = autoScore(c); if (r) cands.push(r); }
  if (cands.length) {
    cands.sort((a, z) => z.score - a.score);
    AUTO.cards++;
    playCard(cands[0].c, cands[0].target);
    return;
  }
  AUTO.turns++;
  endTurn();
}
/* 타일의 g-<등급> 딱지에서 서열을 읽는다 */
function autoTileRank(n) {
  for (const k in AUTO_RANK) if (n.classList.contains('g-' + k)) return AUTO_RANK[k];
  return 0;
}
/* 열려 있는 창을 대신 처리한다 — 아는 창만 건드린다 */
function autoOverlay(panel) {
  if (!panel) return;
  if (panel.dataset.noauto) return;                            /* 메뉴·설정은 손대지 않는다 */
  const q = s => panel.querySelector(s);
  /* 상점에서는 아무것도 사지 않고 나온다 — 돈 쓰는 일은 사람 몫이다 */
  if (panel.dataset.shop) {
    if (OPT.autoScope === 'run' && q('#sh_leave')) q('#sh_leave').click();
    else if (OPT.autoScope !== 'run') autoStop('상점에 들렀다');
    return;
  }
  /* 부적 고르기 — 여기서도 등급이 높은 쪽을 집는다 */
  const picks = [...panel.querySelectorAll('.cardgrid .card.pick')];
  if (picks.length) {
    const wantWorst = /버릴|없앨|덜어/.test(panel.querySelector('h2') ? panel.querySelector('h2').textContent : '');
    let best = picks[0], bv = wantWorst ? 1e9 : -1e9;
    for (const n of picks) {
      const id = n.dataset.cid, d = id && CARDS[id];
      const v = d ? (AUTO_RANK[d.rar] != null ? AUTO_RANK[d.rar] : 0) + (n.dataset.up === '1' ? .5 : 0)
                  : (d && d.rar === 'curse' ? -1 : 0);
      if (wantWorst ? v < bv : v > bv) { bv = v; best = n; }
    }
    best.click(); return;
  }
  /* 비기 고르기 — 등급이 높은 쪽 */
  const stiles = [...panel.querySelectorAll('.skillgrid .stile')];
  if (stiles.length) {
    stiles.sort((a, z) => autoTileRank(z) - autoTileRank(a));
    stiles[0].click(); return;
  }
  /* 유물 자리가 없을 때 — 가장 낮은 등급을 내주고, 새것이 더 낮으면 두고 간다 */
  const olds = [...panel.querySelectorAll('#ro_old .rtile')], fresh = q('#ro_new .rtile');
  if (olds.length && fresh) {
    olds.sort((a, z) => autoTileRank(a) - autoTileRank(z));
    (autoTileRank(olds[0]) < autoTileRank(fresh) ? olds[0] : fresh).click();
    return;
  }
  /* 보스 유물처럼 창 안에서 고르는 것 */
  if (panel.dataset.modal && q('.rewardrow .rewitem:not(.taken)')) { q('.rewardrow .rewitem:not(.taken)').click(); return; }
  if (q('#pk_cancel')) { q('#pk_cancel').click(); return; }
  /* 여기서부터는 화면 단위 — '모험까지' 일 때만 나선다 */
  if (OPT.autoScope !== 'run') { if (!panel.dataset.modal) autoStop('전투가 끝났다'); return; }
  /* 챙길 수 없는 전리품(가득 찬 물약 따위)에 매달리지 않도록 헛도는 횟수를 센다 */
  const rew = q('.rewardrow .rewitem:not(.taken)');
  if (rew) {
    const left = panel.querySelectorAll('.rewardrow .rewitem:not(.taken)').length;
    if (left === AUTO.rewLeft) AUTO.rewStall++; else { AUTO.rewLeft = left; AUTO.rewStall = 0; }
    if (AUTO.rewStall < 8) { rew.click(); return; }
  } else { AUTO.rewLeft = -1; AUTO.rewStall = 0; }
  for (const sel of ['#pr_ok', '#rw_done', '.evtbox .opt:not(:disabled)', '#r_heal', '#tr_done', '#sh_leave']) {
    const n = q(sel);
    if (n) { n.click(); return; }
  }
  /* 모르는 화면(장기 상점·뽑기·대전투장…)에서는 잠시 지켜보다 조용히 물러난다 */
  if (!panel.dataset.modal) {
    AUTO.wait++;
    if (AUTO.wait > 10) {
      const back = q('#jg_back, #g_back, #ar_back');
      if (back) { AUTO.wait = 0; back.click(); return; }
      autoStop('여긴 스스로 정할 자리다');
    }
  }
}
/* 지도에서 다음 갈림길을 고른다 */
function autoMapStep() {
  const run = G.run, ids = availableNodes();
  if (!ids.length) {
    /* 갈 곳이 없다 — 보스를 넘고도 다음 막으로 넘어가지 못한 자리.
       사람이라면 길이 막힌 지도를 보게 되므로, 여기서 끌어내 준다. */
    AUTO.lost = (AUTO.lost || 0) + 1;
    if (AUTO.lost > 10) {
      AUTO.lost = 0;
      if (run.act < LAST_ACT) nextAct(); else victory();
    }
    return;
  }
  AUTO.lost = 0;
  const ratio = run.hp / Math.max(1, run.maxHp);
  const W = { rest: ratio < .72 ? 120 : 26, treasure: 78, elite: ratio > .82 ? 60 : 12,
              shop: 44, event: 46, battle: 52, boss: 200, special: 24, janggi: 24 };
  let best = null, bv = -1;
  for (const id of ids) {
    const n = run.map.nodes[id];
    const v = (W[n.type] != null ? W[n.type] : 30) + rnd() * 9;
    if (v > bv) { bv = v; best = n; }
  }
  if (best) enterNode(best);
}
async function autoLoop() {
  if (AUTO.loop) return;
  AUTO.loop = true;
  try {
    while (AUTO.on) {
      await new Promise(r => setTimeout(r, autoDelay()));
      if (!AUTO.on) break;
      if (!G.run || G.scene === 'title' || G.scene === 'over' || G.scene === 'win') { autoStop(); break; }
      /* 상자가 터지는 중이면 끝날 때까지 기다린다 */
      if ($('#app > .openscene')) { AUTO.lost = 0; continue; }
      /* 이야기는 읽을 틈을 두고 넘긴다 */
      const story = $('#app > .story:not(.fadeout)');
      if (story) {
        const now = Date.now();
        if (!AUTO.storyAt) AUTO.storyAt = now;
        if (now - AUTO.storyAt > 1500) { AUTO.storyAt = now; story.click(); }
        continue;
      }
      AUTO.storyAt = 0;
      const o = $('#overlay');
      if (o.style.display === 'block' && o.lastElementChild) { autoOverlay(o.lastElementChild); continue; }
      AUTO.wait = 0;
      if (G.b) {
        if (G.b.busy || G.b.over) continue;
        try { autoBattleStep(); } catch (e) { console.error('자동 플레이 오류', e); autoStop('길을 잃었다'); }
        continue;
      }
      if (G.scene === 'map') {
        /* '전투만'이면 지도에 서는 순간 손을 뗀다 — 로비에서 켜져 있을 이유가 없다 */
        if (OPT.autoScope !== 'run') { autoStop('전투가 끝났다'); break; }
        AUTO.lost = 0; AUTO.fights++; autoMapStep(); continue;
      }
      /* 어느 화면도 아닌 자리에 오래 서 있으면 스스로 지도로 돌아간다 */
      if (OPT.autoScope === 'run' && G.run) {
        AUTO.lost = (AUTO.lost || 0) + 1;
        if (AUTO.lost > 14) { AUTO.lost = 0; closeOverlay(); showMap(); }
      }
    }
  } finally { AUTO.loop = false; syncAuto(); }
}
function autoStart() {
  if (AUTO.on) return;
  if (!G.run) { toast('모험 중에만 쓸 수 있다'); return; }
  if (!autoOk()) { SND.err(); toast('자동 플레이는 제1막을 넘어선 자에게 열린다 (VIP는 곧바로)'); return; }
  if (!G.b && OPT.autoScope !== 'run') { SND.err(); toast('싸울 때만 대신해 준다 — 지도까지 맡기려면 설정에서 범위를 바꾸시오'); return; }
  AUTO.on = true; SND.ui();
  toast(OPT.autoScope === 'run' ? '자동 플레이 — 지도까지 스스로 나아간다' : '자동 플레이 — 전투를 대신한다');
  syncAuto(); autoLoop();
}
function autoStop(why) {
  if (!AUTO.on) return;

}
function autoToggle() { AUTO.on ? autoStop('직접 하기로 했다') : autoStart(); }
/* 화면 어디서나 보이는 표식 + 전투 단추 */

/* --- 엔소(원상) --- */
function enso(color, seed) {
  const r = 40, off = (seed % 5) - 2;
  return `<svg viewBox="0 0 100 100">
    <path d="M72,${24 + off} A${r},${r} 0 1 0 ${79 - off},${44}" fill="none" stroke="${color}"
      stroke-width="7" stroke-linecap="round" opacity=".85" transform="rotate(${(seed % 9) - 4} 50 50)"/>
    <path d="M72,${24 + off} A${r},${r} 0 1 0 ${79 - off},${44}" fill="none" stroke="${color}"
      stroke-width="2" stroke-linecap="round" opacity=".4" transform="rotate(${(seed % 9) - 1} 50 50) scale(1.04) translate(-2,-2)"/>
  </svg>`;
}

/* ── 응급 회복 — 체력이 바닥나면 상단에 뜨는 작은 단추 ───── */
const EMERGENCY_HP = 30;                    /* 이 아래로 떨어지면 나타난다 */
const EMERGENCY_COST = 60;                  /* 골드 */
function emergencyHeal() {
  const run = G.run;
  if (!run || run.hp > EMERGENCY_HP || run.hp >= run.maxHp) return;
  if (run.gold < EMERGENCY_COST) { SND.err(); toast(`골드가 모자란다 (${EMERGENCY_COST} 필요)`); return; }
  run.gold -= EMERGENCY_COST;
  const n = run.maxHp - run.hp;
  if (G.b) heal(n); else { healRun(n); SND.heal(); }
  screenFlash('rgba(90,220,170,.28)', 460);
  FX.spark(innerWidth / 2, 90, 26, '80,220,170');
  toast(`숨을 돌렸다 — 체력을 모두 회복 (골드 ${EMERGENCY_COST})`);
  renderTop(); saveRun();
}

/* --- 동기화 --- */
function syncAll() { if (!G.b) { renderTop(); syncLowHp(); return; } syncPlayer(); syncEnemies(); syncHand(); syncPiles(); renderTop(); syncLowHp(); }

function statChip(ent, k, v) {
  const s = STATUS[k]; if (!s) return '';
  return `<div class="st ${s.kind}" data-k="${k}" data-v="${v}"><b>${s.g}</b>${v}</div>`;
}
function fillStats(node, ent) {
  let h = '';
  for (const k in ent.s) if (ent.s[k]) h += statChip(ent, k, ent.s[k]);
  const box = node.querySelector('.stats');
  if (box.innerHTML !== h) {
    box.innerHTML = h;
    box.querySelectorAll('.st').forEach(c => bindTip(c, () => statusTip(c.dataset.k, c.dataset.v)));
  }
}
function syncPlayer() {
  if (!G.b) return;
  const p = P(); if (!p || !p.el) return;
  const u = p.el;
  u.querySelector('.ebar i').style.width = (p.hp / p.maxHp * 100) + '%';
  u.querySelector('.ebar b').textContent = p.hp + ' / ' + p.maxHp;
  const bb = u.querySelector('.blockbadge');
  bb.textContent = p.block; bb.classList.toggle('hide', p.block <= 0);
  fillStats(u, p);
}
function syncEnemies() {
  if (!G.b) return;
  for (const e of G.b.enemies) {
    if (!e.el) continue;
    e.el.classList.toggle('willdie', !e.dead && e.hp > 0 && e.hp <= e.maxHp * .18);
    if (e.dead) { if (!e.el.classList.contains('dying')) e.el.classList.add('dying'); continue; }
    e.el.querySelector('.ebar i').style.width = (e.hp / e.maxHp * 100) + '%';
    e.el.querySelector('.ebar b').textContent = e.hp + ' / ' + e.maxHp;
    const bb = e.el.querySelector('.blockbadge');
    bb.textContent = e.block; bb.classList.toggle('hide', e.block <= 0);
    fillStats(e.el, e);
    /* 의도 */
    const box = e.el.querySelector('.intent');
    const m = e.mv;
    if (m && !G.b.over) {
      const dmg = m.d ? calcAtk(e, P(), m.d) : 0;
      const t = e.s.stun ? 'stun' : m.t;
      let label = e.s.stun ? '무력' :
        (m.d ? `${dmg}` + ((m.n || 1) > 1 ? `<span class="x">×${m.n}</span>` : '') : '');
      box.className = 'intent' + (dmg >= 15 ? ' big' : '');
      box.innerHTML = intentSvg(t) + label;
      box.onmouseenter = () => { const r = box.getBoundingClientRect();
        tipShow(`<b>${e.s.stun ? '무력' : m.label}</b><br>${intentDesc(e, m)}`, r.left + r.width / 2, r.top); };
      box.onmouseleave = tipHide;
    } else box.innerHTML = '';
    e.el.classList.toggle('targetable', !!(G.b.sel || G.b.potSel != null) && !G.b.busy);
  }
}
function intentDesc(e, m) {
  if (curseTag('blind')) return '<b style="color:#a89a80">보이지 않는다.</b>';
  if (e.s.stun) return '이번 턴 아무것도 하지 못한다.';
  const out = [];
  if (m.d) out.push(`<em style="color:#e2777a">${calcAtk(e, P(), m.d)}</em>의 피해를 ${(m.n || 1)}회 준다.`);
  if (m.blk) out.push(`방어도 ${m.blk + (e.s.dex || 0)}를 얻는다.`);
  if (m.self) for (const k in m.self) out.push(`자신에게 ${STATUS[k].n} ${m.self[k]}`);
  if (m.deb) for (const k in m.deb) out.push(`나에게 ${STATUS[k].n} ${m.deb[k]}`);
  if (m.heal) out.push(`체력 ${m.heal} 회복`);
  if (m.extra) out.push('그 밖의 술수를 부린다.');
  return out.join('<br>');
}
function syncPiles() {
  if (!G.b) return;
  const d = $('#drawpile'), dd = $('#discardpile');
  if (d) d.querySelector('b').textContent = G.b.drawPile.length;
  if (dd) dd.querySelector('b').textContent = G.b.discardPile.length;

  if (ev) ev.textContent = G.b.energy;
  if (emv) emv.textContent = G.b.maxEnergy + (P().s.focus || 0);
  const et = $('#endturn');

  syncSkill();
  syncIncoming();
}

/* 스킨이 흩뿌리는 작은 것들 (불티·별) */
function skinBits(id) {
  if (id === 'flame') {
    let o = '';
    for (let i = 0; i < 7; i++)
      o += `<i style="left:${8 + i * 13}%;animation-delay:${(i * .37).toFixed(2)}s;animation-duration:${(2.2 + (i % 3) * .5).toFixed(1)}s"></i>`;
    return o;
  }
  if (id === 'star') {

function syncHand() {
  const b = G.b, box = $('#hand'); if (!b || !box) return;
  const have = new Set(b.hand.map(c => c.uid));
  for (const uid in cardEls) if (!have.has(+uid) && !have.has(uid)) { cardEls[uid].remove(); delete cardEls[uid]; }
  b.hand.forEach(c => {
    if (!cardEls[c.uid]) {
      const n = cardNode(c);
      n.style.transform = 'translate(320px,240px) scale(.4)';
      n.onclick = ev => { ev.stopPropagation(); onCardClick(c); };
      box.appendChild(n);
      cardEls[c.uid] = n;
    }
  });
  const n = b.hand.length, W = box.clientWidth || innerWidth;
  const spread = Math.min(150, (W - 480) / Math.max(1, n));
  const per = Math.min(3.2, 20 / Math.max(1, n));        /* 장수가 많을수록 완만하게 */
  const sc = Math.min(1, Math.max(.82, spread / 112));   /* 빽빽하면 조금 작게 */
  b.hand.forEach((c, i) => {
    const node = cardEls[c.uid]; if (!node) return;
    const mid = (n - 1) / 2, off = i - mid;
    const x = off * spread, ang = off * (n > 1 ? per : 0), y = Math.min(18, off * off * 2.6);
    const sel = b.sel && b.sel.uid === c.uid;
    node.style.zIndex = i + 1;
    node.style.transform = `translate(${x}px,${y - (sel ? 54 : 0)}px) rotate(${sel ? 0 : ang}deg) scale(${sel ? 1.08 : sc})`;
    node.classList.toggle('sel', !!sel);
    const cost = ecost(c);
    const playable = cost !== -2 && (cost === -1 ? b.energy >= 1 : b.energy >= cost);
    node.classList.toggle('unplayable', !playable);
    node.onmouseenter = () => {
      if (!b.sel) node.style.transform = `translate(${x}px,${y - 46}px) rotate(0deg) scale(1.1)`;
      showPreview(c);
    };
    node.onmouseleave = () => { clearPreview(); if (!b.sel || !sel) syncHand(); };
  });
}

  const big = !!(e.def.boss || e.def.elite);
  /* 남은 체력보다 훨씬 세게 때려 눕혔다 */
  const over = e.hp <= -Math.max(12, e.maxHp * .25);
  if (e.el) {
    const c = centerOf(e.el);
    FX.ink(c.x, c.y, big ? 44 : 26);
    FX.blood(c.x, c.y, big ? 34 : 18);
    if (big) FX.gold(c.x, c.y, 26);
    crackFx(c.x, c.y, big ? '#ffd76a' : '#e8e0cc');
    shockRing(c.x, c.y, big ? 320 : 200, big ? '#ffd76a' : '#d8cbb0');
    sparkles(c.x, c.y, big ? 20 : 10, big ? '#ffe9a8' : '#efe4cb', big ? 110 : 70);
    blink(big ? 1.4 : .8);
    if (big) { lightBeam(c.x, 'rgba(255,225,160,.7)', 220); zoomPunch(); rgbSplit(); }
    if (over) { FX.burst(c.x, c.y, 40, '255,170,60', 8, 56, 5.5); FX.gold(c.x, c.y, 24);
      shockRing(c.x, c.y, 400, '#ffb648'); rushVignette('rgba(255,150,50,.4)');
      stampWord('과 잉', '#ff9a2a'); sparkles(c.x, c.y, 18, '#ffcf7a', 150); }
    e.el.classList.add('dying');
    const m = el('div', 'killmark' + (big ? ' big' : ''), over ? '과 잉' : big ? '토 벌' : '처 치');
    if (over) m.style.color = '#ffdf9a';
    m.style.left = c.x + 'px'; m.style.top = c.y + 'px';
    $('#app').appendChild(m); setTimeout(() => m.remove(), 1000);
  }
  SND.death();
  hitstop(big || over);
  if (over) { SND.crit(); screenFlash('rgba(255,190,90,.34)', 420); }
  if (big) { screenFlash('rgba(255,210,120,.42)', 520); SND.gong(); shake(true); }
  else shake();
}
/* 처치할 때 이따금 물약이 떨어진다 */
function dropOnKill(e) {
  const run = G.run; if (!run) return;
  const big = !!(e.def.boss || e.def.elite);
  const chance = big ? .55 : .10;
  if (rnd() >= chance) return;
  if (run.potions.length >= run.potSlots) return;
  /* 좋은 물약이 나올 확률은 상대가 셀수록 높다 */
  const pool = POT_POOL.filter(id => {
    const r = POTIONS[id].rar;
    return big ? true : r !== 'rare';
  });
  const id = pickWeighted(pool.map(x => ({
    w: POTIONS[x].rar === 'common' ? 10 : POTIONS[x].rar === 'uncommon' ? (big ? 8 : 4) : (big ? 4 : 1), id: x
  }))).id;
  run.potions.push(id);
  const d = POTIONS[id];
  if (e.el) { const c = centerOf(e.el); FX.spark(c.x, c.y, 16, '120,200,180'); }
  SND.potion();
  toast(`${d.n} 을(를) 떨어뜨렸다`);
  renderTop();
}

/* ── 천운(天運) — 카드를 뽑을 때 아주 드물게 터진다 ─────────── */
const FORTUNE_CHANCE = 0.02;
async function tryFortune() {
  const b = G.b;
  if (!b || b.fortuneRolled || b.over) return false;
  b.fortuneRolled = true;                       /* 한 턴에 한 번만 굴린다 */
  if (rnd() >= FORTUNE_CHANCE) return false;
  const pool = b.drawPile.concat(b.discardPile)
    .filter(c => { const t = cdef(c).type; return t === 'skill' || t === 'power'; });
  if (!pool.length) return false;
  b.busy = true;
  skillBanner('天 運', true);
  screenFlash('radial-gradient(circle,rgba(255,255,220,.9),rgba(255,150,40,.7))', 900);
  stampWord('천 운', '#ffd76a'); blink(2); zoomPunch(); rgbSplit();
  sparkles(innerWidth / 2, innerHeight * .45, 40, '#fff2c0', 300);
  for (let i = 0; i < 5; i++)
    setTimeout(() => lightBeam(innerWidth * (.12 + i * .19), 'rgba(255,235,180,.6)', 130), i * 90);
  SND.gong(); SND.victory();
  toast(`천운! 덱의 기술 ${pool.length}장이 저절로 펼쳐진다`);
  await wait(500);
  for (const c of pool) {
    const i1 = b.drawPile.indexOf(c); if (i1 >= 0) b.drawPile.splice(i1, 1);
    const i2 = b.discardPile.indexOf(c); if (i2 >= 0) b.discardPile.splice(i2, 1);
    const d = cdef(c);
    b.curCard = c;
    try {
      const t = d.tgt === 'enemy' ? (alive()[0] || null) : null;
      if (d.tgt === 'enemy' && !t) { b.exhaustPile.push(c); continue; }
      await d.play({ v: cval(c), u: c.up, t, card: c, x: 0 });
    } catch (err) { console.error('천운 처리 오류', d.id, err); }
    b.curCard = null;
    b.exhaustPile.push(c);
    await checkDeaths();
    if (b.over) break;
    await wait(110);
  }
  FX.gold(innerWidth / 2, innerHeight / 2, 40);
  syncAll();
  b.busy = false;
  return true;
}

/* ── 비기 ────────────────────────────────────────────────── */
function syncSkill() {
  const btn = $('#skillbtn'); if (!btn || !G.b) return;
  const id = G.run.skill, d = id && SKILLS[id];
  btn.querySelector('b').textContent = d ? d.g : '—';
  btn.querySelector('small').textContent = d ? d.n : '비기 없음';
  btn.className = (d ? 'sg-' + d.rar + ' ' : '') + (!d ? 'none' : G.b.skillUsed ? 'used' : 'ready');
  btn.style.setProperty('--sc', d ? GRADE[d.rar].c : '#7d7568');
  btn.disabled = !d || G.b.skillUsed || G.b.busy || G.b.over;
  btn.onmouseenter = () => {
    const r = btn.getBoundingClientRect();
    tipShow(d ? `<b>${d.n}</b> · <span style="color:${GRADE[d.rar].c}">${GRADE[d.rar].n} 비기</span><br>${d.d}
      <br><span style="color:#9a8d74">기를 쓰지 않는다 · 전투당 한 번</span>${G.b.skillUsed ? '<br><b>이미 썼다</b>' : ''}`
      : '<b>비기가 없다</b><br>보스를 잡거나 비기 상자에서 얻는다', r.left + r.width / 2, r.top);
  };
  btn.onmouseleave = tipHide;
}
async function useSkill() {
  const b = G.b; if (!b || b.busy || b.over || b.skillUsed) return;
  const id = G.run.skill, d = id && SKILLS[id];
  if (!d) { SND.err(); toast('장착한 비기가 없다'); return; }
  b.skillUsed = true; b.busy = true; b.sel = null; hideArrow(); clearPreview(); syncAll();
  blink(1.1); zoomPunch();
  sparkles(innerWidth * .12, innerHeight * .78, 14, GRADE[d.rar].c, 90);
  lightBeam(innerWidth * .12, 'rgba(200,150,255,.5)', 130);
  try { await d.use(); } catch (e) { console.error('비기 오류', id, e); }
  await checkDeaths();
  b.busy = false; syncAll();
  await checkOver();
}
/* 이번 턴 적들에게 받을 피해 합계 */
function incomingTotal() {
  if (!G.b) return 0;
  let t = 0;
  for (const e of alive()) {
    if (e.s.stun || !e.mv || !e.mv.d) continue;
    t += calcAtk(e, P(), e.mv.d) * (e.mv.n || 1);
  }
  if (G.b.halved) t = Math.ceil(t / 2);
  return t;
}
function syncIncoming() {
  const p = P(); if (!p || !p.el) return;
  let box = p.el.querySelector('.incoming');
  const total = incomingTotal();
  if (!total) { if (box) box.remove(); return; }
  if (!box) { box = el('div', 'incoming'); p.el.querySelector('.body').appendChild(box); }
  const through = Math.max(0, total - p.block);
  box.className = 'incoming' + (through === 0 ? ' safe' : '');
  box.innerHTML = through === 0
    ? `막아냄 <b>${total}</b>`
    : `받을 피해 <b>${through}</b>` + (p.block ? ` <span style="opacity:.6">(${total}−${p.block})</span>` : '');
}

/* ── 예상치 미리보기 ─────────────────────────────────────────
   손패의 부적에 마우스를 올리면 그 부적이 실제로 낼 수치를
   힘·검기·약화·취약까지 계산해서 적 머리 위에 띄운다. */
const HITS = { twin: 2, ninetail: 4, shadowblade: 3, wail: 2 };
function previewOn(card, e) {
  const d = cdef(card), v = cval(card), b = G.b;
  if (!b) return null;
  /* 체력 절반을 없애는 것들은 공격 분류가 아니어도 보여 준다 */
  if (d.id === 'mu' || d.id === 'genesis') return { total: Math.ceil(e.hp / 2), pierce: true, n: 1 };
  if (d.type !== 'attack') return null;
  let base = v.d, n = HITS[d.id] || v.n || 1;
  switch (d.id) {
    case 'vein':      base = e.s.vuln ? v.d * 2 : v.d; break;
    case 'immovable': base = P().block + v.d; break;
    case 'lotus':     base = (b.played + 1) * v.d; break;
    case 'stormtal':  base = b.hand.length * v.d; break;
    case 'hunt':      base = e.hp * 2 <= e.maxHp ? v.D : v.d; break;
    case 'madness':   base = v.d; n = b.energy; break;
    case 'demonblade': base = v.d + (card.bonus || 0); break;
  }
  if (base == null) return null;
  base = pipe('modAtk', base, card);
  const one = calcAtk(P(), e, base);
  return { total: one * n, one, n, pierce: !!(d.id === 'formless' || d.id === 'vajra' || d.id === 'cleaver') };
}
function previewSelf(card) {
  const d = cdef(card), v = cval(card), p = P();
  let blk = 0, heal = 0;
  if (v.b) blk = Math.max(0, v.b + (p.s.dex || 0));
  if (d.id === 'purify') blk = Math.max(0, v.b + (p.s.dex || 0));
  if (v.h && d.type === 'skill' && (d.id === 'healtalis')) heal = v.h;
  if (d.id === 'gamble' || d.id === 'bloodcut') heal = -(v.h || 3);
  return { blk, heal };
}
function showPreview(card) {
  const b = G.b; if (!b || b.busy) return;
  const d = cdef(card);
  for (const e of b.enemies) {
    if (!e.el || e.dead) continue;
    const box = e.el.querySelector('.prev'); if (!box) continue;
    const r = d.tgt ? previewOn(card, e) : null;
    if (r && r.total > 0) {
      const dead = r.pierce ? false : r.total >= e.hp + e.block;
      box.className = 'prev on';
      box.innerHTML = (r.pierce ? '<small>관통</small> ' : '') + r.total +
        (r.n > 1 ? `<small>(${r.one}×${r.n})</small>` : '') + (dead ? ' <small>처치</small>' : '');
      e.el.classList.toggle('willdie', dead);
    } else { box.className = 'prev'; box.innerHTML = ''; e.el.classList.remove('willdie'); }
  }
  const p = P(), pb = p.el && p.el.querySelector('.prev');
  if (pb) {
    const s2 = previewSelf(card);
    if (s2.blk) { pb.className = 'prev on blk'; pb.innerHTML = '+' + s2.blk + ' <small>방어</small>'; }
    else if (s2.heal > 0) { pb.className = 'prev on heal'; pb.innerHTML = '+' + s2.heal; }
    else if (s2.heal < 0) { pb.className = 'prev on'; pb.innerHTML = s2.heal; }
    else { pb.className = 'prev'; pb.innerHTML = ''; }
  }
}
function clearPreview() {
  const b = G.b; if (!b) return;
  for (const e of b.enemies) if (e.el) {
    const box = e.el.querySelector('.prev');
    if (box) { box.className = 'prev'; box.innerHTML = ''; }
    e.el.classList.remove('willdie');
  }
  const pb = P() && P().el && P().el.querySelector('.prev');
  if (pb) { pb.className = 'prev'; pb.innerHTML = ''; }
}

/* ══════════════════════════════════════════════════════════
   9. 지도 생성 — 갈라지는 등산로 (간선이 교차하지 않는다)
   ══════════════════════════════════════════════════════════ */
const MAP_W = 5, MAP_H = 12, MAP_PATHS = 6;
function genMap(act) {
  const nodes = [], grid = {};
  const key = (r, c) => r + '_' + c;
  const getNode = (r, c) => {
    if (!grid[key(r, c)]) { const n = { id: nodes.length, r, c, type: null, next: [] }; grid[key(r, c)] = n; nodes.push(n); }
    return grid[key(r, c)];
  };
  const edges = [];
  const crosses = (r, from, to) => edges.some(e => e.r === r && (e.a - from) * (e.b - to) < 0);
  for (let p = 0; p < MAP_PATHS; p++) {
    let c = ri(0, MAP_W - 1);
    if (p === 1) { let g = 0; while (c === nodes[0].c && g++ < 20) c = ri(0, MAP_W - 1); }
    let cur = getNode(0, c);
    for (let r = 0; r < MAP_H - 1; r++) {
      let cand = [cur.c - 1, cur.c, cur.c + 1].filter(x => x >= 0 && x < MAP_W && !crosses(r, cur.c, x));
      if (!cand.length) cand = [cur.c];
      const nc = pick(cand);
      const nx = getNode(r + 1, nc);
      if (cur.next.indexOf(nx.id) < 0) { cur.next.push(nx.id); edges.push({ r, a: cur.c, b: nc }); }
      cur = nx;
    }
  }
  /* 보스 */
  const boss = { id: nodes.length, r: MAP_H, c: (MAP_W - 1) / 2, type: 'boss', next: [] };
  nodes.push(boss);
  for (const n of nodes) if (n.r === MAP_H - 1) n.next.push(boss.id);

    if (n.r === REST_ROW) { n.type = 'rest'; continue; }
    const w = [{ w: 44, t: 'battle' }, { w: 23, t: 'event' }, { w: 8, t: 'shop' }, { w: 6, t: 'janggi' }];

    n.x = 74 + n.c * ((660 - 148) / (MAP_W - 1)) + jitter + (n.type === 'boss' ? 0 : 0);

/* ══ 장기 상점 ═════════════════════════════════════════════
   장기판 위에 말이 놓여 있고, 말 하나가 물건 하나를 판다.
   물건은 아래 표만 채우면 된다 — todo:true 인 자리는 '준비 중'.
   { piece:'車', side:'red'|'green', x:0~8, y:0~9,

/* ══════════════════════════════════════════════════════════
   장기(將棋) — 노인과의 한 판
   ──────────────────────────────────────────────────────────
   9줄 × 10줄. 아래가 나(漢), 위가 노인(楚).
   車 馬 象 士 包 卒 의 규칙을 모두 지키고, 궁(宮) 안의 대각선도 산다.
   노인은 알파-베타 가지치기를 붙인 미니맥스로 세 수 앞을 본다.
   ══════════════════════════════════════════════════════════ */
const JG_GLYPH = {

const onBoard = (x, y) => x >= 0 && x < 9 && y >= 0 && y < 10;

function jgDiag(x, y) {

    if (Math.abs(x - cx) === 1 && Math.abs(y - cy) === 1) return [[cx, cy]];
  }

}
function jgNewBoard() {
  const b = new Array(90).fill(null);
  const put = (x, y, t, s) => { b[idx(x, y)] = { t, s }; };
  /* 위(楚) — 차마상사·사상마차 */
  const back = ['R', 'N', 'B', 'A', null, 'A', 'B', 'N', 'R'];
  back.forEach((t, x) => { if (t) put(x, 0, t, 'cho'); });
  put(4, 1, 'K', 'cho');
  put(1, 2, 'C', 'cho'); put(7, 2, 'C', 'cho');
  [0, 2, 4, 6, 8].forEach(x => put(x, 3, 'P', 'cho'));
  /* 아래(漢) */
  back.forEach((t, x) => { if (t) put(x, 9, t, 'han'); });
  put(4, 8, 'K', 'han');
  put(1, 7, 'C', 'han'); put(7, 7, 'C', 'han');
  [0, 2, 4, 6, 8].forEach(x => put(x, 6, 'P', 'han'));
  return b;
}
/* 한 말이 갈 수 있는 자리들 (자기 왕의 안전은 따지지 않는다) */
function jgRaw(b, from) {
  const p = b[from]; if (!p) return [];
  const x = from % 9, y = (from / 9) | 0, out = [];
  const at = (xx, yy) => b[idx(xx, yy)];
  const push = (xx, yy) => {
    if (!onBoard(xx, yy)) return;
    const q = at(xx, yy);
    if (q && q.s === p.s) return;
    if (p.t === 'C' && q && q.t === 'C') return;      /* 포는 포를 먹지 못한다 */
    out.push(idx(xx, yy));

  const ORTH = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  if (p.t === 'K' || p.t === 'A') {
    for (const [dx, dy] of ORTH) { const nx = x + dx, ny = y + dy; if (inPalace(p.s, nx, ny)) push(nx, ny); }
    for (const [nx, ny] of jgDiag(x, y)) if (inPalace(p.s, nx, ny)) push(nx, ny);
    return out;
  }
  if (p.t === 'R') {
    for (const [dx, dy] of ORTH) {

      while (onBoard(nx, ny)) {
        const q = at(nx, ny);
        if (q) { if (q.s !== p.s) push(nx, ny); break; }
        push(nx, ny); nx += dx; ny += dy;
      }
    }
    /* 궁 안 대각선 — 비어 있으면 끝까지 */
    if (anyPalace(x, y)) {
      for (const [nx, ny] of jgDiag(x, y)) {

        if (q) { if (q.s !== p.s) push(nx, ny); continue; }

        const fx = nx + (nx - x), fy = ny + (ny - y);

    }
    /* 궁 대각선: 가운데에 다리가 있어야 한다 */
    if (anyPalace(x, y) && jgDiag(x, y).length === 1) {
      const [mx, my] = jgDiag(x, y)[0], m = at(mx, my);
      if (m && m.t !== 'C') {
        const fx = mx + (mx - x), fy = my + (my - y);
        if (anyPalace(fx, fy)) { const q = at(fx, fy); if (!q || (q.t !== 'C' && q.s !== p.s)) push(fx, fy); }

    return out;
  }
  if (p.t === 'N' || p.t === 'B') {
    const step = p.t === 'N' ? 1 : 2;                  /* 다리를 건넌 뒤 대각선 걸음 수 */
    for (const [dx, dy] of ORTH) {
      if (at(x + dx, y + dy) || !onBoard(x + dx, y + dy)) continue;   /* 첫 다리 */
      const diags = dx ? [[dx, -1], [dx, 1]] : [[-1, dy], [1, dy]];
      for (const [ex, ey] of diags) {
        let cx = x + dx, cy = y + dy, ok = true;
        for (let k = 0; k < step; k++) {

          if (!onBoard(cx, cy)) { ok = false; break; }
          if (k < step - 1 && at(cx, cy)) { ok = false; break; }
        }
        if (ok) push(cx, cy);
      }
    }
    return out;
  }
  if (p.t === 'P') {
    const fwd = p.s === 'cho' ? 1 : -1;
    push(x, y + fwd); push(x - 1, y); push(x + 1, y);
    if (anyPalace(x, y)) for (const [nx, ny] of jgDiag(x, y)) if ((ny - y) === fwd) push(nx, ny);
    return out;
  }
  return out;
}

}

function jgBestMove(b, depth) {
  const moves = jgMoves(b, 'cho');
  if (!moves.length) return null;
  moves.sort((a, z) => (JG_VAL[z.cap] || 0) - (JG_VAL[a.cap] || 0));
  let best = null, bv = -1e9;
  for (const m of moves) {
    const keep = b[m.to]; b[m.to] = b[m.from]; b[m.from] = null;
    let v = (keep && keep.t === 'K') ? 90000 : jgSearch(b, depth - 1, -1e9, 1e9, 'han');
    b[m.from] = b[m.to]; b[m.to] = keep;
    v += Math.random() * 3;                             /* 같은 값이면 손맛대로 */
    if (v > bv) { bv = v; best = m; }
  }
  return best;
}

function jgClick(i) {
  if (JG.over || JG.thinking || JG.turn !== 'han') return;
  const p = JG.b[i];
  if (JG.sel >= 0 && JG.moves.indexOf(i) >= 0) { jgPlay(JG.sel, i); return; }
  if (p && p.s === 'han') {
    JG.sel = i;
    JG.moves = jgMoves(JG.b, 'han').filter(m => m.from === i).map(m => m.to);
    SND.select ? SND.select() : SND.ui();
    jgDraw(); return;
  }
  JG.sel = -1; JG.moves = []; jgDraw();
}
function jgPlay(from, to) {
  JG.hist = JG.hist || [];
  JG.hist.push({ b: JG.b.map(c => c ? { t: c.t, s: c.s } : null), taken: JG.taken.slice() });
  if (JG.hist.length > 12) JG.hist.shift();
  jgApply(from, to);
  JG.sel = -1; JG.moves = [];
  if (jgFinish()) return;
  JG.turn = 'cho'; JG.thinking = true; jgDraw();
  jgSay(['"흠."', '"허어."', '"제법이군."', '"…….', '"거기였나."'][Math.floor(Math.random() * 5)].replace('.','.'));
  setTimeout(() => {
    if (G.scene !== 'janggi') { JG.thinking = false; return; }
    const m = jgBestMove(JG.b, 3);
    JG.thinking = false;
    if (!m) { jgEnd(true); return; }
    jgApply(m.from, m.to);
    if (jgFinish()) return;
    JG.turn = 'han'; jgDraw();
    if (jgInCheck(JG.b, 'han')) { SND.bell(); jgSay('"장군일세."'); }
  }, 420);
}
function jgApply(from, to) {
  const cap = JG.b[to];
  JG.b[to] = JG.b[from]; JG.b[from] = null;
  JG.last = { from, to };
  if (cap) {
    JG.taken.push(cap);
    SND.jgCapture(); FX.burst(innerWidth / 2, innerHeight / 2, 8, '120,70,30', 3, 30, 3);
    const b2 = $('#jg_board');
    if (b2) { b2.classList.remove('jshake'); void b2.offsetWidth; b2.classList.add('jshake'); }
  } else SND.jgMove();
  jgDraw();
}
/* 판이 끝났는지 — 왕이 잡혔거나, 둘 데가 없거나 */
function jgFinish() {
  const choK = jgKingAt(JG.b, 'cho'), hanK = jgKingAt(JG.b, 'han');
  if (choK < 0) { jgEnd(true); return true; }
  if (hanK < 0) { jgEnd(false); return true; }
  const side = JG.turn === 'han' ? 'cho' : 'han';       /* 방금 둔 쪽의 상대 */
  if (!jgMoves(JG.b, side).length) { jgEnd(side === 'cho'); return true; }
  return false;
}
function jgEnd(win) {
  JG.over = true; JG.thinking = false; jgDraw();
  if (win) {

    FX.gold(innerWidth / 2, innerHeight * .45, 60);

}

function janggiLoot() {
  const run = G.run;
  if (rnd() < JANGGI_CARD_CHANCE) {
    const c = mkCard('janggi', false);
    return { g: '將', n: '장기(將棋)', grade: 'unknown', jackpot: true,
      d: `<b style="color:#7b4bd8">?급</b> — ` + CARDS.janggi.txt(CARDS.janggi.v(false), false).replace(/<[^>]+>/g, ''),
      take: () => { run.deck.push(c); run.stats.cards++; dexAdd('cards', 'janggi'); } };
  }
  const r = rnd();
  if (r < .18 && GRADE_POOL.special.length) {
    const id = pick(GRADE_POOL.special);
    return { g: CARDS[id].g, n: CARDS[id].n, grade: 'special',
      d: `<b style="color:${GRADE[CARDS[id].rar].c}">S급</b> — ` + CARDS[id].txt(CARDS[id].v(false), false).replace(/<[^>]+>/g, ''),
      take: () => { run.deck.push(mkCard(id, false)); run.stats.cards++; dexAdd('cards', id); } };
  }
  if (r < .40) {
    const rid = randomRelic();
    if (rid) return { g: RELICS[rid].g, n: RELICS[rid].n, grade: rgrade(rid),
      d: `<b style="color:${GRADE[rgrade(rid)].c}">${GRADE[rgrade(rid)].n} 유물</b> — ` + RELICS[rid].d.replace(/<[^>]+>/g, ''),
      take: () => gainRelic(rid, true) };
  }
  if (r < .62) {
    const n = ri(260, 520);
    return { g: '玉', n: `다이아 ${n}`, d: '노인이 주머니를 털었다', take: () => { run.dia = (run.dia || 0) + n; } };
  }
  if (r < .82) {
    const g = ri(180, 340);
    return { g: '金', n: `골드 ${g}`, d: '엽전 꾸러미', take: () => { run.gold += g; } };
  }
  const id = randomPotion();
  return { g: POTIONS[id].g, n: POTIONS[id].n, d: POTIONS[id].d.replace(/<[^>]+>/g, ''),
    take: () => { if (run.potions.length >= run.potSlots) run.gold += 80; else run.potions.push(id); } };
}

   SSX급 부적 셋을 갖춘 자만 들어간다. 라운드를 넘길수록 요괴가
   늘고 강해지며, 한 라운드마다 다이아 30이 적립된다.
   스스로 물러나면 적립분을 전액, 쓰러지면 절반만 받는다.
   체력은 들어오기 전으로 되돌아가므로 모험 자체는 끝나지 않는다.

const ARENA_DIA = 30;
const ARENA_REQ = 3;
function ssxCount() {
  if (!G.run) return 0;
  const seen = new Set();
  for (const c of G.run.deck) if (CARDS[c.id] && CARDS[c.id].rar === 'ssx') seen.add(c.id);
  return seen.size;
}
function arenaReady() { return ssxCount() >= ARENA_REQ; }

/* 라운드 편성 — 다섯 판마다 보스가 선다 */
function arenaWave(n) {
  const bossRound = n % 5 === 0;
  const pool = [];
  for (const a of [1, 2, 3, 4, 5, 6]) {
    const w = ENCOUNTERS[a];
    for (const g of w.normal) for (const id of g) pool.push(id);
    if (n >= 3) for (const g of w.elite) for (const id of g) pool.push(id);
  }
  const uniq = [...new Set(pool)];
  if (bossRound) {
    const bosses = [];
    for (const a of [1, 2, 3, 4, 5, 6]) bosses.push(...ENCOUNTERS[a].boss);
    const id = bosses[Math.min(bosses.length - 1, Math.floor((n / 5 - 1) % bosses.length))];
    return { ids: [id], boss: true };
  }
  const count = Math.min(5, 2 + Math.floor(n / 2));
  const ids = [];
  for (let i = 0; i < count; i++) ids.push(pick(uniq));
  return { ids, boss: false };
}
function arenaScale(n) {
  return { hpMul: +(1 + 0.30 * (n - 1)).toFixed(2), str: Math.floor((n - 1) / 2), dex: Math.floor((n - 1) / 3) };
}
function arenaPreview(n) {
  const w = arenaWave(n), sc = arenaScale(n);

}

function startArenaRound() {
  const run = G.run;
  if (!arenaReady()) { SND.err(); toast(`SSX급 부적이 ${ARENA_REQ}종 있어야 한다`); return; }
  run.arenaRound = run.arenaRound || 1;
  if (run.arenaHp == null) run.arenaHp = run.hp;      /* 들어오기 전 체력을 기억한다 */
  if (run.arenaDia == null) run.arenaDia = 0;
  const { w, sc } = arenaPreview(run.arenaRound);
  closeOverlay();
  startBattle(w.ids, 'arena', sc);
  setTimeout(() => {
    const n = el('div', 'aroundbig', '제 ' + run.arenaRound + ' 라운드');
    $('#app').appendChild(n); setTimeout(() => n.remove(), 1600);
    SND.gong();
  }, 260);
}
function arenaWin() {
  const run = G.run;
  if (!run) return;
  if (P()) run.hp = P().hp;
  run.arenaDia = (run.arenaDia || 0) + ARENA_DIA;
  run.arena.cleared = (run.arena.cleared || 0) + 1;
  run.arena.best = Math.max(run.arena.best || 0, run.arenaRound);
  META.arenaBest = Math.max(META.arenaBest || 0, run.arenaRound); saveMeta();
  run.arenaRound++;
  G.b = null;
  SND.victory();
  const p = modal(`<h2>제 ${run.arenaRound - 1} 라운드 돌파</h2>
    <div class="hint">다이아 <b style="color:#6fd0e8">+${ARENA_DIA}</b> 적립 · 누적 <b style="color:#6fd0e8">${run.arenaDia}</b>
      · 체력 <b>${run.hp} / ${run.maxHp}</b></div>
    <div class="hint" style="color:#e0a06a">다음은 제 ${run.arenaRound} 라운드 — 요괴가 더 늘어난다</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="brush-btn red" id="aw_go">계속 싸운다</button>
      <button class="brush-btn ghost" id="aw_stop" style="color:#e9dfc9;border-color:#8a7f68">물러난다 (${run.arenaDia} 수령)</button>
    </div>`);
  p.querySelector('#aw_go').onclick = () => { closeTop(); startArenaRound(); };
  p.querySelector('#aw_stop').onclick = () => { closeTop(); arenaRetire(); };
  saveRun();
}
function arenaLose() {
  const run = G.run;
  const half = Math.floor((run.arenaDia || 0) / 2);
  const round = run.arenaRound || 1;
  run.hp = Math.max(1, run.arenaHp || run.maxHp);     /* 들어오기 전 체력으로 */
  run.dia = (run.dia || 0) + half;
  run.arenaDia = 0; run.arenaRound = 1; run.arenaHp = null;
  G.b = null;
  SND.lose();
  const p = modal(`<h2>쓰 러 졌 다</h2>
    <div class="hint">제 ${round} 라운드에서 멈췄다 · 적립분의 절반 <b style="color:#6fd0e8">다이아 ${half}</b>만 받는다</div>
    <div class="hint">체력은 들어오기 전으로 되돌아간다 — <b>모험은 끝나지 않았다</b></div>
    <button class="brush-btn red" id="al_ok">돌아간다</button>`);
  p.querySelector('#al_ok').onclick = () => { closeTop(); renderTop(); saveRun(); showMap(); };
}
function arenaRetire() {
  const run = G.run;
  const got = run.arenaDia || 0;
  run.dia = (run.dia || 0) + got;
  run.hp = Math.max(1, Math.min(run.hp, run.arenaHp || run.hp));
  run.arenaDia = 0; run.arenaRound = 1; run.arenaHp = null;
  closeOverlay();
  SND.coin(); toast(`다이아 ${got} 을(를) 챙겨 물러났다`);
  renderTop(); saveRun(); showMap();
}

/* ── 유물 조합 화면 ─────────────────────────────────────── */
function openFuse() {
  if (G.b) { SND.err(); toast('싸우는 중에는 할 수 없다'); return; }
  SND.ui(); showFuse();
}
function showFuse() {
  const run = G.run;
  const have = new Set(run.relics.map(r => r.id));
  const ready = FUSIONS.filter(f => have.has(f.a) && have.has(f.b));

  const p = modal(`<h2>유물 조합</h2>
    <div class="hint">재료 둘을 태워 <b style="color:#ff2d55">SSX급</b> 유물 하나로 만든다 ·
      지금 지닌 유물 <b>${run.relics.length} / ${RELIC_SLOTS}</b>
      ${ready.length ? ` · <b style="color:#ffd76a">${ready.length}개 조합 가능</b>` : ''}</div>
    <div class="fusehead">지 닌 유 물</div>
    <div class="relicgrid" id="fz_mine"></div>
    <div class="fusehead">조 합 표</div>
    <div class="fusewrap" id="fz_list"></div>
    <button class="brush-btn" id="fz_close">닫기</button>`);

  const mine = p.querySelector('#fz_mine');
  if (!run.relics.length) mine.innerHTML = '<div style="color:#8f846d">아직 유물이 없다</div>';
  for (const r of run.relics) {
    const d = RELICS[r.id];
    const n = el('div', 'rtile g-' + rgrade(r.id), `<b>${d.g}</b><span>${d.n}</span>`);
    bindTip(n, () => `<b>${d.n}</b> · ${GRADE[rgrade(r.id)].n}<br>${d.d}`);
    mine.appendChild(n);
  }

  const list = p.querySelector('#fz_list');
  const sorted = FUSIONS.slice().sort((x, y) => {
    const rx = (have.has(x.a) && have.has(x.b)) ? 0 : (have.has(x.a) || have.has(x.b)) ? 1 : 2;
    const ry = (have.has(y.a) && have.has(y.b)) ? 0 : (have.has(y.a) || have.has(y.b)) ? 1 : 2;
    return rx - ry;
  });
  for (const f of sorted) {
    const ok = have.has(f.a) && have.has(f.b);
    const row = el('div', 'fuserow' + (ok ? ' ready' : ''));
    const tile = (id, dim) => {
      const d = RELICS[id];
      const n = el('div', 'rtile g-' + rgrade(id) + (dim ? ' dim' : ''), `<b>${d.g}</b><span>${d.n}</span>`);
      bindTip(n, () => `<b>${d.n}</b> · ${GRADE[rgrade(id)].n}<br>${d.d}`);
      return n;
    };
    row.appendChild(tile(f.a, !have.has(f.a)));
    row.appendChild(el('div', 'plus', '＋'));
    row.appendChild(tile(f.b, !have.has(f.b)));
    row.appendChild(el('div', 'arrow', '→'));
    row.appendChild(tile(f.to, !ok));
    const btn = el('button', 'fbtn', ok ? '조합한다' : '재료 부족');
    btn.disabled = !ok;
    btn.onclick = () => { closeTop(); doFuse(f); setTimeout(showFuse, 700); };
    row.appendChild(btn);
    list.appendChild(row);
  }
  p.querySelector('#fz_close').onclick = closeTop;
}

/* --- 상점 ---------------------------------------------------
   재고는 모험 상태에 저장된다. 창을 닫았다 다시 열어도 같은 물건이며,
   막이 바뀌거나 지도의 상점 노드를 밟으면 새로 채워진다.
   ----------------------------------------------------------- */
function restockShop() {
  const run = G.run;
  run.merch = pick(MERCH_IDS);                 /* 상점마다 다른 사람이 앉는다 */
  run.betDone = false;
  const mm = MERCHANTS[run.merch].mul;
  const price = v => pipe('modPrice', Math.round(v * mm));
  const cards = [], seen = new Set();
  const w = gradeWeights('elite');            /* 상인은 한 등급 앞서 판다 */
  let guard = 0;
  while (cards.length < 5 && guard++ < 200) {
    const id = randomCard(w); if (seen.has(id)) continue; seen.add(id);
    const up = rnd() < .12;
    const base = { common: 52, uncommon: 78, rare: 135 }[CARDS[id].rar];
    cards.push({ id, up, p: price(Math.round(base * (up ? 1.5 : 1) * (.9 + rnd() * .3))), sold: false });
  }
  const relics = [];
  for (let i = 0; i < 2; i++) {
    const id = randomRelic();
    if (id && !relics.some(r => r.id === id))
      relics.push({ id, p: price({ common: 145, uncommon: 190, rare: 265, boss: 300 }[RELICS[id].rar]), sold: false });
  }
  const pots = [];
  for (let i = 0; i < 3; i++) {
    const id = randomPotion();
    pots.push({ id, p: price({ common: 52, uncommon: 78, rare: 112 }[POTIONS[id].rar]), sold: false });
  }
  run.shop = { cards, relics, pots, purged: false, boxSold: false };
}

const MERCH_IDS = Object.keys(MERCHANTS);
/* 이번 상점의 주인 */
function merchOf(run) {
  if (!run.merch || !MERCHANTS[run.merch]) run.merch = pick(MERCH_IDS);

/* ── 부적 내기 ───────────────────────────────────────────

const BET_GOLD = 80;
function cardPower(c) { return (AUTO_RANK[CARDS[c.id].rar] || 0) * 12 + (c.up ? 5 : 0) + ri(0, 9); }
/* 상인의 패 — 자네가 지닌 것과 비슷한 것을 꺼낸다 (등급 분포를 따른다) */
function betFoeCard(mine) {
  const rar = CARDS[pick(mine).id].rar;
  const pool = Object.keys(CARDS).filter(i => CARDS[i].rar === rar);
  return { uid: -77, id: pool.length ? pick(pool) : 'strike', up: rnd() < .2 };
}

function showShop() {
  G.scene = 'shop';
  const run = G.run;
  if (!run.shop) restockShop();
  const sh = run.shop;
  const purgePrice = pipe('modPrice', 72 + (run.purges || 0) * 20);
  const relicBoxPrice = pipe('modPrice', 165);

  const m = merchOf(run);
  run.merchMet = run.merchMet || {};
  const met = run.merchMet[m.id] || 0;
  run.merchMet[m.id] = met + 1;
  const line = met === 0 ? m.hi : (m.tale[Math.min(m.tale.length - 1, met - 1)] || m.again);
  function draw() {
    const p = overlay(`<h2>${m.n}</h2>
      <div class="merchtop">
        <div class="mface" style="--mc:${m.col}">${m.g}</div>
        <div class="msay">${line}<span class="mtag">${m.mul < 1 ? '값이 싸다' : m.mul > 1 ? '값이 비싸다' : '보통 값'}

      <div class="hint">보유 골드 <b style="color:#e8c86a">${run.gold}</b>
        · 다이아 <b style="color:#6fd0e8">${run.dia || 0}</b></div>
      <div class="shopgrid">
        <div class="shopcol"><h3>부 적</h3><div class="cardgrid" style="max-width:640px;max-height:52vh"></div></div>
        <div class="shopcol"><h3>물 건</h3><div class="rewardrow" style="width:330px"></div></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="brush-btn" id="sh_bet"${run.betDone ? ' disabled' : ''}>부적 내기 (${BET_GOLD})</button>
        <button class="brush-btn red" id="sh_leave">떠난다</button>
      </div>`);
    p.dataset.shop = '1';                     /* 자동 플레이는 남의 지갑을 열지 않는다 */
    const g = p.querySelector('.cardgrid');
    sh.cards.forEach(it => {
      const holder = el('div', 'priced');
      const card = { uid: -100 - sh.cards.indexOf(it), id: it.id, up: it.up };
      const n = cardNode(card);
      if (it.sold) n.classList.add('dim');
      holder.appendChild(n);
      holder.appendChild(el('div', 'pricetag' + (run.gold < it.p || it.sold ? ' no' : ''), it.sold ? '판매됨' : it.p + ' 골드'));
      if (!it.sold) {
        n.classList.add('pick');
        n.onclick = () => buy(it.p, () => {
          it.sold = true; run.deck.push(mkCard(it.id, it.up)); run.stats.cards++;
          dexAdd('cards', it.id); toast(`${cname(card)} 구입`);
        });
      }
      g.appendChild(holder);
    });
    const row = p.querySelector('.rewardrow');
    const addRow = (ic, t, sub, pr, sold, fn) => {
      const n = el('div', 'rewitem' + (sold ? ' taken' : ''),
        `<div class="ic">${ic}</div><div class="t"><b>${t}</b><small>${sub}</small></div>
         <div style="color:${run.gold >= pr && !sold ? '#9d7c2e' : '#b0553f'};font-size:14px;white-space:nowrap">${sold ? '판매됨' : pr + ' 골드'}</div>`);
      if (!sold) n.onclick = () => buy(pr, fn);
      row.appendChild(n);
    };
    sh.relics.forEach(it => addRow(RELICS[it.id].g, RELICS[it.id].n, RELICS[it.id].d.replace(/<[^>]+>/g, ''), it.p, it.sold,
      () => { it.sold = true; gainRelic(it.id); }));
    sh.pots.forEach(it => addRow(POTIONS[it.id].g, POTIONS[it.id].n, POTIONS[it.id].d.replace(/<[^>]+>/g, ''), it.p, it.sold,
      () => { if (run.potions.length >= run.potSlots) { toast('물약을 더 지닐 수 없다'); return false; } it.sold = true; run.potions.push(it.id); }));
    addRow('寶', '유물 상자', '무작위 유물 하나가 나온다', relicBoxPrice, sh.boxSold,
      () => { sh.boxSold = true;
        const l = boxLoot(4); l.take();
        toast(`${l.n} 획득`); SND.bell(); });
    addRow('淨', '부적 태우기', '덱에서 카드 한 장을 없앤다', purgePrice, sh.purged,
      async () => {
        const c = await pickFromList(run.deck, '없앨 카드를 고르시오', { cancel: true });
        if (!c) { draw(); return false; }
        run.deck.splice(run.deck.findIndex(x => x.uid === c.uid), 1);
        run.purges = (run.purges || 0) + 1; sh.purged = true;
        toast(`${CARDS[c.id].n} 제거`);
      });
    p.querySelector('#sh_leave').onclick = () => { closeOverlay(); saveRun(); showMap(); };
    const bb = p.querySelector('#sh_bet');
    if (bb) bb.onclick = () => { if (run.betDone) { SND.err(); toast('한 상점에 한 번뿐일세'); return; }
      SND.ui(); showBet(() => draw()); };
  }
  async function buy(cost, fn) {
    if (run.gold < cost) { SND.err(); toast('골드가 모자란다'); return; }
    const r = await fn();
    if (r === false) return;
    run.gold -= cost; SND.coin(); saveRun(); renderTop(); draw();
  }
  draw();
}

   ══════════════════════════════════════════════════════════ */
const CURSE_ROUNDS = 20;                       /* 견뎌야 하는 전투 수 */
const CURSE_COOLDOWN = 7 * 24 * 3600 * 1000;   /* 이레에 한 번 */
const CURSES = {};
function defCurse(o) { CURSES[o.id] = o; return o; }
