    screenFlash('rgba(255,215,140,.24)', 520); blink(.9);
    sparkles(innerWidth / 2, innerHeight * .42, 16, '#ffe0a0', 180);
  }
  const vm = vipOn() ? 1.2 : 1;               /* VIP 은 전리품이 두둑하다 */
  const gold = Math.round((kind === 'boss' ? ri(70, 95) : kind === 'elite' ? ri(30, 45) : ri(12, 22)) * vm);
  const dia = Math.round((kind === 'boss' ? ri(120, 200) : kind === 'elite' ? ri(50, 90) : ri(12, 28)) * vm);
  const broke = curseTag('nogold');            /* 탐욕의 저주 — 한 푼도 남지 않는다 */
  const items = [{ ic: '金', t: broke ? '골드 (재가 된다)' : `골드 ${gold}`,
      s: broke ? '손에 닿자마자 흩어진다' : '주머니가 무거워진다',
      act: () => { if (broke) { SND.err(); floatText(P() || { el: null }, '', ''); toast('탐욕의 저주 — 골드가 재가 되었다'); return; }
                   run.gold += gold; run.stats.gold += gold; SND.coinRain(gold / 12);
                   flyGet('金 +' + gold, '#ffd76a', '#goldv'); } },
    { ic: '玉', t: broke ? '다이아 (재가 된다)' : `다이아 ${dia}`,
      s: broke ? '손에 닿자마자 흩어진다' : '상자를 여는 값',
      act: () => { if (broke) { SND.err(); toast('탐욕의 저주 — 다이아가 재가 되었다'); return; }
                   run.dia = (run.dia || 0) + dia; SND.coinRain(dia / 20);
                   flyGet('玉 +' + dia, '#6fd0e8', '#diav'); } }];
  const potChance = kind === 'elite' ? .62 : kind === 'boss' ? 1 : .42;
  if (rnd() < potChance && run.potions.length < run.potSlots) {
    const pid = randomPotion();
    items.push({ ic: POTIONS[pid].g, t: POTIONS[pid].n, s: POTIONS[pid].d.replace(/<[^>]+>/g, ''),
      act: () => { if (run.potions.length >= run.potSlots) { toast('물약을 더 지닐 수 없다'); return false; }
        run.potions.push(pid); SND.heal(); flyGet(POTIONS[pid].g, '#7fe6cf', '#potbar'); } });
  }
  /* 엘리트가 이따금 S급을 남긴다 — 그 판은 부적 보상 자체가 S급으로 바뀐다.
     제7막부터는 그 S급이 40% 확률로 한 등급 위인 SSC급이 된다. */
  const sDrop = kind === 'elite' && run.act >= SPECIAL_DROP_FROM
    && GRADE_POOL.special.length && rnd() < specialDropRate(run.act);
  const sscDrop = sDrop && run.act >= SSC_DROP_FROM && GRADE_POOL.ssc.length && rnd() < .4;
  const dropPool = sscDrop ? GRADE_POOL.ssc : GRADE_POOL.special;
  const dropName = sscDrop ? 'SSC급' : 'S급';
  if (kind === 'elite') {
    const rid = randomRelic();
    if (rid) items.push({ ic: RELICS[rid].g, t: RELICS[rid].n, s: RELICS[rid].d.replace(/<[^>]+>/g, ''), act: () => gainRelic(rid) });
  }
  /* 막을 넘어선 값 — 뒤로 갈수록 크게 얹어 준다 (제6막에는 없다) */
  if (kind === 'boss' && ACT_CLEAR_BOX[run.act]) {
    const cnt = ACT_CLEAR_BOX[run.act];
    items.push({ ic: '櫃', t: `특대급 상자 ${cnt}회`, cls: 'sgift',
      s: `제${run.act}막을 넘어선 값 · 특별 부적만 나온다`,
      act: async () => { await freeBigBox(cnt); return true; } });
  }
  /* 제9막을 넘어서면 SSX급 유물 둘 */
  if (kind === 'boss' && FUSED_GIFT_ACTS.indexOf(run.act) >= 0) {
    items.push({ ic: '融', t: 'SSX급 유물 2개', cls: 'sgift cgift',
      s: '제9막을 넘어선 값 · 가장 높은 자리의 유물이다',
      act: async () => { await grantFusedRelics(2); return true; } });
  }
  if (kind === 'boss' && run.act === 1 && !autoOk()) {
    items.push({ ic: '自', t: '자동 플레이 개방', s: '제1막을 넘어선 값 · 앞으로 모든 모험에서 쓸 수 있다',
      cls: 'gift', act: () => { unlockAuto(); } });
  }
  if (kind === 'boss') {
    items.push({ ic: '寶', t: '보스의 유물', s: '셋 중 하나를 고른다', act: async () => { await pickBossRelic(); } });
    if (randomSkill()) items.push({ ic: '祕', t: '비기 전수', s: '1등급 이상 셋 중 하나를 익힌다', act: async () => { await pickSkill(); } });
  }
  const n = Math.max(1, 3 - (run.rewardCut || 0));
  const cards = sDrop ? sample(dropPool, Math.min(3, dropPool.length)).map(id => mkCard(id, false))
                      : rewardCards(n, kind === 'normal' ? null : kind);
  const un = unlockedGrades(kind === 'normal' ? null : kind).map(r => GRADE[r].n).join(' · ');
  const nx = nextUnlock();
  items.push({ ic: sDrop ? (sscDrop ? 'C' : 'S') : '牌',
    t: sDrop ? `${dropName} 부적 고르기` : '부적 한 장 고르기',
    cls: sDrop ? (sscDrop ? 'sgift cgift' : 'sgift') : '',
    s: sDrop ? `${cards.length}장 중 하나 · 엘리트가 남긴 ${sscDrop ? '푸른' : '불타는'} 부적`
             : `${cards.length}장 중 하나 · 지금 나오는 등급 ${un}` + (nx ? ` (${nx.left}층 뒤 ${nx.n})` : ''),
    act: async () => {
      const c = await pickFromList(cards, sDrop ? `${dropName} 부적 하나를 고르시오` : '한 장을 고르시오',
        { cancel: true, hint: sDrop ? (sscDrop ? '청람빛이 돈다' : '불타는 부적이다') : '건너뛰어도 좋다' });
      if (c) { run.deck.push(mkCard(c.id, c.up)); run.stats.cards++; dexAdd('cards', c.id);
               if (sDrop) { SND.unlock(); screenFlash(sscDrop ? 'rgba(60,200,230,.4)' : 'rgba(255,150,60,.4)', 620); blink(1); }
               toast(`${cname(c)} 획득`); }
      return true;
    } });

  const p = overlay(`<h2>승 리</h2><div class="hint">전리품을 챙기시오</div>
     <div class="rewardrow"></div>
     <div class="rewbtns">
       <button class="brush-btn gold" id="rw_all">모두 받기</button>
       <button class="brush-btn red" id="rw_done">${kind === 'boss' && G.run.act >= LAST_ACT ? '정상으로' : '길을 나선다'}</button>
     </div>`, '');
  const row = p.querySelector('.rewardrow');
  const nodes = [];
  const allBtn = p.querySelector('#rw_all');
  const syncAll2 = () => {
    const left = nodes.filter(([n2]) => !n2.classList.contains('taken')).length;
    allBtn.textContent = left ? `모두 받기 (${left})` : '다 챙겼다';
    allBtn.disabled = !left;
  };
  const take = async (n2, it) => {
    if (n2.classList.contains('taken')) return false;
    const r = await it.act(it);
    if (r !== false) { n2.classList.add('taken'); renderTop(); }
    return r !== false;
  };
  items.forEach(it => {
    const n2 = el('div', 'rewitem' + (it.cls ? ' ' + it.cls : ''), `<div class="ic">${it.ic}</div><div class="t"><b>${it.t}</b><small>${it.s}</small></div>`);
    n2.onclick = async () => { await take(n2, it); syncAll2(); };
    row.appendChild(n2);
    nodes.push([n2, it]);
  });
  /* 한 번에 다 챙긴다 — 골라야 하는 것은 순서대로 창을 띄운다 */
  allBtn.onclick = async () => {
    if (allBtn.dataset.busy) return;
    allBtn.dataset.busy = '1'; allBtn.disabled = true;
    SND.coin();
    for (const [n2, it] of nodes) {
      if (n2.classList.contains('taken')) continue;
      await take(n2, it);
      await new Promise(r => setTimeout(r, 90));
    }
    delete allBtn.dataset.busy;
    syncAll2();
  };
  syncAll2();
  /* 초반에는 그냥 지나치려 할 때 한 번 붙잡는다 — 뒤가 가팔라진다.
     잦다는 말을 들어 제2막까지로 줄였다. */
  const WARN_UNTIL = 2;
  const leftItems = () => [...p.querySelectorAll('.rewardrow .rewitem:not(.taken)')].length;
  const doLeave = () => {
    /* 그냥 지나쳤더라도 제1막을 넘었으면 자동 플레이는 준다 */
    if (kind === 'boss' && run.act === 1) unlockAuto(true);
    closeOverlay(); saveRun();
    if (kind === 'boss') {
      const act = G.run.act;
      const key = act >= LAST_ACT
        ? (STORY['end_' + G.run.bossPick] ? 'end_' + G.run.bossPick : 'end_taecho')
        : ('act' + act);
      showStory(STORY[key] ? key : null).then(() => { if (act >= LAST_ACT) victory(); else nextAct(); });
    }
    else showMap();
  };
  p.querySelector('#rw_done').onclick = () => {
    const n = leftItems();
    if (n > 0 && run.act <= WARN_UNTIL && !AUTO.on) {
      SND.err();
      const q = modal(`<h2>그냥 가려는가</h2>
        <div class="hint" style="max-width:440px">아직 챙기지 않은 것이 <b style="color:#ffd76a">${n}가지</b> 남았다.<br>
          <b style="color:#ff8a9a">다음 층부터 요괴가 굵어진다.</b> 지금 챙길 수 있는 것은 챙겨 두는 편이 낫다.</div>
        <div class="hint" style="color:#8d8367">이 안내는 제${WARN_UNTIL}막까지만 뜬다</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="brush-btn" id="rw_take">모두 챙긴다</button>
          <button class="brush-btn red" id="rw_go">그래도 나선다</button>
        </div>`);
      q.dataset.noauto = '1';
      q.querySelector('#rw_take').onclick = () => { closeTop(); allBtn.click(); };
      q.querySelector('#rw_go').onclick = () => { closeTop(); doLeave(); };
      return;
    }
    doLeave();
  };
  renderTop();
}
/* 보스가 내어 주는 비기 — 막에 따라 등급이 열린다.
   ?급 회광반조는 제10막을 넘어선 사람에게만 나온다. */
const SKILL_GATE = { basic: 1, common: 1, uncommon: 2, rare: 4, special: 7, ssc: 10, ssx: 13, unknown: 17 };
async function pickSkill() {
  const act = (G.run && G.run.act) || 1;
  const good = Object.keys(SKILL_GATE).filter(r => act >= SKILL_GATE[r]);
  let pool = ALL_SKILLS.filter(id => (G.run.skills || []).indexOf(id) < 0 && good.indexOf(SKILLS[id].rar) >= 0);
  if (!pool.length) pool = ALL_SKILLS.filter(id => (G.run.skills || []).indexOf(id) < 0 && good.indexOf(SKILLS[id].rar) >= 0);
  if (!pool.length) pool = ALL_SKILLS.filter(id => (G.run.skills || []).indexOf(id) < 0);
  const cand = sample(pool, 3);
  if (!cand.length) { G.run.dia = (G.run.dia || 0) + 300; toast('다이아 300을 얻었다'); return; }
  return new Promise(res => {
    const p = modal(`<h2>비기 전수</h2><div class="hint">하나만 익힐 수 있다 ·
      지금 열린 등급 ${good.map(r => GRADE[r].n).join(' · ')}</div>
      <div class="skillgrid"></div>`);
    p._esc = () => res();
    const g = p.querySelector('.skillgrid');
    for (const id of cand) {
      const d = SKILLS[id];
      const n = el('div', 'stile g-' + d.rar,
        `<div class="sg" style="--gc:${GRADE[d.rar].c}">${GRADE[d.rar].n}</div><b>${d.g}</b>
         <div class="sn">${d.n}</div><div class="sd">${d.d.replace(/<br>\s*/g, ' ')}</div>`);
      n.onclick = () => { p._esc = null; gainSkill(id); G.run.skill = id; closePanel(p); renderTop(); res(); };
      g.appendChild(n);
    }
  });
}
async function pickBossRelic() {
  const owned = new Set(G.run.relics.map(r => r.id));
  const cand = RELIC_POOL.boss.filter(id => !owned.has(id));
  const three = sample(cand, 3);
  if (!three.length) { G.run.gold += 100; toast('골드 100을 얻었다'); return; }
  return new Promise(res => {
    const p = modal(`<h2>보스의 유물</h2><div class="hint">하나만 가질 수 있다</div><div class="rewardrow"></div>`);
    p._esc = () => res();
    const row = p.querySelector('.rewardrow');
    for (const id of three) {
      const d = RELICS[id];
      const n = el('div', 'rewitem', `<div class="ic">${d.g}</div><div class="t"><b>${d.n}</b><small>${d.d.replace(/<[^>]+>/g, '')}</small></div>`);
      n.onclick = () => { p._esc = null; closePanel(p); gainRelic(id); renderTop(); res(); };
      row.appendChild(n);
    }
  });
}

/* ══ 장기 상점 ═════════════════════════════════════════════
   장기판 위에 말이 놓여 있고, 말 하나가 물건 하나를 판다.
   물건은 아래 표만 채우면 된다 — todo:true 인 자리는 '준비 중'.
   { piece:'車', side:'red'|'green', x:0~8, y:0~9,
     n:'이름', d:'설명', price:골드, dia:다이아, buy(){ ... } }
   ═══════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════
   장기(將棋) — 노인과의 한 판
   ──────────────────────────────────────────────────────────
   9줄 × 10줄. 아래가 나(漢), 위가 노인(楚).
   車 馬 象 士 包 卒 의 규칙을 모두 지키고, 궁(宮) 안의 대각선도 산다.
   노인은 알파-베타 가지치기를 붙인 미니맥스로 세 수 앞을 본다.
   ══════════════════════════════════════════════════════════ */
const JG_GLYPH = {
  cho: { K: '楚', A: '士', R: '車', N: '馬', B: '象', C: '包', P: '卒' },
  han: { K: '漢', A: '士', R: '車', N: '馬', B: '象', C: '包', P: '兵' }
};
const JG_VAL = { K: 10000, R: 130, C: 70, N: 50, B: 30, A: 30, P: 20 };
const JG_NAME = { K: '왕', A: '사', R: '차', N: '마', B: '상', C: '포', P: '졸' };
const idx = (x, y) => y * 9 + x;
const onBoard = (x, y) => x >= 0 && x < 9 && y >= 0 && y < 10;
const inPalace = (s, x, y) => x >= 3 && x <= 5 && (s === 'cho' ? y <= 2 : y >= 7);
const anyPalace = (x, y) => x >= 3 && x <= 5 && (y <= 2 || y >= 7);
/* 궁 안 대각선으로 이어진 자리 */
function jgDiag(x, y) {

    return { g: '玉', n: `다이아 ${n}`, d: '노인이 주머니를 털었다', take: () => { run.dia = (run.dia || 0) + n; } };

    return { g: '金', n: `골드 ${g}`, d: '엽전 꾸러미', take: () => { run.gold += g; } };

    take: () => { if (run.potions.length >= run.potSlots) run.gold += 80; else run.potions.push(id); } };

/* ══ 대전투장(大鬪場) ══════════════════════════════════════

function ssxCount() {
  if (!G.run) return 0;
  const seen = new Set();
  for (const c of G.run.deck) if (CARDS[c.id] && CARDS[c.id].rar === 'ssx') seen.add(c.id);
  return seen.size;
}
function arenaReady() { return ssxCount() >= ARENA_REQ; }

/* 라운드 편성 — 다섯 판마다 보스가 선다 */
function arenaWave(n) {
  const bossRound = n % 5 === 0;
  const pool = [];
  for (const a of [1, 2, 3, 4, 5, 6]) {
    const w = ENCOUNTERS[a];
    for (const g of w.normal) for (const id of g) pool.push(id);
    if (n >= 3) for (const g of w.elite) for (const id of g) pool.push(id);
  }
  const uniq = [...new Set(pool)];
  if (bossRound) {
    const bosses = [];
    for (const a of [1, 2, 3, 4, 5, 6]) bosses.push(...ENCOUNTERS[a].boss);
    const id = bosses[Math.min(bosses.length - 1, Math.floor((n / 5 - 1) % bosses.length))];
    return { ids: [id], boss: true };
  }
  const count = Math.min(5, 2 + Math.floor(n / 2));
  const ids = [];
  for (let i = 0; i < count; i++) ids.push(pick(uniq));
  return { ids, boss: false };
}
function arenaScale(n) {
  return { hpMul: +(1 + 0.30 * (n - 1)).toFixed(2), str: Math.floor((n - 1) / 2), dex: Math.floor((n - 1) / 3) };
}
function arenaPreview(n) {
  const w = arenaWave(n), sc = arenaScale(n);
  return { w, sc };
}

function startArenaRound() {
  const run = G.run;
  if (!arenaReady()) { SND.err(); toast(`SSX급 부적이 ${ARENA_REQ}종 있어야 한다`); return; }

  if (run.arenaHp == null) run.arenaHp = run.hp;      /* 들어오기 전 체력을 기억한다 */
  if (run.arenaDia == null) run.arenaDia = 0;
  const { w, sc } = arenaPreview(run.arenaRound);
  closeOverlay();
  startBattle(w.ids, 'arena', sc);
  setTimeout(() => {
    const n = el('div', 'aroundbig', '제 ' + run.arenaRound + ' 라운드');
    $('#app').appendChild(n); setTimeout(() => n.remove(), 1600);
    SND.gong();
  }, 260);
}
/* 깊이 들어갈수록 한 라운드의 값이 오른다 — 욕심에 값을 매긴다 */
function arenaPay(round) { return ARENA_DIA + Math.max(0, round - 1) * 5; }
function arenaWin() {
  const run = G.run;
  if (!run) return;
  if (P()) run.hp = P().hp;
  const pay = arenaPay(run.arenaRound || 1);
  run.arenaDia = (run.arenaDia || 0) + pay;
  META.jp += ARENA_JP; META.jpTotal += ARENA_JP;      /* 대전투장도 정진이 쌓인다 */
  run.arena.cleared = (run.arena.cleared || 0) + 1;
  run.arena.best = Math.max(run.arena.best || 0, run.arenaRound);
  META.arenaBest = Math.max(META.arenaBest || 0, run.arenaRound); saveMeta();
  run.arenaRound++;
  G.b = null;
  SND.victory();
  const p = modal(`<h2>제 ${run.arenaRound - 1} 라운드 돌파</h2>
    <div class="hint">다이아 <b style="color:#6fd0e8">+${pay}</b> 적립 · 누적 <b style="color:#6fd0e8">${run.arenaDia}</b>
      · 정진 <b style="color:#ffd76a">+${ARENA_JP}</b>
      · 체력 <b>${run.hp} / ${run.maxHp}</b></div>
    <div class="hint" style="color:#e0a06a">다음은 제 ${run.arenaRound} 라운드 — 요괴가 더 늘어난다</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="brush-btn red" id="aw_go">계속 싸운다</button>
      <button class="brush-btn ghost" id="aw_stop" style="color:#e9dfc9;border-color:#8a7f68">물러난다 (${run.arenaDia} 수령)</button>
    </div>`);
  p.querySelector('#aw_go').onclick = () => { closeTop(); startArenaRound(); };
  p.querySelector('#aw_stop').onclick = () => { closeTop(); arenaRetire(); };
  saveRun();
}
function arenaLose() {
  battleWatch(false);

  const half = Math.floor((run.arenaDia || 0) / 2);
  const round = run.arenaRound || 1;
  run.hp = Math.max(1, run.arenaHp || run.maxHp);     /* 들어오기 전 체력으로 */
  run.dia = (run.dia || 0) + half;

  G.b = null;
  SND.lose();
  const p = modal(`<h2>쓰 러 졌 다</h2>
    <div class="hint">제 ${round} 라운드에서 멈췄다 · 적립분의 절반 <b style="color:#6fd0e8">다이아 ${half}</b>만 받는다</div>

function arenaRetire() {

/* ── 유물 조합 화면 ─────────────────────────────────────── */
function openFuse() {
  if (G.b) { SND.err(); toast('싸우는 중에는 할 수 없다'); return; }
  SND.ui(); showFuse();
}
function showFuse() {
  const run = G.run;
  const have = new Set(run.relics.map(r => r.id));
  const ready = FUSIONS.filter(f => have.has(f.a) && have.has(f.b));

  const p = modal(`<h2>유물 조합</h2>
    <div class="hint">재료 둘을 태워 <b style="color:#ff2d55">SSX급</b> 유물 하나로 만든다 ·
      지금 지닌 유물 <b>${run.relics.length} / ${RELIC_SLOTS}</b>
      ${ready.length ? ` · <b style="color:#ffd76a">${ready.length}개 조합 가능</b>` : ''}</div>
    <div class="fusehead">지 닌 유 물</div>
    <div class="relicgrid" id="fz_mine"></div>
    <div class="fusehead">조 합 표</div>
    <div class="fusewrap" id="fz_list"></div>
    <button class="brush-btn" id="fz_close">닫기</button>`);

  const mine = p.querySelector('#fz_mine');
  if (!run.relics.length) mine.innerHTML = '<div style="color:#8f846d">아직 유물이 없다</div>';
  for (const r of run.relics) {
    const d = RELICS[r.id];
    const n = el('div', 'rtile g-' + rgrade(r.id), `<b>${d.g}</b><span>${d.n}</span>`);
    bindTip(n, () => `<b>${d.n}</b> · ${GRADE[rgrade(r.id)].n}<br>${d.d}`);
    mine.appendChild(n);
  }

  const list = p.querySelector('#fz_list');
  const sorted = FUSIONS.slice().sort((x, y) => {
    const rx = (have.has(x.a) && have.has(x.b)) ? 0 : (have.has(x.a) || have.has(x.b)) ? 1 : 2;
    const ry = (have.has(y.a) && have.has(y.b)) ? 0 : (have.has(y.a) || have.has(y.b)) ? 1 : 2;
    return rx - ry;
  });
  for (const f of sorted) {
    const ok = have.has(f.a) && have.has(f.b);
    const row = el('div', 'fuserow' + (ok ? ' ready' : ''));
    const tile = (id, dim) => {
      const d = RELICS[id];
      const n = el('div', 'rtile g-' + rgrade(id) + (dim ? ' dim' : ''), `<b>${d.g}</b><span>${d.n}</span>`);
      bindTip(n, () => `<b>${d.n}</b> · ${GRADE[rgrade(id)].n}<br>${d.d}`);
      return n;
    };
    row.appendChild(tile(f.a, !have.has(f.a)));
    row.appendChild(el('div', 'plus', '＋'));
    row.appendChild(tile(f.b, !have.has(f.b)));
    row.appendChild(el('div', 'arrow', '→'));
    row.appendChild(tile(f.to, !ok));
    const btn = el('button', 'fbtn', ok ? '조합한다' : '재료 부족');
    btn.disabled = !ok;
    btn.onclick = () => { closeTop(); doFuse(f); setTimeout(showFuse, 700); };
    row.appendChild(btn);
    list.appendChild(row);
  }
  p.querySelector('#fz_close').onclick = closeTop;
}

/* --- 상점 ---------------------------------------------------
   재고는 모험 상태에 저장된다. 창을 닫았다 다시 열어도 같은 물건이며,
   막이 바뀌거나 지도의 상점 노드를 밟으면 새로 채워진다.
   ----------------------------------------------------------- */
function restockShop() {
  const run = G.run;
  run.merch = pick(MERCH_IDS);                 /* 상점마다 다른 사람이 앉는다 */
  run.betDone = false;
  run.talkNow = {};                            /* 말은 만날 때마다 다시 두 마디 */
  run.talkCut = 0;
  /* 앞서 이 상인을 빈손으로 지나쳤다면 그 값을 여기서 치른다 */
  const mm = MERCHANTS[run.merch].mul * snubMul(run, run.merch);
  const price = v => pipe('modPrice', Math.round(v * mm));
  const cards = [], seen = new Set();
  const w = gradeWeights('elite');            /* 상인은 한 등급 앞서 판다 */
  let guard = 0;
  while (cards.length < 5 && guard++ < 200) {
    const id = randomCard(w); if (seen.has(id)) continue; seen.add(id);
    const up = rnd() < .12;
    const base = { common: 52, uncommon: 78, rare: 135 }[CARDS[id].rar];
    cards.push({ id, up, p: price(Math.round(base * (up ? 1.5 : 1) * (.9 + rnd() * .3))), sold: false });
  }
  const relics = [];
  for (let i = 0; i < 2; i++) {
    const id = randomRelic();
    if (id && !relics.some(r => r.id === id))
      relics.push({ id, p: price({ common: 145, uncommon: 190, rare: 265, boss: 300 }[RELICS[id].rar]), sold: false });
  }
  const pots = [];
  for (let i = 0; i < 3; i++) {
    const id = randomPotion();
    pots.push({ id, p: price({ common: 52, uncommon: 78, rare: 112 }[POTIONS[id].rar]), sold: false });
  }
  run.shop = { cards, relics, pots, purged: false, boxSold: false };
}

/* ── 말을 건다 ────────────────────────────────────────────

/* 말로 얻은 할인을 지금 진열대에 매긴다 */
function restockShopPrices() {
  const run = G.run, sh = run.shop; if (!sh) return;
  const k = 1 - Math.min(.45, run.talkCut || 0);
  const cut = v => Math.max(1, Math.round(v * k));
  if (sh._cutAt === run.talkCut) return;
  sh._cutAt = run.talkCut;
  sh.cards.forEach(it => { it.p = cut(it.p0 || (it.p0 = it.p)); });
  sh.relics.forEach(it => { it.p = cut(it.p0 || (it.p0 = it.p)); });
  sh.pots.forEach(it => { it.p = cut(it.p0 || (it.p0 = it.p)); });
}

/* 지금 걸린 저주가 이 표를 지녔는가 */
function curseTag(t) {
  const c = G.run && G.run.curse;
  return !!(c && c.left > 0 && CURSES[c.id] && CURSES[c.id].tags.indexOf(t) >= 0);
}
function hasBoon(b) { return !!(G.run && G.run.boons && G.run.boons.indexOf(b) >= 0); }
function curseLeft() { const c = G.run && G.run.curse; return c ? c.left : 0; }
function curseReady() { return Date.now() - (META.curseAt || 0) >= CURSE_COOLDOWN; }
function curseWaitDays() { return Math.ceil((CURSE_COOLDOWN - (Date.now() - (META.curseAt || 0))) / (24 * 3600 * 1000)); }

/* 저주를 받는다 */
function takeCurse(id) {
  const run = G.run, d = CURSES[id];
  if (!d || run.curse) return;
  run.curse = { id, left: CURSE_ROUNDS };
  META.curseAt = Date.now(); saveMeta();
  if (d.tags.indexOf('lesshp') >= 0) {
    run.curseHp = run.maxHp;
    run.maxHp = Math.max(20, Math.round(run.maxHp * .6));
    run.hp = Math.min(run.hp, run.maxHp);
  }
  SND.boss(); SND.err();
  screenFlash('rgba(120,20,60,.55)', 900); shake(true);
  FX.burst(innerWidth / 2, innerHeight / 2, 60, '140,30,70', 7, 60, 6);
  toast(`${d.n} — ${CURSE_ROUNDS}판을 견뎌라`);
  saveRun(); renderTop();
}
/* 전투가 끝날 때마다 하루가 간다 */
function curseTick() {
  const run = G.run; if (!run || !run.curse || run.curse.left <= 0) return;
  run.curse.left--;
  const d = CURSES[run.curse.id];
  if (run.curse.left > 0) {
    if (run.curse.left <= 3) { SND.heartbeat(); toast(`저주가 풀리기까지 ${run.curse.left}판`); }
    return;
  }
  /* 견뎌 냈다 */
  run.boons = run.boons || [];
  if (run.boons.indexOf(d.boon) < 0) run.boons.push(d.boon);
  if (d.tags.indexOf('lesshp') >= 0 && run.curseHp) {
    run.maxHp = Math.round(run.curseHp * 1.6);
    run.hp = Math.min(run.maxHp, run.hp + Math.round(run.curseHp * .6));
    run.curseHp = 0;
  }
  else if (d.boon === 'hp60') { run.maxHp = Math.round(run.maxHp * 1.6); }
  if (d.boon === 'qi3') run.maxEnergy += 3;
  run.curse = null;
  SND.unlock(); SND.gong();
  screenFlash('rgba(255,220,140,.6)', 1300); shake(true);
  FX.gold(innerWidth / 2, innerHeight * .42, 80);
  flash('저주를 이겨 냈다');
  setTimeout(() => {

const ALL_SKINS = Object.keys(SKINS);
/* 스킨을 입힐 수 있는 등급 */
const SKINNABLE = ['special', 'ssc', 'ssx', 'unknown'];
function skinnable(id) { return CARDS[id] && SKINNABLE.indexOf(CARDS[id].rar) >= 0; }
/* 이 부적을 위한 이 옷을 가지고 있는가.
   옛 저장에서 '옷 자체'로 가지고 있던 것은 free 로 옮겨 어느 부적에나 입힌다. */
function ownSkin(cardId, skinId) {
  if (!META.skins) return false;
  if (META.skins.free && META.skins.free[skinId]) return true;
  return !!META.skins.own[cardId + '|' + skinId];
}
function skinOf(cardId) {
  if (!skinnable(cardId)) return null;          /* S급 아래에는 입히지 않는다 */
  const e = META.skins && META.skins.eq[cardId];
  return e && SKINS[e] && ownSkin(cardId, e) ? e : null;
}
/* 어느 부적을 위한 어느 옷인가 — 이 한 벌이 소유의 단위다 */
function skinKey(cardId, skinId) { return cardId + '|' + skinId; }
function gainSkin(cardId, skinId, silent) {
  META.skins.own[skinKey(cardId, skinId)] = (META.skins.own[skinKey(cardId, skinId)] || 0) + 1;
  saveMeta();
  if (!silent) { SND.unlock(); toast(`${CARDS[cardId].n}을 위한 ${SKINS[skinId].n}`); }
  return META.skins.own[skinKey(cardId, skinId)] === 1;
}
function equipSkin(cardId, skinId) {
  if (!META.skins) return false;
  if (skinId && !ownSkin(cardId, skinId)) return false;   /* 그 부적을 위한 옷이 아니면 못 입힌다 */
  if (skinId && !skinnable(cardId)) return false;         /* S급 아래에는 입히지 않는다 */
  if (skinId) META.skins.eq[cardId] = skinId; else delete META.skins.eq[cardId];
  saveMeta();
  return true;
}
function skinCount() { return Object.keys(META.skins ? META.skins.own : {}).length; }
/* 이 부적을 위해 가진 옷들 */
function skinsFor(cardId) { return ALL_SKINS.filter(sk => ownSkin(cardId, sk)); }
/* 옷을 입힐 수 있는 부적 전부 */
function skinnableCards() {
  return Object.keys(CARDS).filter(id => skinnable(id));
}
const SKIN_PAIRS = () => skinnableCards().length * ALL_SKINS.length;
/* 스킨 상자에서 하나 — 이제 「어느 부적을 위한 어느 옷」이 통째로 나온다 */
function skinLoot() {
  const w = [{ w: 44, r: 'common' }, { w: 33, r: 'uncommon' }, { w: 18, r: 'rare' }, { w: 5, r: 'ssx' }];
  let pool = [], guard = 0;
  while (!pool.length && guard++ < 10) { const r = pickWeighted(w).r; pool = ALL_SKINS.filter(i => SKINS[i].rar === r); }
  if (!pool.length) pool = ALL_SKINS;
  const id = pick(pool), d = SKINS[id];
  /* 어느 부적을 위한 것인가 — 아직 안 가진 벌을 먼저 노린다 */
  const cards = skinnableCards();
  const fresh = cards.filter(c => !ownSkin(c, id));
  const cardId = fresh.length && rnd() < .88 ? pick(fresh) : pick(cards);
  const cd = CARDS[cardId];
  const dup = ownSkin(cardId, id);
  return { g: d.h, n: `${cd.n}의 ${d.n}`, grade: d.rar, skin: id, card: cardId,
    d: dup ? `<b style="color:${d.c}">이미 가진 한 벌</b> — 다이아 200으로 바꿔 준다`
           : `<b style="color:${d.c}">${GRADE[d.rar].n} 스킨</b> · <b style="color:${GRADE[cd.rar].c}">${cd.n}</b> 전용<br>` + d.d +
             ` <b style="color:#7fe6cf">· 도감에서 그 부적을 눌러 갈아입힌다</b>`,
    take: () => { if (dup) { G.run.dia = (G.run.dia || 0) + 200; } else gainSkin(cardId, id, true); } };
}
/* 스킨 고르는 창 — 도감의 부적 상세에서 연다.
   옷은 이제 「이 부적을 위한 것」만 입힐 수 있다. */
function showSkinPicker(cardId, after) {
  const d = CARDS[cardId];
  const mine = skinsFor(cardId);
  const p = modal(`<h2>${d.n} — 옷 갈아입히기</h2>
    <div class="hint">성능은 하나도 바뀌지 않는다 · <b style="color:var(--gold)">부적이 나갈 때의 빛깔도 이 옷을 따라간다</b><br>
      <b style="color:${GRADE[d.rar].c}">${d.n}</b>을 위해 가진 옷 <b>${mine.length}</b> / ${ALL_SKINS.length}
      · 모은 한 벌 ${skinCount()} / ${SKIN_PAIRS()}</div>
    <div class="skinstage" id="sk_stage"></div>
    <div class="skinrow" id="sk_row"></div>
    <button class="brush-btn" id="sk_close">닫기</button>`);
  p.dataset.noauto = '1';
  const stage = p.querySelector('#sk_stage'), row = p.querySelector('#sk_row');
  const draw = () => {
    stage.innerHTML = '';
    stage.appendChild(cardNode({ uid: -30, id: cardId, up: false }, { tip: false }));
    [...row.children].forEach(n => n.classList.toggle('on', (n.dataset.sk || '') === (skinOf(cardId) || '')));
  };
  const addTile = (id) => {
    const sd = id ? SKINS[id] : null;
    const has = !id || ownSkin(cardId, id);
    const t = el('div', 'skintile' + (id ? '' : ' plain') + (has ? '' : ' lock'),
      id ? `<div class="sh" style="--sc2:${has ? sd.c : '#6b6053'}">${has ? sd.h : '?'}</div>
            <b>${has ? sd.n : '???'}</b>
            <small style="color:${has ? GRADE[sd.rar].c : '#7a7263'}">${has ? GRADE[sd.rar].n : '없음'}</small>`
         : `<div class="sh" style="--sc2:#8a7f68">素</div><b>기본</b><small>본디 모습</small>`);
    t.dataset.sk = id || '';
    if (id) bindTip(t, () => has
      ? `<b style="color:${sd.c}">${sd.n} (${sd.h})</b> · ${GRADE[sd.rar].n} 스킨<br>${sd.d}`
      : `<b>${d.n}을 위한 ${sd.n}</b>을 아직 못 얻었다<br>
         <span style="color:#9a8d74">스킨 상자는 <b>부적 하나를 정해</b> 그 부적의 옷을 준다</span>`);
    t.onclick = () => {
      if (!has) { SND.err(); toast(`${d.n}을 위한 ${sd.n}이 아직 없다`); return; }
      if (!equipSkin(cardId, id)) { SND.err(); return; }
      SND.ui(); draw(); if (after) after();
    };
    row.appendChild(t);
  };
  addTile(null);
  for (const id of ALL_SKINS) addTile(id);
  if (!mine.length) row.appendChild(el('div', 'skinnone',
    `아직 <b>${d.n}</b>을 위한 옷이 없다 · 부적 뽑기(匣)의 <b>스킨 상자</b>에서 나온다`));
  draw();
  p.querySelector('#sk_close').onclick = closeTop;
}

const SPECIAL_DROP_FROM = 4;                 /* 이 막부터 엘리트가 내어 준다 */
const SSC_DROP_FROM = 7;                     /* 이 막부터는 그것이 SSC급으로 오르기도 한다 */

/* 막을 넘어선 값으로 주는 특대급 상자 횟수. 제6막만 비워 둔다 */
const ACT_CLEAR_BOX = { 5: 1, 7: 2, 8: 5, 11: 3, 13: 4, 16: 6, 18: 8, 21: 6, 23: 8 };
const FUSED_GIFT_ACTS = [9, 14, 19, 22, 24];         /* 이 막들을 넘으면 SSX급 유물 둘 */
/* 뽑기를 하지 않은 사람도 오를 수 있게, 제4막부터 조금씩 열어 준다 */
function specialDropRate(act) { return act >= 6 ? .35 : act >= 5 ? .30 : .20; }
/* 공짜 특대급 상자 한 번 — 연출까지 그대로 */
async function freeBigBox(times) {
  const B = BANNERS[3];
  const n = Math.max(1, times || 1);
  const items = [];
  let best = 0;
  for (let i = 0; i < n; i++) {
    const loot = boxLoot(B.tier);
    loot.take();
    const g = loot.grade || 'special';
    best = Math.max(best, GRADE_ORDER.indexOf(g));
    items.push({ g: loot.g, n: loot.n, d: loot.d, grade: g });
  }
  saveRun(); renderTop();
  await boxOpenScene(B.g, GRADE_ORDER[best] || 'special');
  return new Promise(res => showPullResult(items, () => res()));
}
/* SSX급(합쳐진) 유물 하나를 고른다 — randomRelic 은 이 칸을 일부러 빼므로 따로 본다 */
function randomFusedRelic() {
  const owned = new Set(G.run.relics.map(r => r.id));
  const cand = (RELIC_POOL.fused || []).filter(id => !owned.has(id));
  return cand.length ? pick(cand) : null;
}
/* SSX급 유물을 그냥 얹어 준다 — 제9막을 넘어선 값 */
async function grantFusedRelics(n) {
  let got = 0;
  for (let i = 0; i < n; i++) {
    const rid = randomFusedRelic() || randomRelic('boss') || randomRelic();
    if (!rid) break;
    gainRelic(rid, true); got++;
    toast(`SSX급 유물 — ${RELICS[rid].n}`);
    SND.unlock(); screenFlash('rgba(255,80,120,.34)', 560);
    await wait(420);
  }
  if (!got) { G.run.gold += 400; toast('가질 유물이 남지 않아 값으로 받았다 (+400 골드)'); }
  saveRun(); renderTop();
}

/* 상자 하나에서 나오는 것 */
function boxLoot(tier) {
  const run = G.run;
  /* 스킨 상자 */
  if (tier === 6) return skinLoot();
  /* 비기 상자 */
  if (tier === 5) {
    const r = rnd();
    const grade = r < .005 ? 'unknown' : r < .05 ? 'ssx' : r < .13 ? 'ssc' : r < .30 ? 'special'
                : r < .50 ? 'rare' : r < .73 ? 'uncommon' : 'common';
    let id = randomSkill(grade) || randomSkill();
    if (!id) { const g = ri(200, 320); return { g: '金', n: `골드 ${g}`, d: '더 배울 비기가 없다', take: () => { run.gold += g; } }; }
    const sd = SKILLS[id];
    return { g: sd.g, n: sd.n, grade: sd.rar,
      d: `<b style="color:${GRADE[sd.rar].c}">${GRADE[sd.rar].n} 비기</b> — ` + sd.d.replace(/<[^>]+>/g, ''),
      take: () => gainSkill(id, true) };
  }
  /* 유물 상자 — 유물만 나온다 */
  if (tier === 4) {
    const w = [{ w: 52, r: 'common' }, { w: 33, r: 'uncommon' }, { w: 15, r: 'rare' }];
    let rid = null, guard = 0;
    while (!rid && guard++ < 40) rid = randomRelic(pickWeighted(w).r);
    if (!rid) rid = randomRelic();
    if (!rid) { const g = ri(120, 200); return { g: '金', n: `골드 ${g}`, d: '가질 유물이 남지 않았다', take: () => { run.gold += g; } }; }
    return { g: RELICS[rid].g, n: RELICS[rid].n, grade: rgrade(rid),
      d: `<b style="color:${GRADE[rgrade(rid)].c}">${GRADE[rgrade(rid)].n} 유물</b> — ` + RELICS[rid].d.replace(/<[^>]+>/g, ''),
      take: () => gainRelic(rid, true) };
  }
  /* 특대급 — 반드시 특별 등급 부적. ?급 0.1% · SSX급 10% · SSC급 26% · 나머지 S급 */
  if (tier === 3) {
    const r = rnd();
    const grade = r < .001 && GRADE_POOL.unknown.length ? 'unknown'
                : r < .101 && GRADE_POOL.ssx.length ? 'ssx'
                : r < .361 && GRADE_POOL.ssc.length ? 'ssc' : 'special';
    const id = pick(GRADE_POOL[grade]);
    const up = grade === 'special' && rnd() < .35;
    const c = mkCard(id, up);
    return { g: CARDS[id].g, n: cname(c), grade, card: c,
      d: `<b style="color:${GRADE[grade].c}">${GRADE[grade].n}</b> — ` + CARDS[id].txt(cval(c), up).replace(/<[^>]+>/g, ''),
      take: () => { run.deck.push(mkCard(id, up)); run.stats.cards++; dexAdd('cards', id); } };
  }
  const w = [
    [{ w: 34, t: 'dia' }, { w: 26, t: 'card' }, { w: 26, t: 'potion' }, { w: 14, t: 'treasure' }],
    [{ w: 26, t: 'dia' }, { w: 34, t: 'card' }, { w: 18, t: 'potion' }, { w: 22, t: 'treasure' }],
    [{ w: 20, t: 'dia' }, { w: 42, t: 'card' }, { w: 10, t: 'potion' }, { w: 28, t: 'treasure' }]
  ][tier];
  const kind = pickWeighted(w).t;
  if (kind === 'dia') {
    const n = ri(40 + tier * 40, 90 + tier * 90);
    return { g: '玉', n: `다이아 ${n}`, d: '맑고 단단한 돌. 뽑기의 값으로 쓰인다.',
      take: () => { run.dia = (run.dia || 0) + n; } };
  }
  if (kind === 'card') {
    const special = (tier >= 1 && rnd() < .35) || rnd() < .15;
    const id = special && GRADE_POOL.special.length ? pick(GRADE_POOL.special) : pick(POOL.rare);
    const up = tier >= 2 && rnd() < .3;
    const c = mkCard(id, up);
    return { g: CARDS[id].g, n: cname(c), grade: CARDS[id].rar, card: c,
      d: `<b style="color:${GRADE[CARDS[id].rar].c}">${GRADE[CARDS[id].rar].n}</b> — ` + CARDS[id].txt(cval(c), up).replace(/<[^>]+>/g, ''),
      take: () => { run.deck.push(mkCard(id, up)); run.stats.cards++; dexAdd('cards', id); } };
  }
  if (kind === 'potion') {
    const id = randomPotion();
    return { g: POTIONS[id].g, n: POTIONS[id].n, d: POTIONS[id].d.replace(/<[^>]+>/g, ''),
      take: () => { if (run.potions.length >= run.potSlots) { run.gold += 60; } else run.potions.push(id); } };
  }
  const rid = randomRelic(tier >= 2 ? 'rare' : null) || randomRelic();
  if (!rid) { const g = ri(80, 160); return { g: '金', n: `골드 ${g}`, d: '엽전 꾸러미', take: () => { run.gold += g; } }; }
  return { g: RELICS[rid].g, n: RELICS[rid].n, d: RELICS[rid].d.replace(/<[^>]+>/g, ''),
    take: () => gainRelic(rid, true) };
}

/* 배너에서 등장하는 부적 목록 */
function bannerPool(tier) {
  if (tier === 4 || tier === 5 || tier === 6) return [];
  if (tier === 3) return GRADE_POOL.special.concat(GRADE_POOL.ssc, GRADE_POOL.ssx, GRADE_POOL.unknown);
  const base = POOL.rare.slice();
  if (tier >= 1) return base.concat(GRADE_POOL.special);
  return base;
}
function bannerRates(tier) {
  if (tier === 3) return [
    { g: 'special', p: '63.9%' }, { g: 'ssc', p: '26%' }, { g: 'ssx', p: '10%' }, { g: 'unknown', p: '0.1%' }];
  if (tier === 4) return [
    { g: 'common', p: '52%' }, { g: 'uncommon', p: '33%' }, { g: 'rare', p: '15%' }];
  if (tier === 5) return [
    { g: 'common', p: '28%' }, { g: 'uncommon', p: '24%' }, { g: 'rare', p: '22%' },
    { g: 'special', p: '17%' }, { g: 'ssc', p: '8%' }, { g: 'ssx', p: '4.5%' }, { g: 'unknown', p: '0.5%' }];
  if (tier === 6) return [
    { g: 'common', p: '44%' }, { g: 'uncommon', p: '33%' }, { g: 'rare', p: '18%' }, { g: 'ssx', p: '5%' }];
  return null;
}

/* 누적 보너스 지급 */
function grantMilestones(before, after) {
  const run = G.run, got = [];
  for (const m of MILESTONES) {
    if (before < m.at && after >= m.at) {
      const pool = GRADE_POOL[m.grade];
      if (!pool.length) continue;
      const id = pick(pool);
      run.deck.push(mkCard(id, false)); run.stats.cards++; dexAdd('cards', id);
      got.push({ g: CARDS[id].g, n: CARDS[id].n, grade: m.grade, bonus: true,
                 d: `${m.label} — ` + CARDS[id].txt(CARDS[id].v(false), false).replace(/<[^>]+>/g, '') });
    }
  }
  return got;
}

  async function doSummon(B, times) {
    const cost = BOX_FREE ? 0 : B.price * (times === 11 ? 9 : 1);

    run.dia = (run.dia || 0) - cost;
    const before = run.summons;
    const items = [];
    for (let i = 0; i < times; i++) {
      const loot = boxLoot(B.tier);
      loot.take();
      items.push({ g: loot.g, n: loot.n, d: loot.d, grade: loot.grade || null });
    }
    run.summons += times;
    run._boxAct = run.act;                 /* 이 막에서 열었다 — 권유가 뜨지 않는다 */
    markUsed('box'); boxCallHide();
    const bonus = grantMilestones(before % 100, run.summons % 100 === 0 ? 100 : (before % 100) + times);
    if (run.summons % 100 === 0 || (before % 100) + times >= 100) run.summons = ((before % 100) + times) % 100;
    saveRun(); renderTop();
    const all = items.concat(bonus);
    const best = all.reduce((a, it) => Math.max(a, GRADE_ORDER.indexOf(it.grade || 'basic')), -1);
    closeOverlay();
    await boxOpenScene(B.g, GRADE_ORDER[best] || 'special');
    showPullResult(all, () => draw());
  }

}

/* 상자가 흔들리다 터지는 연출 — 등급이 높을수록 오래 끌고 빛이 세다 */
function boxOpenScene(glyph, bestGrade) {
  return new Promise(res => {
    const hi = bestGrade === 'unknown' ? 3 : bestGrade === 'ssx' ? 2 : bestGrade === 'ssc' || bestGrade === 'special' ? 1 : 0;
    const sc = el('div', 'openscene');
    const color = ['#ffd76a', '#ff9c4a', '#ff2d55', '#b98cff'][hi];
    sc.innerHTML = `<div class="obox shake" style="border-color:${color}"><span>${glyph}</span></div>
      <div class="ohint">상 자 가 떨 린 다</div>`;
    for (let i = 0; i < 12; i++) {
      const ray = el('i', 'oray');
      ray.style.cssText = `--a:${i * 30}deg;transform:rotate(${i * 30}deg);animation-delay:${i * .012}s;` +
        `background:linear-gradient(transparent,${color},transparent)`;
      sc.appendChild(ray);
    }
    $('#app').appendChild(sc);
    const boxEl = sc.querySelector('.obox');
    const hint = sc.querySelector('.ohint');
    const suspense = 500 + hi * 420;          /* 좋은 게 나올수록 길게 뜸을 들인다 */
    let beat = 0;
    const tick = setInterval(() => { beat++; SND.drum(); if (beat > 2 + hi * 2) clearInterval(tick); }, 260);
    setTimeout(() => {
      boxEl.classList.remove('shake'); boxEl.classList.add('charge');
      hint.textContent = ['빛 이 새 어 나 온 다', '뜨 겁 다', '무 언 가 깨 어 난 다', '하 늘 이 갈 라 진 다'][hi];
      hint.style.color = color;
      SND.hiss({ dur: 1.05, vol: .12, freq: 300, to: 6000, filter: 'bandpass', q: 1.2, rev: .6 });
    }, suspense);
    setTimeout(() => {
      clearInterval(tick);
      sc.classList.add('bursting');
      boxEl.classList.remove('charge'); boxEl.classList.add('burst');
      hint.remove();
      const g = el('div', 'ograde', GRADE[bestGrade] ? GRADE[bestGrade].n : '');
      g.style.color = color; g.style.textShadow = `0 0 30px ${color},0 0 70px ${color}`;
      sc.appendChild(g);
      const cx = innerWidth / 2, cy = innerHeight / 2;
      FX.gold(cx, cy, 44);
      sparkles(cx, cy, 18 + hi * 10, hi === 3 ? '#d8b0ff' : hi === 2 ? '#ffb0c8' : '#ffe9a8', 130 + hi * 60);
      blink(.8 + hi * .45);
      if (hi >= 1) { lightBeam(cx, hi === 3 ? 'rgba(190,140,255,.6)' : 'rgba(255,200,120,.6)', 150); zoomPunch(); }
      if (hi >= 2) { FX.burst(cx, cy, 40, hi === 3 ? '150,90,255' : '255,60,110', 8, 60, 5);
        rgbSplit(); stampWord(hi === 3 ? '? 급' : 'SSX 급', hi === 3 ? '#b98cff' : '#ff2d55'); }
      shake(true);
      if (hi === 3) { screenFlash('radial-gradient(circle,rgba(255,255,255,.95),rgba(120,60,220,.8))', 900); SND.gong(); SND.thunder(); }
      else if (hi === 2) { screenFlash('rgba(255,90,130,.55)', 640); SND.gong(); }
      else if (hi === 1) { screenFlash('rgba(255,180,90,.4)', 480); SND.power(); }
      else SND.bell();
    }, suspense + 1050);
    setTimeout(() => { sc.remove(); res(); }, suspense + 2050);
  });
}

  const best = items.reduce((a, it) => {

  }, -1);
  const bestGrade = GRADE_ORDER[best];
  SND.coin();

  const p = modal(`<h2>뽑기 결과</h2>
    <div class="hint">${items.length}개를 얻었다${bestGrade === 'unknown' ? ' · <b style="color:#b98cff">?급 등장!</b>'
      : bestGrade === 'ssx' ? ' · <b style="color:#ff2d55">SSX급 등장!</b>' : ''}</div>
    <div class="pullgrid"></div>
    <button class="brush-btn red" id="pr_ok">확인</button>`);
  p._esc = () => { if (after) after(); };      /* Esc 로 닫혀도 뒷일은 이어진다 */
  const g = p.querySelector('.pullgrid');
  items.forEach((it, i) => {
    const gr = it.grade;
    const n = el('div', 'pullitem' + (gr ? ' p-' + gr : '') + (it.bonus ? ' p-bonus' : ''),
      `<div class="pg">${it.g}</div>
       ${gr ? `<div class="pb" style="--gc:${GRADE[gr].c}">${GRADE[gr].n}</div>` : ''}
       <div class="pn">${it.n}</div>`);
    n.style.animationDelay = (i * .07) + 's';
    bindTip(n, () => `<b>${it.n}</b><br>${it.d}`);
    g.appendChild(n);
  });
  p.querySelector('#pr_ok').onclick = () => { p._esc = null; closeTop(); if (after) after(); };
}

function showEvent() {
  G.scene = 'event';
  const run = G.run;
  let pool = EVENTS.filter(e => G.seen.events.indexOf(e.id) < 0);
  if (!pool.length) { G.seen.events = []; pool = EVENTS; }
  const ev = pick(pool);
  G.seen.events.push(ev.id);
  const opts = ev.opts(run);
  const p = overlay(`<div class="evtbox"><h2>${ev.t}</h2><div class="who">${ev.who}</div><p>${ev.d}</p><div class="opts"></div></div>`);
  const box = p.querySelector('.opts');
  opts.forEach(o => {
    const b = el('button', 'opt', `${o.t}<small>${o.s}</small>`);
    if (o.dis) b.disabled = true;
    b.onclick = async () => {
      box.querySelectorAll('button').forEach(x => x.disabled = true);
      await o.do();
      renderTop(); closeOverlay(); saveRun();
      if (run._forceElite) { run._forceElite = false; startBattle(pick(ENCOUNTERS[run.act].elite), 'elite'); }
      else showMap();
    };
    box.appendChild(b);
  });
}

function storyScene(kind) {

    tiger: ['#241a0e', '#0d0906'], dragon: ['#12141d', '#07080c'],
    gate: ['#1a1626', '#08070c'], dawn: ['#2c2418', '#100c07'],
    abyss: ['#0c0a14', '#030206'], first: ['#3a3222', '#1a1610'] }[kind] || ['#14110d', '#080706'];
  const mt = (fill, d, op) => `<path d="${d}" fill="${fill}" opacity="${op}"/>`;
  let art = '';
  switch (kind) {
    case 'abyss': {                       /* 무저갱 — 아래로 끝없이 */
      let rings = '';

        const rx = 460 - i * 48, ry = 150 - i * 15, cy = 300 + i * 30;

/* 한 글자씩 찍히는 이야기 화면 */
function showStory(key) {
  const pages = key && STORY[key];
  if (!pages || !pages.length) return Promise.resolve();
  return new Promise(done => {
    let i = 0, typing = null, finished = false;
    const sc = el('div', 'story');
    sc.innerHTML = `<div class="sart"></div><div class="svig"></div>
      <div class="sdust">${[...Array(22)].map((_, k) =>
        `<i style="left:${(k * 4.7 + (k % 3) * 9) % 100}%;bottom:-8px;` +
        `animation-duration:${(9 + (k % 5) * 4)}s;animation-delay:${(k * .7).toFixed(1)}s;` +
        `--dx:${((k % 7) - 3) * 22}px;width:${2 + (k % 3)}px;height:${2 + (k % 3)}px"></i>`).join('')}</div>
      <div class="swho"></div><div class="stitle"></div>
      <div class="stext"></div><div class="snext">눌러서 계속</div>
      <button class="sskip">건너뛰기</button>`;
    $('#app').appendChild(sc);
    const art = sc.querySelector('.sart'), who = sc.querySelector('.swho'),
      title = sc.querySelector('.stitle'), text = sc.querySelector('.stext'),
      next = sc.querySelector('.snext');

    function finish() {
      if (finished) return; finished = true;
      clearInterval(typing);
      sc.classList.add('fadeout');
      setTimeout(() => { sc.remove(); done(); }, 600);
    }
    function page() {
      const p = pages[i];
      art.innerHTML = storyScene(p.scene);
      art.classList.remove('kenburns'); void art.offsetWidth; art.classList.add('kenburns');
      who.textContent = p.who || '';
      title.textContent = p.title || '';
      title.style.display = p.title ? '' : 'none';
      next.style.opacity = '0';
      const full = p.t;
      let n = 0;
      clearInterval(typing);
      text.classList.remove('stext'); void text.offsetWidth; text.classList.add('stext');
      if (p.who) { who.style.animation = 'none'; void who.offsetWidth; who.style.animation = ''; }
      SND.hiss({ dur: .06, vol: .05, freq: 3000, filter: 'bandpass', q: 2 });
      typing = setInterval(() => {
        n += 1;
        text.innerHTML = full.slice(0, n).replace(/\n/g, '<br>') + (n < full.length ? '<span class="cur">▍</span>' : '');
        if (n % 3 === 0 && full[n - 1] && full[n - 1].trim())
          SND.blip(1400 + Math.random() * 400, { dur: .02, type: 'square', vol: .012 });
        if (n >= full.length) { clearInterval(typing); typing = null; next.style.opacity = ''; }
      }, 42);
    }
    function advance() {
      if (typing) {                       /* 타자 중이면 즉시 완성 */
        clearInterval(typing); typing = null;
        text.innerHTML = pages[i].t.replace(/\n/g, '<br>');
        next.style.opacity = '';
        return;
      }
      i++;
      if (i >= pages.length) { finish(); return; }
      SND.ui(); page();
    }
    sc.onclick = advance;
    sc.querySelector('.sskip').onclick = e => { e.stopPropagation(); finish(); };
    const key2 = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); } };
    addEventListener('keydown', key2);
    const origDone = done;
    done = () => { removeEventListener('keydown', key2); origDone(); };
    page();
  });
}

function gameOver() {
  battleWatch(false);
  /* 엘리트 앞에서 무너진 것을 세어 둔다 */
  if (G.run && G.run.inElite) {
    META.eliteFails = META.eliteFails || {};
    META.eliteFails[G.run.act] = (META.eliteFails[G.run.act] || 0) + 1;

  const score = (G.run.act - 1) * 12 + G.run.floor;
  META.best = Math.max(META.best, score); saveMeta();
  G.scene = 'over';

     다음 판에는 그 막의 요괴가 그만큼 눅어진다 */
  const gained = jpGain(G.run, false);

  const canReturn = !!G.cp;

      ${canReturn ? '<button class="brush-btn red" id="ov_back">그 갈림길로 돌아간다</button>' : ''}
      <button class="brush-btn gold" id="ov_train">수행터로 간다 (精 ${META.jp})</button>
      <button class="brush-btn ghost" id="ov_title" style="color:#e9dfc9;border-color:#7a6f5c">처음으로</button>
    </div>
    ${canReturn ? `<div style="color:#7d7261;font-size:12.5px;margin-top:4px">돌아가면 그 길에 들어서기 직전으로 되돌아가고,
      <b style="color:#d8a24a">체력이 ${REVIVE_HP} 로 채워진다</b></div>` : ''}`;
  s.appendChild(d);
  const back = d.querySelector('#ov_back');
  if (back) back.onclick = () => {
    d.remove(); closeOverlay();
    adoptRun(JSON.parse(G.cp));
    /* 표시점의 체력 그대로 돌려보내면 빈사로 되살아나 또 죽는다 —
       그 무한굴레를 끊으려고 숨을 돌릴 만큼은 채워 준다 */
    const rv = REVIVE_HP + ((G.run.train && G.run.train.revive) || 0);
    G.run.hp = Math.max(G.run.hp, Math.min(rv, G.run.maxHp));
    G.run.stats.revives++;

    toast(`숨을 고르고 다시 선다 — 체력 ${G.run.hp}`);
    saveRun(); showMap();
  };
  d.querySelector('#ov_train').onclick = () => showTraining();
  d.querySelector('#ov_title').onclick = () => { d.remove(); closeOverlay(); G.run = null; showTitle(); };

  p.dataset.noauto = '1';
  let tab = 'card';
  const grid = p.querySelector('#ad_grid'), find = p.querySelector('#ad_find');
  const draw = () => {
    const q = (find.value || '').trim();
    grid.innerHTML = '';
    const add = (g, n, sub, col, fn) => {
      const t = el('div', 'trtile adtile',
        `<div class="tg" style="background:radial-gradient(circle at 35% 28%,${col},#06120e);color:#eafff6">${g}</div>
         <div class="tn">${n}</div><div class="tv">${sub}</div><div class="tbuy">받는다</div>`);
      t.onclick = () => { fn(); SND.unlock(); saveRun(); saveMeta(); renderTop(); };
      grid.appendChild(t);
    };
    if (tab === 'card') {
      for (const id in CARDS) { const d = CARDS[id];
        if (d.rar === 'curse') continue;
        if (q && d.n.indexOf(q) < 0) continue;
        add(d.g, d.n, GRADE[d.rar].n, GRADE[d.rar].c, () => {
          if (!run) return; run.deck.push(mkCard(id, false)); run.stats.cards++; dexAdd('cards', id);
          toast(`${d.n} 획득`); });
      }
    } else if (tab === 'relic') {
      for (const id in RELICS) { const d = RELICS[id];
        if (q && d.n.indexOf(q) < 0) continue;
        add(d.g, d.n, GRADE[rgrade(id)].n, GRADE[rgrade(id)].c, () => {
          if (!run) return;
          if (run.relics.some(x => x.id === id)) { toast('이미 있다'); return; }
          run.relics.push({ id, used: false, isNew: true }); dexAdd('relics', id);
          const rd = RELICS[id]; if (rd.h && rd.h.onGain) rd.h.onGain(run.relics[run.relics.length - 1]);
          toast(`${d.n} 획득`); });
      }
    } else if (tab === 'skill') {
      for (const id of ALL_SKILLS) { const d = SKILLS[id];
        if (q && d.n.indexOf(q) < 0) continue;
        add(d.g, d.n, GRADE[d.rar].n, GRADE[d.rar].c, () => {
          gainSkill(id, true); if (run) run.skill = id; toast(`${d.n} 장착`); });
      }
    } else {
      for (const id of PET_POOL) { const d = ENEMIES[id];
        if (q && d.n.indexOf(q) < 0) continue;
        add(d.g, d.n, d.elite ? '엘리트' : '요괴', d.col, () => {
          gainPet(id, true); setPet(id); toast(`${d.n} 팻`); });
      }
    }
    if (!grid.children.length) grid.innerHTML = '<div class="petnone">찾는 것이 없다</div>';
  };
  draw();
  find.oninput = draw;
  p.querySelectorAll('.adtab').forEach(b => b.onclick = () => {
    p.querySelectorAll('.adtab').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); tab = b.dataset.t; draw();

  p.querySelector('#ad_go').onclick = () => {
    if (!run) { toast('모험 중에만'); return; }

    saveRun(); closeOverlay(); toast(`제${a}막으로`); showMap();

  p.querySelector('#ad_dia').onclick = () => { if (run) { run.dia = (run.dia || 0) + 99999; renderTop(); saveRun(); toast('다이아'); } };
  p.querySelector('#ad_jp').onclick = () => { META.jp += 99999; META.jpTotal += 99999; saveMeta(); toast('정진'); };
  p.querySelector('#ad_hp').onclick = () => { if (run) { run.hp = run.maxHp; if (P()) P().hp = run.hp; renderTop(); syncAll(); saveRun(); toast('체력'); } };
  p.querySelector('#ad_qi').onclick = () => { if (run) { run.maxEnergy += 3; renderTop(); saveRun(); toast('기 +3'); } };
  p.querySelector('#ad_all').onclick = () => {
    for (const id in CARDS) { if (CARDS[id].rar === 'curse') continue; dexAdd('cards', id); if (run) run.deck.push(mkCard(id, false)); }
    for (const id in RELICS) dexAdd('relics', id);
    for (const id of ALL_SKILLS) gainSkill(id, true);
    for (const cid of skinnableCards()) for (const sk of ALL_SKINS) META.skins.own[skinKey(cid, sk)] = 1;
    for (const id of PET_POOL) gainPet(id, true);
    META.cleared = LAST_ACT; META.pets.pulls = 0;
    saveMeta(); if (run) saveRun(); renderTop();
    SND.unlock(); toast('전부 넣었다');
  };
  p.querySelector('#ad_back').onclick = () => { closePanel(p); if (G.run && G.scene === 'map') showMap(); };
}
function redeemCode(raw) {
  const k = String(raw || '').trim().toLowerCase();
  if (!k) return { ok: false, msg: '코드를 적으시오' };
  const c = CODES[k];
  if (!c) return { ok: false, msg: '없는 코드다' };
  META.codes = META.codes || {};
  if (c.once && META.codes[k]) return { ok: false, msg: '이미 쓴 코드다' };
  META.codes[k] = Date.now(); saveMeta();
  const got = c.give();
  saveMeta();
  const tb = $('#topbar'); if (tb && G.run) { tb.remove(); renderTop(); }   /* 관리자 단추가 바로 보이도록 */
  toast(`${c.n} — ${got}`);
  return { ok: true, msg: `${c.n} · ${got}` };
}

  for (const gk of GRADE_ORDER.concat(['curse'])) {
    const box = p.querySelector(`.dexgrid[data-g="${gk}"]`);
    if (!box) continue;
    for (const id of byGrade[gk]) {
      const d = CARDS[id], known = !!META.dex.cards[id];
      box.appendChild(dexTile(known, d.g, d.n,
        `<b>${d.n}</b> · ${GRADE[d.rar].n} ${TYPE_NAME[d.type]}<br>${d.txt(d.v(false), false)}
         <br><span style="color:#8f846d">눌러서 자세히 보기</span>`,
        'gd_' + d.rar, () => showCardDetail(id)));
    }
  }
  const gr = p.querySelector('#dx_r');
  const rOrder = ['common', 'uncommon', 'rare', 'special', 'ssc', 'ssx'];
  relicIds.slice().sort((a, b) => rOrder.indexOf(rgrade(a)) - rOrder.indexOf(rgrade(b))).forEach(id => {
    const d = RELICS[id], known = !!META.dex.relics[id], g = rgrade(id);
    gr.appendChild(dexTile(known, d.g, d.n,
      `<b>${d.n}</b> · <span style="color:${GRADE[g].c}">${GRADE[g].n} 유물</span>` +
      (d.rar === 'fused' ? ' <span style="color:#ffd76a">(합성)</span>' : '') + `<br>${d.d}`,
      'gd_' + g));
  });
  const gk = p.querySelector('#dx_sk');
  {
    const cards = skinnableCards();
    for (const id of ALL_SKINS) {
      const d = SKINS[id];
      const mine = cards.filter(c => ownSkin(c, id));
      const got = mine.length > 0;
      const n = el('div', 'dextile skintileD gd_' + d.rar + (got ? '' : ' unknown'),
        `<b style="${got ? `color:${d.c};text-shadow:0 0 12px ${d.c}99` : ''}">${got ? d.h : '?'}</b>
         <span>${got ? d.n : '???'}</span>
         <em class="skcnt" style="color:${got ? '#6fe0a8' : '#7a7263'}">${mine.length}/${cards.length}</em>`);
      bindTip(n, () => got
        ? `<b style="color:${d.c}">${d.n} (${d.h})</b> · ${GRADE[d.rar].n} 스킨<br>${d.d}
           <br><span style="color:#8f846d">입힐 수 있는 부적 ${mine.length}자루 —
           ${mine.slice(0, 6).map(c => CARDS[c].n).join(' · ')}${mine.length > 6 ? ' …' : ''}</span>`
        : `<b>아직 한 벌도 없는 옷</b><br><span style="color:#9a8d74">스킨 상자는
           <b>부적 하나를 정해</b> 그 부적의 옷을 준다</span>`);
      gk.appendChild(n);
    }
  }
  {
    const gp2 = p.querySelector('#dx_pt');
    for (const id of PET_POOL) {
      const d = ENEMIES[id];
      const has = !!(META.pets.own && META.pets.own[id]);
      const seen = !!META.dex.enemies[id];
      const rec = has ? META.pets.own[id] : null;
      const n = el('div', 'dextile gd_' + (d.elite ? 'rare' : 'uncommon') +
        (has ? '' : ' unknown') + (rec && rec.dead ? ' petgone' : ''),
        `<b style="${has ? `color:${d.col};text-shadow:0 0 12px ${d.col}99` : ''}">${seen ? d.g : '?'}</b>
         <span>${seen ? d.n : '???'}</span>`);
      bindTip(n, () => has
        ? `<b style="color:${d.col}">${d.n}</b> · 데려온 팻${activePet() === id ? ' <span style="color:#8fe6d0">(지금 데리고 다닌다)</span>' : ''}
           <br>쓰는 수: ${Object.keys(d.moves).map(k => d.moves[k].label).join(' · ')}
           ${rec.dead ? `<br><b style="color:#ff8a9a">쓰러졌다</b> · 엘리트 ${rec.need}마리 남음` : ''}`
        : seen
        ? `<b>${d.n}</b><br><span style="color:#9a8d74">길들일 수 있는 요괴다 — ≡ → 터 → 팻 우리에서 뽑는다</span>`
        : `<b>아직 만나지 못한 요괴</b>`);
      gp2.appendChild(n);
    }
  }
  const gs = p.querySelector('#dx_s');
  for (const id of ALL_SKILLS) {
    const d = SKILLS[id], known = !!META.dex.skills[id];
    gs.appendChild(dexTile(known, d.g, d.n,
      `<b>${d.n}</b> · <span style="color:${GRADE[d.rar].c}">${GRADE[d.rar].n} 비기</span><br>${d.d}`, 'gd_' + d.rar));
  }
  const ge = p.querySelector('#dx_e');
  for (const id of enemyIds) {
    const d = ENEMIES[id], known = !!META.dex.enemies[id];
    const moves = Object.keys(d.moves).map(k => d.moves[k].label).join(' · ');
    ge.appendChild(dexTile(known, d.g, d.n,
      `<b>${d.n}</b> · 체력 ${d.hp[0]}~${d.hp[1]}${d.boss ? ' · 보스' : d.elite ? ' · 엘리트' : ''}<br>행동: ${moves}`,
      d.boss ? 'e_boss' : d.elite ? 'e_elite' : ''));
  }
  p.querySelector('#dx_close').onclick = closeTop;
}

function showTutorial(fromHelp) {
  return new Promise(done => {

        </div>
      </div>

    $('#app').appendChild(sc);
    const body = sc.querySelector('#tu_body'), step = sc.querySelector('#tu_step'),
      dots = sc.querySelector('#tu_dots'), next = sc.querySelector('#tu_next'),
      prev = sc.querySelector('#tu_prev');

      META.tutorDone = true; saveMeta();
      sc.classList.add('fadeout');
      setTimeout(() => { sc.remove(); done(); }, 480);
    };
    function draw() {
      const d = TUTOR[i];
      step.textContent = `${i + 1} / ${TUTOR.length}`;
      body.innerHTML = `<div class="tuseal" style="--tc:${d.c}">${d.g}</div>
        <h3>${d.t}</h3>
        <p class="tulead">${d.b}</p>
        <ul class="tulist">${d.s.map(x => `<li>${x}</li>`).join('')}</ul>`;
      body.classList.remove('in'); void body.offsetWidth; body.classList.add('in');
      dots.innerHTML = TUTOR.map((_, k) => `<i class="${k === i ? 'on' : k < i ? 'past' : ''}"></i>`).join('');
      [...dots.children].forEach((n, k) => { n.onclick = () => { i = k; SND.ui(); draw(); }; });
      prev.style.visibility = i ? 'visible' : 'hidden';
      next.textContent = i === TUTOR.length - 1 ? '시작한다' : '다음';
      SND.select ? SND.select() : SND.ui();
    }
    next.onclick = () => { if (i === TUTOR.length - 1) { SND.gong(); finish(); } else { i++; draw(); } };
    prev.onclick = () => { if (i) { i--; draw(); } };
    sc.querySelector('#tu_skip').onclick = () => { SND.ui(); finish(); };
    const key = e => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next.click(); }
      else if (e.key === 'ArrowLeft') prev.click();
      else if (e.key === 'Escape') { e.preventDefault(); finish(); }

    const orig = done; done = () => { removeEventListener('keydown', key); orig(); };

  });

function showHelp(startTab) {

/* --- 타이틀 --- */
function showTitle() {
  G.scene = 'title'; G.b = null; _bgKey = ''; setBg(1); autoStop();
  const tb = $('#topbar'); if (tb) tb.remove();
  SND.ambience(false); SND.bgm(false);
  closeOverlay(); hideArrow();
  const s = $('#scene');
  s.innerHTML = `<div id="title-scene">
      <div class="title-seal"><span>百</span><span>鬼</span><span>夜</span><span>行</span></div>
      <h1>수 묵 로 그 라 이 크</h1>
      <div class="big">백귀야행</div>
      <div class="sub">퇴마사의 등산</div>
      <div class="menu">
        <button class="brush-btn red" id="t_new">새로운 모험</button>
        ${hasSave() ? '<button class="brush-btn" id="t_cont">이어서 오르기</button>' : ''}
        <button class="brush-btn gold" id="t_train">수행터${META.jp ? ` · 精 ${META.jp}` : ''}</button>
        <button class="brush-btn ghost" id="t_dex">도감</button>
        <button class="brush-btn ghost" id="t_tutor">첫걸음 (처음이라면)</button>
        <button class="brush-btn ghost" id="t_help">안내서</button>
        <button class="brush-btn ghost" id="t_set">설정</button>
      </div>
      <div class="foot">${META.runs ? `등반 ${META.runs}회 · 등정 ${META.wins}회 · 최고 기록 ${META.best}` : '한 판에 30~45분'}</div>
    </div>`;
  s.querySelector('#t_new').onclick = () => { SND.init(); SND.gong(); clearSave(); newRun(0); };
  s.querySelector('#t_help').onclick = () => { SND.init(); showHelp(); };
  /* 처음 오는 사람에게는 안내서를 권한다 */
  if (!META.runs && !hasSave()) setTimeout(() => {
    const n = $('#t_help'); if (n) { n.style.borderColor = '#e8c86a'; n.style.color = '#e8c86a';
      n.textContent = '안내서 (처음이신가요?)'; }
  }, 900);
  s.querySelector('#t_dex').onclick = () => { SND.init(); SND.ui(); showDex(); };
  s.querySelector('#t_train').onclick = () => { SND.init(); SND.ui(); showTraining(); };
  s.querySelector('#t_set').onclick = () => { SND.init(); SND.ui(); showSettings(); };
  s.querySelector('#t_tutor').onclick = () => { SND.init(); SND.ui(); showTutorial(true); };
  const c = s.querySelector('#t_cont');
  if (c) c.onclick = () => { SND.init(); SND.ui(); resumeRun(); };
}
function resumeRun() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d || !d.run) { toast('저장된 모험이 없다'); return; }
    /* 싸우다 말고 나갔다면, 그 갈림길에 들어서기 직전으로 되돌린다 */
    if (d.run.inBattle && d.cp) {
      adoptRun(JSON.parse(d.cp));
      G.run.inBattle = false;
      G.cp = d.cp;
      toast('싸우다 만 자리 — 그 갈림길로 되돌렸다');
    } else {
      adoptRun(d.run);
      G.cp = d.cp || null;
    }
    showMap();
  } catch (e) { console.error(e); toast('저장된 기록을 읽을 수 없다'); }
}

/* --- 키보드 --- */
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const o = $('#overlay'), top = o.lastElementChild;
    if (top) {
      if (top.dataset.modal) { closeTop(); return; }
      /* 화면 패널(사건·상점 따위)은 Esc 로 지우지 않는다 — 지우면 갈 곳이 없어진다.
         대신 메뉴를 위에 얹어, 어디서든 빠져나갈 길을 하나 남긴다. */
      if (G.run && !top.dataset.noesc) showMenu();
      return;
    }
    if (G.b && (G.b.sel || G.b.potSel != null)) { G.b.sel = null; hideArrow(); syncHand(); syncEnemies(); return; }
    if (G.run) showMenu();
    return;
  }
  if ((e.key === 'a' || e.key === 'A') && G.run && $('#overlay').style.display !== 'block') { autoToggle(); return; }
  if (!G.b || G.b.busy || G.b.over || $('#overlay').style.display === 'block') return;
  if (e.key >= '1' && e.key <= '9') {
    const c = G.b.hand[+e.key - 1];
    if (c) onCardClick(c);
  } else if (e.key === 'e' || e.key === 'E' || e.key === ' ') { e.preventDefault(); endTurn(); }
  else if (e.key === 'd' || e.key === 'D') showCardList(G.run.deck, '나의 덱');
});
addEventListener('resize', () => { if (G.b) syncHand(); if (G.scene === 'map' && _mapFit) _mapFit(); });
addEventListener('pointerdown', () => SND.init(), { once: true });

/* --- 시작 --- */
loadMeta();
FX.init();
showTitle();
syncAuto();
console.log('%c백귀야행 百鬼夜行', 'font-size:20px;color:#a8272c', '\n카드', Object.keys(CARDS).length,
  '· 유물', Object.keys(RELICS).length, '· 물약', Object.keys(POTIONS).length, '· 요괴', Object.keys(ENEMIES).length);

</script>
