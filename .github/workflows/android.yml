# 안드로이드판을 짓는다 — Capacitor
#
# 열쇠(서명)가 없으면 시험용 APK 만 짓고 끝낸다. 플레이 스토어에
# 올릴 AAB 는 서명이 있어야 하므로, 저장소 비밀 넷을 넣어 두면
# 그때부터 서명된 AAB 가 나온다.
#   ANDROID_KEYSTORE_B64   열쇠집(.jks)을 base64 로 옮긴 것
#   ANDROID_KEYSTORE_PASS  열쇠집 암호
#   ANDROID_KEY_ALIAS      열쇠 이름
#   ANDROID_KEY_PASS       열쇠 암호
name: 손전화판 짓기

on:
  push:
    branches: [main, master, claude/game-development-syhzcd]
    paths: ['game/**', 'app/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write        # 받을 수 있게 내놓으려면 쓰기가 있어야 한다

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }   # Capacitor 7 이 21 을 쓴다
      # android-actions/setup-android 은 쓰지 않는다 — 구글이 없앤 옛
      # 'tools' 패키지를 아직 받으려 해서 멎는다("Failed to find package
      # 'tools'"). 러너에 SDK 가 이미 깔려 있으니 그것을 쓰고, 모자란
      # 조각만 직접 챙긴다.
      - name: 안드로이드 SDK 를 챙긴다
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"      >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK"  >> $GITHUB_ENV
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$SM" ]; then echo "sdkmanager 를 찾지 못했다"; exit 1; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" || true
          ls "$SDK/platforms" || true

      - name: 껍데기 짐을 챙긴다
        run: npm install --no-audit --no-fund
      - name: 알맹이를 www 로 옮긴다
        run: npm run prepare:www
      - name: 안드로이드 판을 만든다
        run: npx cap add android && npx cap sync android
      - name: 아이콘·첫 화면을 굽는다
        run: npm run icons

      - name: 열쇠가 있는가
        id: k
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then echo "go=1" >> $GITHUB_OUTPUT
          else echo "서명 열쇠가 없어 시험용 APK 만 짓는다" >> $GITHUB_STEP_SUMMARY; fi

      # 폰에 바로 넣을 것은 언제나 이것이다. 서명 안 된 release APK 는
      # 설치가 안 되므로, 손에 쥘 물건은 debug 로 짓는다.
      - name: 폰에 넣을 APK
        run: cd android && ./gradlew --no-daemon assembleDebug

      - name: 열쇠를 풀어 둔다
        if: steps.k.outputs.go == '1'
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/key.jks

      - name: 서명된 AAB
        if: steps.k.outputs.go == '1'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/key.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KS_KEYPASS"

      - name: 열쇠를 치운다
        if: always()
        run: rm -f android/key.jks

      - uses: actions/upload-artifact@v4
        with:
          name: baekgwi-android
          path: |
            app/android/android/app/build/outputs/bundle/release/*.aab
            app/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ── 폰에서 바로 받게 내놓는다 ────────────────────────────
      # Actions 의 artifact 는 로그인해야 받을 수 있고 zip 으로 묶여
      # 나와서 폰에서 쓰기 나쁘다. 그래서 늘 같은 이름표(phone)를 단
      # 자리에 APK 를 그대로 걸어 둔다. 주소가 바뀌지 않으므로
      # 한 번 즐겨찾기 해 두면 다음부터는 그 자리에서 새것을 받는다.
      - name: 이름을 붙인다
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk baekgwi.apk
          ls -l baekgwi.apk
      - name: 받을 수 있게 내놓는다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phone --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create phone baekgwi.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "백귀야행 — 손전화판" \
            --notes "$(printf '%s\n' \
              '폰에서 이 자리를 열고 **baekgwi.apk** 를 누르면 받아진다.' \
              '' \
              '처음 한 번은 「이 출처의 앱 설치」를 켜 달라고 물을 것이다.' \
              '브라우저(크롬·삼성인터넷)에 허락을 주면 그대로 설치된다.' \
              '' \
              '- 값을 받는 자리는 아직 구글 결제에 물려 있지 않다 (물건 등록 전)' \
              '- 만든이 서명이 없어 「안전하지 않은 앱」이라고 한 번 물을 수 있다' \
              '' \
              "지은 때: $(date -u '+%Y-%m-%d %H:%M UTC') · $GITHUB_SHA")"
          echo "### 받는 자리" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/phone/baekgwi.apk" >> $GITHUB_STEP_SUMMARY
