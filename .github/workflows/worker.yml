# 값 치른 것을 확인해 주는 자리를 올린다 — Cloudflare Worker
name: 확인 서버 올리기

on:
  push:
    branches: [main, master, claude/game-development-syhzcd]
    paths: ['game/server/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # 열쇠가 없으면 조용히 넘어간다 — 없다고 붉은 표가 뜨지 않게
      - name: 열쇠가 있는가
        id: k
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "go=1" >> $GITHUB_OUTPUT
          else echo "CLOUDFLARE_API_TOKEN 이 없어 건너뛴다" >> $GITHUB_STEP_SUMMARY; fi
      - name: 올린다
        if: steps.k.outputs.go == '1'
        working-directory: game/server
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: CREEM_API_KEY 도 함께 넣는다
        if: steps.k.outputs.go == '1' && env.CREEM_API_KEY != ''
        working-directory: game/server
        run: printf '%s' "$CREEM_API_KEY" | npx --yes wrangler@4 secret put CREEM_API_KEY
        env:
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
