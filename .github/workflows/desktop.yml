# PC판을 짓는다 — Electron
#
# 윈도우와 리눅스는 여기서 나온다. 맥은 애플의 서명이 있어야
# 남에게 줄 수 있어 따로 둔다 (혼자 쓸 것은 mac 에서 npm run dist:mac).
name: PC판 짓기

on:
  push:
    branches: [main, master, claude/game-development-syhzcd]
    paths: ['game/**', 'app/desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write        # 받을 수 있게 내놓으려면 쓰기가 있어야 한다

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: dist:linux
            out: 'app/desktop/out/*.AppImage'
          - os: windows-latest
            target: dist:win
            out: 'app/desktop/out/*.exe'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 껍데기 짐을 챙긴다
        run: npm install --no-audit --no-fund
      - name: 짓는다
        run: npm run ${{ matrix.target }}
        env:
          # 서명은 안 한다 — 윈도우가 「모르는 만든이」라고 할 것이다
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: baekgwi-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

      # ── 받을 수 있게 내놓는다 ────────────────────────────
      # Actions 의 산출물은 로그인해야 받을 수 있고 zip 으로 묶여
      # 나온다. 늘 같은 이름표(pc)를 단 자리에 그대로 걸어 둔다.
      #   https://github.com/<나>/D/releases/tag/pc
      # 윈도우와 리눅스가 따로 끝나므로, 먼저 온 쪽이 자리를 만들고
      # 나중 온 쪽은 거기에 얹는다 (--clobber 로 덮어쓴다).
      - name: 받을 수 있게 내놓는다
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release view pc --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create pc --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "백귀야행 — 컴퓨터판" \
              --notes "$(printf '%s\n' \
                '내려받아 그대로 쓴다. 인터넷 없이도 돈다.' \
                '' \
                '- **.exe** — 윈도우. 만든이 서명이 없어 「모르는 만든이」라고 한 번 물을 수 있다.' \
                '  「추가 정보」 → 「실행」을 누르면 된다.' \
                '- **.AppImage** — 리눅스. 받은 뒤 실행 권한을 주고 누른다.' \
                '' \
                '맥은 애플 서명이 있어야 남에게 줄 수 있어 여기 없다.')"
          # $(ls ...) 로 받으면 이름 속 공백에서 쪼개진다
          # (「백귀야행 Setup 1.0.0.exe」가 「백귀야행」이 되어 못 찾았다).
          # 글로브를 그대로 돌리고 따옴표로 감싼다.
          shopt -s nullglob
          found=0
          for f in app/desktop/out/*.exe app/desktop/out/*.AppImage; do
            echo "올린다: $f"
            gh release upload pc "$f" --repo "$GITHUB_REPOSITORY" --clobber
            found=$((found+1))
          done
          if [ "$found" = 0 ]; then echo "올릴 것을 찾지 못했다"; ls -l app/desktop/out || true; exit 1; fi
          # 옛 이름으로 걸려 있던 것을 치운다 — 이름 짓기를 고치기 전에
          # 올라간 「-1.0.0.AppImage」 같은 것들이 남아 헷갈린다.
          gh release view pc --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null \
          | while IFS= read -r a; do
              case "$a" in
                baekgwi-*) ;;
                '') ;;
                *) echo "치운다: $a"
                   gh release delete-asset pc "$a" --repo "$GITHUB_REPOSITORY" --yes || true ;;
              esac
            done
          echo "### 받는 자리" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/pc" >> $GITHUB_STEP_SUMMARY
